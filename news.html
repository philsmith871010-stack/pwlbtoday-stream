<title>PWLBintel — the newsroom</title>

<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

require either additional EFS or further expenditure cuts, undermining the credibility of the Medium-Term Financial Plan.","url":"https://shropshire.gov.uk/committee-services/documents/s45349/45349.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"EFS","figures":"\u00a315m transformation budget; \u00a33.127m committed (20.8%); \u00a311.9m assumed consumption; each \u00a31m unspent reduces EFS requirement by \u00a31m","quote":"This report assumes at this time that all transformation funding available through EFS will be consumed although this assumption is likely to move downward as the year progresses.","paper":"Financial Monitoring Report Quarter 1 2026.27-02072026 1235 v8","committee":"Finance and Improvement Overview and Scrutiny Committee"},{"lane":"ours","source":"Southend-on-Sea UA","title":"High Needs education provision significantly behind original forecast with \u00a32.818m expected underspend","summary":"Delays to SEND provision could affect council's statutory education duties; reflects capital project management execution challenges","url":"https://southend.moderngov.co.uk/documents/s72479/72479.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E06000033","council":"Southend-on-Sea UA","tag":"DSG / SEND","figures":"\u00a35.661m originally forecast; \u00a33m currently expected; \u00a32.818m variance","quote":"As previously reported to Cabinet, it was estimated that \u00a35.661M of works could be undertaken in 2026/27. This consisted of the development of autism resource bases at various schools; special education needs trust schools' expansion and accessibility funding for schools. There have been some delays to the project and current estimates are that \u00a33M will be delivered in 2026/27.","paper":"Appendix 2 - Period 4 - Capital Investment_Programme Performance 2026-27","committee":"Cabinet"},{"lane":"ours","source":"Brent","title":"Two LOBO loans refinanced at 6.4% and 6.2% following lender options, up from original rates of 4.1% and 5.2%","summary":"Unexpected forced refinancing at elevated rates increases debt servicing costs and reduces budget flexibility at a time when the council is already taking on substantial new borrowing.","url":"https://democracy.brent.gov.uk/documents/s159555/159555.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E09000005","council":"Brent","tag":"LOBO","figures":"\u00a310m repaid at 6.41%, \u00a310m repaid at 6.24%; original rates 4.1% and 5.2%; \u00a39.5m LOBO due for review 2026/27","quote":"The Council repaid two LOBO loans in 2025/26 after the lender exercised their option. As a result, the Council's borrowing requirement increased, with the additional financing being met through borrowing from the Public Works Loan Board (PWLB) during the year within our overall borrowing need.","paper":"13. Treasury Management Outturn 2025-26","committee":"Cabinet"},{"lane":"ours","source":"Tunbridge Wells","title":"Council is using internal borrowing (\u00a33.687m) to fund capital projects not yet financed","summary":"Internal borrowing signals capital funding constraints and indicates the council is using reserves as a de facto lender; this reduces financial flexibility for dealing with emerging pressures or the unitary transition.","url":"https://tunbridgewells.moderngov.co.uk/documents/s84653/84653.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E07000116","council":"Tunbridge Wells","tag":"borrowing","figures":"\u00a33,687k internal borrowing still to be repaid","quote":"Internal Borrowing still to be repaid (projects not yet financed/MRP) (3,687)","paper":"Appendix D Usable Reserves Q1 202627","committee":"Finance, Innovation and Transformation Cabinet Advisory Board"},{"lane":"ours","source":"St Helens MBC","title":"Net budget overspend of \u00a33.4m driven by increased social care demand and failed savings delivery","summary":"A material overspend in a major service directorate signals budget control problems and pressure from demand that exceeds the council's savings capacity\u2014both material risks for lenders assessing financial stability.","url":"https://sthelens.moderngov.co.uk/documents/s180277/180277.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E08000013","council":"St Helens MBC","tag":"overspend","figures":"\u00a33.4m net budget overspend for the year","quote":"The Council continues to face severe financial pressures as a result of increased service demand (particularly within children's and adult social care) and delays/failure to deliver some of the approved budget savings which resulted in a net budget overspend of \u00a33.4m for the year.","paper":"Covering Report","committee":"Children and Young People Services Scrutiny Committee"},{"lane":"ours","source":"Southend-on-Sea UA","title":"Reserves increased to \u00a312M but council acknowledges they cannot fund recurring statutory pressures indefinitely","summary":"Reserves are a financial buffer, not a solution. A council building reserves while facing recurring structural overspends is acknowledging that near-term resilience (\u00a312M buffer) masks a medium-term insolvency if structural pressures are not solved.","url":"https://southend.moderngov.co.uk/documents/s72477/72477.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E06000033","council":"Southend-on-Sea UA","tag":"overspend","figures":"General Fund Reserve: \u00a312M (highest ever held). 2025/26 overspend: \u00a312.0M. 2026/27 forecast overspend: \u00a313.291M. Medium-term gap by 2030/31: \u00a328.5M.","quote":"Reserves provide financial resilience but cannot fund recurring statutory pressures indefinitely. Any drawdown should be replenished given the challenging funding outlook for 2027/28 and 2028/29.","paper":"Finance Performance Report- July 2026-27 Period 4","committee":"Cabinet"},{"lane":"ours","source":"Hastings","title":"Homelessness costs are running \u00a3234k above budget (4.5% overspend on a \u00a35.1m service)","summary":"Homelessness is a demand-led cost that councils cannot refuse; persistent overspends here indicate either structural affordability issues or rising unit costs that will recur in future years","url":"https://hastings.moderngov.co.uk/documents/s59898/59898.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E07000062","council":"Hastings","tag":"overspend","figures":"Budget \u00a35,158,664, forecast \u00a35,393,087, variance \u00a3234,423","quote":"Homelessness 20182 5,158,664 (114,916) 5,393,087 234,423 0 234,423","paper":"Appendix 1 - Revenue Monitoring Tables 2026-27 -Q1, 25/08/2026 Political Briefing","committee":"Cabinet"},{"lane":"markets","source":"City AM","title":"UK jobs seekers rise despite recovery in permanent hiring","url":"https://www.cityam.com/uk-jobs-seekers-rise-despite-recovery-in-permanent-hiring/","summary":"Rising redundancies and heightened employment insecurity drove a sharp increase in UK job seekers in August despite the permanent hiring market showing its first signs of recovery in nearly four years. Total staff availability rose at its fastest rate in three months as Brits hunting for roles flooded the market. This influx was triggered by [...]","iso":"2026-09-07T07:34:17+00:00"},{"lane":"markets","source":"Guardian business","title":"First annual fall in UK house prices since November 2023, led by London and the south \u2013 business live","url":"https://www.theguardian.com/business/live/2026/sep/07/uk-house-prices-fall-subdued-market-jlr-job-cuts-shares-oil-latest-news-updates","summary":"<p>Rolling coverage of the latest economic and financial news</p><p><strong>A hedge fund manager known as \u201cthe Rottweiler\u201d is getting his teeth into UK\u2019s biggest private hospital operator, following a takeover battle.</strong></p><p><strong>Spire</strong> <strong>Healthcare</strong>, which operates 38 private hospitals and more than 60 clinics across England, has agreed to be taken over by activis","iso":"2026-09-07T07:25:39+00:00"},{"lane":"markets","source":"City AM","title":"\u2018King of Mayfair\u ":"2026-09-04T06:30:00+00:00"},{"lane":"councils","source":"LGC","title":"District to take \u2018all necessary\u2019 legal steps against LGR","url":"https://www.lgcplus.com/politics/governance-and-structure/district-to-take-all-necessary-legal-steps-against-lgr-03-09-2026/","summary":"South Kesteven DC will issue a pre-action protocol letter to the government about its plans for reorganising Lincolnshire, paving the way for a potential legal challenge. The district's cabinet today approved a motion to take \u201call necessary and appropriate pre-action steps in contemplation of a\u2026\nThe post District to take \u2018all necessary\u2019 legal steps against LGR appeared first on Local Government Ch","iso":"2026-09-03T16:10:03+00:00"},{"lane":"councils","source":"LGC","title":"Reform-led county drops refugee role","url":"https://www.lgcplus.com/services/housing/reform-led-county-drops-refugee-role-03-09-2026/","summary":"The Reform UK administration at Lancashire CC has decided to end its coordinating role for the refugee resettlement scheme ahead of local government reorganisation. The decision, made by the cabinet this morning, would not result in an end to refugees entering Lancashire or the county\u2026\nThe post Reform-led county drops refugee role appeared first on Local Government Chronicle (LGC).","iso":"2026-09-03T16:04:23+00:00"},{"lane":"policy","source":"MHCLG","title":"Correspondence: 7/2026: Court of Appeal decision on 'box-shifting'","url":"https://www.gov.uk/government/publications/72026-court-of-appeal-decision-on-box-shifting","summary":"Business rates information letters are issued by the Ministry of Housing, Communities and Local Government at regular intervals throughout the year.","iso":"2026-09-03T15:44:54+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Housing supply: indicators of new supply, England: April to June 2026","url":"https://www.gov.uk/government/statistics/announcements/housing-supply-indicators-of-new-supply-england-april-to-july-2026","summary":"This statistical release includes building control reported estimates of housing supply in England. It also shows estimates of housing supply in England using other additional data sources.","iso":"2026-09-03T12:01:39+00:00"},{"lane":"councils","source":"LGC","title":"The future of the mayoral precept amid fiscal devolution","url":"https://www.lgcplus.com/finance/the-future-of-the-mayoral-precept-amid-fiscal-devolution-03-09-2026/","summary":"Andy Burnham\u2019s push for devolution has extended beyond authority borders, with fiscal devolution becoming central to how mayors fund services and projects, writes devolution reporter Elliot Topham. As part of the \u201cRewiring the State\u201d policy, mayors are now going to gain a share of income\u2026\nThe post The future of the mayoral precept amid fiscal devolution appeared first on Local Government Chronicle","iso":"2026-09-03T09:56:06+00:00"},{"lane":"councils","source":"LGC","title":"District issues LGR legal letter","url":"https://www.lgcplus.com/politics/governance-and-structure/district-issues-pre-action-protocol-on-lgr-03-09-2026/","summary":"Newcastle-under-Lyme BC has sent a pre-action protocol letter to the government ahead of a possible legal challenge opposing local government reorganisation. Newcastle-under-Lyme said its pre-action letter was \u201cseeking clarification on precisely what information\" the former communities secretary Steve Reed \"considered when deciding to merge Newcastle-under-Lyme,\u2026\nThe post District issues LGR legal","iso":"2026-09-03T09:46:33+00:00"},{"lane":"councils","source":"LGC","title":"How our children in care benefited from peer mentors","url":"https://www.lgcplus.com/idea-exchange/how-our-children-in-care-benefited-from-peer-mentors-03-09-2026/","summary":"Darlington BC\u2019s peer mentor service won the medium team of the year prize at the LGC Awards 2026. Here they explain what they did. The LGC Awards 2027 are moving from June to March, with an earlier entry deadline of 16 October.\u00a0Explore the categories here\u00a0and\u00a0submit\u2026\nThe post How our children in care benefited from peer mentors appeared first on Local Government Chronicle (LGC).","iso":"2026-09-03T09:10:38+00:00"},{"lane":"policy","source":"MHCLG","title":"Correspondence: \u200b\u200bDirection under the Building Act 1984 for fibre optic cabling in non-HRBs, Circular 03/2026\u200b","url":"https://www.gov.uk/government/publications/direction-under-the-building-act-1984-for-fibre-optic-cabling-in-non-hrbs-circular-032026","summary":"\u200b\u200b\u200bThis circular draws attention to the\u202fpublication of an updated type relaxation direction for installing fibre optic cabling in non-higher-risk buildings.","iso":"2026-09-03T09:00:01+00:00"},{"lane":"ours","source":"Cheshire East UA","title":"The S151 officer's assurance is explicitly qualified, stating the balanced forecast 'does not demonstrate that the Council's underlying financial position is yet sustainable' and flagging that 'targeted intervention is required now to prevent deterioration.'","summary":"A qualified S151 assurance is a formal statement that the council is not yet financially sustainable. It means the chief finance officer has concerns about whether current measures will hold and whether reserves are adequate. This directly informs a lender's risk assessment of whether the council will need to call on external support.","url":"https://moderngov.cheshireeast.gov.uk/documents/s135862/135862.pdf","iso":"2026-09-03T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m exceptional financial support (EFS) drawn. Contingency use: \u00a35.799m Transformation Contingency + \u00a310.336m General Contingency = \u00a316.135m. Total contingency deployed: \u00a315.358m of forecast.","quote":"The balanced forecast depends on the delivery of savings and mitigations, containment of social care demand, achievement of capital receipts and management of higher financing costs. My assurance is qualified.","paper":"20260825102352_006496_0013321_Reporttemplatev4","committee":"Cabinet"},{"lane":"ours","source":"Cheshire East UA","title":"Council operating under Non-Statutory Best Value Notice with need to improve financial sustainability","summary":"A council under regulatory financial scrutiny is viewed as higher risk by lenders and demonstrates existing financial management concerns.","url":"https://moderngov.cheshireeast.gov.uk/documents/s135552/135552.pdf","iso":"2026-09-03T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"intervention","figures":"Best Value Notice issued 15 July 2026","quote":"given the revised Non-Statutory Best Value Notice issued on 15 July 2026 and the continuing need to improve financial sustainability","paper":"Cheshire East Growth, Investment and Regeneration Programme - Procurement of intelligent client and technical support and a strategic approach for Crewe.Cabinet and Committee Report Template","committee":"Cabinet"},{"lane":"ours","source":"Lancashire CC","title":"Government grant support conditional on DfE approval of SEND reform plan; approval status not yet confirmed","summary":"The council's financial position relies on external government approval of a reform plan. Rejection or significant delay would eliminate the \u00a391.44m grant, leaving the full \u00a3253.48m deficit to be funded from general reserves or force deeper service cuts.","url":"https://lancashire.moderngov.co.uk/documents/s285139/285139.pdf","iso":"2026-09-03T09:00:00+00:00","gss":"E10000017","council":"Lancashire CC","tag":"DSG / SEND","figures":"High Needs Stability Grant \u00a391.44m (covering 90% of deficit); deficit reduction dependent on approval: \u00a3253.48m to \u00a3162.04m","quote":"Due to the increasing DSG deficits forecasted nationally, the government has recently announced the High Needs Stability Grant, which subject to the approval of the Council's SEND reform plan from the Department for Education (DfE), will cover 90% of the DSG deficit at March 2026, estimated at \u00a391.44m","paper":"Appendix C","committee":"Cabinet"},{"lane":"policy","source":"HM Treasury","title":"Research: UK official holdings of international reserves: August 2026","url":"https://www.gov.uk/government/publications/uk-official-holdings-of-international-reserves-august-2026","summary":"This release details movements in the international reserves of gold and assets held by the UK government.","iso":"2026-09-03T08:30:10+00:00"},{"lane":"policy","source":"MHCLG","title":"Live tables on local government finance","url":"https://www.gov.uk/government/statistical-data-sets/live-tables-on-local-government-finance","summary":"The latest data tables on local government finance.","iso":"2026-09-03T08:30:09+00:00"},{"lane":"policy","source":"MHCLG","title":"Live tables on social housing sales","url":"https://www.gov.uk/government/statistical-data-sets/live-tables-on-social-housing-sales","summary":"The latest data tables on social housing sales.","iso":"2026-09-03T08:30:08+00:00"},{"lane":"policy","source":"MHCLG","title":"Live tables on affordable housing supply","url":"https://www.gov.uk/government/statistical-data-sets/live-tables-on-affordable-housing-supply","summary":"The latest data tables on affordable housing supply.","iso":"2026-09-03T08:30:08+00:00"},{"lane":"ours","source":"Swansea","title":"Welsh Government has no protocol for supporting councils that issue section 114 (cannot balance budget) reports","summary":"A lender assessing financial sustainability risk needs to understand that if a Welsh council does get into severe financial difficulty (unable to balance budget), there is no published framework for intervention or support. This affects the lender's understanding of worst-case escalation.","url":"https://swansea.moderngov.co.uk/documents/s129728/129728.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"W06000011","council":"Swansea","tag":"s114","figures":"No section 114 reports made in Wales to date; draft protocol in development but not finalised","quote":"Not being clear on what would happen after a section 114 report is made can have a negative impact on financial decision-making. For example, during our interviews we heard there is a misconception amongst some members and officers that issuing a section 114 report will lead to the Welsh Government providing more funding.","paper":"07 (1 of 1) - Funding_councils_How_the_Welsh_Government_funds_councils","committee":"Governance & Audit Committee"},{"lane":"ours","source":"Salford","title":"Council repaid one \u00a325m LOBO loan from cash but declined \u00a3143m of lenders' subsequent refinancing offers","summary":"LOBO loans carry refinancing risk if lenders exercise options to propose new rates; the council's selective approach to early repayment (paying cash on one loan, retaining others) reveals both liquidity position and debt management strategy, signalling whether refinancing at proposed rates remains affordable.","url":"https://salford.moderngov.co.uk/documents/s96840/96840.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"LOBO","figures":"\u00a325m repaid November 2024; \u00a3143m of refinancing offers (\u00a328m + \u00a320m + \u00a326m + \u00a328m + \u00a316m) declined between July 2025 and March 2026","quote":"There was one lender exercising an option and there were early prepayment offers on the following of the Authority's loans","paper":"Treasury Management Annual Report for 2025-26 v4 - Legal","committee":"Overview and Scrutiny Board"},{"lane":"ours","source":"Salford","title":"Earmarked reserves depleting by \u00a321.417m in Q1 forecast alone","summary":"Reserves are being consumed rapidly to manage overspends rather than fund planned initiatives. At this depletion rate (\u00a321.4m per quarter), the council exhausts earmarked reserves in under three years, leaving no buffer for future shocks.","url":"https://salford.moderngov.co.uk/documents/s96838/96838.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"reserves","figures":"Earmarked reserves 1 April 2026: \u00a3255.5m; Q1 forecast position: \u00a3234.1m; planned drawdown \u00a321.417m","quote":"General Fund Earmarked reserves at 1st April 2026 were \u00a3255.5m and at Quarter 1 are estimated to be \u00a3234.1m based on the year end forecast which forecasts the use of \u00a321.4m.","paper":"Revenue Budget Monitoring Report - Quarter 1 - Cabinet Briefing","committee":"Overview and Scrutiny Board"},{"lane":"ours","source":"Cumberland Council","title":"General Fund reserves falling below the minimum adequacy threshold after unplanned Q1 draw","summary":"A council operating below its minimum reserve threshold has reduced financial resilience and signals stress early in the financial year, with nine months remaining.","url":"https://cumberland.moderngov.co.uk/documents/s57346/57346.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E06000063","council":"Cumberland Council","tag":"reserves","figures":"General Fund reserves to \u00a324.965m, minimum adequacy level \u00a325.000m, unplanned contribution \u00a33.719m","quote":"The draft outturn position requires an unplanned contribution from General Fund balances of \u00a33.719m. This takes General Fund reserves to \u00a324.965m (subject to audit), which is below the Councils minimum adequacy level of \u00a325.000m.","paper":"2026/27 Budget Monitoring at Quarter 1 (April to June 2026)","committee":"Business and Resources Overview and Scrutiny Committee"},{"lane":"ours","source":"Worcester","title":"Earmarked reserves are planned to fall from \u00a313.3m to \u00a32.9m over two years, with business rates reserves depleting sharply","summary":"Rapidly depleting reserves reduce the council's capacity to manage contingencies and increases vulnerability to external shocks or forecast misses.","url":"https://committee.worcester.gov.uk/documents/s65994/65994.pdf","iso":"2026-09-01T09:00:00+00:00","gss":"E07000237","council":"Worcester","tag":"reserves","figures":"Earmarked reserves: \u00a313.317m (March 2026) \u2192 \u00a36.832m (March 2027) \u2192 \u00a32.901m (March 2028); Business rates: \u00a33.138m \u2192 \u00a31.693m \u2192 \u00a3693m","quote":"Earmarked reserves are expected to reduce by \u00a310.416m between March 2026 and March 2028","paper":"Q1 Financial monitoring report 26-27 v1","committee":"Policy and Resources Committee"},{"lane":"ours","source":"Thanet","title":"Council repaid \u00a34.5m LOBO loan after lender exercised option to increase interest rate","summary":"LOBO loans embed the risk that lenders can force borrowers to accept higher rates. The council's decision to repay rather than accept the increase shows the new rate created material cost pressure, illustrating the council's vulnerability to rate risk.","url":"https://thanet.moderngov.co.uk/documents/s97246/97246.pdf","iso":"2026-08-27T09:00:00+00:00","gss":"E07000114","council":"Thanet","tag":"LOBO","figures":"LOBO loan \u00a34.5m at 4.19%, repaid 9 Dec 2025; new rate not disclosed; repayment funded from investments.","quote":"The Council had a Lender Option Borrower Option (LOBO) loan for \u00a34.5m at 4.19% and the lender exercised its option to increase the interest rate from 9 December 2025. Accordingly, the Council exercised its option to repay this loan on the same date.","paper":"Cabinet Treasury YE 25-26 - Google Docs","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Lincoln City","title":"Council has \u00a342m under-borrowing against its Capital Financing Requirement, with additional borrowing deferred to end of financial year.","summary":"A lender needs to understand borrowing trajectory. Deferred \u00a342m borrowing suggests either strong cash position or intentional rate timing; the deferral to year-end creates lumpy refinancing risk if rates move.","url":"https://lincoln.moderngov.co.uk/documents/s80928/80928.pdf","iso":"2026-08-18T09:00:00+00:00","gss":"E07000138","council":"Lincoln City","tag":"borrowing","figures":"CFR \u00a3160.432m, actual debt \u00a3118.395m, under-borrowing \u00a342.037m; capital expenditure revised to \u00a354.508m from original \u00a333.662m","quote":"Currently forecasting actual external debt at year end to be inline with the original budget, albeit additional borrowing pushed to the end of the financial year.","paper":"Treasury Management Q1 26.27 Exec","committee":"Executive"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"ours","source":"Somerset Council","title":"Government issued formal Best Value Notice on 15 July citing concerns about Council's capacity to comply with Best Value Duty","summary":"Best Value Notices are formal steps toward more severe intervention; they signal to lenders that government has lost confidence in the authority's capacity to manage its finances","url":"https://democracy.somerset.gov.uk/documents/s68778/20262027 General Fund Revenue Budget Monitoring Report - Quarter 1.pdf","iso":"2026-08-12T09:00:00+00:00","gss":"E06000066","council":"Somerset Council","tag":"intervention","figures":"Issued 15 July 2026","quote":"On 15 July 2026, the Ministry of Housing, Communities and Local Government (MHCLG) issued Somerset Council with a Best Value Notice. This is a formal notification that Government has concerns about the Council's capacity to comply with its Best Value Duty.","paper":"2026/2027 General Fund Revenue Budget Monitoring Report - Quarter 1","committee":"Scrutiny Committee - Corporate and Strategic"},{"lane":"ours","source":"Somerset Council","title":"\u00a343m of Capitalisation Directive deployed in 2025/26 to fund revenue budget from capital resources\u2014described as 'repeated warning' indicating ongoing concern.","summary":"Depletes capital resources available for investment; masks true revenue deficit; cannot continue indefinitely without exhausting capital or accumulating unsustainable debt.","url":"https://democracy.somerset.gov.uk/documents/s68921/Lead Member for Finance Procurement Performance Annual Report.pdf","iso":"2026-08-12T09:00:00+00:00","gss":"E06000066","council":"Somerset Council","tag":"audit opinion","figures":"\u00a343m Capitalisation Directive 2025/26","quote":"the repeated warning that \u00a343m of Capitalisation Directive has been deployed in closing the budget gap","paper":"Annual Report of the Deputy Leader of Somerset Council and the Lead Member for Finance, Procurement and Performance","committee":"Scrutiny Committee - Corporate and Strategic"},{"lane":"ours","source":"Stoke-on-Trent UA","title":"Council using capital receipts flexibility and reserves to offset revenue overspends; no Section 114 report yet, but mitigations are finite.","summary":"Capital receipts flexibility and reserve drawdown are tools of last resort. Their deployment signals the council is using contingency strategies to manage a \u00a313.6m social care overspend. If overspends persist into Q2-Q4, these tools will be depleted.","url":"https://moderngov.stoke.gov.uk/documents/s182418/182418.pdf","iso":"2026-08-11T09:00:00+00:00","gss":"E06000021","council":"Stoke-on-Trent UA","tag":"s114","figures":"\u00a32m corporate reserve deployed; \u00a33.293m capital receipts flexibility deployed","quote":"Despite the in-year pressures currently facing the Council, the Section 151 Officer has not considered it necessary to make any such report at the current juncture in light of ongoing mitigations.","paper":"Financial Performance Report 2026/27 - Quarter 1","committee":"Cabinet"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"ours","source":"Nottingham City UA","title":"Council issued a Section 114 notice in November 2023 for inability to set a balanced budget; recovery is now early-stage despite achievement of 2026/27 balanced budget without Exceptional Financial Support.","summary":"Section 114 is a critical threshold event for local authority lending. While recovery progress is welcome, it is very early-stage and dependent on continued financial discipline.","url":"https://committee.nottinghamcity.gov.uk/documents/s183981/183981.pdf","iso":"2026-07-31T09:00:00+00:00","gss":"E06000018","council":"Nottingham City UA","tag":"s114","figures":"Section 114 issued November 2023; Commissioners oversight concluded March 2026; EFS \u00a341.024m approved 2024/25, only \u00a37.737m required year-end; 2026/27 balanced budget achieved without EFS","quote":"In November 2023, a Section 114 (Part 3) report was issued to Councillors due to concerns regarding the financial sustainability of the Council","paper":"Enc. 1 for Draft Annual Governance Statement 2025 - 2026","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Time-limited relief from the Community Infrastructure Levy in London","summary":"We are seeking views on proposed regulations to implement a time-limited relief from the Community Infrastructure Levy (CIL) to support housebuilding in London.","url":"https://www.gov.uk/government/consultations/time-limited-relief-from-the-community-infrastructure-levy-in-london","iso":"2026-07-17T16:01:48Z","closes":"2026-09-18T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-07-15T14:15:00Z","closes":"2026-09-23T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement process costs","summary":"Seeks views on exceptions to the rule that parties pay their own process costs in leasehold transactions under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-process-costs","iso":"2026-07-15T14:14:00Z","closes":"2026-09-23T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Safeguarding Stability, Enabling Growth: Consultation on Ring-fencing Reform","summary":"This consultation invites views on changes to the ring-fencing regime announced as part of the government's ring-fencing review, which are intended to be delivered via secondary legislation.","url":"https://www.gov.uk/government/consultations/safeguarding-stability-enabling-growth-consultation-on-ring-fencing-reform","iso":"2026-07-14T15:10:00Z","closes":"2026-09-08T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Consultation on Reforming Land Remediation Relief","summary":"The government is consultation on potential reforms to make Land Remediation Relief more accessible, better targeted, and more closely aligned with the practical realities of brownfield development.","url":"https://www.gov.uk/government/consultations/consultation-on-reforming-land-remediation-relief","iso":"2026-07-13T12:08:00Z","closes":"2026-09-21T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Tax Treatment of Predevelopment costs","summary":"The government is consulting on the tax treatment of predevelopment costs. The consultation seeks views and evidence from stakeholders on the types of costs incurred, their treatment under the current rules, and the impact on investment decisions.","url":"https://www.gov.uk/government/consultations/tax-treatment-of-predevelopment-costs--2","iso":"2026-07-13T12:08:00Z","closes":"2026-09-21T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"CIPFA and the codes","title":"South and East Ayrshire councils carry almost \u00a31 billion debt between them - Cumnock Chronicle","url":"https://news.google.com/rss/articles/CBMilgFBVV95cUxPdEp5alFIRG00SFFRaFZ1Z3A0WnlXZENyVGJHWTNZSEt4Wm5mRExyaUlua3ZmWklDWV9NZFNGRUNWTG1qN0Jlc3Bkek53c0xuZ2pfdXBISmJERElQT3hnbTlIcWtQa0Z2TUJKazRCdnpBM3FaMTgzbW4zNndEQ09iLXpjSkJ6cTI3U2RFRG8zX1d5YUg1NHc?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMilgFBVV95cUxPdEp5alFIRG00SFFRaFZ1Z3A0WnlXZENyVGJHWTNZSEt4Wm5mRExyaUlua3ZmWklDWV9NZFNGRUNWTG1qN0Jlc3Bkek53c0xuZ2pfdXBISmJERElQT3hnbTlIcWtQa0Z2TUJKazRCdnpBM3FaMTgzbW4zNndEQ09iLXpjSkJ6cTI3U2RFRG8zX1d5YUg1NHc?oc=5\" target=\"_blank\">South and East Ayrshire councils carry almost \u00a31 billion debt between them</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Cumnock Chro","iso":"2026-07-08T07:00:00+00:00"},{"lane":"po function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
