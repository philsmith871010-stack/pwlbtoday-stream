<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>
</head><body>

QyREZUR3M2bTRwQ1NBNTREemY0WGdKdWpkamVEamE0QkZMRnItWHczekV3dVlxd3VuRTduVEVpcWN4Um1VNHpIbldBcDc4bGoycFNvRWtBM2ZZUkRqaW9zLVpJ?oc=5\" target=\"_blank\">\u2018Learn from England\u2019s failings\u2019: warnings over \u2018half-baked\u2019 Scottish LGR</a>&nbsp;&nbsp;<font color=\"#6f6f6","iso":"2026-09-24T10:38:56+00:00"},{"lane":"markets","source":"BBC business","title":"Tories would prevent long-term jobless spending benefits on alcohol and cigarettes","url":"https://www.bbc.co.uk/news/articles/c920vy2jxle8o?at_medium=RSS&at_campaign=rss","summary":"The proposals would also see benefits cut for people who are able to work but have failed to hold down a job.","iso":"2026-09-24T10:25:58+00:00"},{"lane":"markets","source":"BBC business","title":"Rolls-Royce signs 'multi-million' engine deal","url":"https://www.bbc.co.uk/news/articles/cmpwle47zxgyo?at_medium=RSS&at_campaign=rss","summary":"The order will see 18 engines built and maintained by the company from its Derby aerospace centre.","iso":"2026-09-24T10:14:47+00:00"},{"lane":"councils","source":"LGC","title":"Mayoral candidate calls for election next year","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/mayoral-candidate-calls-for-election-next-year-24-09-2026/","summary":"The Labour mayoral candidate for the Hampshire & the Solent CCA has called for elections to be brought forward to 2027. The mayoral election for Hampshire & the Solent CCA was originally set to take place at in May 2026 before being delayed by two\u2026\nThe post Mayoral candidate calls for election next year appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T09:58:51+00:00"},{"lane":"councils","source":"LG finance press","title":"Are US equities still exceptional? - Room151","url":"https://news.google.com/rss/articles/CBMipgFBVV95cUxNbHExeFk5dk1jNzVCQVBFRGp1Z1VhaHRET0x5MDdNRl9KRGpBYzJtXy1uZjJnaDBrcTRWblg3VXJXUFJVTU8tM3cyZENhNTNURm1URzAwYzJpNVU4S2lVYkF3a2dXNVp0RDBXRUF3X2VhWnF4V3NYNHBJVF8xVVBVUlc2TFFPcXE1cW9aUElJd3ZZNWZmOHZBa3ljSEM4RXQ4ZUMwOENR?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMipgFBVV95cUxNbHExeFk5dk1jNzVCQVBFRGp1Z1VhaHRET0x5MDdNRl9KRGpBYzJtXy1uZjJnaDBrcTRWblg3VXJXUFJVTU8tM3cyZENhNTNURm1URzAwYzJpNVU4S2lVYkF3a2dXNVp0RDBXRUF3X2VhWnF4V3NYNHBJVF8xVVBVUlc2TFFPcXE1cW9aUElJd3ZZNWZmOHZBa3ljSEM4RXQ4ZUMwOENR?oc=5\" target=\"_blank\">Are US equities still exceptional?</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Room151</font>","iso":"2026-09-24T09:23:13+00:00"},{"lane":"councils","source":"LGC","title":"Shadow unitaries seek devolution update","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/shadow-unitaries-seek-devolution-update-24-09-2026/","summary":"Both of Surrey\u2019s new shadow unitary authorities are seeking clarity from the government over the future of devolution in the county, following the pause to local government reorganisation in other two-tier areas. East Surrey shadow authority will consider a motion this afternoon on whether to\u2026\nThe post Shadow unitaries seek devolution update appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T09:11:38+00:00"},{"lane":"ours","source":"Cardiff","title":"Cardiff Council faces \u00a3167m budget shortfall over four years","summary":"Cardiff Council has identified a \u00a3167.1 million budget shortfall for 2027/28 to 2030/31 in its spending plan approved today. The shortfall reflects demand pressures in social care, schools and specialist placements for children with additional learning needs. The council struggles with current savings delivery: in 2025/26 it achieved 88 per cent of efficiency savings but only 76 per cent of service change savings \u2014 changes to services designed to reduce costs \u2014 which it notes are complex to execute. The council's accounts for the year ending 31 March 2026 were balanced overall, though some directorates recorded significant overspends. Further service change savings will be required to bridge the future gap.","url":"https://cardiff.moderngov.co.uk/documents/s97282/97282.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"s114","figures":"None","quote":"On this basis, as the Section 151 Officer I have concluded that those conditions did not arise during the year and no Section 114 notice was issued in 2025/26.","paper":"Appointment of Section 151 Officer","committee":"Council"},{"lane":"ours","source":"Worcestershire CC","title":"\u00a359.9m Exceptional Financial Support programme receives no project detail in capital budget tables.","summary":"Large borrowing commitments require clear project documentation for lenders and finance directors to assess deliverability and risk. The absence of scheme detail makes it impossible to evaluate the programme from this paper alone.","url":"https://worcestershire.moderngov.co.uk/documents/s61943/61943.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"EFS","figures":"\u00a359,933k total; \u00a349,933k borrowing, \u00a310,000k capital receipts","quote":"Exceptional Financial Support 0 59,933 59,933 0 0 0 0 0 0 59,933 59,933","paper":"7 Appendix 4 - Quarter 1 Capital Programme","committee":"Cabinet"},{"lane":"ours","source":"North Somerset UA","title":"North Somerset passes audit but auditor flags financial sustainability risks","summary":"North Somerset's council accounts have passed external audit without qualification, with no material errors identified. However, the auditor has identified a risk of significant weakness in the council's financial sustainability, reflecting continued pressure on its schools funding deficit and the delivery of planned savings. The auditor has also flagged a separate risk in managing demand and costs in adult social care. The council intends to apply for government support that could write off up to 90 per cent of its schools deficit provided the council funds the remaining 10 per cent. Senior finance staff also faced criticism for control gaps: the chief finance officer posted 89 journal entries during year-end closedown, breaching segregation of duties principles, and the auditor recommends removing this access and reassigning journal posting to the finance team.","url":"https://n-somerset.moderngov.co.uk/documents/s9091/9091.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000024","council":"North Somerset UA","tag":"EFS","figures":"\u00a36m additional recurring income from EFS; 8.99% total council tax rise","quote":"Due to the structural deficit between increasing costs and the Council's capacity to increase income, the Council had to request EFS from the government to balance the 2026/27 budget.","paper":"11. Audit Findings Report 2025-26","committee":"Audit Committee"},{"lane":"ours","source":"Cheshire East UA","title":"Cheshire East uses government permission to balance budget as adult social care demand outpaces savings","summary":"Cheshire East balanced its 2026/27 budget only by using \u00a324.995m of Exceptional Financial Support, a government permission to treat day-to-day spending as if it were capital spending so it can be paid for by borrowing. The council faces sustained demand growth in Adult Social Care of around \u00a36m per year for the next five years, accumulating to \u00a330m in additional budget requirement by 2030/31. The budget has already increased 22 per cent over three years, from \u00a3138m in 2023/24 to \u00a3169m in 2026/27, driven by an ageing population and rising complexity of care. The council's savings programmes are delivering approximately \u00a33m to \u00a34m total across initiatives, leaving a structural annual gap between demand growth and what the council can save. The transformation savings target has increased from \u00a314.99m to \u00a322.45m across its medium-term plan.","url":"https://moderngov.cheshireeast.gov.uk/documents/s136550/136550.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m","quote":"The budget was balanced, as required by statute, with plan ned use of EFS, by way of a capitalisation direction, totalling \u00a324.995m.","paper":"2026/27 Budget \u2013 Quarter 1 Forecast OutturnCabinet and Committee Report Template","committee":"Adults Overview and Scrutiny Committee"},{"lane":"ours","source":"Bradford","title":"Bradford Council posted a \u00a3113m overspend funded by government emergency support","summary":"Bradford Council spent \u00a3113 million more than it received in 2025\u201326, with its overspend on revenue spending \u2014 day-to-day running costs for staff, services and contracts \u2014 funded through government emergency support. The figure represents an improvement of \u00a314 million on initial forecasts. Despite the deficit, the council's usable reserves, money set aside for future needs and unexpected events, increased by \u00a355 million year-on-year to \u00a3229.2 million, providing what the council describes as \"a stronger buffer against continued financial uncertainty.\" The external auditors anticipate issuing an unqualified audit opinion on the financial statements, meaning they expect to be able to fully sign off the accounts.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Runnymede","title":"Runnymede's reserves forecast to collapse to \u00a32m within six years as costs outpace income.","summary":"Runnymede council's general fund reserves, the financial cushion it holds for unexpected costs, are forecast to fall from \u00a321.6m next March to just \u00a32m by 2032, with the rate of depletion accelerating sharply from 2029 onwards. The council's housing account, funded by rental income from its own homes, is also in deficit, forecast to lose \u00a39.1m in a single year. The deterioration is driven by ongoing cost pressures, principally a pay and grading review that added \u00a31.241m to the annual budget. The council is exploring early repayment of loans using maturing investments and has agreed to dispose of several properties to reduce borrowing, but officers note that further savings and efficiencies would be needed if current forecasts materialise.","url":"https://runnymede.moderngov.co.uk/documents/s18927/18927.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"intervention","figures":"Notice issued December 2023; now withdrawn as of September 2026 meeting date","quote":"Following the non-statutory best value notice, which has now been withdrawn","paper":"Q1 - Budget Monitoring report - Appenxix 6 v3 - final","committee":"Corporate Management Committee"},{"lane":"ours","source":"West Suffolk","title":"West Suffolk's audit qualification will persist until at least 2027 as \u00a37.8m of property assets await revaluation","summary":"West Suffolk Council received a qualified audit opinion for 2024-25, marking recovery from the nationwide local audit crisis that left the council's 2022-23 and 2023-24 accounts unaudited. However, external auditors Ernst & Young say the qualification cannot be lifted until property assets valued at \u00a37.8 million\u2014last assessed in 2022-23\u2014are revalued as part of the council's rolling five-year programme. Even once that revaluation occurs, a further two years must pass before the impact flows through the accounts and auditors can sign off in full. Auditors expect a clean conclusion on whether the council manages its money efficiently. The council signed its draft accounts for 2025-26 on 29 May, ahead of the statutory deadline, with a qualified opinion anticipated before the January 2027 backstop date.","url":"https://democracy.westsuffolk.gov.uk/documents/s59460/59460.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000245","council":"West Suffolk","tag":"audit opinion","figures":"\u00a329.5m cash and investments at 31 March 2026; \u00a310m forecast cash at March 2027; \u00a36.13m General Fund; \u00a352.01m earmarked reserves","quote":"Overall, based on its cash flow forecast, borrowing potential and access to investment funds, as well as the level of general fund and reserve balances it holds, the council determines that it has sufficient liquidity to continue to deliver services for the foreseeable future.","paper":"6-PAS-WS-26-015-EY-Risk-Assessment-Update","committee":"Performance and Audit Scrutiny Committee"},{"lane":"ours","source":"Hammersmith & Fulham","title":"Hammersmith and Fulham's audit cannot be formally closed after cyber incident hits pension fund","summary":"Hammersmith and Fulham's auditors have issued a clean opinion on the council's 2025/26 accounts but cannot formally certify the audit because a cyber incident \u2014 which took the pension fund's general ledger and pensions administration system offline \u2014 has left wider legal, risk and fraud work incomplete. The auditors also identified \u00a31.22m in unaddressed errors in the valuation of the council's property holdings and \u00a31.43m in uncorrected overstatements of pension fund investments, both exceeding reporting thresholds. The council balanced its accounts this year despite funding pressures, but faces budget gaps of \u00a331.4m in 2027/28 and \u00a357.3m in 2028/29 when government transitional support ends. The council holds \u00a3122.1m in reserves, but officers warn these cannot sustainably meet recurring shortfalls and the council will need to explore council tax increases and additional savings.","url":"https://lbhf.moderngov.co.uk/documents/s136009/136009.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000013","council":"Hammersmith & Fulham","tag":"audit opinion","figures":"Total net assets: \u00a31,462.070 million; materiality: \u00a323 million","quote":"Our anticipated financial statements audit report opinion will be unmodified.","paper":"Appendix 4 - LBHF Pension Fund Audit Findings Report 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Harrow","title":"Harrow faces \u00a33m overspend as temporary accommodation and children's care costs surge","summary":"Harrow Council is forecasting a net overspend of \u00a33.039m for the current financial year after planned use of reserves, according to figures presented to cabinet on Wednesday. The shortfall is driven by two structural pressures: temporary accommodation for homeless households, which is costing the council \u00a315.7m a year more than government subsidy covers, and children's services placements, where 25 children in residential homes at an average \u00a37,000 per week are creating a \u00a37.249m overspend. The council has approved a savings programme of \u00a34.062m for the year, but nearly half of those savings depend on completing capital projects\u2014acquiring 50 new homes for temporary housing, selling properties at Sheldon House, and investing in residential care provision\u2014that are rated as at-risk and may not deliver on schedule.","url":"https://harrow.moderngov.co.uk/documents/s201854/201854.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000015","council":"Harrow","tag":"DSG / SEND","figures":"Total variance \u00a335,859,859 (all slippage to 27/28); SEN Expansion \u00a310,448,369; Schools Capital Maintenance \u00a37,597,098; High Needs Provision \u00a34,200,000; Additional Basic Need Funding \u00a37,761,893","quote":"Total Children's Services Directorate 41,282,293 0 41,282,293 5,422,434 (35,859,859)","paper":"Appendix 2 - 2026-27 MTFS Tracker","committee":"Cabinet"},{"lane":"ours","source":"Gloucestershire CC","title":"Audit finds 41% of Gloucestershire firefighters lack current medical checks","summary":"An audit of Gloucestershire Fire and Rescue Service found 155 of 378 firefighters (41%) with overdue medical checks as of May 2026, in breach of their employment terms. The council's internal audit team identified a lack of consistent process for booking and monitoring mandatory health checks. Separately, the occupational health review found 84 of 143 fire service managers (59%) have not completed mandatory training on reasonable adjustments for workers with disabilities. The audit issued two high-priority and four medium-priority recommendations. The findings were presented to the Audit and Governance Committee on 24 September.","url":"https://gloucestershire.moderngov.co.uk/documents/s120233/120233.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000013","council":"Gloucestershire CC","tag":"DSG / SEND","figures":"\u00a346.28 million increase; \u00a3124.7 million cumulative deficit; \u00a336.3 million general fund balance; approximately \u00a312.5m residual local contribution; statutory override expires March 2028","quote":"The DSG deficit increased by \u00a346.28 million in 2025/26 to \u00a3124.7 million, compared to a General Fund balance at year end of \u00a336.3 million.","paper":"ISA260 202526 GCC draft for papers","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Herefordshire UA","title":"Herefordshire Council faces \u00a311.6m budget shortfall with reserves nearly depleted","summary":"The council forecast a \u00a311.6m shortfall in day-to-day spending at the end of the first quarter, a 5% overspend on its \u00a3234.1m budget. Of the shortfall, \u00a36.5m relates to savings targets that have not commenced or cannot be confirmed. The remaining pressures centre on adult social care and support for children with special educational needs and disabilities (SEND), where demand continues to grow despite efforts to control costs. Money set aside in the Budget Resilience Reserve to cushion unexpected costs has fallen to \u00a31.0m from \u00a311.0m two years earlier. The council acknowledged its total reserves would be insufficient to cover the overspend without significant damage to financial resilience and must immediately take corrective action to cut or recover spending.","url":"https://councillors.herefordshire.gov.uk/documents/s50135886/50135886.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000019","council":"Herefordshire UA","tag":"DSG / SEND","figures":"\u00a33.6 million council liability from March 2028; \u00a332.7 million DfE grant (90%); \u00a310m capital investment in 2026/27; \u00a33.8m additional High Needs funding over three years","quote":"the remaining balance of \u00a33.6 million (10%) to be a liability of the council once the statutory override period ends in March 2028","paper":"Q1 2026/27 Budget Report, main report","committee":"Cabinet"},{"lane":"ours","source":"Babergh","title":"Mid Suffolk cuts borrowing by \u00a314m as debt costs squeeze Babergh budget","summary":"Mid Suffolk delivered a material reduction in borrowing, cutting total loans by \u00a314.2m to \u00a392.7m, predominantly by eliminating \u00a313m of expensive short-term debt that had risen to rates of 5\u20137 per cent by year-end. The move reduces exposure to volatile interest markets during a period of economic uncertainty, including the February 2026 US-Israel-Iran conflict which pushed oil prices higher and raised Public Works Loan Board (PWLB) rates from 5.38 to 5.72 per cent. Babergh, by contrast, saw its proportion of general fund revenue consumed by debt service costs rise from 28 per cent to 33 per cent, reducing financial flexibility for service spending. The councils' treasury management report to the Mid Suffolk Committee on 24 September shows one authority successfully repositioning its debt while the other faces tighter budget constraints from rising borrowing costs.","url":"https://baberghmidsuffolk.moderngov.co.uk/documents/s43661/43661.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000200","council":"Babergh","tag":"LOBO","figures":"\u00a34m LOBO loans outstanding; average rate 4.21%; call dates February and August each year","quote":"The lender has not exercised its option during 2025/26.","paper":"MC/26/15 Annual Treasury Management Report 2025-26","committee":"Mid Suffolk Council"},{"lane":"ours","source":"City of Edinburgh","title":"Edinburgh's \u00a332m underspend masks structural spending pressures and reliance on one-off income","summary":"Edinburgh City Council ended 2025-26 with a \u00a332.2m underspend, but the auditor's accounts and budget monitoring show this masks underlying financial strain. The surplus included \u00a324.9m from a legal settlement in prior years and relied on one-off mitigations to offset shortfalls. The council delivered only 70% of \u00a343.2m in planned savings, with delays in demand-led services like home transport and building maintenance accounting for roughly \u00a313m of the shortfall. Capital spending fell \u00a338.2m behind target, with housing acquisitions for temporary accommodation delayed by \u00a320m due to insufficient available properties. The auditor has flagged that the council plans substantial increases in borrowing and debt over the next five years, presenting significant risk to longer-term financial sustainability. Forward-year projections show overspending, prompting the council to set aside the unallocated underspend rather than spend it.","url":"https://edinburgh.moderngov.co.uk/documents/s103738/103738.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"S12000036","council":"City of Edinburgh","tag":"LOBO","figures":"\u00a332m market debt repaid (including two LOBOs); outstanding LOBO debt \u00a3122.4m","quote":"The lenders exercised their option to request an increase in the interest rate paid on the loans and the Council exercised its option to repay the loans at par with no penalty.","paper":"8.3 Revenue monitoring outturn 25-26","committee":"Finance and Resources Committee"},{"lane":"ours","source":"Thanet","title":"Thanet council reserves fall to critical low as spending deficits persist despite controls","summary":"Thanet council's financial reserves have fallen to \u00a34.1m of unrestricted funds, below the \u00a36m minimum its chief finance officer has advised it should hold. The council drew down \u00a34.7m from reserves over two consecutive years to cover deficits of \u00a34.7m in 2024-25 and \u00a33.5m in 2025-26, despite introducing weekly spending panels and mandatory vacancy freezes. The report warns that services are facing structural problems: temporary accommodation, housing benefit subsidy, and waste collection are running persistent deficits totalling \u00a32.26m annually. Early forecasts for 2026-27 show a further overspend exceeding \u00a31m is \"highly likely\", driven largely by cleansing services. The council faces an estimated \u00a3700k to \u00a31.2m bill for Local Government Reorganisation transition costs with no identified funding source.","url":"https://thanet.moderngov.co.uk/documents/s97590/97590.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000114","council":"Thanet","tag":"LOBO","figures":"\u00a34.5m LOBO at 4.19%, repaid 9 December 2025","quote":"The Council had a Lender Option Borrower Option (LOBO) loan for \u00a34.5m at 4.19% and the lender exercised its option to increase the interest rate from 9 December 2025. Accordingly, the Council exercised its option to repay this loan on the same date.","paper":"Council - 2025-26 Budget Approvals Report","committee":"Council"},{"lane":"ours","source":"Tunbridge Wells","title":"Tunbridge Wells council starts year with stronger cash position as investment income outperforms","summary":"Tunbridge Wells Cabinet heard on 24 September that the council opened the financial year with \u00a341.9 million in cash, \u00a31.9 million more than budgeted, after capital projects totalling \u00a314.074 million were rescheduled into 2026/27. The stronger liquidity position has boosted investment returns. The council forecasts investment income of \u00a32.2 million for the year against a \u00a32 million budget, a surplus of \u00a3200,000 that will be transferred to reserves, after achieving an average interest rate of 4.13 per cent rather than the budgeted 3.94 per cent. Q1 investment balances reached \u00a348.3 million, well above the year-end budget assumption of \u00a328.9 million. The council holds no external debt. However, the capital programme is forecast to spend \u00a319.9 million in 2026/27 against a budget of \u00a38.9 million\u2014more than double\u2014and the Grant Volatility Reserve, which buffers against swings in government funding, is forecast to be completely depleted by March 2027.","url":"https://tunbridgewells.moderngov.co.uk/documents/s84985/84985.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000116","council":"Tunbridge Wells","tag":"borrowing","figures":"Internal Borrowing: \u00a33,687k","quote":"Internal Borrowing still to be repaid (projects not yet financed/MRP) (3,687)","paper":"Quarter 1 Treasury Management 202627","committee":"Cabinet"},{"lane":"ours","source":"Tamworth","title":"Tamworth housing safety failures breach statutory deadlines in damp and mould cases","summary":"Tamworth Borough Council's audit committee heard that the council has failed to meet legal response times in tackling emergency damp and mould cases in its housing stock. Of 14 emergency cases reviewed between October 2025 and March 2026, seven breached statutory requirements. One case took 264 hours to fix instead of the required 24 hours; follow-on works in three cases were delayed 15, 17 and 54 days instead of five. Internal audit also found only 53.8 per cent of fire safety remedial works and 48 per cent of water safety works were complete. The audit gave a \"limited\" opinion\u2014the weakest available\u2014on the council's housing safety controls, citing gaps in procedures, incomplete evidence of work done, and reliance on manual spreadsheets to track compliance. The council has not yet prepared for Phase 2 of the Awaab's Law regulations, due in 2026, which will expand the hazards covered.","url":"https://tamworth.moderngov.co.uk/documents/s45358/45358.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000199","council":"Tamworth","tag":"borrowing","figures":"Gross borrowing \u00a363.060m (unchanged from prior year); Capital Financing Requirement \u00a374.0m; net borrowing position \u00a37.158m under-borrowed","quote":"Due to the elevated cost of borrowing long-term, no borrowing was undertaken during the year.","paper":"Internal Audit 2026/27 Progress and Follow-Up of Recommendations Report","committee":"Audit and Governance Committee"},{"lane":"policy","source":"MHCLG","title":"Correspondence: City of London Corporation Local Plan: letters from the Housing Minister","url":"https://www.gov.uk/government/publications/city-of-london-corporation-local-plan-letters-from-the-housing-minister","summary":"Letters from the Minister of State for Housing and Planning, the Right Honourable Matthew Pennycook MP, to the Planning Inspectorate in respect of the City of London Corporation Local Plan.","iso":"2026-09-24T08:43:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Live tables on housing supply: indicators of new supply","url":"https://www.gov.uk/government/statistical-data-sets/live-tables-on-house-building","summary":"The latest data tables on housing supply: indicators of new supply.","iso":"2026-09-24T08:30:20+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Housing supply: indicators of new supply, England: April to June 2026","url":"https://www.gov.uk/government/statistics/housing-supply-indicators-of-new-supply-england-april-to-june-2026","summary":"An indication of the levels of and trends in new housing supply in England.","iso":"2026-09-24T08:30:18+00:00"},{"lane":"policy","source":"MHCLG","title":"Live tables on planning application statistics","url":"https://www.gov.uk/government/statistical-data-sets/live-tables-on-planning-application-statistics","summary":"Live tables for statistics on planning applications at national and local planning authority level.","iso":"2026-09-24T08:30:16+00:00"},{"lane":"policy","source":"MHCLG","title":"Historical and discontinued planning live tables","url":"https://www.gov.uk/government/statistical-data-sets/historical-and-discontinued-planning-live-tables","summary":"Historical and discontinued tables on planning applications.","iso":"2026-09-24T08:30:16+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Planning applications in England: April to June 2026","url":"https://www.gov.uk/government/statistics/planning-applications-in-england-april-to-june-2026","summary":"Accredited Official Statistics on the number of planning applications received, decided and granted in England.","iso":"2026-09-24T08:30:16+00:00"},{"lane":"councils","source":"LGC","title":"Social care ombudsman complaints rise 22%","url":"https://www.lgcplus.com/services/health-and-care/social-care-ombudsman-complaints-rise-22-24-09-2026/","summary":"Complaints to the ombudsman about adult social care rose by 22% last year, new figures show. The Local Government & Social Care Ombudsman received 3,938 complaints about adult social care in 2025-26, according to its annual review published today. The largest share of complaints to\u2026\nThe post Social care ombudsman complaints rise 22% appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T04:38:19+00:00"},{"lane":"councils","source":"LGC","title":"LGA calls for \u2018alternative\u2019 to EFS","url":"https://www.lgcplus.com/finance/lga-calls-for-alternative-to-efs-24-09-2026/","summary":"The Local Government Association has called for a revision of the exceptional financial support programme, with its chair warning councils are \"financially fragile\". In its Autumn Budget submission to the chancellor the LGA said it is \u201cconcerned about the effectiveness\u201d of EFS for those councils\u2026\nThe post LGA calls for \u2018alternative\u2019 to EFS appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T03:27:03+00:00"},{"lane":"councils","source":"LG finance press","title":"IFS Recruitment Event 2026 - ifs.org.uk","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9oS3JrT2ZoaUEwY1BHZ2F2ckU2R0ZOdTNCN1Nkc1lwQ2hud2c1VkhhNFFtdkx5WHBpc1pFcHo3TDVRWkRYLXFqd1ZkUGRVTC1BWDBxSVplUXp6YW5tQXBCaTZB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9oS3JrT2ZoaUEwY1BHZ2F2ckU2R0ZOdTNCN1Nkc1lwQ2hud2c1VkhhNFFtdkx5WHBpc1pFcHo3TDVRWkRYLXFqd1ZkUGRVTC1BWDBxSVplUXp6YW5tQXBCaTZB?oc=5\" target=\"_blank\">IFS Recruitment Event 2026</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">ifs.org.uk</font>","iso":"2026-09-23T15:42:56+00:00"},{"lane":"councils","source":"LGC","title":"WEBINAR: How Burnley became Council of the Year","url":"https://www.lgcplus.com/politics/governance-and-structure/webinar-how-burnley-became-council-of-the-year-23-09-2026/","summary":"Burnley BC was named Council of the Year at the LGC Awards 2026. The judges said: \u201cThis council has demonstrated exceptional work in place leadership and community cohesion. The judges were inspired by the council\u2019s passion and fearless leadership, with outstanding results in areas from\u2026\nThe post WEBINAR: How Burnley became Council of the Year appeared first on Local Government Chronicle (LGC).","iso":"2026-09-23T10:06:30+00:00"},{"lane":"councils","source":"LGC","title":"LGPS local investment \u2018can\u2019t start hyper local\u2019","url":"https://www.lgcplus.com/lgps/lgps-local-investment-cant-start-hyper-local-23-09-2026/","summary":"The Local Government Pension Scheme should not begin its new legal duty on investing in local areas by going \"hyper local,\" a senior pool figure has warned. Council pension funds, the pools that invest their assets on their behalf and strategic authorities are required to\u2026\nThe post LGPS local investment \u2018can\u2019t start hyper local\u2019 appeared first on Local Government Chronicle (LGC).","iso":"2026-09-23T09:58:53+00:00"},{"lane":"councils","source":"LGC","title":"Rail strategies will need \u2018genuine\u2019 devo","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/rail-strategies-will-need-genuine-devo-23-09-2026/","summary":"Devolution must be \u201cgenuine\u201d and not just a policy of decentralisation for a successful rail transport network, according to a Lib Dem Lord. At this year\u2019s Liberal democrat conference, Baroness Pidgeon (Lib Dem), who was previously the party\u2019s transport spokesperson, said that a significant transport\u2026\nThe post Rail strategies will need \u2018genuine\u2019 devo appeared first on Local Government Chronicle (L","iso":"2026-09-23T09:11:25+00:00"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"councils","source":"LGC","title":"\u2018We need to be one of those major house builders again\u2019","url":"https://www.lgcplus.com/services/housing/we-need-to-be-one-of-those-major-house-builders-again-23-09-2026/","summary":"Local government needs to play a central role in social housing development and building, according to the deputy leader of Southwark LBC. At this year\u2019s Liberal Democrat annual conference, conversation opened up about the role of local government in housing delivery during a panel about\u2026\nThe post \u2018We need to be one of those major house builders again\u2019 appeared first on Local Government Chronicle ","iso":"2026-09-23T08:23:33+00:00"},{"lane":"councils","source":"LGC","title":"LGR delay: setback or opportunity?","url":"https://www.lgcplus.com/politics/governance-and-structure/lgr-delay-setback-or-opportunity-23-09-2026/","summary":"Norse chief executive Justin Galliford argues councils must keep preparing for reorganisation - and use the pause to secure a more resilient local government settlement. Sponsored comment from Norse. The delay to local government reorganisation confirms a familiar truth: reshaping local democracy is rarely straightforward.\u2026\nThe post LGR delay: setback or opportunity? appeared first on Local Govern","iso":"2026-09-23T08:00:18+00:00"},{"lane":"markets","source":"Bank of England","title":"Foreign Currency Reserves 2026 \u2013 Market Notice 22 September 2026","url":"https://www.bankofengland.co.uk/markets/market-notices/2026/september/foreign-currency-reserves-2026-market-notice-22-september-2026","summary":"Not for distribution, directly or indirectly, in or into the United States, Canada, Australia, Japan or any other jurisdiction where it is unlawful to distribute this announcement","iso":"2026-09-22T15:30:00+00:00"},{"lane":"councils","source":"LG finance press","title":"\u2018Capabilities are not equal\u2019 across mayoral areas, says former Treasury minister - Room151","url":"https://news.google.com/rss/articles/CBMisgFBVV95cUxNaWNWM053OTYwOGIxaDVPQkhvR2t2WGlhVXF4cEZxNGY5ZUUwS1J5MVlNM3JfQ3BHbEVMWkNUMHcxbUVnaExDandQTml4LUE2MFJDN0p4czQ2Qjc1ekpiUmlDSmJJMm5TOVdvS2lCdEIyc3F0d3RiYTQ4QlloMk90aS11TVBNN1FIWFdURjVpb05TV2xrcVlYS1BrWUtsdGtXNWw2emRIMlFkdXl5aFFDSW5B?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMisgFBVV95cUxNaWNWM053OTYwOGIxaDVPQkhvR2t2WGlhVXF4cEZxNGY5ZUUwS1J5MVlNM3JfQ3BHbEVMWkNUMHcxbUVnaExDandQTml4LUE2MFJDN0p4czQ2Qjc1ekpiUmlDSmJJMm5TOVdvS2lCdEIyc3F0d3RiYTQ4QlloMk90aS11TVBNN1FIWFdURjVpb05TV2xrcVlYS1BrWUtsdGtXNWw2emRIMlFkdXl5aFFDSW5B?oc=5\" target=\"_blank\">\u2018Capabilities are not equal\u2019 across mayoral areas, says former Treasury minister</a>&nb","iso":"2026-09-22T14:05:13+00:00"},{"lane":"policy","source":"HM Treasury","title":"Guidance: Submit an enquiry to HM Treasury","url":"https://www.gov.uk/government/publications/submit-an-enquiry-to-hm-treasury","summary":"Use this form to send an enquiry to HM Treasury.","iso":"2026-09-22T10:30:01+00:00"},{"lane":"policy","source":"HM Treasury","title":"Guidance: Submit an FOI request to HM Treasury","url":"https://www.gov.uk/government/publications/submit-an-foi-request-to-hm-treasury","summary":"Use this form to send an FOI request to HM Treasury.","iso":"2026-09-22T10:30:01+00:00"},{"lane":"policy","source":"HM Treasury","title":"Corporate report: Whole of Government Accounts 2025 to 2026: guidance for preparers","url":"https://www.gov.uk/government/publications/whole-of-government-accounts-2025-to-2026-guidance-for-preparers","summary":"Guidance for central government and local government preparers for Whole of Government Accounts.","iso":"2026-09-22T10:06:58+00:00"},{"lane":"ours","source":"Medway Towns UA","title":"Medway faces \u00a326.7m current-year overspend and \u00a365m structural deficit dependent on government funding","summary":"Medway Council faces a \u00a326.7m overspend forecast in the current financial year, exceeding its total general reserves of \u00a310.1m, and a structural budget gap of \u00a365.9m in 2027/28 rising to \u00a3359.3m cumulatively across the medium term. The financial plan cannot be balanced without exceptional financial support from government\u2014permission to borrow to cover day-to-day spending\u2014which has not been confirmed for 2027/28. If the government refuses, the Section 151 officer, the council's chief finance officer, may be forced to issue a Section 114 notice, a formal warning that the council cannot balance its budget, which freezes new spending until councillors agree a plan. The Cabinet heard pressures of \u00a338.6m in adult social care and \u00a39.2m in children's services, with adult social care costs having more than doubled since 2020-21.","url":"https://democracy.medway.gov.uk/documents/s91492/91492.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000035","council":"Medway Towns UA","tag":"s114 risk","figures":"\u00a365.858m 2027/28 gap dependent on EFS; EFS already granted for 2025/26 (\u00a39.856m) and agreed in-principle for 2026/27 (total \u00a328.003m borrowed)","quote":"The current MTFO projections cannot be balanced through the use of reserves and assume that further exceptional financial support from Government will be required. There remains a significant risk to the Council's financial resilience should additional support not be forthcoming...In the unlikely event that the MHCLG rejects the Council's latest application for EFS, the Section 151 Officer may be forced to issue a Section 114 notice to the Council.","paper":"Report","committee":"Cabinet"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: OSCAR II \u2013 publishing data from the database: September 2026","url":"https://www.gov.uk/government/publications/oscar-ii-publishing-data-from-the-database-september-2026","summary":"The first quarterly OSCAR transparency release for 2026-27.","iso":"2026-09-22T08:30:02+00:00"},{"lane":"policy","source":"HM Treasury","title":"Accredited official statistics: Public sector finances bulletin","url":"https://www.gov.uk/government/statistics/public-sector-finances-bulletin","summary":"The public sector finances statistical bulletin.","iso":"2026-09-22T06:52:50+00:00"},{"lane":"councils","source":"LG finance press","title":"Electricity prices - ifs.org.uk","url":"https://news.google.com/rss/articles/CBMiX0FVX3lxTFBUM1ZrY1ZINXpVd09weEgzM1g0SWx3RFJ4RWVEOWFVRUJxbE5DaFlabE1yU1NnZzAxUXcxS0NUaTVFeDc0bzZ2M1NRbVU0RWw5N29rTnExUG8xVkc5YmdZ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiX0FVX3lxTFBUM1ZrY1ZINXpVd09weEgzM1g0SWx3RFJ4RWVEOWFVRUJxbE5DaFlabE1yU1NnZzAxUXcxS0NUaTVFeDc0bzZ2M1NRbVU0RWw5N29rTnExUG8xVkc5YmdZ?oc=5\" target=\"_blank\">Electricity prices</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">ifs.org.uk</font>","iso":"2026-09-22T00:36:37+00:00"},{"lane":"councils","source":"LG finance press","title":"Scotland: plan to replace councils with \u2018six to ten\u2019 regional authorities - Room151","url":"https://news.google.com/rss/articles/CBMirAFBVV95cUxPa1k2N1FETDBkRjNSSGpOQ2tjQ1ZvdG1rTVBfSEJJMTNvVGRNN0pwTEk2dml4U3RkcnJ1YXc1azZwS2NhR3VISFFLb2w0UkhrNURVLXlUYjV4SU5WZWdMeHdqTHU3enhJWXhIRmotQVJmZ3puN0xZQldaRm5XTmhma1FTYzZHa1g4WFlOMzRIQXFDMXkzQlpPODc0Q3dYdHR5MG1WX2dhZl9SWng4?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMirAFBVV95cUxPa1k2N1FETDBkRjNSSGpOQ2tjQ1ZvdG1rTVBfSEJJMTNvVGRNN0pwTEk2dml4U3RkcnJ1YXc1azZwS2NhR3VISFFLb2w0UkhrNURVLXlUYjV4SU5WZWdMeHdqTHU3enhJWXhIRmotQVJmZ3puN0xZQldaRm5XTmhma1FTYzZHa1g4WFlOMzRIQXFDMXkzQlpPODc0Q3dYdHR5MG1WX2dhZl9SWng4?oc=5\" target=\"_blank\">Scotland: plan to replace councils with \u2018six to ten\u2019 regional authorities</a>&nbsp;&nbsp;<font ","iso":"2026-09-21T16:12:20+00:00"},{"lane":"markets","source":"Bank of England","title":"Bank of England announces new office space in Leeds","url":"https://www.bankofengland.co.uk/news/2026/september/bank-of-england-announces-new-office-space-in-leeds","summary":"The Bank of England has secured\u202fa\u202fnew long-term premises in Leeds, marking a major milestone in its commitment to\u202fbuild\u202fits presence in the region.","iso":"2026-09-21T12:00:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Special Development Order: Entertainment Resort Complex and Associated Development in Bedford","url":"https://www.gov.uk/guidance/special-development-order-entertainment-resort-complex-and-associated-development-in-bedford","summary":"The map, copies of notices, documents, and statements identifying documents not published for reasons of safety or security of any premises or property or national security.","iso":"2026-09-21T11:35:57+00:00"},{"lane":"markets","source":"Bank of England","title":"Foreign Currency Reserves 2026 \u2013 Market Notice 21 September 2026","url":"https://www.bankofengland.co.uk/markets/market-notices/2026/september/foreign-currency-reserves-2026-market-notice-21-september-2026","summary":"Not for distribution, directly or indirectly, in or into the United States, Canada, Australia, Japan or any other jurisdiction where it is unlawful to distribute this announcement","iso":"2026-09-21T11:30:00+00:00"},{"lane":"ours","source":"Slough UA","title":"Slough Council faces \u00a319.9m overspend with government-appointed commissioners warning of financial collapse by year-end.","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-01T07:00:00+00:00"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"CIPFA and the codes","title":"CIPFA prudential code changes aim for greater council transparency - localgov.co.uk","url":"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2Vj function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
