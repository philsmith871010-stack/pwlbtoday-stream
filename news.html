<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>
</head><body>

FtWHk3TXoxTjRZUUVva0pBUmJUbmprXzdRazQ?oc=5\" target=\"_blank\">Audit completion up but improved guidance on reforms needed, finds PSAA</a>&nbsp;&nbsp;<font col","iso":"2026-09-30T09:31:25+00:00"},{"lane":"markets","source":"Bank of England","title":"Financial Policy Committee Record \u2013 September 2026","url":"https://www.bankofengland.co.uk/financial-policy-committee-record/2026/september-2026","summary":"Our Financial Policy Committee (FPC) meets to identify risks to financial stability and agree policy actions aimed at safeguarding the resilience of the UK financial system.","iso":"2026-09-30T09:30:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: MHCLG\u2019s live commissioned research studies","url":"https://www.gov.uk/government/publications/mhclgs-live-commissioned-research-studies","summary":"A summary of the Ministry of Housing, Communities and Local Government\u2019s (MHCLG) live research studies as at September 2026.","iso":"2026-09-30T09:29:51+00:00"},{"lane":"councils","source":"LGC","title":"McMahon: No plan to give council powers to mayors","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/mcmahon-no-plan-to-give-council-powers-to-mayors-30-09-2026/","summary":"The local government minister has said the government does not have a programme to shift powers from councils to regional government. Jim McMahon was responding to concerns from some in local government that the government\u2019s devolution plans risk centralising power at a regional level with\u2026\nThe post McMahon: No plan to give council powers to mayors appeared first on Local Government Chronicle (LGC","iso":"2026-09-30T09:04:57+00:00"},{"lane":"markets","source":"Guardian business","title":"Prosecco pratfalls and coffee catastrophes: Neets are missing out on formative first-job experiences | Isabel Brooks","url":"https://www.theguardian.com/commentisfree/2026/sep/30/neets-formative-first-job-experiences-hospitality-industry","summary":"<p>Work in the hospitality industry made me who I am. Without it, young people are denied not only an income and a step on the career ladder, but important life skills</p><p>Everyone remembers their first job. More often than not, it\u2019s in the service industry. I started at 14, pouring drinks, serving food and standing with an ice-cream tray. This is where I learned how to handle mistakes,<strong> ","iso":"2026-09-30T09:00:23+00:00"},{"lane":"markets","source":"Guardian business","title":"Super-rich UK energy and food magnates\u2019 wealth skyrockets amid global crises","url":"https://www.theguardian.com/news/2026/sep/30/super-rich-uk-energy-and-food-magnates-wealth-skyrockets-amid-global-crises","summary":"<p>Analysis has shown the costs of daily essentials soaring in recent years, thanks in part to climate shocks, wars and geopolitical tensions</p><p>Fran\u00e7ois Perrodo is what is known in motorsport as a gentleman driver. In June, he raced at Le Mans, earning a podium place. At the end of August he was back behind the wheel at the Circuit de Spa-Francorchamps. This time he won.</p><p>Gentleman driver","iso":"2026-09-30T09:00:21+00:00"},{"lane":"ours","source":"Halton UA","title":"Halton's Mersey Gateway toll project cuts annual deficit by two-thirds in four years as revenue climbs 33 per cent.","summary":"The Mersey Gateway Crossings project, funded by a combination of Department for Transport grant and toll revenue, has narrowed its annual deficit from \u00a321.5m in 2021-22 to \u00a37.4m in 2025-26, a reduction of 66 per cent. Toll revenue has grown to \u00a359m a year, up from \u00a344.5m four years earlier, driven by traffic recovery to pre-pandemic levels and beyond, and by the first toll increase since the bridge opened in 2017. The council held the Class 2 toll charge at \u00a32.40 in April 2025, well below the \u00a32.90 it would have been had cumulative inflation been passed entirely to users. Grant support from the Department for Transport is now declining, from \u00a320.67m this year to \u00a318.11m by 2028-29, placing greater reliance on toll revenue to meet operating costs. The council has returned \u00a325.33m of unused grant to the department at this review point, retaining \u00a34.47m for sustainable transport and bridge maintenance. At the same meeting, the council appointed a new Head of Internal Audit and Assurance following a review that found the former post had carried significant operational responsibilities alongside audit duties, a structure that conflicted with audit independence standards.","url":"https://moderngov.halton.gov.uk/documents/s83362/83362.pdf","iso":"2026-09-30T09:00:00+00:00","gss":"E06000006","council":"Halton UA","tag":"EFS","figures":"\u00a333.9m, 2026/27 budget year","quote":"The Council has set a balanced 2026/27 budget but has required approval from Government of \u00a333.9m of Exceptional Financial Support.","paper":"Item 5 External Auditors Annual Report 2025.26","committee":"Audit and Governance Board"},{"lane":"ours","source":"Gloucestershire CC","title":"Gloucestershire general reserves at \u00a336.3m face further erosion as day-to-day spending overshoots budget by \u00a32.4m amid school and care cost pressures","summary":"Gloucestershire County Council's general reserves, already at its minimum safety level, face further erosion this year as day-to-day spending overshoots budget by \u00a32.4m. The Corporate Overview and Scrutiny Committee heard that reserves stand at \u00a336.3m, only just above the 5% minimum the council has set. The pressure comes from two unbudgeted demand surges: a schools funding shortfall that has grown by \u00a314m in three months to \u00a368.4m as more children enter special education, and adult social care overspending by \u00a33.2m on learning disabilities packages. Children's disability placements add another \u00a31.8m pressure. The council has deferred \u00a339.8m of its capital programme\u2014including \u00a317.6m of children's services schemes and \u00a311.1m of transport work\u2014to ease immediate cash strain. A \u00a37m portion of its \u00a337.2m savings plan also faces delivery risk. The schools deficit depends on government approval of the council's special educational needs reform plan to unlock a grant covering 90% of costs, expected in autumn.","url":"https://gloucestershire.moderngov.co.uk/documents/s120308/120308.pdf","iso":"2026-09-30T09:00:00+00:00","gss":"E10000013","council":"Gloucestershire CC","tag":"DSG / SEND","figures":"\u00a368.447m in-year DSG deficit (budgeted \u00a354.408m), \u00a314.039m deterioration, \u00a3193.165m cumulative deficit, government grant 90% of deficit pending SEND Plan approval","quote":"the in-year DSG deficit is now forecast to be \u00a368.447 million, which is \u00a314.039 million higher than the figure projected in the MTFS. The cumulative DSG deficit is therefore forecast to reach \u00a3193.165 million as at 31 March 2027. These figures do not include any impact of the High Needs Stability Grant (90% funding commitment from Central Government), of which the first instalments are expected in Autumn 2026, assuming the SEND Reform Plan is approved.","paper":"COSC - Financial Monitoring Report - Q1 2026-27","committee":"Corporate Overview and Scrutiny Committee"},{"lane":"ours","source":"Durham UA","title":"Durham audit confirms clean opinion on 2024/25 accounts and stable finances.","summary":"County Durham's Audit Committee heard on 30 September that external auditors Forvis Mazars had given an unqualified opinion on the council's 2024/25 accounts and its arrangements for value for money. The council's own going concern assessment, confirmed by the Corporate Director of Resources on 31 July, concluded there were no significant financial or operating risks to its continuing operation and that it had ready access to financial resources. Internal Audit delivered a moderate opinion on the effectiveness of the council's control environment for 2025/26, with 97% of 405 prior audit recommendations implemented by 30 June. One Resources Service review received limited assurance during the first quarter, though details remain confidential. Internal Audit was significantly understaffed in that quarter owing to unplanned absences, delivering only 18% of its planned productive hours against an expected 22.5%. An external Local Government Association peer review from October 2025 found the council financially well-managed with debt and reserves consistent with sector practice.","url":"https://democracy.durham.gov.uk/documents/s229397/229397.pdf","iso":"2026-09-30T09:00:00+00:00","gss":"E06000047","council":"Durham UA","tag":"audit opinion","figures":"Assessment period to 31 March 2026; forward-looking period of at least 12 months","quote":"It did not identify any event that would cast a significant doubt on the organisation's ability to continue as a going concern.","paper":"04 Audit Strategy Memorandum \u2013 DCC Pension Fund","committee":"Audit Committee"},{"lane":"ours","source":"Gosport","title":"Gosport sells White Horse Inn for \u00a3140,000 to help meet two-year savings target","summary":"Gosport Borough Council is disposing of the White Horse Inn freehold for \u00a3140,000, a sale explicitly linked to the council's need to deliver savings over the next two financial years. The property currently generates only \u00a3135 a year in rental income under a fixed lease, making it a poor-performing asset. The agreed price significantly exceeds the council's March 2025 valuation of \u00a332,000, reflecting the value created by combining the freehold and leasehold interests. The capital receipt from the sale must be used to repay the council's borrowing or fund new capital assets, in accordance with the council's capital strategy. The sale comes as the council forecasts a minor revenue overspend of \u00a323,000 on its \u00a315.2 million net budget in the first quarter of 2026/27\u2014less than 1 per cent variance\u2014while its \u00a338.4 million capital programme faces \u00a38.4 million of slippage, primarily in regeneration schemes including the Local Regeneration Fund projects.","url":"https://gosport.moderngov.co.uk/documents/s7270/7270.pdf","iso":"2026-09-30T09:00:00+00:00","gss":"E07000088","council":"Gosport","tag":"borrowing","figures":"Total unsupported borrowing: \u00a34,006,528. 2026/27: \u00a33,780,325.","quote":"Unsupported Borrowing UB 226,203 \u00a3 3,209,000\u00a3 3,780,325\u00a3 - \u00a3 -\u00a3 -\u00a3 -\u00a3 4,006,528\u00a3","paper":"P&amp;O Board Report - White Horse Inn - Proposed Disposal","committee":"Policy and Organisation Board"},{"lane":"ours","source":"Boston BC","title":"Boston council forecasts \u00a355,000 revenue deficit as service pressures outpace investment income windfall","summary":"Boston council is forecasting a \u00a355,000 deficit for 2026\u201327 after the first quarter, driven by \u00a3354,000 in service cost pressures that are being offset only by investment income performing \u00a3299,000 above budget. The council faces income shortfalls across multiple service areas, including cremation services (\u00a342,000), neighbourhoods (\u00a342,000) and markets rental (\u00a316,000), while staffing costs have outrun budgeted savings in neighbourhoods (\u00a3108,000), communities and housing (\u00a382,000) and strategic growth (\u00a316,000). A 3.3 per cent local government pay award, above the 3 per cent budgeted, adds a further \u00a322,000 pressure. To manage cash flow, the council has budgeted to take \u00a33 million in short-term borrowing from October 2026 at 3.5 per cent, against existing debt of \u00a31 million. Reserves fell by \u00a32.355 million in the quarter and are forecast to fall by a further \u00a31.532 million over the full year, to \u00a317.820 million by March 2027. Council tax collection at 27.15 per cent lags the previous year's 27.57 per cent, which the council attributes to the cost-of-living crisis.","url":"https://democracy.boston.gov.uk/documents/s26698/26698.pdf","iso":"2026-09-30T09:00:00+00:00","gss":"E07000136","council":"Boston BC","tag":"borrowing","figures":"External Grants \u00a322.232m (72% of \u00a330.696m), Internal Borrowing \u00a38.181m (27%)","quote":"The majority of the capital programme is financed through external grant funding.","paper":"Appendix A - BBC Q1 Finance Revenue Report 2026-27","committee":"Cabinet"},{"lane":"councils","source":"LGC","title":"McGovern: Commissioning \u2018at the heart\u2019 of care reform","url":"https://www.lgcplus.com/services/health-and-care/mcgovern-commissioning-at-the-heart-of-care-reform-30-09-2026/","summary":"The government wants to look at how local authorities commission services and what skills they need as part of social care reforms, the care minister said earlier today. Alison McGovern was speaking at a Fabian Society fringe event about developing a national care service where\u2026\nThe post McGovern: Commissioning \u2018at the heart\u2019 of care reform appeared first on Local Government Chronicle (LGC).","iso":"2026-09-30T08:52:46+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Fire statistics guidance","url":"https://www.gov.uk/government/publications/fire-statistics-guidance","summary":"This page contains all guidance, quality and definition documents associated with fire statistics.","iso":"2026-09-30T08:30:03+00:00"},{"lane":"policy","source":"MHCLG","title":"Fire statistics data tables","url":"https://www.gov.uk/government/statistical-data-sets/fire-statistics-data-tables","summary":"The Ministry of Housing, Communities and Local Government collects detailed information on incidents attended by Fire and Rescue Services.","iso":"2026-09-30T08:30:03+00:00"},{"lane":"policy","source":"MHCLG","title":"Research: Building Safety Remediation: monthly data release - August 2026","url":"https://www.gov.uk/government/publications/building-safety-remediation-monthly-data-release-august-2026","summary":"The 106th monthly data relea said that Mr Burnham had \u201cset out a powerful\u2026\nThe post Mason: Devo \u2018won\u2019t mean anything\u2019 if it stops at mayors appeared first on Local Government Chronicle (LGC).","iso":"2026-09-29T10:47:07+00:00"},{"lane":"councils","source":"LG finance press","title":"S151s back in \u2018washing machine of turmoil\u2019 as LGR pause impacts planning - Room151","url":"https://news.google.com/rss/articles/CBMiqAFBVV95cUxNY0RXeE9YSjNZWGdMeWRsbUxYMUgzOEViZFJKUC1hb2l6eFlUem1yWE9qYXFQbnB3Q29uMXVIMndjOGUyZVhIRnFWX2VVTi1rNGRmQTlpU0N3OHRtdHR3R29XNWRoSk5hck5vd0t3OWh5ZENHdDdNVEs0Tkl2TGpFYmlBcnJkakFZRUdKSGswbWJMV2ViYmNXLXBQeHFlTjhlV0FDb0pqaEo?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiqAFBVV95cUxNY0RXeE9YSjNZWGdMeWRsbUxYMUgzOEViZFJKUC1hb2l6eFlUem1yWE9qYXFQbnB3Q29uMXVIMndjOGUyZVhIRnFWX2VVTi1rNGRmQTlpU0N3OHRtdHR3R29XNWRoSk5hck5vd0t3OWh5ZENHdDdNVEs0Tkl2TGpFYmlBcnJkakFZRUdKSGswbWJMV2ViYmNXLXBQeHFlTjhlV0FDb0pqaEo?oc=5\" target=\"_blank\">S151s back in \u2018washing machine of turmoil\u2019 as LGR pause impacts planning</a>&nbsp;&nbsp;<font color=","iso":"2026-09-29T10:34:08+00:00"},{"lane":"ours","source":"Windsor & Maidenhead UA","title":"Windsor and Maidenhead capital spending forecast at less than half of annual budget","summary":"Windsor and Maidenhead council is forecasting only \u00a334.3m in capital spending \u2014 money spent on buildings, vehicles and equipment \u2014 against a \u00a367.2m annual budget for 2026-27, a shortfall of \u00a331.2m. The shortfall has worsened in recent months, declining by \u00a39.1m between month 2 and month 4 forecasts. Waste collection vehicles (\u00a37.2m), Heatherwood Royal (\u00a33.4m) and street lighting enhancement (\u00a31.7m) are all forecast at or near zero. The council's largest shortfall is the ICB Health Hub: council papers provide no explanation for the \u00a314.7m underspend, with the project forecast at \u00a39.7m against a \u00a324.4m budget. Other delays include \u00a32.3m of school funding for children with special educational needs unallocated while awaiting government reforms, and a bus improvement plan \u00a30.4m lower because contracted works exceeded what is deliverable. Capital reserves have grown to \u00a3111.5m.","url":"https://rbwm.moderngov.co.uk/documents/s73201/73201.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000040","council":"Windsor & Maidenhead UA","tag":"EFS","figures":"\u00a348,754k budgeted EFS; \u00a30 received to date; represents 26% of total funding budget of \u00a3187,055k","quote":"Exceptional Financial Support (48,754) 0 (48,754) 0 (48,754) 0 0","paper":"Appendix E - Reserves","committee":"Cabinet"},{"lane":"ours","source":"East Sussex CC","title":"East Sussex requests \u00a370m emergency government funding for 2026/27 budget gap","summary":"East Sussex has asked the government for up to \u00a370m of exceptional financial support to balance its budget for 2026/27, covering a projected deficit of \u00a355.6m. The council has received agreement in principle, but has told the Department for Levelling Up, Housing and Communities it will likely need the same support again in 2027/28 to meet its statutory duties. The request follows a Fair Funding Review settlement that increased the council's core spending power by 11%, below the national average of 15% even with planned council tax rises of 5% per annum. The council projects a cumulative deficit of \u00a3117.7m by 2028/29. Strategic reserves are forecast to fall to \u00a33.9m by 2030, excluding any additional draws needed to balance future budgets.","url":"https://democracy.eastsussex.gov.uk/documents/s79408/79408.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E10000011","council":"East Sussex CC","tag":"EFS","figures":"\u00a355.6m deficit for 2026/27; \u00a370m capitalisation requested; cumulative deficit of \u00a3117.7m by 2028/29","quote":"Our revenue budget for 2026/27 includes a \u00a355.6m deficit, which has led us to request Exceptional Financial Support from Government... we have notified MHCLG that without further Government funding to address the challenges we face, we are likely to require EFS for 2027/28 to deliver our statutory duties.","paper":"Appendix 1","committee":"Cabinet"},{"lane":"ours","source":"Bristol UA","title":"Bristol's \u00a385.4m schools funding deficit set to grow before statutory protection expires","summary":"Bristol City Council's Dedicated Schools Grant deficit reached \u00a385.4m as of 31 March 2026 and is forecast to grow further, reaching \u00a342.2m in 2026/27 and \u00a325.3m in 2027/28, according to the council's auditors' annual report. The council can currently hold this deficit in an unusable reserve, a temporary statutory arrangement that expires on 31 March 2028. At that point, unless the government changes its approach or the council eliminates the deficit, the council would need to fund it from its general fund working balance \u2014 currently \u00a338m, or 6% of its annual budget. The council has submitted a SEND Reform Plan that, if approved by government, would secure grant funding covering up to 90% of the historic deficit. However, the auditors note that \"forecast DSG deficits in 2026/27 and 2027/28 create financial risk, particularly given funding uncertainty.\"","url":"https://bristol.moderngov.co.uk/documents/s131453/131453.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000023","council":"Bristol UA","tag":"DSG / SEND","figures":"\u00a329.5m in-year deficit; \u00a385.4m cumulative deficit at 31 March 2026","quote":"The DSG position remains a significant financial challenge, with an in-year deficit of \u00a329.5m million and a cumulative deficit of \u00a385.4m million at 31 March 2026, subject to national funding arrangements and local recovery plans.","paper":"11 - Interim Bristol City Council 2025-26 Auditors Annual Report","committee":"Audit Committee"},{"lane":"ours","source":"Bristol UA","title":"Bristol schools grant deficit reaches \u00a387.8m after \u00a346.7m overspend in 2025-26; first-quarter 2026-27 forecast projects \u00a344.8m in-year overspend","summary":"Bristol City Council is carrying forward a cumulative shortfall of \u00a387.8m on its dedicated schools grant, the government funding that pays for school provision, after spending \u00a346.7m more than allocated in the 2025-26 financial year. A first-quarter forecast for 2026-27 projects an in-year overspend of \u00a344.8m, driven by rising numbers of pupils with complex additional needs and inflationary pressures on specialist provision. The council's recovery plan depends partly on a High Needs Stability Grant from the Department for Education, pending approval of its Local SEND Reform Plan by the end of October. The strain is visible across the sector: 24 of 53 maintained schools are now in cumulative deficit, up from 21 a year ago, while 11 of 12 maintained nursery schools are in deficit totalling \u00a35.5m. The forum also heard the council is considering ending a maternity supply cover scheme for schools unless maintained schools accept increases in their de-delegation rates of 34 per cent for primary and 23 per cent for secondary.","url":"https://bristol.moderngov.co.uk/documents/s131422/131422.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000023","council":"Bristol UA","tag":"DSG / SEND","figures":"\u00a344.8m unmitigated forecast overspend; approval decision expected end of October 2026","quote":"The forecast does not currently assume receipt of the High Needs Stability Grant, pending Government confirmation of the outcome of our reform plan, which is expected by the end of October.","paper":"Item 5 - DSG and NFF 2027-28 - Update","committee":"Bristol Schools Forum"},{"lane":"ours","source":"Stroud","title":"Stroud council's capital spending needs \u00a38.1m higher than budgeted as it plans increased borrowing for housing","summary":"Stroud's capital financing requirement\u2014the total amount it has spent on long-lived assets that it has not yet paid for\u2014reached \u00a3171.4m at the end of June, against a budgeted \u00a3163.3m for the full year. The \u00a38.1m overshoot, mostly from the housing revenue account, means the council faces greater underlying need to borrow than anticipated. The council is responding by increasing borrowing to finance an expanded housing and land acquisition programme, but faces rising interest rates that are now higher than budgeted. The council's cash position is dwindling through the financial year as land acquisitions and social housing spending mount. Investment losses of \u00a35.9m on a \u00a310m portfolio from the liquidation of two property funds will be covered from earmarked reserves. Treasury management remained compliant with all prudential indicators in the quarter, and the council's specified investments outperformed their benchmark yield at 3.97 per cent against a 3.75 per cent target.","url":"https://stroud.moderngov.co.uk/documents/s20993/20993.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000082","council":"Stroud","tag":"borrowing","figures":"External borrowing \u00a3100.717m at 30 June 2026, internal borrowing planned \u00a336,690, next repayment \u00a36m March 2032","quote":"The council's current actual external borrowing is \u00a3100.717m as of 30 June 2026 shown in Table 7 above. The council intends to use internal borrowing of \u00a336,690. The next borrowing to be repaid is \u00a36m in March 2032.","paper":"Internal Audit Progress Report 2026/27","committee":"Audit and Standards Committee"},{"lane":"councils","source":"Distress watch","title":"High Court of Karnataka Allows Relief Against Forfeiture of Lease Under Section 114 of Transfer of Property Act, 1882 \u2014 Tenant Granted One Month to Deposit Arrears of Rent. Court holds that forfeiture of lease for non-payment of rent is not automatic and ten - lawtext.in","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBzMWlJdThDMlBCRVNEMVB5R3dLY1h4OTVUN0JsWnFuZk5TT0JDUU52dGtSVHBvSUJYWFhxN2pqZmJuTTRzXzA3OE5NMFk2Q3NvTW5GUlNkeXA1cWFvbEdmVVNheVZPdw?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBzMWlJdThDMlBCRVNEMVB5R3dLY1h4OTVUN0JsWnFuZk5TT0JDUU52dGtSVHBvSUJYWFhxN2pqZmJuTTRzXzA3OE5NMFk2Q3NvTW5GUlNkeXA1cWFvbEdmVVNheVZPdw?oc=5\" target=\"_blank\">High Court of Karnataka Allows Relief Against Forfeiture of Lease Under Section 114 of Transfer of Property Act, 1882 \u2014 Tenant Granted One Month to Deposit Arrears of Rent. Court holds that","iso":"2026-09-29T06:01:12+00:00"},{"lane":"policy","source":"HM Treasury","title":"Chancellor backs young people into work by supporting jobs","url":"https://www.gov.uk/government/news/chancellor-backs-young-people-into-work-by-supporting-jobs","summary":"The Chancellor has announced a package to help people into work, education and training, while building the skilled workforce Britain needs for the future.","iso":"2026-09-28T15:56:37+00:00"},{"lane":"policy","source":"HM Treasury","title":"More overseas firms enticed to buy British","url":"https://www.gov.uk/government/news/more-overseas-firms-enticed-to-buy-british--2","summary":"Overseas buyers will be offered a new UK Export Finance loan guarantee to incentivise buying goods and services from British companies.","iso":"2026-09-28T15:43:57+00:00"},{"lane":"ours","source":"Isle of Wight UA","title":"Treasury saving of \u00a3925,000 helps Isle of Wight Council manage budget pressures","summary":"Isle of Wight Council's treasury management generated a forecast saving of \u00a3925,000 in the year to March, contributing to management of wider in-year budget pressures. The saving came from lower borrowing costs and increased investment income, the council reported. A further \u00a3655,000 saving is forecast for the current financial year from the same sources. However, the council holds \u00a338.2 million of commercial property investments and must review options for exiting these holdings before taking on further borrowing. Internal audit gave the highest assurance rating to the treasury management controls.","url":"https://iow.moderngov.co.uk/documents/s24049/24049.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000046","council":"Isle of Wight UA","tag":"s114","figures":"One loan outstanding; zero loans to S114 authorities","quote":"Close attention is taken to the financial situation of other local authorities, and no loans have been made to any authority that has issued a S114 notice.","paper":"7e. Treasury Management Report Quarter 4 2025-26","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Stockton-on-Tees UA","title":"Stockton-on-Tees increased borrowing by \u00a326.89m in 2025-26 despite capital spending 46% below budget","summary":"Stockton-on-Tees raised net borrowing from \u00a3111.43m to \u00a3138.32m during 2025-26, taking on \u00a340m of new government loans at rates between 4.31% and 4.57%, even as capital spending fell substantially short of plan. The council spent \u00a351.2m of a \u00a394.53m capital budget, leaving \u00a343.35m unspent. The mismatch reflects a deliberate strategy of internal borrowing\u2014using reserves instead of external loans to minimize interest costs\u2014but one that depletes cash cushions and commits the council to heavy future borrowing to meet its underlying need to borrow, or capital financing requirement, of \u00a3202.27m. The council also carries an accumulated schools funding deficit of \u00a317.1m, the costs of servicing which\u2014up to \u00a3500k annually\u2014fall on the general fund rather than schools budgets. Children in care placement costs have escalated the risk to Red, requiring immediate change, while commercial property investments of \u00a314.89m face mandatory review under new government borrowing rules.","url":"https://moderngov.stockton.gov.uk/documents/s23952/23952.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000004","council":"Stockton-on-Tees UA","tag":"LOBO","figures":"\u00a316.0m LOBO loans; average rate 4.87%; weighted average maturity 11.4 years","quote":"On 1st April 2025 the Authority held \u00a316m of LOBO (Lender's Option Borrower's Option) loans... As market interest rates have risen, there is an increased probability of call options on the LOBOs being exercised by lenders.","paper":"Sept 2026 - Risk Management Update - Report","committee":"Audit and Governance Committee"},{"lane":"councils","source":"Distress watch","title":"Bombay High Court Dismisses Revision Against Conviction for Theft and House-Trespass \u2014 Presumption Under Section 114 Evidence Act Upheld Based on Recent Possession of Stolen Articles. The accused was convicted under Sections 380 and 457 IPC f - lawtext.in","url":"https://news.google.com/rss/articles/CBMiaEFVX3lxTE83blpsWm9tOUw0bGJNQTRWTkc3X2RnbmEzcnJKSW1qYlBlV1hDTDZSazBuUldNOEU2cTNuelJEem55bmJQMkRoVVBpTFdLOThwTzZWemJCNkFJV3Mxa3BoZVNKTk5pdWJ0?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiaEFVX3lxTE83blpsWm9tOUw0bGJNQTRWTkc3X2RnbmEzcnJKSW1qYlBlV1hDTDZSazBuUldNOEU2cTNuelJEem55bmJQMkRoVVBpTFdLOThwTzZWemJCNkFJV3Mxa3BoZVNKTk5pdWJ0?oc=5\" target=\"_blank\">Bombay High Court Dismisses Revision Against Conviction for Theft and House-Trespass \u2014 Presumption Under Section 114 Evidence Act Upheld Based on Recent Possession of Stolen Articles. The","iso":"2026-09-28T01:15:31+00:00"},{"lane":"policy","source":"HM Treasury","title":"Healey pledges \u201cnew age of industrialisation\u201d as Government backs British shipbuilding","url":"https://www.gov.uk/government/news/healey-pledges-new-age-of-industrialisation-as-government-backs-british-shipbuilding","summary":"Two major maritime projects to be part of \u201cnew age of industrialisation\u201d for Britain.","iso":"2026-09-27T23:01:00+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Shropshire payroll control failures persist after four years of audit interventions","summary":"Shropshire Council's payroll systems continue to show control weaknesses after four years of remedial action. The latest audit identified 12 fundamental and 15 significant recommendations for addressing systemic governance failures across payroll, human resources and finance, including management non-compliance, weak oversight and unclear responsibilities. The problems emerge as the council operates under a declared financial emergency with an interim chief financial officer in place. Other audit findings highlighted school deficit governance failures, with Bishops Castle Community College forecast to reach approximately \u00a31m deficit by 2027/28 despite a recovery plan, and purchase order control breaches in 386 of 2,068 same-day orders totalling \u00a3125.1m. The pension fund audit, completed following its three-yearly revaluation, found no material issues and is expected to be fully signed off.","url":"https://shropshire.gov.uk/committee-services/documents/s46580/46580.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Progress update deadline: end September 2026; subsequent quarterly meetings","quote":"Responding to the CIPFA Review recommendations is a requirement of the EFS arrangements and will be monitored by MHCLG as part of the Best Value Notice process.","paper":"SPF Draft 9-107 LGPS Audit Findings Report 2025-26 v2","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Cardiff","title":"Cardiff Council faces \u00a3167m budget gap over four years as savings plans fall short","summary":"Cardiff Council is facing a projected budget shortfall of \u00a3167.1 million between 2027/28 and 2030/31, the Governance and Audit Committee heard on 24 September. The council balanced its 2025/26 budget but acknowledged that delivery of its savings programme is proving uneven: efficiency savings hit 88 per cent of target at \u00a310.9 million, while service change proposals achieved only 76 per cent at \u00a32.3 million. The Audit Committee noted that while the overall position was balanced, some directorates recorded significant overspends requiring control improvements. The council is also facing sustained demand pressures in social care, schools and education, particularly in support for additional learning needs. In a separate governance change, the former Section 151 Officer (chief finance officer) was promoted to Chief Executive in August, with the Deputy Section 151 Officer holding the role on an interim basis for up to 12 months while the senior management structure is reviewed. The council has been explicit about the risk that a Chief Executive permanently holding both roles would compromise independent financial challenge \u2014 guidance from the profession's standards body requires the Section 151 Officer to operate independently from the Chief Executive.","url":"https://cardiff.moderngov.co.uk/documents/s97282/97282.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"s114","figures":"None","quote":"On this basis, as the Section 151 Officer I have concluded that those conditions did not arise during the year and no Section 114 notice was issued in 2025/26.","paper":"Appointment of Section 151 Officer","committee":"Council"},{"lane":"ours","source":"Bradford","title":"Bradford Council's \u00a3113m revenue overspend funded by government as reserves rise \u00a355m","summary":"Bradford Council's accounts for 2025-26 show a revenue overspend of \u00a3113 million, which was funded through a Capitalisation Direction \u2014 government permission to treat day-to-day spending as capital spending and pay for it by borrowing. The overspend was \u00a314 million better than initially forecast. Despite the operating deficit, the council's usable reserves (money set aside for unexpected costs or named purposes) increased by \u00a355 million to \u00a3229.2 million, with a General Fund balance of \u00a353.1 million representing 3.5 per cent of gross expenditure. The external auditors anticipate issuing an unqualified audit opinion on the financial statements. A post-balance-sheet decision to cancel the Square Lane capital project will reduce usable reserves by \u00a34.9 million once abortive costs are formally charged to revenue.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Runnymede","title":"Runnymede Council's General Fund reserves forecast to fall from \u00a321.6m to \u00a32m by 2032","summary":"The General Fund working balance, money set aside as a cushion against unexpected costs, is forecast to fall from \u00a321.6m to \u00a32.0m by 2032. Between 2029 and 2031 alone, reserves are forecast to fall by \u00a311.7m. The Housing Revenue Account (HRA), the council's separate account for its housing stock, faces a \u00a39.1m deficit forecast for 2026/27, reducing reserves from \u00a325.3m to \u00a315.0m, with ongoing annual deficits expected. The Pay and Grading review is the principal driver of General Fund deterioration, creating a \u00a31.241m structural cost pressure. The council is exploring early repayment of one loan using maturing investments and has approved property disposals to reduce borrowing and interest payments. Accounts for 2025/26 remain unfinalized due to resourcing and introduction of a new Financial Management System, meaning opening reserve figures are indicative only.","url":"https://runnymede.moderngov.co.uk/documents/s18927/18927.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"intervention","figures":"Notice issued December 2023; now withdrawn as of September 2026 meeting date","quote":"Following the non-statutory best value notice, which has now been withdrawn","paper":"Q1 - Budget Monitoring report - Appenxix 6 v3 - final","committee":"Corporate Management Committee"},{"lane":"ours","source":"West Suffolk","title":"West Suffolk's audit qualification will persist until \u00a37.8m property revaluation completes","summary":"West Suffolk moved out of audit limbo this year when its external auditor, Ernst & Young, issued a qualified opinion on the 2024-25 accounts\u2014the first audit assurance in three years following the national local audit backlog. The auditor reports no concerns with the council's value-for-money arrangements. However, the qualification cannot be lifted until the council completes revaluation of \u00a37.8 million in property assets last valued in 2022-23. Once revalued, a further two-year lag in the accounts will follow before an unqualified opinion can be issued, putting full clearance at 2027-28 at the earliest. The council signed its 2025-26 draft accounts a month ahead of the extended statutory deadline, and the auditor expects to issue an opinion well in advance of the January 2027 backstop date.","url":"https://democracy.westsuffolk.gov.uk/documents/s59460/59460.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000245","council":"West Suffolk","tag":"audit opinion","figures":"\u00a329.5m cash and investments at 31 March 2026; \u00a310m forecast cash at March 2027; \u00a36.13m General Fund; \u00a352.01m earmarked reserves","quote":"Overall, based on its cash flow forecast, borrowing potential and access to investment funds, as well as the level of general fund and reserve balances it holds, the council determines that it has sufficient liquidity to continue to deliver services for the foreseeable future.","paper":"6-PAS-WS-26-015-EY-Risk-Assessment-Update","committee":"Performance and Audit Scrutiny Committee"},{"lane":"ours","source":"Hammersmith & Fulham","title":"Hammersmith and Fulham cleared audit despite cyber incident and unadjusted investment errors","summary":"Hammersmith and Fulham's accounts for 2025/26 received an unmodified audit opinion, with no going-concern doubts identified, though auditors have yet to complete their assessment of wider legal and fraud impacts from a cyber incident that took the council's pension fund systems offline during the year. The Pension Fund itself also received a clean audit opinion with net assets of \u00a31,462m. However, auditors identified but did not correct a \u00a31.4m overstatement of pension fund Level 3 investments \u2014 valuations used December 2025 figures instead of March 2026 year-end valuations \u2014 and a \u00a31.22m understatement of council property valuations, both exceeding reporting thresholds. Management agreed to reclassify \u00a310m of a \u00a325m joint venture investment from short-term to long-term after auditor challenge. Looking ahead, the council faces medium-term budget gaps of \u00a331.4m in 2027/28 and \u00a357.3m in 2028/29 as government funding reductions take effect, though it holds \u00a3122.1m in reserves.","url":"https://lbhf.moderngov.co.uk/documents/s136009/136009.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000013","council":"Hammersmith & Fulham","tag":"audit opinion","figures":"Total net assets: \u00a31,462.070 million; materiality: \u00a323 million","quote":"Our anticipated financial statements audit report opinion will be unmodified.","paper":"Appendix 4 - LBHF Pension Fund Audit Findings Report 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"North East Lincolnshire UA","title":"\u00a310m LOBO loan called and repaid without penalty; \u00a31m LOBO remaining outstanding to 2035","summary":"LOBO repayments eliminate future rate-reset risk on that tranche but represent cash refinancing need; lenders and peer councils track LOBO market activity as indicator of rate environment and council refinancing exposure.","url":"https://www.nelincs.gov.uk/assets/uploads/2026/05/013.-Treasury-Outturn-2025-26-Cabinet-Report.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000012","council":"North East Lincolnshire UA","tag":"LOBO","figures":"\u00a310m repaid, \u00a31m remaining to 2035","quote":"A further Lender Option, Borrower Option (LOBO) loan (\u00a310m) was called and duly repaid without penalty during the period. This leaves one smaller (\u00a31m) LOBO remaining outstanding with an ultimate maturity date of 2035.","paper":"013. Treasury Outturn 2025-26 Cabinet Report","committee":"Council"},{"lane":"ours","source":"Babergh","title":"Mid Suffolk cuts borrowing by \u00a314m as Babergh housing scheme loss grows to \u00a34.9m","summary":"Mid Suffolk reduced total borrowing by \u00a314.2m in 2025-26, cutting short-term debt from \u00a318m to \u00a35m and avoiding exposure to rates that had risen to 7 per cent by year-end. Babergh held borrowing steady at \u00a3123.6m. However, Babergh Growth's Hadleigh housing scheme, financed through \u00a313.7m in loans, saw its expected credit loss rise from \u00a33.1m to \u00a34.889m as completed units remained unsold; the final loss will not be known until 2026-27. Both councils' commercial housing ventures underperformed: Mid Suffolk cancelled phase two of its Needham Market scheme, writing off \u00a3877k in costs before selling the land for \u00a32.7m. The councils' main investment subsidiary, CIFCO Ltd, held \u00a343.3m in loans from each council with \u00a3434k in expected credit losses and \u00a31.3m in cumulative deferred interest payments as it defers roughly 13 per cent of annual interest due through 2028.","url":"https://baberghmidsuffolk.moderngov.co.uk/documents/s43661/43661.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000200","council":"Babergh","tag":"LOBO","figures":"\u00a34m LOBO loans outstanding; average rate 4.21%; call dates February and August each year","quote":"The lender has not exercised its option during 2025/26.","paper":"MC/26/15 Annual Treasury Management Report 2025-26","committee":"Mid Suffolk Council"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"ours","source":"Slough UA","title":"Slough forecasts \u00a319.9m overspend in 2026-27, with \u00a315.955m driven by children's social care placements","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"CIPFA and the codes","title":"CIPFA prudential code changes aim for greater council transparency - localgov.co.uk","url":"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2VjdzZMYVRKY2FPV3FhS0dTU01pS2ZMUWlwbWtOVU1RSzdTV2l3SXZudjlCVHlmZUFnajB function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
