<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>
</head><body>

","title":"Childminder facing 'severe financial burden' as heating oil costs rise","url":"https://www.bbc.co.uk/news/articles/cq07ly2232pzo?at_medium=RSS&at_campaign=rss","summary":"The war in Iran is having a practical impact on people across the island as energy prices continue to climb.","iso":"2026-09-28T09:01:12+00:00"},{"lane":"ours","source":"Isle of Wight UA","title":"Isle of Wight Council's treasury strategy delivers \u00a31.58m in savings amid budget pressures","summary":"The Isle of Wight Council's treasury management function has generated combined savings of \u00a3925,000 in the year to March and a further \u00a3655,000 forecast for the current year, contributing to wider council budget pressures. A combination of reduced borrowing costs and increased investment income produced the savings, though investment returns have declined as interest rates have fallen from 4.58 per cent to 3.80 per cent. The council holds \u00a338.2 million in commercial property investments purchased before new prudential borrowing rules took effect in 2021, and has committed to reviewing options for exiting these assets before undertaking further borrowing. The liability benchmark\u2014a measure of sustainable debt levels\u2014shows forecast borrowing of \u00a3173.4 million tracking substantially below long-term capital financing requirements through 2054, indicating manageable debt levels. Internal audit gave the highest level of assurance on treasury controls, though the governance statement identifies pension arrangements and consistency of governance arrangements as key risks requiring ongoing monitoring.","url":"https://iow.moderngov.co.uk/documents/s24049/24049.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000046","council":"Isle of Wight UA","tag":"s114","figures":"One loan outstanding; zero loans to S114 authorities","quote":"Close attention is taken to the financial situation of other local authorities, and no loans have been made to any authority that has issued a S114 notice.","paper":"7e. Treasury Management Report Quarter 4 2025-26","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Worcestershire CC","title":"Worcestershire council faces financial sustainability warning as auditors highlight control weaknesses","summary":"Worcestershire's auditors have identified financial sustainability as the council's most pressing concern, according to Grant Thornton's interim report to the Audit and Governance Committee. The council is operating under Exceptional Financial Support of \u00a333.6m from central government, treated as a capitalisation direction \u2014 meaning it increases the authority's borrowing requirement rather than providing a one-off adjustment. This will increase the minimum revenue provision, the sum set aside annually to repay past borrowing, by \u00a31.2m to \u00a318.4m in 2025/26, with charges continuing for up to 20 years. The auditors have also identified control weaknesses, including a segregation of duties issue where journal entries can be authorised by the same person who prepares them, and four IT control recommendations from 2020/21 that remain outstanding. A statutory recommendation on the dedicated schools grant deficit, the highest category of audit finding, has not been resolved and carries forward into 2025/26. The auditors noted significant weaknesses in the council's arrangements for financial sustainability and value for money, though the council has made progress on some prior findings.","url":"https://worcestershire.moderngov.co.uk/documents/s61974/61974.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"EFS","figures":"60% of councils, median EFS request \u00a348.5m for social care-driven councils","quote":"Councils citing social care demand as their main driver typically requested higher levels of support, with a median EFS request of \u00a348.5m.","paper":"au 2026 09 28 2025-26 Interim External Auditors Annual Report","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Stockton-on-Tees UA","title":"Stockton-on-Tees increased borrowing by \u00a326.89m in 2025-26 despite capital spending 46% below budget","summary":"Stockton-on-Tees raised net borrowing from \u00a3111.43m to \u00a3138.32m during 2025-26, taking on \u00a340m of new government loans at rates between 4.31% and 4.57%, even as capital spending fell substantially short of plan. The council spent \u00a351.2m of a \u00a394.53m capital budget, leaving \u00a343.35m unspent. The mismatch reflects a deliberate strategy of internal borrowing\u2014using reserves instead of external loans to minimize interest costs\u2014but one that depletes cash cushions and commits the council to heavy future borrowing to meet its underlying need to borrow, or capital financing requirement, of \u00a3202.27m. The council also carries an accumulated schools funding deficit of \u00a317.1m, the costs of servicing which\u2014up to \u00a3500k annually\u2014fall on the general fund rather than schools budgets. Children in care placement costs have escalated the risk to Red, requiring immediate change, while commercial property investments of \u00a314.89m face mandatory review under new government borrowing rules.","url":"https://moderngov.stockton.gov.uk/documents/s23952/23952.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000004","council":"Stockton-on-Tees UA","tag":"DSG / SEND","figures":"Accumulated DSG deficit \u00a317.1m; borrowing costs up to \u00a3500k in 2025-26","quote":"At the end of the 2025/26 financial year the Council had an overall accumulative deficit of \u00a317.1m on its DSG... The cost of this borrowing in year was up to \u00a3500k.","paper":"Sept 2026 - Risk Management Update - Report","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Tonbridge & Malling","title":"Tonbridge and Malling eliminates \u00a32.8m funding gap and approves balanced 2026-27 budget ahead of merger.","summary":"Tonbridge and Malling Borough Council has closed a previously forecast funding shortfall of \u00a32.8m and approved a balanced budget for 2026-27, moving from planned reserve depletion to planned reserve contributions. The improvement follows a more favourable government funding settlement and updated financial assumptions, according to the council's external auditors Grant Thornton. Auditors intend to issue an unqualified opinion on the council's 2025-26 financial statements, finding no significant weaknesses in value for money arrangements. The council faces transition uncertainty: government announced on 16 July 2026 that Tonbridge and Malling will form a West Kent unitary authority with Maidstone, Sevenoaks and Tonbridge Wells, but paused the decision on 7 September 2026 pending review. Auditors identified no evidence that the council had depleted reserves ahead of merger, a known risk in local government reorganisation. Three improvement recommendations were raised, including stronger Member reporting on the council's largest planned capital project, the \u00a319.4m Angel Centre development, which may require borrowing.","url":"https://democracy.tmbc.gov.uk/documents/s100302/100302.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E07000115","council":"Tonbridge & Malling","tag":"audit opinion","figures":"Zero significant weaknesses identified; three improvement recommendations; zero statutory recommendations; zero Public Interest Reports","quote":"We intend to issued an unqualified opinion on the Council's financial statements following the Audit Committee meeting on 28 September 2026.","paper":"Annex 2 - Audit Findings Report","committee":"Audit Committee"},{"lane":"markets","source":"BBC business","title":"You need \u00a317,000 for a first home - here's how to save it","url":"https://www.bbc.co.uk/news/articles/cqvgy09kep21o?at_medium=RSS&at_campaign=rss","summary":"Here are four ways you can put money aside to save enough for a deposit on your first home.","iso":"2026-09-2 he first professional fellow at the new Institute of Devolution at Newcastle University. Mr Haldane was previously the chief economist at the Bank of England and also served as the chief executive of the Royal Society of Arts. He is\u2026\nThe post Andy Haldane joins new university devolution institute appeared first on Local Government Chronicle (LGC).","iso":"2026-09-25T15:04:11+00:00"},{"lane":"policy","source":"MHCLG","title":"Correspondence: North East Lincolnshire Council: Local Plan intervention letter","url":"https://www.gov.uk/government/publications/north-east-lincolnshire-council-local-plan-intervention-letter","summary":"The Minister of State for Housing and Planning, the Right Honourable Matthew Pennycook MP, has written to North East Lincolnshire Council about their Local Plan.","iso":"2026-09-25T14:44:44+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Transition of Development Consent Orders and Transport and Work Act Orders to Lawmaker","url":"https://www.gov.uk/government/publications/transition-of-development-consent-orders-and-transport-and-work-act-orders-to-lawmaker","summary":"Guidance about the transition of Development Consent Orders and Transport and Work Act Orders from the SI template to Lawmaker.","iso":"2026-09-25T13:10:23+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Social housing lettings in England, April 2025 to March 2026","url":"https://www.gov.uk/government/statistics/announcements/social-housing-lettings-in-england-april-2025-to-march-2026","summary":"Statistics on new social housing lettings in England in 2025/26 by local authorities and private registered providers, covering tenancies and tenants.","iso":"2026-09-25T13:01:03+00:00"},{"lane":"councils","source":"LGC","title":"Shadow unitary accuses county of withholding Send plan","url":"https://www.lgcplus.com/services/children/shadow-unitary-accuses-county-of-withholding-send-plan-25-09-2026/","summary":"East Surrey shadow unitary authority has accused Surrey CC of withholding the plans to reform the services for children with special needs and disabilities. The Department for Education required every upper tier authority submits a Send reform plan by June as a condition for writing\u2026\nThe post Shadow unitary accuses county of withholding Send plan appeared first on Local Government Chronicle (LGC).","iso":"2026-09-25T10:39:16+00:00"},{"lane":"councils","source":"LGC","title":"Steve Kay: Building a civic alliance for every child","url":"https://www.lgcplus.com/services/children/steve-kay-building-a-civic-alliance-for-every-child-25-09-2026/","summary":"The local outcomes framework offer a chance to organise around the outcomes children experience rather than the institutions that deliver individual services, writes the director of belonging at Sheffield City Council. For more than two decades, education reform has rightly focused on making schools better.\u2026\nThe post Steve Kay: Building a civic alliance for every child appeared first on Local Gove","iso":"2026-09-25T10:31:48+00:00"},{"lane":"councils","source":"LGC","title":"Analysis: Possible fair funding legal challenge","url":"https://www.lgcplus.com/finance/analysis-possible-fair-funding-legal-challenge-25-09-2026/","summary":"London boroughs have been exploring legal routes to challenge fair funding, Jonathan Knott reports. The government\u2019s fair funding settlement is \u201cprobably immune\u201d from legal challenge due to the time passed since it was announced, a lawyer who works with councils has told LGC. However, Victoria\u2026\nThe post Analysis: Possible fair funding legal challenge appeared first on Local Government Chronicle (L","iso":"2026-09-25T09:49:58+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Shropshire Council in declared financial emergency; audit finds persistent control gaps","summary":"Shropshire Council is operating under a declared financial emergency with an Improvement Plan established in December 2025, the Audit & Governance Committee heard. The council's chief financial officer is serving in an interim capacity. Audit findings identified persistent control weaknesses. Payroll controls received limited assurance for the fourth consecutive year, with 12 fundamental recommendations outstanding. Six schools were forecast to run deficits with five missing notification deadlines; Bishops Castle Community College's deficit was projected to reach \u00a31 million by 2027/28. Procurement controls showed 386 purchase orders exceeding authorization limits within a \u00a3125.1 million sample. The council has committed to escalating audit committee oversight of issues where audit recommendations have not been implemented.","url":"https://shropshire.gov.uk/committee-services/documents/s46580/46580.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Progress update deadline: end September 2026; subsequent quarterly meetings","quote":"Responding to the CIPFA Review recommendations is a requirement of the EFS arrangements and will be monitored by MHCLG as part of the Best Value Notice process.","paper":"SPF Draft 9-107 LGPS Audit Findings Report 2025-26 v2","committee":"Audit & Governance Committee"},{"lane":"policy","source":"MHCLG","title":"Form: Council Tax base calculation","url":"https://www.gov.uk/government/publications/council-tax-base-calculation","summary":"Forms and guidance notes for the calculation of Council Tax base (CTB).","iso":"2026-09-25T07:30:03+00:00"},{"lane":"markets","source":"Bank of England","title":"Minutes of the Market Participants Group meeting \u2013 24 September 2026","url":"https://www.bankofengland.co.uk/minutes/2026/september/market-participants-group-meeting-25-september-2026","summary":"The Market Participants Group (MPG) is a senior-level forum for financial market participants to share their views on relevant themes and narratives in financial markets with members of the Bank of England\u2019s Monetary Policy Committee.","iso":"2026-09-25T06:30:00+00:00"},{"lane":"councils","source":"LGC","title":"Boosting care reform from intent to action","url":"https://www.lgcplus.com/politics/lgc-briefing/boosting-care-reform-from-intent-to-action-24-09-2026/","summary":"The public needs to see adult social care reform as essential, achievable and worthwhile, writes Andrew Cozens, an independent social care and health specialist. Today\u2019s top news and views: LGA calls for \u2018alternative\u2019 to EFS Shadow unitaries seek devolution update Mayoral candidate calls for election\u2026\nThe post Boosting care reform from intent to action appeared first on Local Government Chronicle ","iso":"2026-09-24T16:07:05+00:00"},{"lane":"councils","source":"LG finance press","title":"\u2018The cautious route is ambitious\u2019: call for tiered approach to fiscal devolution - Room151","url":"https://news.google.com/rss/articles/CBMisgFBVV95cUxPaDEwZWtsM0xhalVheTJqZ1B2cjNfZDY2WVN0S19KSkw3dHZVM19mb1pzcGFzMkpoYURwVjFiVVhaMU9EQ0hBejlqMnhheDJLTTI2Q3h2UmhHYjg2Uzk3LUxXU1EybnphbHJyMjdENDRHM0NDcWRiM1FoRzA4MFBudk5rRDhwOHdMU09zUlAzMGxPbHFYSFVZa0dXUFl0NmM1Zk9fM2w1Y095NnVEcHljU0FR?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMisgFBVV95cUxPaDEwZWtsM0xhalVheTJqZ1B2cjNfZDY2WVN0S19KSkw3dHZVM19mb1pzcGFzMkpoYURwVjFiVVhaMU9EQ0hBejlqMnhheDJLTTI2Q3h2UmhHYjg2Uzk3LUxXU1EybnphbHJyMjdENDRHM0NDcWRiM1FoRzA4MFBudk5rRDhwOHdMU09zUlAzMGxPbHFYSFVZa0dXUFl0NmM1Zk9fM2w1Y095NnVEcHljU0FR?oc=5\" target=\"_blank\">\u2018The cautious route is ambitious\u2019: call for tiered approach to fiscal devolution</a>&nb","iso":"2026-09-24T15:33:28+00:00"},{"lane":"policy","source":"MHCLG","title":"Plan-making and local government reorganisation","url":"https://www.gov.uk/guidance/plan-making-and-local-government-reorganisation","summary":"Information for two-tier authorities about transitioning their plan-making to single tier unitary authorities.","iso":"2026-09-24T15:04:41+00:00"},{"lane":"policy","source":"MHCLG","title":"Transparency data: MHCLG: senior officials\u2019 business expenses, hospitality and meetings, April to June 2026","url":"https://www.gov.uk/government/publications/mhclg-senior-officials-business-expenses-hospitality-and-meetings-april-to-june-2026","summary":"Data on senior officials\u2019 business expenses, hospitality and meetings with external organisations.","iso":"2026-09-24T15:00:19+00:00"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: HM Treasury business appointment rules advice, April to June 2026","url":"https://www.gov.uk/government/publications/hm-treasury-business-appointment-rules-advice-april-to-june-2026","summary":"Summaries of advice given under the business appointment rules to applicants at SCS2 and SCS1 level and equivalents.","iso":"2026-09-24T15:00:07+00:00"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: HM Treasury: special advisers\u2019 gifts, hospitality and meetings, April to June 2026","url":"https://www.gov.uk/government/publications/hm-treasury-special-advisers-gifts-hospitality-and-meetings-april-to-june-2026","summary":"Data on gifts and hospitality received by special advisers, and meetings they attended with senior media figures.","iso":"2026-09-24T15:00:06+00:00"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: HM Treasury: ministerial overseas travel and meetings, April to June 2026","url":"https://www.gov.uk/government/publications/hm-treasury-ministerial-overseas-travel-and-meetings-april-to-june-2026","summary":"Data on ministers\u2019 overseas travel and meetings with external individuals and organisations.","iso":"2026-09-24T15:00:06+00:00"},{"lane":"policy","source":"MHCLG","title":"Transparency data: MHCLG: ministerial travel and meetings, April to June 2026","url":"https://www.gov.uk/government/publications/mhclg-ministerial-travel-and-meetings-april-to-june-2026","summary":"Details of ministers' overseas travel and external meetings.","iso":"2026-09-24T15:00:05+00:00"},{"lane":"policy","source":"MHCLG","title":"Transparency data: MHCLG: special advisers\u2019 gifts, hospitality and meetings, April to June 2026","url":"https://www.gov.uk/government/publications/mhclg-special-advisers-gifts-hospitality-and-meetings-april-to-june-2026","summary":"Data on gifts and hospitality received by special advisers, and meetings they attended with senior media figures.","iso":"2026-09-24T15:00:05+00:00"},{"lane":"policy","source":"MHCLG","title":"Research: Votes at 16 research","url":"https://www.gov.uk/government/publications/votes-at-16-research","summary":"\u200b\u200bThis report outlines the findings of a major research study with young people aged 14 to 17 to inform the government\u2019s work to extend the right to vote to 16- and 17-year-olds.","iso":"2026-09-24T15:00:02+00:00"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: HM Treasury: Senior officials\u2019 business expenses, hospitality, and meetings January to March 2026","url":"https://www.gov.uk/government/publications/hm-treasury-senior-officials-business-expenses-hospitality-and-meetings-january-to-march-2026","summary":"Data on senior officials\u2019 (SCS2+) business expenses, hospitality, and meetings with external individuals and organisations.","iso":"2026-09-24T15:00:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Detailed analysis of non-fire incidents, year ending March 2026","url":"https://www.gov.uk/government/statistics/announcements/detailed-analysis-of-non-fire-incidents-year-ending-march-2026","summary":"Detailed analysis of non-fire incidents attended by fire and rescue services, England, April 2025 to March 2026.","iso":"2026-09-24T14:17:01+00:00"},{"lane":"policy","source":"HM Treasury","title":"Corporate report: National Lottery Distribution Fund Investment Account Report & Accounts 2025 to 2026","url":"https://www.gov.uk/government/publications/national-lottery-distribution-fund-investment-account-report-accounts-2025-to-2026","summary":"Annual report and accounts of the National Lottery Distribution Fund Investment Account.","iso":"2026-09-24T14:06:47+00:00"},{"lane":"ours","source":"Cardiff","title":"Cardiff Council faces \u00a3167m budget gap over four years as service change savings fall short","summary":"Cardiff Council has identified a projected budget deficit of \u00a3167.1 million between 2027/28 and 2030/31, with the Governance and Audit Committee noting sustained financial pressure across the authority. The council delivered only 76 per cent of planned service change savings in 2025/26, achieving \u00a32.276 million against target, while efficiency savings reached 88 per cent of their goal. The shortfall comes as the council faces significant spikes in demand for high-cost services, particularly in social care, schools and education, including additional learning needs and specialist placements. While the council's overall 2025/26 position was balanced, some directorates recorded significant overspends requiring control improvements. The Committee identified sustained demand as a key driver of the medium-term challenge facing the authority.","url":"https://cardiff.moderngov.co.uk/documents/s97282/97282.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"s114","figures":"None","quote":"On this basis, as the Section 151 Officer I have concluded that those conditions did not arise during the year and no Section 114 notice was issued in 2025/26.","paper":"Appointment of Section 151 Officer","committee":"Council"},{"lane":"ours","source":"Worcestershire CC","title":"Worcestershire granted \u00a359.9m emergency borrowing permission to balance budget","summary":"Worcestershire County Council required emergency government permission to borrow \u00a359.9m for day-to-day spending in order to set a balanced budget for 2026/27. The council could not close the gap between spending and income without this exceptional financial support, which it will repay over 20 years at an estimated cost of \u00a35.4m in additional borrowing charges this year alone. The decision reflects acute pressure from demand-driven overspends in adult and children's social care and a dedicated schools grant deficit forecast at \u00a3122.2m after expected government grant. Against this, the council's savings programme is on track to deliver 98% of its \u00a39m target, with home to school transport saving \u00a34.56m through contract reviews. General Fund reserves have fallen to \u00a322.8m, \u00a38.2m short of the minimum prudent level, and the council faces an estimated \u00a385m budget gap in 2027/28, creating significant risk if exceptional support is not continued.","url":"https://worcestershire.moderngov.co.uk/documents/s61939/61939.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"EFS","figures":"\u00a359,933k total; \u00a349,933k borrowing, \u00a310,000k capital receipts","quote":"Exceptional Financial Support 0 59,933 59,933 0 0 0 0 0 0 59,933 59,933","paper":"7 Budget Monitoring P3 Final","committee":"Cabinet"},{"lane":"ours","source":"North Somerset UA","title":"North Somerset receives clean audit but faces financial sustainability risks","summary":"North Somerset's auditors anticipate giving the council a clean bill of health on its 2025\u201326 accounts, with no adjustments to the financial statements identified to date. However, the audit has identified significant weaknesses in two areas: the council's underlying financial sustainability, driven by continued pressure on the dedicated schools grant (DSG) \u2014 the government funding for schools \u2014 and its ability to manage demand and costs in social care. The council intends to apply for a DSG deficit support scheme under which up to 90 per cent of the deficit can be written off if the council funds the remaining 10 per cent, though the auditor has flagged that the council's initial calculation will need amending. The auditors also identified control weaknesses in how the council authorises financial transactions during year-end closedown, recommending that the Section 151 Officer (chief finance officer) no longer post journal entries directly to the ledger.","url":"https://n-somerset.moderngov.co.uk/documents/s9091/9091.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000024","council":"North Somerset UA","tag":"EFS","figures":"\u00a36m additional recurring income from EFS; 8.99% total council tax rise","quote":"Due to the structural deficit between increasing costs and the Council's capacity to increase income, the Council had to request EFS from the government to balance the 2026/27 budget.","paper":"11. Audit Findings Report 2025-26","committee":"Audit Committee"},{"lane":"ours","source":"Bradford","title":"Bradford funded \u00a3113m revenue overspend through government emergency financing","summary":"Bradford Council ended 2025-26 with a revenue spending overspend of \u00a3113 million, which the council funded through a Capitalisation Direction (a form of exceptional financial support, or EFS, allowing day-to-day spending to be treated as capital and financed through borrowing or asset sales). The overspend was \u00a314 million better than initially forecast. External auditors have issued an unqualified opinion on the council's financial statements, subject to completion of outstanding audit work. Despite the overspend, usable reserves (money set aside as a buffer) increased by \u00a355 million year-on-year to \u00a3229.2 million, with the General Fund balance standing at \u00a353.1 million. The council's Local Government Pension Scheme shows a \u00a3871 million surplus but accounting restrictions prevent this from being recognised on the balance sheet.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Runnymede","title":"Runnymede Council's General Fund reserves forecast to fall from \u00a321.6m to \u00a32m by 2032","summary":"The General Fund working balance, money set aside as a cushion against unexpected costs, is forecast to fall from \u00a321.6m to \u00a32.0m by 2032. Between 2029 and 2031 alone, reserves are forecast to fall by \u00a311.7m. The Housing Revenue Account (HRA), the council's separate account for its housing stock, faces a \u00a39.1m deficit forecast for 2026/27, reducing reserves from \u00a325.3m to \u00a315.0m, with ongoing annual deficits expected. The Pay and Grading review is the principal driver of General Fund deterioration, creating a \u00a31.241m structural cost pressure. The council is exploring early repayment of one loan using maturing investments and has approved property disposals to reduce borrowing and interest payments. Accounts for 2025/26 remain unfinalized due to resourcing and introduction of a new Financial Management System, meaning opening reserve figures are indicative only.","url":"https://runnymede.moderngov.co.uk/documents/s18927/18927.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"intervention","figures":"Notice issued December 2023; now withdrawn as of September 2026 meeting date","quote":"Following the non-statutory best value notice, which has now been withdrawn","paper":"Q1 - Budget Monitoring report - Appenxix 6 v3 - final","committee":"Corporate Management Committee"},{"lane":"ours","source":"West Suffolk","title":"West Suffolk's audit qualification will persist until \u00a37.8m property revaluation completes","summary":"West Suffolk moved out of audit limbo this year when its external auditor, Ernst & Young, issued a qualified opinion on the 2024-25 accounts\u2014the first audit assurance in three years following the national local audit backlog. The auditor reports no concerns with the council's value-for-money arrangements. However, the qualification cannot be lifted until the council completes revaluation of \u00a37.8 million in property assets last valued in 2022-23. Once revalued, a further two-year lag in the accounts will follow before an unqualified opinion can be issued, putting full clearance at 2027-28 at the earliest. The council signed its 2025-26 draft accounts a month ahead of the extended statutory deadline, and the auditor expects to issue an opinion well in advance of the January 2027 backstop date.","url":"https://democracy.westsuffolk.gov.uk/documents/s59460/59460.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000245","council":"West Suffolk","tag":"audit opinion","figures":"\u00a329.5m cash and investments at 31 March 2026; \u00a310m forecast cash at March 2027; \u00a36.13m General Fund; \u00a352.01m earmarked reserves","quote":"Overall, based on its cash flow forecast, borrowing potential and access to investment funds, as well as the level of general fund and reserve balances it holds, the council determines that it has sufficient liquidity to continue to deliver services for the foreseeable future.","paper":"6-PAS-WS-26-015-EY-Risk-Assessment-Update","committee":"Performance and Audit Scrutiny Committee"},{"lane":"ours","source":"Hammersmith & Fulham","title":"Hammersmith and Fulham cleared audit despite cyber incident and unadjusted investment errors","summary":"Hammersmith and Fulham's accounts for 2025/26 received an unmodified audit opinion, with no going-concern doubts identified, though auditors have yet to complete their assessment of wider legal and fraud impacts from a cyber incident that took the council's pension fund systems offline during the year. The Pension Fund itself also received a clean audit opinion with net assets of \u00a31,462m. However, auditors identified but did not correct a \u00a31.4m overstatement of pension fund Level 3 investments \u2014 valuations used December 2025 figures instead of March 2026 year-end valuations \u2014 and a \u00a31.22m understatement of council property valuations, both exceeding reporting thresholds. Management agreed to reclassify \u00a310m of a \u00a325m joint venture investment from short-term to long-term after auditor challenge. Looking ahead, the council faces medium-term budget gaps of \u00a331.4m in 2027/28 and \u00a357.3m in 2028/29 as government funding reductions take effect, though it holds \u00a3122.1m in reserves.","url":"https://lbhf.moderngov.co.uk/documents/s136009/136009.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000013","council":"Hammersmith & Fulham","tag":"audit opinion","figures":"Total net assets: \u00a31,462.070 million; materiality: \u00a323 million","quote":"Our anticipated financial statements audit report opinion will be unmodified.","paper":"Appendix 4 - LBHF Pension Fund Audit Findings Report 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Sutton","title":"Sutton accumulated \u00a321.48m schools deficit for special needs with \u00a313.55m projected overspend next year","summary":"Sutton Council has accumulated a \u00a321.48m deficit in its schools budget for children with special educational needs, with spending projected to overspend by a further \u00a313.55m next year. The council's own papers show this threatens its financial stability. The government has offered to write off 90 per cent of the accumulated deficit\u2014worth \u00a319.35m\u2014but only if the council's special needs reform plan wins approval. The council is betting on that approval: it has set aside \u00a31.64m and budgets \u00a30.58m a year to cover the remaining 10 per cent liability it would owe even after a write-down. The deficit stems from a 43.7 per cent rise in children needing specialist support since December 2020, with Sutton receiving roughly 180 more assessment requests than other London boroughs of its size. The council is also facing a shortfall in capital funding: the \u00a32.83m allocated for 2026/27 is insufficient to deliver the reform plan's requirements, the council's papers state.","url":"https://sutton.moderngov.co.uk/documents/s96615/96615.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000029","council":"Sutton","tag":"DSG / SEND","figures":"\u00a32.15m residual 10% liability; \u00a31.64m High Needs Block Repayment Reserve established; \u00a30.58m annual contribution budgeted","quote":"The Council's residual 10% liability is estimated at \u00a32.15m. To fund this, the Council established a High Needs Block Repayment Reserve of \u00a31.64m and budgets an annual contribution of \u00a30.58m.","paper":"SEND Update Report","committee":"People Committee"},{"lane":"ours","source":"Harrow","title":"Temporary accommodation demand triples as Harrow faces \u00a315.7m annual subsidy loss","summary":"Harrow Council is facing a structural financial challenge as demand for temporary accommodation has tripled in three years, creating a \u00a315.7m annual subsidy loss. Household numbers have grown from 234 in April 2023 to 726 in June 2026, reflecting an unprecedented mismatch between government subsidy levels and market costs. The cabinet reported a net revenue overspend of \u00a33.039m for 2026/27, with temporary accommodation identified as the directorate's most significant financial risk for the remainder of the year. Other substantial pressures include dedicated schools grant deficits (government funding for school support for children with special needs) forecast at \u00a354.181m, as well as service overspends in Children's Services (\u00a37.249m) and Adult Services (\u00a31.462m). The council is pursuing a \u00a34.062m savings plan, though nearly half is contingent on capital project delivery which the capital programme, at 47% commitment by Q1, is struggling to achieve on schedule.","url":"https://harrow.moderngov.co.uk/documents/s201854/201854.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000015","council":"Harrow","tag":"DSG / SEND","figures":"Total variance \u00a335,859,859 (all slippage to 27/28); SEN Expansion \u00a310,448,369; Schools Capital Maintenance \u00a37,597,098; High Needs Provision \u00a34,200,000; Additional Basic Need Funding \u00a37,761,893","quote":"Total Children's Services Directorate 41,282,293 0 41,282,293 5,422,434 (35,859,859)","paper":"Appendix 2 - 2026-27 MTFS Tracker","committee":"Cabinet"},{"lane":"ours","source":"Babergh","title":"Mid Suffolk cuts \u00a314m borrowing as Babergh housing scheme faces \u00a34.9m loss","summary":"Mid Suffolk cut total borrowing by \u00a314.2m in 2025-26, largely by repaying \u00a313m in expensive short-term debt that had risen to between 5.0 and 7.0 per cent by year-end, according to the councils' annual treasury management report. The reduction improves financial flexibility as interest rates remain volatile. Babergh's position has tightened: the proportion of its general fund revenue consumed by financing costs rose from 28 per cent budgeted to 33 per cent actual, reducing money available for services. The Hadleigh housing scheme, part of the Babergh Growth joint venture, has completed but units remain unsold, with expected credit losses jumping from \u00a33.1m to \u00a34.889m. The final loss is not expected to be known until later in 2026-27. Mid Suffolk's commercial housing scheme at Needham Market took a different course, cancelling phase two entirely and writing off \u00a3877k in costs before selling the phase two land for \u00a32.7m.","url":"https://baberghmidsuffolk.moderngov.co.uk/documents/s43661/43661.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000200","council":"Babergh","tag":"LOBO","figures":"\u00a34m LOBO loans outstanding; average rate 4.21%; call dates February and August each year","quote":"The lender has not exercised its option during 2025/26.","paper":"MC/26/15 Annual Treasury Management Report 2025-26","committee":"Mid Suffolk Council"},{"lane":"ours","source":"City of Edinburgh","title":"Edinburgh Council's \u00a332.2m surplus relies on one-off gains as structural pressures mount","summary":"Edinburgh Council reported a \u00a332.2m underspend for 2025-26 with an unqualified audit opinion. However, the surplus rests on a \u00a324.9m one-off legal settlement and \"one-off mitigations\", according to the council's own report. Approved savings targets were only 70% delivered, with delays in demand-led services such as Home to School Transport and property maintenance. Council Tax revenue fell \u00a31.7m owing to reduced growth in the number of properties subject to tax, a structural loss. The council projects an overspend for 2026-27. Audit Scotland flagged that planned increases in borrowing and debt over the next five years \"presents a significant risk to its longer-term financial sustainability\".","url":"https://edinburgh.moderngov.co.uk/documents/s103738/103738.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"S12000036","council":"City of Edinburgh","tag":"LOBO","figures":"\u00a332m market debt repaid (including two LOBOs); outstanding LOBO debt \u00a3122.4m","quote":"The lenders exercised their option to request an increase in the interest rate paid on the loans and the Council exercised its option to repay the loans at par with no penalty.","paper":"8.3 Revenue monitoring outturn 25-26","committee":"Finance and Resources Committee"},{"lane":"ours","source":"Thanet","title":"Thanet's reserves fall below safety floor as two years of service overspends erode financial cushion","summary":"Thanet has drawn reserves down to \u00a34.1m of unrestricted funds, falling below the \u00a36m floor its chief finance officer has advised the authority maintain as it heads toward Local Government Reorganisation. The decline reflects two consecutive years of overspend: \u00a34.7m in 2024-25 and \u00a33.5m in 2025-26, driven by structural deficits in three major service areas totalling \u00a32.26m. Temporary Accommodation overspent by \u00a3597k on nightly-paid costs, Housing Benefit incurred a \u00a3662k shortfall because central government froze subsidy rates at January 2011 levels, and Domestic Waste and Street Cleansing overspent \u00a31.001m on agency cover and emergency vehicle hire. The council's capital programme delivered only \u00a328.6m of its \u00a380.6m budget; the shortfall reflects a \u00a321.9m miss on external funding expected from grants. The 2026-27 forecast indicates service pressures are highly likely to exceed \u00a31m further, and the council faces unfunded transition costs of \u00a3700k to \u00a31.2m as it prepares for reorganisation.","url":"https://thanet.moderngov.co.uk/documents/s97590/97590.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000114","council":"Thanet","tag":"LOBO","figures":"\u00a34.5m LOBO at 4.19%, repaid 9 December 2025","quote":"The Council had a Lender Option Borrower Option (LOBO) loan for \u00a34.5m at 4.19% and the lender exercised its option to increase the interest rate from 9 December 2025. Accordingly, the Council exercised its option to repay this loan on the same date.","paper":"Council - 2025-26 Budget Approvals Report","committee":"Council"},{"lane":"ours","source":"Tunbridge Wells","title":"Tunbridge Wells council starts year with stronger cash position as investment income outperforms","summary":"Tunbridge Wells Cabinet heard on 24 September that the council opened the financial year with \u00a341.9 million in cash, \u00a31.9 million more than budgeted, after capital projects totalling \u00a314.074 million were rescheduled into 2026/27. The stronger liquidity position has boosted investment returns. The council forecasts investment income of \u00a32.2 million for the year against a \u00a32 million budget, a surplus of \u00a3200,000 that will be transferred to reserves, after achieving an average interest rate of 4.13 per cent rather than the budgeted 3.94 per cent. Q1 investment balances reached \u00a348.3 million, well above the year-end budget assumption of \u00a328.9 million. The council holds no external debt. However, the capital programme is forecast to spend \u00a319.9 million in 2026/27 against a budget of \u00a38.9 million\u2014more than double\u2014and the Grant Volatility Reserve, which buffers against swings in government funding, is forecast to be completely depleted by March 2027.","url":"https://tunbridgewells.moderngov.co.uk/documents/s84985/84985.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000116","council":"Tunbridge Wells","tag":"borrowing","figures":"Internal Borrowing: \u00a33,687k","quote":"Internal Borrowing still to be repaid (projects not yet financed/MRP) (3,687)","paper":"Quarter 1 Treasury Management 202627","committee":"Cabinet"},{"lane":"ours","source":"Herefordshire UA","title":"Herefordshire forecasts \u00a311.6m revenue overspend as social care and schools pressures mount","summary":"Herefordshire Council is forecast to overspend its day-to-day budget by \u00a311.6 million (5 per cent) in 2026/27 before management action, the Cabinet heard on 24 September. The council approved a net revenue budget of \u00a3234.1 million but expects to spend \u00a3245.7 million. Of this variance, \u00a33.6 million is new in-year cost pressures and \u00a38.0 million reflects savings targets where delivery has not yet started or cannot be confirmed. The overspend is driven by continuing demand in adult social care, special educational needs transport and temporary accommodation. One-third of \u00a320 million in approved savings\u2014\u00a36.5 million\u2014is assessed as at risk, and over half of \u00a32.7 million in savings carried forward from previous years remains undelivered. The council's Budget Resilience Reserve, established at \u00a311 million in 2024/25 to cushion future pressures, has been drawn down to \u00a31 million. Its statement of accounts notes that available reserves are insufficient to mitigate the forecast overspend without significant impact on overall financial resilience, and that corrective action must be taken immediately.","url":"https://councillors.herefordshire.gov.uk/documents/s50135886/50135886.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000019","council":"Herefordshire UA","tag":"borrowing","figures":"Capital Financing Requirement \u00a3330.3m, long-term borrowing \u00a3184.7m","quote":"It is anticipated that significant borrowing will be undertaken in the last 3 quarters of the financial year due to replacement of internal borrowing with external borrowing, depending on actual expenditure within the capital programme.","paper":"Q1 2026/27 Budget Report, main report","committee":"Cabinet"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"ours","source":"Medway Towns UA","title":"Medway faces \u00a326.7m current-year overspend and \u00a365m structural deficit dependent on government funding","summary":"Medway Council faces a \u00a326.7m overspend forecast in the current financial year, exceeding its total general reserves of \u00a310.1m, and a structural budget gap of \u00a365.9m in 2027/28 rising to \u00a3359.3m cumulatively across the medium term. The financial plan cannot be balanced without exceptional financial support from government\u2014permission to borrow to cover day-to-day spending\u2014which has not been confirmed for 2027/28. If the government refuses, the Section 151 officer, the council's chief finance officer, may be forced to issue a Section 114 notice, a formal warning that the council cannot balance its budget, which freezes new spending until councillors agree a plan. The Cabinet heard pressures of \u00a338.6m in adult social care and \u00a39.2m in children's services, with adult social care costs having more than doubled since 2020-21.","url":"https://democracy.medway.gov.uk/documents/s91492/91492.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000035","council":"Medway Towns UA","tag":"s114 risk","figures":"\u00a365.858m 2027/28 gap dependent on EFS; EFS already granted for 2025/26 (\u00a39.856m) and agreed in-principle for 2026/27 (total \u00a328.003m borrowed)","quote":"The current MTFO projections cannot be balanced through the use of reserves and assume that further exceptional financial support from Government will be required. There remains a significant risk to the Council's financial resilience should additional support not be forthcoming...In the unlikely event that the MHCLG rejects the Council's latest application for EFS, the Section 151 Officer may be forced to issue a Section 114 notice to the Council.","paper":"Report","committee":"Cabinet"},{"lane":"ours","source":"Slough UA","title":"Slough forecasts \u00a319.9m overspend in 2026-27, with \u00a315.955m driven by children's social care placements","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
</body></html>
