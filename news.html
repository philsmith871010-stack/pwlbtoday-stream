<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

<script>
const DATA = {"generated":"2026-09-24T06:29:05.841013+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":5,"councils":17,"policy":24,"markets":35},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":5,"hm-treasury":2,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"_":"no key"},"items":[{"lane":"ours","source":"Cardiff","title":"Cardiff faces \u00a3167m budget gap as council struggles to deliver cost-cutting targets","summary":"Cardiff Council is facing a projected budget shortfall of \u00a3167.1 million over four years from 2027/28 to 2030/31, according to papers from this week's Council meeting. The council's track record on delivering the savings programmes it needs to close previous gaps is patchy. In 2025/26, it achieved only 76 per cent of its planned service change savings, the cuts to service provision it had committed to, delivering \u00a32.3 million of the target amount. Efficiency and income savings performed better at 88 per cent of target, reaching \u00a310.9 million. The council also faced sustained demand pressures in social care, schools and education, particularly for additional learning needs support and specialist placements. While the 2025/26 accounts balanced overall, some individual directorates recorded significant overspends requiring improved controls.","url":"https://cardiff.moderngov.co.uk/documents/s97282/97282.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"s114","figures":"None","quote":"On this basis, as the Section 151 Officer I have concluded that those conditions did not arise during the year and no Section 114 notice was issued in 2025/26.","paper":"Appointment of Section 151 Officer","committee":"Council"},{"lane":"ours","source":"Worcestershire CC","title":"\u00a359.9m Exceptional Financial Support programme receives no project detail in capital budget tables.","summary":"Large borrowing commitments require clear project documentation for lenders and finance directors to assess deliverability and risk. The absence of scheme detail makes it impossible to evaluate the programme from this paper alone.","url":"https://worcestershire.moderngov.co.uk/documents/s61943/61943.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"EFS","figures":"\u00a359,933k total; \u00a349,933k borrowing, \u00a310,000k capital receipts","quote":"Exceptional Financial Support 0 59,933 59,933 0 0 0 0 0 0 59,933 59,933","paper":"7 Appendix 4 - Quarter 1 Capital Programme","committee":"Cabinet"},{"lane":"ours","source":"North Somerset UA","title":"North Somerset audit cleared but auditor flags financial sustainability risks","summary":"North Somerset Council's accounts will receive an unmodified audit opinion with no adjustments identified, but the auditor has identified a significant weakness in the council's financial sustainability. The finding reflects continued pressure on the Dedicated Schools Grant (DSG), the government funding for schools, and the council's ability to deliver recurring savings. The auditor also identified a separate significant weakness in managing demand and costs in social care. The council intends to apply for a government support scheme under which up to 90 per cent of its DSG deficit could be written off, provided the council funds the remaining 10 per cent. The auditor found a calculation error in how the council has recorded the contingent asset and said it would need amending.","url":"https://n-somerset.moderngov.co.uk/documents/s9091/9091.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000024","council":"North Somerset UA","tag":"EFS","figures":"\u00a36m additional recurring income from EFS; 8.99% total council tax rise","quote":"Due to the structural deficit between increasing costs and the Council's capacity to increase income, the Council had to request EFS from the government to balance the 2026/27 budget.","paper":"11. Audit Findings Report 2025-26","committee":"Audit Committee"},{"lane":"ours","source":"Cheshire East UA","title":"Cheshire East uses emergency government powers to balance budget as adult social care costs spiral","summary":"Cheshire East Council balanced its 2026/27 budget only by using exceptional financial support, a government power that treats day-to-day spending as capital spending so it can be paid for by borrowing. The council used \u00a324.995m of this support to achieve statutory balance. Adult social care is the driver: the budget for care demand is forecast at \u00a311.455m against the original plan of \u00a35.958m, a \u00a35.497m overspend driven by an ageing population and rising complexity of needs. The council is attempting to close the gap through a \u00a322.45m transformation savings programme, but early results show only \u00a30.980m delivered in the first quarter against planned savings of \u00a35.830m for the full year. The council also faces unquantified financial risk from the local NHS integrated care board, which is in formal turnaround with \u00a3170m of required savings and may transfer costs to the council through health care arrangements.","url":"https://moderngov.cheshireeast.gov.uk/documents/s136550/136550.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m","quote":"The budget was balanced, as required by statute, with plan ned use of EFS, by way of a capitalisation direction, totalling \u00a324.995m.","paper":"2026/27 Budget \u2013 Quarter 1 Forecast OutturnCabinet and Committee Report Template","committee":"Adults Overview and Scrutiny Committee"},{"lane":"ours","source":"Bradford","title":"Bradford Council's \u00a3113m spending overspend funded by government emergency support","summary":"Bradford Council's accounts for 2025\u201326 have received an unqualified audit opinion, but the council ran a \u00a3113 million overspend on day-to-day spending, which was funded through a Capitalisation Direction\u2014emergency government permission to treat day-to-day spending as if it were capital spending. The overspend was \u00a314 million better than initially forecast, but the result is that the council did not meet its running costs from its own revenues. Usable reserves rose by \u00a355 million to \u00a3229.2 million, largely because costs funded by the Capitalisation Direction were earmarked in reserves rather than charged directly to spending. The General Fund balance stands at \u00a353.1 million, equivalent to 3.5 per cent of the council's gross expenditure.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Runnymede","title":"Runnymede forecasts unsustainable reserve depletion: \u00a39m housing deficit and general fund to \u00a32m by 2032","summary":"Runnymede Council is forecasting unsustainable reserve depletion on two fronts. The housing revenue account, which funds the council's own homes from rental income, will run a deficit of \u00a39.1 million in 2026/27, reducing its working balance from \u00a325.3 million to \u00a315 million. The council's general reserves \u2014 money set aside for emergencies \u2014 are forecast to fall from \u00a321.6 million in March 2027 to \u00a32 million by March 2032, a pace the council describes as unsustainable. Cost pressures drive the decline, principally a \u00a31.241 million ongoing commitment from a pay and grading review. The council depends on \u00a325.9 million in annual investment property rental income, but officers acknowledge risk in reletting properties at current rental levels. The council is exploring property disposals to reduce borrowing, though timelines remain uncertain.","url":"https://runnymede.moderngov.co.uk/documents/s18927/18927.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"intervention","figures":"Notice issued December 2023; now withdrawn as of September 2026 meeting date","quote":"Following the non-statutory best value notice, which has now been withdrawn","paper":"Q1 - Budget Monitoring report - Appenxix 6 v3 - final","committee":"Corporate Management Committee"},{"lane":"ours","source":"West Suffolk","title":"Council assessed as going concern with sufficient liquidity for next 12 months and forecast cash balances of \u00a310m at March 2027.","summary":"Going concern is foundational to all lending decisions. The council's formal assessment, with detailed supporting evidence on cash, reserves and budgeting, provides assurance on financial continuity.","url":"https://democracy.westsuffolk.gov.uk/documents/s59481/59481.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000245","council":"West Suffolk","tag":"audit opinion","figures":"\u00a329.5m cash and investments at 31 March 2026; \u00a310m forecast cash at March 2027; \u00a36.13m General Fund; \u00a352.01m earmarked reserves","quote":"Overall, based on its cash flow forecast, borrowing potential and access to investment funds, as well as the level of general fund and reserve balances it holds, the council determines that it has sufficient liquidity to continue to deliver services for the foreseeable future.","paper":"9-PAS-WS-26-018-Annual-Statement-of-Accounts-Appendix-A","committee":"Performance and Audit Scrutiny Committee"},{"lane":"ours","source":"Hammersmith & Fulham","title":"Hammersmith and Fulham balanced accounts but faces \u00a331.4m budget gap in two years","summary":"Hammersmith and Fulham balanced its budget across all areas in 2025/26 despite financial pressures from inflation, interest rates and a cyber incident, the council's audit committee was told. However, the council faces substantial budget gaps when temporary government funding ends: \u00a331.4m in 2027/28 and \u00a357.3m in 2028/29, according to the council's auditors. Government changes to funding and business rates will cut local income by \u00a323.5m a year. The council holds \u00a3122.1m in reserves set aside, but auditors say these cannot sustainably cover recurring shortfalls and the council will need to consider Council Tax increases and additional savings.","url":"https://lbhf.moderngov.co.uk/documents/s136009/136009.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000013","council":"Hammersmith & Fulham","tag":"audit opinion","figures":"Total net assets: \u00a31,462.070 million; materiality: \u00a323 million","quote":"Our anticipated financial statements audit report opinion will be unmodified.","paper":"Appendix 4 - LBHF Pension Fund Audit Findings Report 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Harrow","title":"Harrow Council forecasts \u00a33m overspend on day-to-day spending for current year","summary":"Harrow Council's Cabinet was told on Thursday that the authority is forecasting a net overspend of \u00a33.039m on its revenue spending (day-to-day running costs) for 2026-27, which would consume its budget planning reserves if not contained by year-end. The largest single pressure is temporary accommodation for homeless households, where demand has tripled in three years to 726 households, creating a \u00a315.7m annual subsidy loss as government funding falls short of market costs. Children's services is overspending by \u00a37.2m, driven chiefly by residential placements at average costs of \u00a37,000 per week, while schools-related funding has a \u00a354.2m accumulated deficit that grows by \u00a324.6m this year. The council is relying on government support to cover 90 per cent of that deficit, though approval of its special educational needs reform plan remains conditional. The Cabinet also approved a savings programme of \u00a34.062m, but nearly half depends on capital projects succeeding.","url":"https://harrow.moderngov.co.uk/documents/s201854/201854.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000015","council":"Harrow","tag":"DSG / SEND","figures":"Total variance \u00a335,859,859 (all slippage to 27/28); SEN Expansion \u00a310,448,369; Schools Capital Maintenance \u00a37,597,098; High Needs Provision \u00a34,200,000; Additional Basic Need Funding \u00a37,761,893","quote":"Total Children's Services Directorate 41,282,293 0 41,282,293 5,422,434 (35,859,859)","paper":"Appendix 2 - 2026-27 MTFS Tracker","committee":"Cabinet"},{"lane":"ours","source":"Gloucestershire CC","title":"Gloucestershire Fire Service has 41% of firefighters with overdue medical checks, auditors find","summary":"Gloucestershire Fire and Rescue Service is in breach of employment terms with more than two-fifths of its firefighters, the council's auditors have identified. As of May 2026, 155 of 378 firefighters had not completed mandatory medical checks required by their contracts, a gap that has grown because the service lacks a consistent process for booking and monitoring the checks. The same audit also found that 59 per cent of fire service managers have not completed mandatory training on reasonable adjustments for staff with disabilities. The findings, rated as high-priority by internal auditors, emerge within the context of concerns already raised by the fire inspectorate about occupational health and wellbeing in the service.","url":"https://gloucestershire.moderngov.co.uk/documents/s120233/120233.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000013","council":"Gloucestershire CC","tag":"DSG / SEND","figures":"\u00a346.28 million increase; \u00a3124.7 million cumulative deficit; \u00a336.3 million general fund balance; approximately \u00a312.5m residual local contribution; statutory override expires March 2028","quote":"The DSG deficit increased by \u00a346.28 million in 2025/26 to \u00a3124.7 million, compared to a General Fund balance at year end of \u00a336.3 million.","paper":"ISA260 202526 GCC draft for papers","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Herefordshire UA","title":"Herefordshire Council faces \u00a311.6m budget shortfall with reserves nearly depleted","summary":"The council forecast a \u00a311.6m shortfall in day-to-day spending at the end of the first quarter, a 5% overspend on its \u00a3234.1m budget. Of the shortfall, \u00a36.5m relates to savings targets that have not commenced or cannot be confirmed. The remaining pressures centre on adult social care and support for children with special educational needs and disabilities (SEND), where demand continues to grow despite efforts to control costs. Money set aside in the Budget Resilience Reserve to cushion unexpected costs has fallen to \u00a31.0m from \u00a311.0m two years earlier. The council acknowledged its total reserves would be insufficient to cover the overspend without significant damage to financial resilience and must immediately take corrective action to cut or recover spending.","url":"https://councillors.herefordshire.gov.uk/documents/s50135886/50135886.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000019","council":"Herefordshire UA","tag":"DSG / SEND","figures":"\u00a33.6 million council liability from March 2028; \u00a332.7 million DfE grant (90%); \u00a310m capital investment in 2026/27; \u00a33.8m additional High Needs funding over three years","quote":"the remaining balance of \u00a33.6 million (10%) to be a liability of the council once the statutory override period ends in March 2028","paper":"Q1 2026/27 Budget Report, main report","committee":"Cabinet"},{"lane":"ours","source":"Hampshire CC","title":"Hampshire's internal audit barely a tenth complete, with care monitoring failures going undetected","summary":"Hampshire's internal audit plan is severely behind schedule, with only 14 per cent completed against a 90 per cent target as of late July. The Audit Committee heard that none of the audits delivered to draft stage have met agreed timescales, and only a third reached final stage on time. The shortfall has real consequences: an audit found 642 care packages went without required weekly monitoring checks over seven weeks, with five providers failing to submit variations for 80 per cent or more of their packages. The council's external auditor also identified a risk of significant weakness in the council's financial sustainability and said full assurance over property valuations will not be restored until 2027/28, pushing an unqualified audit opinion to 2029/30 at the earliest.","url":"https://democracy.hants.gov.uk/documents/s151132/151132.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000014","council":"Hampshire CC","tag":"audit opinion","figures":"Three-year rebuild trajectory; Hampshire main remaining work areas identified as reserves, PPE, developers' contributions, capital grants receipts in advance, CIES and disclosure notes","quote":"The Council's progress is in line with the expected timescales for rebuilding assurance set out in LARRIG 01.","paper":"8i Hampshire County Council - From Reset to Recovery Audit Committee","committee":"Audit Committee"},{"lane":"ours","source":"City of Edinburgh","title":"Edinburgh Council's \u00a332m surplus masks delivery failures in core services","summary":"Edinburgh City Council reported a \u00a332.2m underspend in 2025-26 with an unqualified audit opinion, but the figure conceals underlying financial strain. The audited accounts show the underspend relied heavily on \u00a324.9m of non-recurring legal settlement income, and the council acknowledged it reflected \"one-off mitigations of underlying pressures or savings shortfalls\". More significantly, only 70 per cent of \u00a343.2m in approved savings and spending reductions were delivered in-year, leaving a \u00a313m shortfall concentrated in demand-led services including home to school transport and property repairs and maintenance. The council also faces a structural revenue loss of \u00a31.7m from reduced council tax base growth. With forward-year overspending already projected, the Finance and Resources Committee was advised that the unallocated underspend should be set aside for future use.","url":"https://edinburgh.moderngov.co.uk/documents/s103738/103738.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"S12000036","council":"City of Edinburgh","tag":"LOBO","figures":"\u00a332m market debt repaid (including two LOBOs); outstanding LOBO debt \u00a3122.4m","quote":"The lenders exercised their option to request an increase in the interest rate paid on the loans and the Council exercised its option to repay the loans at par with no penalty.","paper":"8.3 Revenue monitoring outturn 25-26","committee":"Finance and Resources Committee"},{"lane":"ours","source":"Thanet","title":"Lender exercised option on \u00a34.5m LOBO loan; council repaid at par on 9 December 2025","summary":"LOBO calls are refinancing and liquidity events; the council had to repay principal immediately and subsequently replace this funding through the capital markets","url":"https://thanet.moderngov.co.uk/documents/s97583/97583.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000114","council":"Thanet","tag":"LOBO","figures":"\u00a34.5m LOBO at 4.19%, repaid 9 December 2025","quote":"The Council had a Lender Option Borrower Option (LOBO) loan for \u00a34.5m at 4.19% and the lender exercised its option to increase the interest rate from 9 December 2025. Accordingly, the Council exercised its option to repay this loan on the same date.","paper":"Council Treasury YE 25-26","committee":"Council"},{"lane":"ours","source":"Camden","title":"Camden Council refinances \u00a329m LOBO loan to avoid rate rise","summary":"Camden Council has refinanced a \u00a329 million LOBO loan\u2014a bank loan where the lender may propose a higher interest rate\u2014after FMS Wertmanagement proposed raising the rate to 7.77 per cent from 4.625 per cent. Rather than accept, the council repaid the loan in August and replaced it with Public Works Loan Board (PWLB) borrowing, the government's lending arm for councils, at 4.69 per cent, avoiding approximately \u00a3893,000 a year in costs. But the council faces three further FMS loans totalling \u00a350 million with similar lender options due between September and October, which may require additional refinancing depending on interest rates.","url":"https://camden.moderngov.co.uk/documents/s135279/135279.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000007","council":"Camden","tag":"LOBO","figures":"\u00a315m due 24 September 2026; \u00a325m due 9 October 2026; \u00a310m due 29 October 2026","quote":"There are further FMS loans due for call during 2026/27: 24 September 2026 \u2013 \u00a315m, 9 October 2026 \u2013 \u00a325m, 29 October 2026 \u2013 \u00a310m","paper":"Treasury Management Update","committee":"Audit and Corporate Governance Committee"},{"lane":"ours","source":"Tunbridge Wells","title":"Internal borrowing of \u00a33,687k remains unfunded, with no identified financing mechanism in budget allocations.","summary":"Unfinanced internal borrowing represents a deferred claim on future budgets or the unitary authority's finances, creating refinancing risk and potential constraint on future service spending.","url":"https://tunbridgewells.moderngov.co.uk/documents/s85000/85000.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000116","council":"Tunbridge Wells","tag":"borrowing","figures":"Internal Borrowing: \u00a33,687k","quote":"Interna ":"https://www.lgcplus.com/politics/governance-and-structure/webinar-how-burnley-became-council-of-the-year-23-09-2026/","summary":"Burnley BC was named Council of the Year at the LGC Awards 2026. The judges said: \u201cThis council has demonstrated exceptional work in place leadership and community cohesion. The judges were inspired by the council\u2019s passion and fearless leadership, with outstanding results in areas from\u2026\nThe post WEBINAR: How Burnley became Council of the Year appeared first on Local Government Chronicle (LGC).","iso":"2026-09-23T10:06:30+00:00"},{"lane":"councils","source":"LGC","title":"LGPS local investment \u2018can\u2019t start hyper local\u2019","url":"https://www.lgcplus.com/lgps/lgps-local-investment-cant-start-hyper-local-23-09-2026/","summary":"The Local Government Pension Scheme should not begin its new legal duty on investing in local areas by going \"hyper local,\" a senior pool figure has warned. Council pension funds, the pools that invest their assets on their behalf and strategic authorities are required to\u2026\nThe post LGPS local investment \u2018can\u2019t start hyper local\u2019 appeared first on Local Government Chronicle (LGC).","iso":"2026-09-23T09:58:53+00:00"},{"lane":"councils","source":"LGC","title":"Rail strategies will need \u2018genuine\u2019 devo","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/rail-strategies-will-need-genuine-devo-23-09-2026/","summary":"Devolution must be \u201cgenuine\u201d and not just a policy of decentralisation for a successful rail transport network, according to a Lib Dem Lord. At this year\u2019s Liberal democrat conference, Baroness Pidgeon (Lib Dem), who was previously the party\u2019s transport spokesperson, said that a significant transport\u2026\nThe post Rail strategies will need \u2018genuine\u2019 devo appeared first on Local Government Chronicle (L","iso":"2026-09-23T09:11:25+00:00"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"councils","source":"LGC","title":"\u2018We need to be one of those major house builders again\u2019","url":"https://www.lgcplus.com/services/housing/we-need-to-be-one-of-those-major-house-builders-again-23-09-2026/","summary":"Local government needs to play a central role in social housing development and building, according to the deputy leader of Southwark LBC. At this year\u2019s Liberal Democrat annual conference, conversation opened up a ment/publications/submit-an-enquiry-to-hm-treasury","summary":"Use this form to send an enquiry to HM Treasury.","iso":"2026-09-22T10:30:01+00:00"},{"lane":"policy","source":"HM Treasury","title":"Guidance: Submit an FOI request to HM Treasury","url":"https://www.gov.uk/government/publications/submit-an-foi-request-to-hm-treasury","summary":"Use this form to send an FOI request to HM Treasury.","iso":"2026-09-22T10:30:01+00:00"},{"lane":"councils","source":"LGC","title":"Devo planning powers without and LGR risks \u2018disconnect\u2019","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/devo-planning-powers-without-and-lgr-risks-disconnect-22-09-2026/","summary":"Districts risk being excluded from strategic planning decisions if local government reorganisation does not go ahead, according to a city leader. At this year\u2019s Liberal Democrat conference, Steve Pipp (Lib Dem), leader of Portsmouth City Council, told LGC if LGR does not go ahead it\u2026\nThe post Devo planning powers without and LGR risks \u2018disconnect\u2019 appeared first on Local Government Chronicle (LGC)","iso":"2026-09-22T10:28:23+00:00"},{"lane":"policy","source":"HM Treasury","title":"Corporate report: Whole of Government Accounts 2025 to 2026: guidance for preparers","url":"https://www.gov.uk/government/publications/whole-of-government-accounts-2025-to-2026-guidance-for-preparers","summary":"Guidance for central government and local government preparers for Whole of Government Accounts.","iso":"2026-09-22T10:06:58+00:00"},{"lane":"councils","source":"LGC","title":"LGPS independent person not \u2018just another adviser\u2019","url":"https://www.lgcplus.com/lgps/lgps-independent-person-not-just-another-adviser-22-09-2026/","summary":"The new independent person council pension funds have to appoint should not duplicate investment advice, the LGC Investment & Pensions Summit has been told. As part of the government\u2019s Fit for the Future reforms to the Local Government Pension Scheme, pension funds have to appoint\u2026\nThe post LGPS independent person not \u2018just another adviser\u2019 appeared first on Local Government Chronicle (LGC).","iso":"2026-09-22T09:56:38+00:00"},{"lane":"ours","source":"Medway Towns UA","title":"Medway faces \u00a326.7m current-year overspend and \u00a365m structural deficit dependent on government funding","summary":"Medway Council faces a \u00a326.7m overspend forecast in the current financial year, exceeding its total general reserves of \u00a310.1m, and a structural budget gap of \u00a365.9m in 2027/28 rising to \u00a3359.3m cumulatively across the medium term. The financial plan cannot be balanced without exceptional financial support from government\u2014permission to borrow to cover day-to-day spending\u2014which has not been confirmed for 2027/28. If the government refuses, the Section 151 officer, the council's chief finance officer, may be forced to issue a Section 114 notice, a formal warning that the council cannot balance its budget, which freezes new spending until councillors agree a plan. The Cabinet heard pressures of \u00a338.6m in adult social care and \u00a39.2m in children's services, with adult social care costs having more than doubled since 2020-21.","url":"https://democracy.medway.gov.uk/documents/s91492/91492.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000035","council":"Medway Towns UA","tag":"s114 risk","figures":"\u00a365.858m 2027/28 gap dependent on EFS; EFS already granted for 2025/26 (\u00a39.856m) and agreed in-principle for 2026/27 (total \u00a328.003m borrowed)","quote":"The current MTFO projections cannot be balanced through the use of reserves and assume that further exceptional financial support from Government will be required. There remains a significant risk to the Council's financial resilience should additional support not be forthcoming...In the unlikely event that the MHCLG rejects the Council's latest application for EFS, the Section 151 Officer may be forced to issue a Section 114 notice to the Council.","paper":"Report","committee":"Cabinet"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: OSCAR II \u2013 publishing data from the database: September 2026","url":"https://www.gov.uk/government/publications/oscar-ii-publishing-data-from-the-database-september-2026","summary":"The first quarterly OSCAR transparency release for 2026-27.","iso":"2026-09-22T08:30:02+00:00"},{"lane":"policy","source":"HM Treasury","title":"Accredited official statistics: Public sector finances bulletin","url":"https://www.gov.uk/government/statistics/public-sector-finances-bulletin","summary":"The public sector finances statistical bulletin.","iso":"2026-09-22T06:52:50+00:00"},{"lane":"councils","source":"LG finance press","title":"Electricity prices - IFS | Institute for Fiscal Studies","url":"https://news.google.com/rss/articles/CBMiX0FVX3lxTFBUM1ZrY1ZINXpVd09weEgzM1g0SWx3RFJ4RWVEOWFVRUJxbE5DaFlabE1yU1NnZzAxUXcxS0NUaTVFeDc0bzZ2M1NRbVU0RWw5N29rTnExUG8xVkc5YmdZ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiX0FVX3lxTFBUM1ZrY1ZINXpVd09weEgzM1g0SWx3RFJ4RWVEOWFVRUJxbE5DaFlabE1yU1NnZzAxUXcxS0NUaTVFeDc0bzZ2M1NRbVU0RWw5N29rTnExUG8xVkc5YmdZ?oc=5\" target=\"_blank\">Electricity prices</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">IFS | Institute for Fiscal Studies</font>","iso":"2026-09-22T00:36:37+00:00"},{"lane":"councils","source":"LG finance press","title":"Scotland: plan to replace councils with \u2018six to ten\u2019 regional authorities - Room151","url":"https://news.google.com/rss/articles/CBMirAFBVV95cUxPa1k2N1FETDBkRjNSSGpOQ2tjQ1ZvdG1rTVBfSEJJMTNvVGRNN0pwTEk2dml4U3RkcnJ1YXc1azZwS2NhR3VISFFLb2w0UkhrNURVLXlUYjV4SU5WZWdMeHdqTHU3enhJWXhIRmotQVJmZ3puN0xZQldaRm5XTmhma1FTYzZHa1g4WFlOMzRIQXFDMXkzQlpPODc0Q3dYdHR5MG1WX2dhZl9SWng4?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMirAFBVV95cUxPa1k2N1FETDBkRjNSSGpOQ2tjQ1ZvdG1rTVBfSEJJMTNvVGRNN0pwTEk2dml4U3RkcnJ1YXc1azZwS2NhR3VISFFLb2w0UkhrNURVL rnment (MHCLG) is backing your business by making it easier for small businesses to access public sector supply chains, removing unnecessary burdens and costs.","iso":"2026-09-21T10:30:33+00:00"},{"lane":"policy","source":"MHCLG","title":"Capacity to Build","url":"https://www.gov.uk/guidance/capacity-to-build","summary":"The government's Capacity to Build programme supports councils to increase their current levels of housebuilding.","iso":"2026-09-21T09:00:06+00:00"},{"lane":"ours","source":"Slough UA","title":"Slough Council faces \u00a319.9m overspend with government-appointed commissioners warning of financial collapse by year-end.","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"councils","source":"Distress watch","title":"High Court of Karnataka Dismisses Review Petition in Land Acquisition Compensation Dispute \u2014 No Error Apparent on Record. Review Petition under Section 114 r/w Order 47 Rule 1 CPC fails as petitioners seek re-argument on merits, not correction of error. - Lawtext","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBGeVNKLWlkOGVlSFVTZVBHN2lCZ1Q4WlQ2dWdNOUliUGZvWEw1ZERmUmVYb0w0d2NUazVJQVBWZkZSVWRJUG5qQ2xnRjZoU0l5eEgyblNWdllJZWZCSmEyMUtVQ3ZPQQ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBGeVNKLWlkOGVlSFVTZVBHN2lCZ1Q4WlQ2dWdNOUliUGZvWEw1ZERmUmVYb0w0d2NUazVJQVBWZkZSVWRJUG5qQ2xnRjZoU0l5eEgyblNWdllJZWZCSmEyMUtVQ3ZPQQ?oc=5\" target=\"_blank\">High Court of Karnataka Dismisses Review Petition in Land Acquisition Compensation Dispute \u2014 No Error Apparent on Record. Review Petition under Section 114 r/w Order 47 Rule 1 CPC fails as ","iso":"2026-09-20T22:56:57+00:00"},{"lane":"councils","source":"Distress watch","title":"High Court Acquits Appellants in Abetment of Suicide Case Due to Lack of Evidence of Instigation or Abetment. Conviction under Section 306 IPC read with Section 114 IPC set aside as prosecution failed to prove any positive act of instigation or intentional aid - Lawtext","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTE1qZE96dDJZb0FvZkJYY0hkaGpCR1VveC1GVlJwdG9XM0JVSjR5ZkV4ZWZHclVISWItNzRRWnJmNFg5Y09uaC14TzMxVHZud0gzb3JzSXVZdTA3eTM2Y0g4U3pmOTJzUQ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTE1qZE96dDJZb0FvZkJYY0hkaGpCR1VveC1GVlJwdG9XM0JVSjR5ZkV4ZWZHclVISWItNzRRWnJmNFg5Y09uaC14TzMxVHZud0gzb3JzSXVZdTA3eTM2Y0g4U3pmOTJzUQ?oc=5\" target=\"_blank\">High Court Acquits Appellants in Abetment of Suicide Case Due to Lack of Evidence of Instigation or Abetment. Conviction under Section 306 IPC read with Section 114 IPC set aside as prosecu","iso":"2026-09-20T10:21:47+00:00"},{"lane":"councils","source":"Distress watch","title":"Havering Council Forecasts \u00a354.2m Use Of Exceptional Financial Support - The Havering Daily","url":"https://news.google.com/rss/articles/CBMisgFBVV95cUxNamNvM3JsNkpKOFZyUVJTX2dKbEFjS1hfaC14UG5teXZVNjlSZm1iRTF1YUtXemZyUnQwdi1Bb0FOdllFQk9BRy0zWmlPcUNxV0pFNGJJM0NZZ2tncW9JQjVzaWdoVG9FSE1JMjh3RUV5VWQ3alRLeENnS3NGZ0cwU2JkaERzNkZNb1hSTnFpaWIzX3FmdEkwdmFEdGFjWVpqRVhPdDRzSWtVTnMwbXpaVHpB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMisgFBVV95cUxNamNvM3JsNkpKOFZyUVJTX2dKbEFjS1hfaC14UG5teXZVNjlSZm1iRTF1YUtXemZyUnQwdi1Bb0FOdllFQk9BRy0zWmlPcUNxV0pFNGJJM0NZZ2tncW9JQjVzaWdoVG9FSE1JMjh3RUV5VWQ3alRLeENnS3NGZ0cwU2JkaERzNkZNb1hSTnFpaWIzX3FmdEkwdmFEdGFjWVpqRVhPdDRzSWtVTnMwbXpaVHpB?oc=5\" target=\"_blank\">Havering Council Forecasts \u00a354.2m Use Of Exceptional Financial Support</a>&nbsp;&nbsp;<","iso":"2026-09-20T07:21:00+00:00"},{"lane":"ours","source":"Croydon","title":"Croydon's debt servicing costs force reliance on Government support to balance budget","summary":"Croydon spent \u00a382m servicing its \u00a31.5bn General Fund debt in 2025/26, according to its annual governance statement. The council required \u00a3108.7m of capitalisation directions from Government \u2014 permission to treat day-to-day spending as capital spending and pay for it through borrowing \u2014 to balance its budget. The external auditor has rated the council's financial sustainability Red, the lowest possible rating, citing significant weakness in the council's arrangements for debt and cost reduction. An auditor's statutory recommendation, carried forward from the prior year unchanged, states the council must work with newly appointed Commissioners to develop measures enabling reduced operating costs and return to self-sufficiency, and that \"a solution to the debt issue is vital\" to assess the council's capability to manage its finances sustainably.","url":"https://croydon.moderngov.co.uk/documents/s72885/72885.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"intervention","figures":"Commissioners appointed July 2025","quote":"In July 2025 the Secretary of State appointed Commissioners to the Council, replacing the Improvement and Assurance Panel that had worked with us since 2021. That decision was a judgement about pace and grip rather than about intent.","paper":"Progress Update and Annual Head of Internal Audit Report","committee":"Audit & Governance Committee"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-01T07:00:00+00:00"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary": function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
</body></html>
