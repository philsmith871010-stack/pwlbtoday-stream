<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

s":"\u00a324.995m exceptional financial support (EFS) drawn. Contingency use: \u00a35.799m Transformation Contingency + \u00a310.336m General Contingency = \u00a316.135m. Total contingency deployed: \u00a315.358m of forecast.","quote":"The balanced forecast depends on the delivery of savings and mitigations, containment of social care demand, achievement of capital receipts and management of higher financing costs. My assurance is qualified.","paper":"20260825102352_006496_0013321_Reporttemplatev4","committee":"Cabinet"},{"lane":"ours","source":"Cheshire East UA","title":"Budget balance depends entirely on \u00a324.995m of conditional Exceptional Financial Support and contingency drawdowns.","summary":"A lender needs to know whether budget balance reflects underlying financial health or external life-support. This council cannot balance without support.","url":"https://moderngov.cheshireeast.gov.uk/documents/s135866/135866.pdf","iso":"2026-09-03T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m conditional Exceptional Financial Support; \u00a35.799m Transformation Contingency applied; \u00a315.358m General Contingency applied (including \u00a310.336m for services and \u00a35.022m for central pressures)","quote":"The reported balanced forecast is dependent on the planned application of \u00a324.995m of conditional Exceptional Financial Support, substantial of General Contingency budgets, delivery of savings and mitigations, containment of demand-led expenditure, achievement of capital receipts and management of increased financing costs.","paper":"20260825102353_006577_0013325_Annex4Quarter12627Section151AssuranceStatement","committee":"Cabinet"},{"lane":"ours","source":"Lancashire CC","title":"Government grant support conditional on DfE approval of SEND reform plan; approval status not yet confirmed","summary":"The council's financial position relies on external government approval of a reform plan. Rejection or significant delay would eliminate the \u00a391.44m grant, leaving the full \u00a3253.48m deficit to be funded from general reserves or force deeper service cuts.","url":"https://lancashire.moderngov.co.uk/documents/s285139/285139.pdf","iso":"2026-09-03T09:00:00+00:00","gss":"E10000017","council":"Lancashire CC","tag":"DSG / SEND","figures":"High Needs Stability Grant \u00a391.44m (covering 90% of deficit); deficit reduction dependent on approval: \u00a3253.48m to \u00a3162.04m","quote":"Due to the increasing DSG deficits forecasted nationally, the government has recently announced the High Needs Stability Grant, which subject to the approval of the Council's SEND reform plan from the Department for Education (DfE), will cover 90% of the DSG deficit at March 2026, estimated at \u00a391.44m","paper":"Appendix C","committee":"Cabinet"},{"lane":"ours","source":"Westminster","title":"Dedicated Schools Grant moving into deficit in 2026/27, with 14 of 34 schools (41.2%) in licensed deficit","summary":"School deficits are a future budget liability. The high proportion in deficit signals system-wide financial stress, not isolated issues. DfE oversight imminent.","url":"https://westminster.moderngov.co.uk/documents/s73934/73934.pdf","iso":"2026-09-03T09:00:00+00:00","gss":"E09000033","council":"Westminster","tag":"DSG / SEND","figures":"14 of 34 schools in deficit (41.2%), 6 with agreed recovery plans, 4 unable to produce plans, \u00a32.254m high needs overspend in 2025/26","quote":"The DSG is expected to move into an overall deficit in 2026/27 as a result of high needs expenditure.","paper":"Q1 Financial Monitor 2026-27","committee":"Audit and Performance Committee"},{"lane":"ours","source":"Oxford","title":"Council must draw down \u00a33.5m HRA reserves due to rental income miscalculation","summary":"Drawing down reserves reduces the HRA's buffer to absorb future shocks; lenders need to understand the trajectory of reserve positions and their adequacy","url":"https://mycouncil.oxford.gov.uk/documents/s92066/92066.pdf","iso":"2026-09-03T09:00:00+00:00","gss":"E07000178","council":"Oxford","tag":"overspend","figures":"\u00a33.5 million reserves drawdown; \u00a33.848 million income overestimation; original budgeted surplus \u00a31.47 million; revised deficit \u00a32.030 million","quote":"In order to rectify the issue identified, reserves totalling \u00a33.5 million will need to be drawn down, representing the net movement between the original budgeted surplus of \u00a31.47 million and the revised position that reflects a deficit for the year of \u00a32.030 million.","paper":"HRA Budget report July 2026 v4","committee":"Council"},{"lane":"markets","source":"Reuters UK","title":"Sterling ticks up from three-week low as yen rallies and oil cools - reuters.com","url":"https://news.google.com/rss/articles/CBMioAFBVV95cUxOV1NGWTdEaERkeW00Z01zWTlKNlVBazh6ZnoxdkJtWHBWaUVDV3BPSnVRTFdodkszeFRfT0t5cElaRC1MWWc5X0N5ZTktWGt2LUktaXFnSkJoRkZ1VUY1TUlpMTQ4Zzd1M3hGZ2F6bjV5TXlzUU1SUEJGUkliUDBLQVNUcWl3U0E3NFBNYzZRMF9SNlhIVWYySnk1NEYxbHhw?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMioAFBVV95cUxOV1NGWTdEaERkeW00Z01zWTlKNlVBazh6ZnoxdkJtWHBWaUVDV3BPSnVRTFdodkszeFRfT0t5cElaRC1MWWc5X0N5ZTktWGt2LUktaXFnSkJoRkZ1VUY1TUlpMTQ4Zzd1M3hGZ2F6bjV5TXlzUU1SUEJGUkliUDBLQVNUcWl3U0E3NFBNYzZRMF9SNlhIVWYySnk1NEYxbHhw?oc=5\" target=\"_blank\">Sterling ticks up from three-week low as yen rallies and oil cools</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">reuters","iso":"2026-09-03T08:37:19+00:00"},{"lane":"policy","source":"HM Treasury","title":"Research: UK official holdings of international reserves: August 2026","url":"https://www.gov.uk/government/publications/uk-official-holdings-of-international-reserves-august-2026","summary":"This release details movements in the international reserves of gold and assets held by the UK government.","iso":"2026-09-03T08:30:10+00:00"},{"lane":"policy","source":"MHCLG","title":"Live tables on local government finance","url":"https:/ 026-09-02T10:05:54+00:00"},{"lane":"councils","source":"LG finance press","title":"Final call: Last chance to take Room151\u2019s treasury and current affairs survey - Room151","url":"https://news.google.com/rss/articles/CBMisAFBVV95cUxOTDd3OFFaQkFQcDNVQW1CamJ6OU9HWmJRaU5nb0lFLXEyZkdnYXQwOFF5cGt4bksxdjZKclZvYl9USXlxbkFZSHpaUktFRFAtN0hlOE9wNnNDa3RjUlRGT1l2aENhaC1YNEhBZnNUakllRnlqVmE3d2VJZ2RpaW9jZUtTZFZLVzFxMHRHWjg2Rm85RWx1WW9OR3ZBSFF3TUxfWGhRZnZBY0VXbnRFNzZPNQ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMisAFBVV95cUxOTDd3OFFaQkFQcDNVQW1CamJ6OU9HWmJRaU5nb0lFLXEyZkdnYXQwOFF5cGt4bksxdjZKclZvYl9USXlxbkFZSHpaUktFRFAtN0hlOE9wNnNDa3RjUlRGT1l2aENhaC1YNEhBZnNUakllRnlqVmE3d2VJZ2RpaW9jZUtTZFZLVzFxMHRHWjg2Rm85RWx1WW9OR3ZBSFF3TUxfWGhRZnZBY0VXbnRFNzZPNQ?oc=5\" target=\"_blank\">Final call: Last chance to take Room151\u2019s treasury and current affairs survey</a>&nbsp;&n","iso":"2026-09-02T10:00:17+00:00"},{"lane":"policy","source":"MHCLG","title":"Urgent Crown Development application: MOD Bicester (Site A)","url":"https://www.gov.uk/guidance/urgent-crown-development-application-mod-bicester-site-a","summary":"Documents supporting the Urgent Crown Development application for the 10-year temporary use of the former MOD Bicester as non-detained asylum accommodation.","iso":"2026-09-02T10:00:03+00:00"},{"lane":"ours","source":"Swansea","title":"Welsh Government has no protocol for supporting councils that issue section 114 (cannot balance budget) reports","summary":"A lender assessing financial sustainability risk needs to understand that if a Welsh council does get into severe financial difficulty (unable to balance budget), there is no published framework for intervention or support. This affects the lender's understanding of worst-case escalation.","url":"https://swansea.moderngov.co.uk/documents/s129728/129728.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"W06000011","council":"Swansea","tag":"s114","figures":"No section 114 reports made in Wales to date; draft protocol in development but not finalised","quote":"Not being clear on what would happen after a section 114 report is made can have a negative impact on financial decision-making. For example, during our interviews we heard there is a misconception amongst some members and officers that issuing a section 114 report will lead to the Welsh Government providing more funding.","paper":"07 (1 of 1) - Funding_councils_How_the_Welsh_Government_funds_councils","committee":"Governance & Audit Committee"},{"lane":"ours","source":"Salford","title":"Council repaid one \u00a325m LOBO loan from cash but declined \u00a3143m of lenders' subsequent refinancing offers","summary":"LOBO loans carry refinancing risk if lenders exercise options to propose new rates; the council's selective approach to early repayment (paying cash on one loan, retaining others) reveals both liquidity position and debt management strategy, signalling whether refinancing at proposed rates remains affordable.","url":"https://salford.moderngov.co.uk/documents/s96840/96840.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"LOBO","figures":"\u00a325m repaid November 2024; \u00a3143m of refinancing offers (\u00a328m + \u00a320m + \u00a326m + \u00a328m + \u00a316m) declined between July 2025 and March 2026","quote":"There was one lender exercising an option and there were early prepayment offers on the following of the Authority's loans","paper":"Treasury Management Annual Report for 2025-26 v4 - Legal","committee":"Overview and Scrutiny Board"},{"lane":"ours","source":"Salford","title":"Earmarked reserves depleting by \u00a321.417m in Q1 forecast alone","summary":"Reserves are being consumed rapidly to manage overspends rather than fund planned initiatives. At this depletion rate (\u00a321.4m per quarter), the council exhausts earmarked reserves in under three years, leaving no buffer for future shocks.","url":"https://salford.moderngov.co.uk/documents/s96838/96838.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"reserves","figures":"Earmarked reserves 1 April 2026: \u00a3255.5m; Q1 forecast position: \u00a3234.1m; planned drawdown \u00a321.417m","quote":"General Fund Earmarked reserves at 1st April 2026 were \u00a3255.5m and at Quarter 1 are estimated to be \u00a3234.1m based on the year end forecast which forecasts the use of \u00a321.4m.","paper":"Revenue Budget Monitoring Report - Quarter 1 - Cabinet Briefing","committee":"Overview and Scrutiny Board"},{"lane":"ours","source":"Cumberland Council","title":"General Fund reserves falling below the minimum adequacy threshold after unplanned Q1 draw","summary":"A council operating below its minimum reserve threshold has reduced financial resilience and signals stress early in the financial year, with nine months remaining.","url":"https://cumberland.moderngov.co.uk/documents/s57346/57346.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E06000063","council":"Cumberland Council","tag":"reserves","figures":"General Fund reserves to \u00a324.965m, minimum adequacy level \u00a325.000m, unplanned contribution \u00a33.719m","quote":"The draft outturn position requires an unplanned contribution from General Fund balances of \u00a33.719m. This takes General Fund reserves to \u00a324.965m (subject to audit), which is below the Councils minimum adequacy level of \u00a325.000m.","paper":"2026/27 Budget Monitoring at Quarter 1 (April to June 2026)","committee":"Business and Resources Overview and Scrutiny Committee"},{"lane":"ours","source":"Middlesbrough UA","title":"Tees Valley Combined Authority received Best Value Inspection Notice in April 2026, creating governance oversight risk for member councils.","summary":"TVCA governance failures could constrain council autonomy, trigger government intervention in council services, or create unexpected costs; interim leadership in key finance roles signals operational risk.","url":"https://moderngov.middlesbrough.gov.uk/documents/s44749/44749.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E06000002","council":"Middlesbrough UA","tag":"intervention risk","figures":"Risk score SR-18: 20 (original and current), target 14; Best Value Notice issued April 2026","quote":"Best Value Inspection Notice issued April 26 resulting in increased government oversight.","paper":"Appendix 3 - Strategic Risk Register Quarter 1 2026-27","committee":"Executive"},{"lane":"ours","source":"Middlesbrough UA","title":"Dedicated Schools Grant deficit forecast to reach \u00a338.316m by March 2027, a separate structural financial liability","summary":"A \u00a338.316m DSG deficit represents a massive contingent liability separate from the revenue budget. National reform remains uncertain, leaving the council exposed to a structural problem it cannot unilaterally solve.","url":"https://moderngov.middlesbrough.gov.uk/documents/s44739/44739.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E06000002","council":"Middlesbrough UA","tag":"DSG / SEND risk","figures":"\u00a338.316m cumulative DSG deficit forecast by 31 March 2027","quote":"The forecast cumulative Dedicated Schools Grant (DSG) deficit is expected to increase to \u00a338.316m by 31 March 2027. Whilst national reform and the Local SEND Reform Plan (if approved by the Department for Education) provide a route towards longer-term sustainability, DSG remains a significant financial risk for the Council.","paper":"Report","committee":"Executive"},{"lane":"ours","source":"Bournemouth, Christchurch and Poole UA","title":"Accumulated DSG deficit forecast to reach \u00a3275.5m by March 2027, contingent on government approval","summary":"DSG deficit is the council's largest financial liability and the greatest threat to long-term sustainability; material relief depends on unconfirmed government action.","url":"https://bcpcouncil.moderngov.co.uk/documents/s68529/68529.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E06000058","council":"Bournemouth, Christchurch and Poole UA","tag":"DSG / SEND risk","figures":"\u00a3275.5m accumulated deficit by March 2027; \u00a3179.8m opening balance; \u00a395.7m in-year deficit; High Needs Stability Grant would cover 90% of historic deficit","quote":"The Dedicated Schools Grant (DSG) deficit remains the Council's most significant financial risk, with the accumulated deficit forecast to increase to approximately \u00a3275.5m by March 2027.","paper":"2026/27 Council Budget Monitoring at quarter 1","committee":"Cabinet"},{"lane":"councils","source":"LGC","title":"Richard Wright: Rewiring the state must start with councils","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/richard-wright-rewiring-the-state-must-start-with-councils-02-09-2026/","summary":"A new call for change is asking councils to help develop practical proposals to present to ministers, writes the chair of the Local Councils Network. The prime minister\u2019s Rewiring the State agenda is a refreshing recognition of a truth that we\u2019ve always known in local\u2026\nThe post Richard Wright: Rewiring the state must start with councils appeared first on Local Government Chronicle (LGC).","iso":"2026-09-02T08:55:46+00:00"},{"lane":"councils","source":"LGC","title":"Why some councils have missed housing standards","url":"https://www.lgcplus.com/services/housing/why-some-councils-have-missed-housing-standards-02-09-2026/","summary":"James Wilmore looks at why some councils are not meeting housing consumer standards Just over nine years ago, 72 people - including 18 children - died due to a fire in a 24-storey west London tower block. The Grenfell Tower blaze was the deadliest residential\u2026\nThe post Why some councils have missed housing standards appeared first on Local Government Chronicle (LGC).","iso":"2026-09-02T08:34:29+00:00"},{"lane":"policy","source":"MHCLG","title":"Fire statistics data tables","url":"https://www.gov.uk/government/statistical-data-sets/fire-statistics-data-tables","summary":"The Ministry o 2025-to-2026-first-release","summary":"Provisional outturn estimates of local authority revenue expenditure for\r\nApril 2025 to March 2026.","iso":"2026-09-01T12:08:50+00:00"},{"lane":"councils","source":"LG finance press","title":"Why a people-first approach is key to digital transformation: Ed Garcez interview - Room151","url":"https://news.google.com/rss/articles/CBMitgFBVV95cUxQMmFDREJDWmJaXzJ3NmNRd0ZwSkV4bGhNbG9TbWdnOUhJVFdPcS1Gay1HUTJlRV9wd2ZVejRwVTFiTkdRa0VRNXY4SUVvcUY1cXBCQU1raEJfWUd6dVRCQUhTV3JzOUVXNEo1Qkh0TjNVS2JRRm9sMUJqajRPWWJHMmw4X09MaDZGaG9waFJWSjV1eVB0ZUlsampRaVRyZ2QzNE1ZOUlKbk9WUGRZbFN2cmVFdzF5Zw?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMitgFBVV95cUxQMmFDREJDWmJaXzJ3NmNRd0ZwSkV4bGhNbG9TbWdnOUhJVFdPcS1Gay1HUTJlRV9wd2ZVejRwVTFiTkdRa0VRNXY4SUVvcUY1cXBCQU1raEJfWUd6dVRCQUhTV3JzOUVXNEo1Qkh0TjNVS2JRRm9sMUJqajRPWWJHMmw4X09MaDZGaG9waFJWSjV1eVB0ZUlsampRaVRyZ2QzNE1ZOUlKbk9WUGRZbFN2cmVFdzF5Zw?oc=5\" target=\"_blank\">Why a people-first approach is key to digital transformation: Ed Garcez interview","iso":"2026-09-01T11:09:24+00:00"},{"lane":"ours","source":"Worcester","title":"Earmarked reserves are planned to fall from \u00a313.3m to \u00a32.9m over two years, with business rates reserves depleting sharply","summary":"Rapidly depleting reserves reduce the council's capacity to manage contingencies and increases vulnerability to external shocks or forecast misses.","url":"https://committee.worcester.gov.uk/documents/s65994/65994.pdf","iso":"2026-09-01T09:00:00+00:00","gss":"E07000237","council":"Worcester","tag":"reserves","figures":"Earmarked reserves: \u00a313.317m (March 2026) \u2192 \u00a36.832m (March 2027) \u2192 \u00a32.901m (March 2028); Business rates: \u00a33.138m \u2192 \u00a31.693m \u2192 \u00a3693m","quote":"Earmarked reserves are expected to reduce by \u00a310.416m between March 2026 and March 2028","paper":"Q1 Financial monitoring report 26-27 v1","committee":"Policy and Resources Committee"},{"lane":"policy","source":"HM Treasury","title":"UK leads way in disrupting shadowy Russian sanctions evasion network","url":"https://www.gov.uk/government/news/uk-leads-way-in-disrupting-shadowy-russian-sanctions-evasion-network","summary":"Chancellor calls on allies to step up their pressure on Russia and sets out new action to stop Putin evading sanctions to fund his illegal war.","iso":"2026-08-31T21:58:43+00:00"},{"lane":"policy","source":"HM Treasury","title":"\u00a3100 million competition to back British AI companies to fix public services","url":"https://www.gov.uk/government/news/100-million-competition-to-back-british-ai-companies-to-fix-public-services","summary":"\u00a3100 million fund competition will help promising British AI start-ups start in the UK and tackle some of society's biggest challenges.","iso":"2026-08-31T09:25:15+00:00"},{"lane":"ours","source":"Thanet","title":"Council repaid \u00a34.5m LOBO loan after lender exercised option to increase interest rate","summary":"LOBO loans embed the risk that lenders can force borrowers to accept higher rates. The council's decision to repay rather than accept the increase shows the new rate created material cost pressure, illustrating the council's vulnerability to rate risk.","url":"https://thanet.moderngov.co.uk/documents/s97246/97246.pdf","iso":"2026-08-27T09:00:00+00:00","gss":"E07000114","council":"Thanet","tag":"LOBO","figures":"LOBO loan \u00a34.5m at 4.19%, repaid 9 Dec 2025; new rate not disclosed; repayment funded from investments.","quote":"The Council had a Lender Option Borrower Option (LOBO) loan for \u00a34.5m at 4.19% and the lender exercised its option to increase the interest rate from 9 December 2025. Accordingly, the Council exercised its option to repay this loan on the same date.","paper":"Cabinet Treasury YE 25-26 - Google Docs","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Medway Towns UA","title":"Council now expects to require Exceptional Financial Support in the current year, with debt reaching \u00a3800-900m by local government reorganisation","summary":"EFS is a clear signal the council cannot meet its statutory duties from its own resources. Combined with local government reorganisation, this indicates financial stress and elevated refinancing risk for the successor authority.","url":"https://democracy.medway.gov.uk/documents/s91075/91075.pdf","iso":"2026-08-25T09:00:00+00:00","gss":"E06000035","council":"Medway Towns UA","tag":"EFS","figures":"Projected debt \u00a3800m-\u00a3900m; Dartford and Gravesham combined debt \u00a3200m; EFS now required; only \u00a3900k government funding for LGR against significant need","quote":"By vesting day, it was likely that the Council's debt would reach between \u00a3800m-\u00a3900m","paper":"Treasury Management Report 2026/27: Quarter 1","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Lincoln City","title":"Council has \u00a342m under-borrowing against its Capital Financing Requirement, with additional borrowing deferred to end of financial year.","summary":"A lender needs to understand borrowing trajectory. Deferred \u00a342m borrowing suggests either strong cash position or intentional rate timing; the deferral to year-end creates lumpy refinancing risk if rates move.","url":"https://lincoln.moderngov.co.uk/documents/s80928/80928.pdf","iso":"2026-08-18T09:00:00+00:00","gss":"E07000138","council":"Lincoln City","tag":"borrowing","figures":"CFR \u00a3160.432m, actual debt \u00a3118.395m, under-borrowing \u00a342.037m; capital expenditure revised to \u00a354.508m from original \u00a333.662m","quote":"Currently forecasting actual external debt at year end to be inline with the original budget, albeit additional borrowing pushed to the end of the financial year.","paper":"Treasury Management Q1 26.27 Exec","committee":"Executive"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"ours","source":"Somerset Council","title":"Government issued formal Best Value Notice on 15 July citing concerns about Council's capacity to comply with Best Value Duty","summary":"Best Value Notices are formal steps toward more severe intervention; they signal to lenders that government has lost confidence in the authority's capacity to manage its finances","url":"https://democracy.somerset.gov.uk/documents/s68778/20262027 General Fund Revenue Budget Monitoring Report - Quarter 1.pdf","iso":"2026-08-12T09:00:00+00:00","gss":"E06000066","council":"Somerset Council","tag":"intervention","figures":"Issued 15 July 2026","quote":"On 15 July 2026, the Ministry of Housing, Communities and Local Government (MHCLG) issued Somerset Council with a Best Value Notice. This is a formal notification that Government has concerns about the Council's capacity to comply with its Best Value Duty.","paper":"2026/2027 General Fund Revenue Budget Monitoring Report - Quarter 1","committee":"Scrutiny Committee - Corporate and Strategic"},{"lane":"ours","source":"Somerset Council","title":"\u00a343m of Capitalisation Directive deployed in 2025/26 to fund revenue budget from capital resources\u2014described as 'repeated warning' indicating ongoing concern.","summary":"Depletes capital resources available for investment; masks true revenue deficit; cannot continue indefinitely without exhausting capital or accumulating unsustainable debt.","url":"https://democracy.somerset.gov.uk/documents/s68921/Lead Member for Finance Procurement Performance Annual Report.pdf","iso":"2026-08-12T09:00:00+00:00","gss":"E06000066","council":"Somerset Council","tag":"audit opinion","figures":"\u00a343m Capitalisation Directive 2025/26","quote":"the repeated warning that \u00a343m of Capitalisation Directive has been deployed in closing the budget gap","paper":"Annual Report of the Deputy Leader of Somerset Council and the Lead Member for Finance, Procurement and Performance","committee":"Scrutiny Committee - Corporate and Strategic"},{"lane":"ours","source":"Stoke-on-Trent UA","title":"Council using capital receipts flexibility and reserves to offset revenue overspends; no Section 114 report yet, but mitigations are finite.","summary":"Capital receipts flexibility and reserve drawdown are tools of last resort. Their deployment signals the council is using contingency strategies to manage a \u00a313.6m social care overspend. If overspends persist into Q2-Q4, these tools will be depleted.","url":"https://moderngov.stoke.gov.uk/documents/s182418/182418.pdf","iso":"2026-08-11T09:00:00+00:00","gss":"E06000021","council":"Stoke-on-Trent UA","tag":"s114","figures":"\u00a32m corporate reserve deployed; \u00a33.293m capital receipts flexibility deployed","quote":"Despite the in-year pressures currently facing the Council, the Section 151 Officer has not considered it necessary to make any such report at the current juncture in light of ongoing mitigations.","paper":"Financial Performance Report 2026/27 - Quarter 1","committee":"Cabinet"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"ours","source":"Nottingham City UA","title":"Council issued a Section 114 notice in November 2023 for inability to set a balanced budget; recovery is now early-stage despite achievement of 2026/27 balanced budget without Exceptional Financial Support.","summary":"Section 114 is a critical threshold event for local authority lending. While recovery progress is welcome, it is very early-stage and dependent on continued financial discipline.","url":"https://committee.nottinghamcity.gov.uk/documents/s183981/183981.pdf","iso":"2026-07-31T09:00:00+00:00","gss":"E06000018","council":"Nottingham City UA","tag":"s114","figures":"Section 114 issued November 2023; Commissioners oversight concluded March 2026; EFS \u00a341.024m approved 2024/25, only \u00a37.737m required year-end; 2026/27 balanced budget achieved without EFS","quote":"In November 2023, a Section 114 (Part 3) report was issued to Councillors due to concerns regarding the financial sustainability of the Council","paper":"Enc. 1 for Draft Annual Governance Statement 2025 - 2026","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"ours","source":"Woking BC","title":"Revenue expenditure continues to be funded through Capitalisation Direction due to structural deficit","summary":"This is a direct indicator of ongoing structural revenue deficit; the council remains dependent on special borrowing permissions to fund day-to-day expenditure, not just capital investment. This is the core condition that triggered the section 114 notice.","url":"https://woking.moderngov.co.uk/documents/s46562/46562.pdf","iso":"2026-07-23T09:00:00+00:00","gss":"E07000217","council":"Woking BC","tag":"capitalisation","figures":"Capitalisation Direction used to fund revenue expenditure pending financial restructuring; \u00a3482.13m total borrowing in 2025/26","quote":"the primary reason for new borrowing in 2025/26, excluding the refinancing of loans maturing during the year, was to support the Capitalisation Directive (CD) required to fund revenue expenditure while the Council works towards a more sustainable financial position. A significant element of the CD relates to the loss of income following the suspension of interest previously received from wholly owned companies.","paper":"EXE26-035 Treasury Management Annual function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
