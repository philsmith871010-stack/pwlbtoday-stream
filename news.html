<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">

<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

<script>
const DATA = {"generated":"2026-09-22T06:43:23.292805+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":5,"councils":12,"policy":23,"markets":35},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":6,"hm-treasury":2,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"_":"no key"},"items":[{"lane":"ours","source":"West Berkshire UA","title":"West Berkshire faces depleted reserves and external borrowing spiral, Q1 figures show","summary":"West Berkshire Council's financial position is deteriorating faster than budgeted, with reserves forecast to run out by 2028 and external borrowing projected to reach \u00a3486m by 2029, the council's Q1 financial report reveals. The council is currently overspending by \u00a39.3m against its \u00a3210.9m revenue budget, driven by a \u00a310.3m overspend in Children's Services where residential care placements have surged 27% annually to 36 clients costing \u00a3543,000 each. Though a schools funding deficit is tracking \u00a33.1m better than expected, this gain is insufficient to offset the wider pressure. The council's General Fund Reserve\u2014its financial cushion\u2014is forecast to fall to \u00a31m by year-end, below the level the council's chief finance officer considers sustainable. With cash resources depleting from \u00a347.2m to \u00a31.3m by 2028, the council will exhaust internal reserves and become dependent on external borrowing, exposing it to higher interest rate risks.","url":"https://decisionmaking.westberks.gov.uk/documents/s147933/147933.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000037","council":"West Berkshire UA","tag":"EFS","figures":"MRP 2025/26: \u00a36.6m; MRP 2026/27 Q1 forecast: \u00a37.1m; MRP forecast 2032/33: \u00a315.3m; EFS-related portion: c.\u00a36.7m","quote":"the annual MRP charge is forecast to increase to approximately \u00a315.3m by 2032/33. Of this total, around \u00a36.7m relates to the repayment of borrowing associated with Exceptional Financial Support (EFS)","paper":"7d. Appendix D - Gross and net revenue expenditure by Directorate for 2026_27 Budget vs 2026_27 Q1 Outturn","committee":"Resources and Place Scrutiny Committee"},{"lane":"ours","source":"Nottingham City UA","title":"Nottingham City's school funding deficit hits \u00a327.3m as special needs demand outpaces budget","summary":"Nottingham City Council's dedicated schools grant \u2014 the government money that funds schools \u2014 faces an in-year shortfall of \u00a327.3m in its high needs block for children with special educational needs and disabilities, largely because demand has far exceeded forecasts. The council warned that the deficit is \u00a324.2m worse than the recovery plan it approved assumed. It will fully deplete the \u00a312.1m reserve set aside for this and create a cumulative deficit of \u00a315.2m by the end of March 2027. The council is undertaking a fundamental review of the recovery plan. The financial protection that has shielded the council from this liability \u2014 a statutory override \u2014 ends on 31 March 2028, after which the accounting treatment is uncertain. The General Fund reserves, which cushion the council against unexpected costs, are now forecast to fall to 6% of annual spending, below the 10% minimum the council's chief finance officer recommends as prudent.","url":"https://committee.nottinghamcity.gov.uk/documents/s185395/185395.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000018","council":"Nottingham City UA","tag":"DSG / SEND","figures":"\u00a327.3m in-year deficit; \u00a312.1m reserve; \u00a315.2m cumulative deficit by 31 March 2027; worst case \u00a331.3m; statutory override ends 31 March 2028","quote":"The High Needs (SEND) Block is forecasting an in year deficit of \u00a327.3m, \u00a324.2m adverse to the assumptions underpinning the approved DSG Recovery Plan, largely due to unforeseen and unrelenting demand increases exceeding original forecasts.","paper":"2026/27 Budget Monitoring Report \u2013 Quarter 1","committee":"Executive Board"},{"lane":"ours","source":"Medway Towns UA","title":"Medway faces \u00a326.7m current-year overspend and \u00a365m structural deficit dependent on government funding","summary":"Medway Council faces a \u00a326.7m overspend forecast in the current financial year, exceeding its total general reserves of \u00a310.1m, and a structural budget gap of \u00a365.9m in 2027/28 rising to \u00a3359.3m cumulatively across the medium term. The financial plan cannot be balanced without exceptional financial support from government\u2014permission to borrow to cover day-to-day spending\u2014which has not been confirmed for 2027/28. If the government refuses, the Section 151 officer, the council's chief finance officer, may be forced to issue a Section 114 notice, a formal warning that the council cannot balance its budget, which freezes new spending until councillors agree a plan. The Cabinet heard pressures of \u00a338.6m in adult social care and \u00a39.2m in children's services, with adult social care costs having more than doubled since 2020-21.","url":"https://democracy.medway.gov.uk/documents/s91492/91492.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000035","council":"Medway Towns UA","tag":"DSG / SEND","figures":"\u00a39.210m increase 2027/28; 50 new placements at \u00a32.202m cost; currently 21 external residential placements at \u00a36,001-\u00a39,000/week and 21 at \u00a33,001-\u00a36,000/week; SEND transport growth 9%; cost per pupil increased \u00a36,000 since June 2024","quote":"The primary driver is the change in demographics which show an increase of 50 placements at a cost of \u00a32.202million in 2027/28. Further to this an increase of \u00a34.444million is projected for the current cost of service pressure...Further to the above, the increase in the number of children in higher cost placements seen to date in 2026/27 is also reflected...there are 21 External Residential placements at a weekly cost between \u00a36,001 - \u00a39,000 current and a further 21 in placements costing between \u00a33,001 - \u00a36,000.","paper":"Report","committee":"Cabinet"},{"lane":"ours","source":"Powys","title":"Powys Council internal audit findings deteriorate as governance weakens","summary":"Powys Council's internal audit findings deteriorated significantly in 2025-26. Only 2.7% of audited areas achieved substantial assurance that controls were working well, compared with 7.69% the previous year, while limited assurance findings (indicating control weaknesses) rose to 27% of areas examined. The council's governance statement recorded downgrade of three principles, including financial management and internal control, from substantial to reasonable assurance. The council achieved a balanced budget for 2026-27 and received an unqualified opinion on its 2024-25 accounts with no misstatements. However, it can only demonstrate financial balance one year ahead, and a new financial system was embedded in April 2026 during this period of declining governance assurance.","url":"https://powys.moderngov.co.uk/documents/s106651/106651.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"W06000023","council":"Powys","tag":"audit opinion","figures":"Draft submitted 30 June 2025; unqualified opinion issued in advance of 31 October 2025 deadline; zero uncorrected misstatements","quote":"The Auditor issued an unqualified opinion on the accounts in advance of the statutory deadline of 31 October 2025. There were no uncorrected misstatements in the accounts.","paper":"2026-2027 Q1 Cabinet Report - Performance (2026-09-22)","committee":"Cabinet"},{"lane":"ours","source":"Cardiff","title":"Cardiff's borrowing strategy unravels as interest rates stay high and cash reserves dwindle","summary":"Cardiff Council borrowed \u00a3231.8m last year at an average rate of 4.69%, betting that interest rates would fall and allow refinancing at lower cost. Instead, Public Works Loan Board rates have risen to 6.5%, at four-year highs. The council now faces a forced shift to external borrowing as internal cash reserves near maximum depletion\u2014currently at \u00a390m against a targeted limit of \u00a3100m. With a medium-term budget gap of \u00a3167.1m forecast over four years and capital financing costs rising sharply, the council's flexibility is tightening. The Governance and Audit Committee noted that the timing of expected rate falls \"continue to be deferred and look increasingly uncertain,\" while the treasury team, managing \u00a31.1bn of external debt, operates under resource pressure and needs additional specialist support.","url":"https://cardiff.moderngov.co.uk/documents/s97126/97126.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"audit opinion","figures":"No material uncertainties identified","quote":"Based on the work I have performed, I have not identified any material uncertainties relating to events or conditions that, individually or collectively, may cast significant doubt on the Cardiff Harbour Authority's ability to continue to adopt the going concern basis of accounting for a period of at least twelve months from when the financial statements are authorised for issue","paper":"Item 9.1 - Appendix 1","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Bridgend","title":"Bridgend faces \u00a319.25m refinancing bill as lender raises rate on decades-old loans","summary":"Bridgend Council will repay \u00a319.25 million of bank loans after the lender exercised its right to increase the interest rate from 4.65 per cent to 7.52 per cent, effective 22 July 2026. Rather than accept the higher rate on the LOBO loans\u2014long-term borrowing where lenders may propose rate increases on set dates\u2014the council chose to repay at par and refinance. The repayment comes as the council faces a broader tightening of its financial position. Its underlying need to borrow, the amount it has spent on long-lived assets it has not yet paid for, is forecast to grow from \u00a3182.56 million to \u00a3200.82 million by March 2028 as capital commitments progress. The council is currently using \u00a369.97 million of its own cash reserves to fund capital spending instead of borrowing, a position the treasury report suggests cannot be sustained indefinitely as reserves deplete.","url":"https://democratic.bridgend.gov.uk/documents/s38639/38639.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"W06000013","council":"Bridgend","tag":"LOBO","figures":"\u00a370.58 million forecast borrowing need; \u00a319.25 million LOBO component","quote":"the forecast need to borrow during the year is \u00a370.58 million, although this is likely to reduce as capital expenditure and use of earmarked reserves forecasts are updated during the year. This figure includes the repayment of the LOBO loans of \u00a3 19.25 million, which may need to be refinanced either in total or in part duing the year.","paper":"Treasury Management Report Quarter 1 2026-27","committee":"Cabinet"},{"lane":"ours","source":"Tameside","title":"Tameside complaints upheld at above-average rate, with SEN failures dominating remedies","summary":"The ombudsman upheld complaints against Tameside at a rate of 89% in 2025-26, exceeding the 83% average for similar councils. Eight of the 11 cases where the council paid financial remedy \u2014 totalling \u00a37,850 \u2014 involved failures in children's special educational needs support, including delays in issuing Education, Health and Care Plans and loss of educational provision. The council has committed to adopt the ombudsman's Complaint Handling Code by April 2028, requiring it to respond to complaints within 10 working days instead of the current 20. However, the council met that existing timescale in only 69% of cases in 2025-26, down from 73% the previous year, signalling it may struggle to meet tighter targets without additional investment.","url":"https://tameside.moderngov.co.uk/documents/s211535/211535.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E08000008","council":"Tameside","tag":"LOBO","figures":"\u00a35m LOBO; original coupon 4.5%; proposed rate 6.68%; replacement short-term borrowing at 4.3%; maturity would have been 2054; PWLB alternative was 6.28%","quote":"The \u00a35m Dexia loan originally had an interest rate of 4.5% with an option date every 6 months. When the lender option was exercised, the proposed rate from 16 June 2026 was 6.68%. At the time of the new rate being proposed, replacement PWLB loans with the same duration to 2054 were available at a lower rate of 6.28% for a maturity loan with certainty discount.","paper":"ITEM 7 SWAP Internal Audit Progress Report - September 2026","committee":"Audit Committee"},{"lane":"ours","source":"North Hertfordshire","title":"North Hertfordshire capital spending hampered by project delays and failed asset sales","summary":"North Hertfordshire Council faces mounting pressure on its ability to deliver building and infrastructure projects after delays and changes to its funding plans. The capital programme for 2026/27 has swollen to \u00a313.6m, but \u00a34.4m of this is spending that slipped from the previous year. More significantly, the council expected to raise \u00a33m from selling assets but a review by its estates team found that one site will be let rather than sold and two others cannot be disposed of this year without accepting lower prices. The shortfall forces the council to use its own cash reserves to pay for projects instead of borrowing, a strategy that depletes its financial cushion and increases future costs. Cabinet approved a \u00a30.67m addition to the 2027/28 capital programme but noted that the programme must be kept under review for affordability.","url":"https://democracy.north-herts.gov.uk/documents/s32129/32129.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E07000099","council":"North Hertfordshire","tag":"borrowing","figures":"\u00a33M","quote":"The delay would mean an increase in internal borrowing and the minimum revenue provision in future years until those capital receipts were realised and could be applied as capital funding.","paper":"6B - FAR - First Quarter Revenue Budget Monitoring 2026-27","committee":"Cabinet"},{"lane":"ours","source":"Blaby","title":"Blaby approves \u00a38.5m capital programme but deploys just 14% in first quarter","summary":"Blaby Council has approved a revised capital programme of \u00a38.5m for 2026/27, a 69% increase on its original \u00a35.1m budget, but has spent only \u00a31.2m by the end of June. The largest project, a \u00a34.5m regeneration property scheme, remains 78% unspent. Multiple capital projects, including the Walk & Ride Blaby scheme and fleet vehicle replacement programme, have not begun. The council has approved \u00a33.77m of prudential borrowing\u2014new internal borrowing to fund the expanded programme\u2014representing a 44% increase on the original borrowing requirement. One exception is the UK Shared Prosperity Fund, which deployed 99% of its budget in the quarter, suggesting the council can execute rapidly when programmes are actively managed.","url":"https://democracy.blaby.gov.uk/documents/s55855/55855.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E07000129","council":"Blaby","tag":"borrowing","figures":"External debt (excluding Finance Leases) \u00a34m at 30 June 2026; funds available for investment \u00a325.9m","quote":"For several years, the Council has been in an internally borrowed cash position, and balances will need to be replenished at some point in the future, subject to expenditure demands.","paper":"Appendix D \u2013 Treasury and Prudential Indicators","committee":"Council"},{"lane":"markets","source":"City AM","title":"B&Q sales slip but owner Kingfisher lifts profit target","url":"https: nd Whitehall has a \u201ctotal lack of understanding of how local government operates\u201d, a Liberal Democrat county leader said this weekend. Speaking at the Liberal Democrat party conference at the weekend, Gloucestershire CC leader Lisa Spivey\u2026\nThe post County leader: Whitehall has a \u2018total lack of understanding\u2019 appeared first o","iso":"2026-09-21T09:55:57+00:00"},{"lane":"councils","source":"LGC","title":"Graham Chapman: The devolution paradox","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/graham-chapman-the-devolution-paradox-21-09-2026/","summary":"If devolution is to succeed it requires substantial central coordination, writes the former leader of Nottingham City Council. The buzz word of the moment is devolution. There is hardly anyone among the commentariat or political classes who does not think it is a good thing.\u2026\nThe post Graham Chapman: The devolution paradox appeared first on Local Government Chronicle (LGC).","iso":"2026-09-21T09:19:30+00:00"},{"lane":"policy","source":"MHCLG","title":"Capacity to Build","url":"https://www.gov.uk/guidance/capacity-to-build","summary":"The government's Capacity to Build programme supports councils to increase their current levels of housebuilding.","iso":"2026-09-21T09:00:06+00:00"},{"lane":"ours","source":"Slough UA","title":"Slough Council faces \u00a319.9m overspend with government-appointed commissioners warning of financial collapse by year-end.","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"ours","source":"E08000039","title":"Sheffield forecasts \u00a329m schools funding shortfall","summary":"Sheffield Council's dedicated schools grant (DSG), the government funding for schools, faces a \u00a329m overspend forecast for 2026/27, driven by rising numbers of children requiring special educational support and a sharp increase in post-16 college places. The council explicitly stated the gap is unlikely to be resolved without additional government funding and increased special needs costs and placements will continue to create pressure. The shortfall adds to mounting budget pressures across the council: only 89 per cent of \u00a374.1m budgeted savings are currently deliverable, and the Future Sheffield transformation programme is creating a \u00a32.4m overspend rather than delivering planned savings. A positive note came from improved capital programme forecasting, which hit 92 per cent accuracy compared with a 90 per cent target, reversing a historical pattern of substantial project slippage.","url":"https://democracy.sheffield.gov.uk/documents/s87874/87874.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E08000039","council":"E08000039","tag":"DSG / SEND","figures":"\u00a329m overspend forecast; \u00a327m budgeted over-commitment; SEN placements from September 2025; further Post 16 college place increases","quote":"The DSG overspend of \u00a329m is unlikely to be resolved without additional funding and increased SEN costs and number of places continue to create pressures.","paper":"Appendix 2 - 2627 Q1 Capital Monitoring Report","committee":"Finance and Performance Policy Committee"},{"lane":"ours","source":"Carmarthenshire","title":"Carmarthenshire records \u00a316m school and care overspends","summary":"Carmarthenshire Council's schools and social care services all recorded significant budget overspends in 2025-26, driven by rising demand and cost increases that outpaced available funds. School delegated budgets overspent by \u00a37.7m, spread across primary, secondary and special education. Children's services placements exceeded budget by \u00a33.7m, and the council's main children's residential unit, Garreglwyd, is operating at full capacity. Adult social care recorded overspends of \u00a35.1m across older people, learning disabilities, and mental health services, with the council attributing the pressures to rising demand and increasing complexity in care needs. The council managed these pressures partly through new borrowing, taking \u00a330m from the Public Works Loan Board (PWLB), the government's lending arm for councils, during the financial year.","url":"https://carmarthenshire.moderngov.co.uk/documents/s110374/110374.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"W06000010","council":"Carmarthenshire","tag":"borrowing","figures":"Total loans \u00a3434.13m (up from \u00a3415.83m, increase \u00a318.30m); PWLB \u00a3425.04m (up from \u00a3403.45m, increase \u00a321.59m); Market \u00a30m (repaid from \u00a33.00m); \u00a330.00m borrowed in six PWLB loans at 4.51-4.86%; under-borrowing \u00a3152m vs CFR \u00a3586m","quote":"The total loans outstanding at 1st April 2025 and 31st March 2026 were:","paper":"04. App B - HRA BM June 2026","committee":"Cabinet"},{"lane":"markets","source":"Reuters UK","title":"Europe's gas price surge may feed into inflation more quickly, ECB finds - Reuters","url":"https://news.google.com/rss/articles/CBMivwFBVV95cUxPYlZORjIxVTNxX0RoX2h1WS1idFNvSGFRN09nZ0dmRGtfbm9wR0thb01MbnNpUkZWU0lNSFdNU28tQWp3UndBMFNBQ0tQQm9KaGwzYjVkSmVselNOb3EwQ1U2MU1yUFhSTC1HM0FadE5NV2UwWi1Ya1BjYkFZUnFyZmRlYU43bTN1Z1JPT1pjcGtMZWY2b1I0SEp3eVE4aHpZMmNHRFFsZTVmRlVDeU5OWnpNWU80ZDNhWVZmaF9PVQ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMivwFBVV95cUxPYlZORjIxVTNxX0RoX2h1WS1idFNvSGFRN09nZ0dmRGtfbm9wR0thb01MbnNpUkZWU0lNSFdNU28tQWp3UndBMFNBQ0tQQm9KaGwzYjVkSmVselNOb3EwQ1U2MU1yUFhSTC1HM0FadE5NV2UwWi1Ya1BjYkFZUnFyZmRlYU43bTN1Z1JPT1pjcGtMZWY2b1I0SEp3eVE4aHpZMmNHRFFsZTVmRlVDeU5OWnpNWU80ZDNhWVZmaF9PVQ?oc=5\" target=\"_blank\">Europe's gas price surge may feed into inflation more quickly, ECB fi","iso":"2026-09-21T08:08:17+00:00"},{"lane":"councils","source":"LGC","title":"Shadow unitary seeks legal advice behind LGR pause","url":"https://www.lgcplus.com/politics/governance-and-structure/shadow-unitary-seeks-legal-advice-behind-lgr-pause-21-09-2026/","summary":"West Surrey shadow authority has requested to see the legal advice that led to the wider pause in the local government reorganisation programme. The timeline in Surrey is unchanged, with vesting day set for 1 April 2027, but shadow leader Paul Follows (Lib Dem) said\u2026\nThe post Shadow unitary seeks legal advice behind LGR pause appeared first on Local Government Chronicle (LGC).","iso":"2026-09-21T07:05:52+00:00"},{"lane":"councils","source":"Distress watch","title":" nd FCA\u2019s long-term approach to harmonising UK MiFIR, UK EMIR and UK SFTR reporting requirements","iso":"2026-09-18T11:00:00+00:00"},{"lane":"councils","source":"LGC","title":"Met enters interim power sharing deal","url":"https://www.lgcplus.com/politics/governance-and-structure/met-enters-interim-power-sharing-deal-18-09-2026/","summary":"Oldham MBC has entered into a four-way interim political leadership agreement after more than four months of stalemate. The met has been leaderless since the local elections in May and under no overall control. After four failed attempts to choose a leader and \"engagement\" with\u2026\nThe post Met enters interim power sharing deal appeared first on Local Government Chronicle (LGC).","iso":"2026-09-18T09:52:00+00:00"},{"lane":"councils","source":"LGC","title":"Councillor abuse \u2018worsening\u2019","url":"https://www.lgcplus.com/services/community-cohesion/councillor-abuse-worsening-18-09-2026/","summary":"Abuse and intimidation for councillors is worsening, according to the Local Government Association\u2019s latest Debate not Hate survey. Almost two in five councillors said they feel some level of personal risk while carrying out their role. This rises to 85% for female, ethnic minority, LGBT+\u2026\nThe post Councillor abuse \u2018worsening\u2019 appeared first on Local Government Chronicle (LGC).","iso":"2026-09-18T09:36:26+00:00"},{"lane":"councils","source":"LG finance press","title":"Will LGR hiatus herald \u2018messy\u2019 future for devolution? - Room151","url":"https://news.google.com/rss/articles/CBMijgFBVV95cUxOMDcwSk5mNzl3QnhYY28xcndQV1FlWFZVS2ZpdnlNTXM4ZjBuTUlMQ3pQVy1WMWJUVzE0b1ZsWGhldGt6cHdzcFVNVFZYTGNLd21KSHVWRi0xdzZjTl95RFBwQ3hxWHh4Wks0aWJSajRrMmZTdFhCQWRvMXNmS3VUSG9OS3RTWTltakd5V1lB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMijgFBVV95cUxOMDcwSk5mNzl3QnhYY28xcndQV1FlWFZVS2ZpdnlNTXM4ZjBuTUlMQ3pQVy1WMWJUVzE0b1ZsWGhldGt6cHdzcFVNVFZYTGNLd21KSHVWRi0xdzZjTl95RFBwQ3hxWHh4Wks0aWJSajRrMmZTdFhCQWRvMXNmS3VUSG9OS3RTWTltakd5V1lB?oc=5\" target=\"_blank\">Will LGR hiatus herald \u2018messy\u2019 future for devolution?</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Room151</font>","iso":"2026-09-18T09:13:56+00:00"},{"lane":"ours","source":"Leicestershire CC","title":"Leicestershire borrows less than forecast but SEND expansion hinges on capital availability","summary":"Leicestershire County Council's actual debt stood at \u00a387m as of early September, \u00a358m below its \u00a3145m forecast \u2014 a prudent performance that reflects lower-than-expected capital spending. Yet the same financial pressures are narrowing the council's capacity to expand services. Commercial activity income has fallen to 1.0% of the net revenue stream from a forecast 1.3%, a material shortfall in a key income source. The council has now explicitly identified capital investment as the constraint on meeting statutory responsibilities for special educational needs and disability support, warning in its risk register that without sufficient capital to deliver additional places and specialist provision, it may be unable to meet its legal obligations. The audit of the 2024/25 accounts cleared without qualification and draft 2025/26 statements met the statutory publication deadline, giving the council a clean bill of health on past performance.","url":"https://democracy.leics.gov.uk/documents/s198423/198423.pdf","iso":"2026-09-18T09:00:00+00:00","gss":"E10000018","council":"Leicestershire CC","tag":"LOBO","figures":"FMS: \u00a310m at 4.75%, maturity 2054; Dexia: \u00a310m at 4.50%, maturity 2065; zero premiums on LOBO repayments","quote":"The lender exercised their call option to change the interest rates on the loans (to a significantly higher rate). As a result, the Council took the opportunity to repay these loans, no premiums apply in these circumstances.","paper":"Appendix B - Prudential and Treasury Indicators 2026-27","committee":"Corporate Governance Committee"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: HMT workforce management information: August 2026","url":"https://www.gov.uk/government/publications/hmt-workforce-management-information-august-2026","summary":"This document details monthly management information on staff numbers and paybill costs within HM Treasury and its agencies.","iso":"2026-09-18T08:35:10+00:00"},{"lane":"ours","source":"Hillingdon","title":"Hillingdon on track for three-quarters of savings target, but risks mount","summary":"Hillingdon Council has delivered \u00a313.1m of its \u00a327.1m savings programme for 2026/27 by the fourth month of the year, with a further \u00a37.9m on track to follow. Combined, 77 per cent of the planned cuts and efficiencies are either achieved or progressing as intended. However, the council has identified \u00a33.9m at risk of not delivering, including significant uncertainty around social housing supply schemes, and has marked \u00a3599,000 as unable to be delivered without alternative support. The Cabinet meeting on 17 September also heard that homelessness demand is rising against expectation\u2014placements increased by 11 year-to-date against a budgeted reduction of 7\u2014and that schools are facing a \u00a313.1m overspend on high needs support for children with special educational needs as parents rush to apply before government reforms take effect.","url":"https://modgov.hillingdon.gov.uk/documents/b15940/Cabinet Agenda B - Budget Monitoring 17th-Sep-2026 19.00 CABINET.pdf?T=9","iso":"2026-09-17T09:00:00+00:00","gss":"E09000017","council":"Hillingdon","tag":"EFS","figures":"\u00a361.388m revenue costs capitalized under Exceptional Financial Support","quote":"Excluding the in-principle approval from the Ministry of Housing, Communities and Local Government [MHCLG] to allow the Council to capitalise \u00a361.388m of revenue costs as part of its Exceptional Financial Support","paper":"Cabinet Agenda B - Budget Monitoring","committee":"CABINET"},{"lane":"ours","source":"Croydon","title":"Croydon's debt servicing costs force reliance on Government support to balance budget","summary":"Croydon spent \u00a382m servicing its \u00a31.5bn General Fund debt in 2025/26, according to its annual governance statement. The council required \u00a3108.7m of capitalisation directions from Government \u2014 permission to treat day-to-day spending as capital spending and pay for it through borrowing \u2014 to balance its budget. The external auditor has rated the council's financial sustainability Red, the lowest possible rating, citing significant weakness in the council's arrangements for debt and cost reduction. An auditor's statutory recommendation, carried forward from the prior year unchanged, states the council must work with newly appointed Commissioners to develop measures enabling reduced operating costs and return to self-sufficiency, and that \"a solution to the debt issue is vital\" to assess the council's capability to manage its finances sustainably.","url":"https://croydon.moderngov.co.uk/documents/s72885/72885.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"EFS","figures":"\u00a327.3m Stabilisation Plan achieved; continued reliance on Exceptional Financial Support","quote":"The Council's financial position remains the most significant governance weakness and the delivery of the outcomes in the Financial Strategy 2027-30 provides the road map to achieving financial sustainability","paper":"Progress Update and Annual Head of Internal Audit Report","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Liverpool","title":"Liverpool council's reserves hit 'very low level' as financial pressures mount","summary":"Liverpool's reserves \u2014 money a council sets aside as a financial cushion \u2014 have fallen to \u00a325.4m after overspends of \u00a323.8m in 2024/25 and \u00a311.7m in 2025/26. The council's chief finance officer said the council is now holding \"a very low level of usable reserves which will reduce the ability of the council to manage its continuing financial challenges going forward.\"\n\nThe overspends were driven by demand-led service pressures: adult social care (\u00a315.3m), children's services (\u00a317.5m), and homelessness and transport (\u00a321.2m). The council forecasts a cumulative budget gap\u2014the difference between expected spending and available funding\u2014of \u00a363.9m by 2028/29. The council has raised council tax by the maximum allowed 4.99% for 2026/27, despite a 5.8% increase in government grant, signalling limited room for further local revenue-raising.","url":"https://councillors.liverpool.gov.uk/documents/s328596/328596.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E08000012","council":"Liverpool","tag":"audit opinion","figures":"General Fund Reserve \u00a325.389m as buffer against \u00a3756m revenue spend","quote":"Nevertheless, the issues of sustainability and liquidity are overriding concerns for the council despite the going concern prescription. In this respect the key risks for the council are the ability to manage its budget within available resources and the need to maintain adequate reserve balances to mitigate the risks of unexpected cost pressures and difficulties in delivering approved savings programmes.","paper":"Appendix 1 for Draft Statement of Accounts and Draft Annual Governance Statement for 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Brighton & Hove UA","title":"Brighton and Hove faces \u00a320.9m overspend, requests \u00a330m government loan","summary":"Brighton and Hove Council is requesting permission from government to borrow an additional \u00a330m \u2014 known as exceptional financial support \u2014 after forecasting a \u00a320.852m overspend for 2026/27. The council has warned that if the request is denied, its chief finance officer will file a Section 114 notice, a formal warning that the council cannot balance its budget from income. The overspend stems from three main pressures: temporary accommodation (\u00a312m), adult social care placements (\u00a312m), and schools funding for special educational needs (\u00a38.925m). The council's transformation programmes are on track but cannot keep pace with rising demand and costs. A CIPFA review found financial resilience weaknesses; the council reports improvements are being implemented, with a follow-up assessment scheduled for end of September.","url":"https://democracy.brighton-hove.gov.uk/documents/s217111/217111.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E06000043","council":"Brighton & Hove UA","tag":"s114 risk","figures":"\u00a320.852m forecast overspend, \u00a316.949m additional risks not in forecast","quote":"The larger risk is that if our request for further EFS is not approved, the Council's Chief Financial Officer would be forced to file a S114 report on the grounds that expected expenditure in the current financial year cannot be met by expected income.","paper":"Appendix 1- Adult Social Care savings extract from Full Council Budget report 26th February pages 51,52 and 53","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"ours","source":"Stockport MBC","title":"The council is moving closer to the threshold for Exceptional Financial Support (EFS), a form of government-administered distress funding","summary":"EFS signals distress and typically carries restrictions on discretionary borrowing and service reduction mandates. For a lender, it means the council's capacity to service debt becomes a government concern, not just a council one.","url":"https://democracy.stockport.gov.uk/documents/s267445/267445.pdf","iso":"2026-09-15T09:00:00+00:00","gss":"E08000007","council":"Stockport MBC","tag":"s114","figures":"36 councils required EFS in 2026/27; Stockport's likelihood of Section 114 currently low but trajectory worsening","quote":"early and prudent consideration of its timing, conditions and longer-term consequences is necessary to preserve options and avoid a more acute financial intervention","paper":"Part A: Medium Term Financial Plan (MTFP) Summer Review Update","committee":"Cabinet"},{"lane":"ours","source":"Derbyshire CC","title":"Derbyshire Council fails to meet accounts deadlines for second year running","summary":"Derbyshire County Council has failed to publish its draft financial accounts by the statutory deadline for the second consecutive year, triggering auditor concern about \"potentially significant weakness\" in its financial reporting arrangements. The 2025-26 accounts were due on 30 June 2026 but were not published until 14 August; the previous year's accounts were similarly delayed to November 2025. The auditor will now investigate whether the recurring delays were accompanied by material errors, poor working papers, inadequate resources or significant audit adjustments. The missed deadlines come as the council faces multiple unfunded budget pressures: its High Needs school funding deficit is forecast to reach \u00a3173.8m by March 2027, with services including children's placements and adult care forecasting combined overspends of over \u00a37m and \"Red\" rated savings judged unlikely to be delivered.","url":"https://derbyshire.moderngov.co.uk/documents/s35897/35897.pdf","iso":"2026-09-15T09:00:00+00:00","gss":"E10000007","council":"Derbyshire CC","tag":"s114 risk","figures":"Budget deficit over \u00a36m (June 2024); Demand increased from 3,666 (2019) to 8,801 (2025); NAO: national SEN deficit \u00a34.6bn; warning of potential Section 114 notices by March 2026","quote":"The council's budget deficit for EHCPs and HTST is over \u00a36m (June 2024). There is a national financial deficit estimated at \u00a34.6bn contributing in part to the risk of two-fifths of local authorities issuing a Section 114 notice by March 2026.","paper":"Derbyshire County Council - Audit Progress Report - September 26","committee":"Audit Committee"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"CIPFA","title":"FAN - Introduction to Collection Fund Accounting in England - cipfa.org","url":"https://news.google.com/rss/articles/CBMiogFBVV95cUxNRnY1OWtzT1RVVFVhWXRKTDRkejVTanFESU9hdFo5eWt6LWd5VFRvRkpUXzdQOU5FYk14Nnl4ZEtRcDEzNkFGa05aMTRpdUNtaHZ6b25CMzJZQjdoQ0l5LUtTRm14V0dhSUotWGlCMUxBVlRLZGVzQjEzYkotQzV3Rnh6c2E3bkptYnF6S0p4STNCLUszekRuTFhKaDJkVnpEOGc?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiogFBVV95cUxNRnY1OWtzT1RVVFVhWXRKTDRkejVTanFESU9hdFo5eWt6LWd5VFRvRkpUXzdQOU5FYk14Nnl4ZEtRcDEzNkFGa05aMTRpdUNtaHZ6b25CMzJZQjdoQ0l5LUtTRm14V0dhSUotWGlCMUxBVlRLZGVzQjEzYkotQzV3Rnh6c2E3bkptYnF6S0p4STNCLUszekRuTFhKaDJkVnpEOGc?oc=5\" target=\"_blank\">FAN - Introduction to Collection Fund Accounting in England</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">cipfa.org</","iso":"2026-09-12T05:20:31+00:00"},{"lane":"policy","source":"CIPFA","title":"Benchmarking Clubs - cipfa.org","url":"https://news.google.com/rss/articles/CBMiXkFVX3lxTE05bzh1Z3l4WnJuZDdYOUZiTXVQYm10ZHRuNG9qbGt6NndubGJsOXBQclpYNXZoV0xSellqVnJST2NxV3dpV3BTcno1YlJWc0hjWGZ3engxblA1dm1rNUE?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiXkFVX3lxTE05bzh1Z3l4WnJuZDdYOUZiTXVQYm10ZHRuNG9qbGt6NndubGJsOXBQclpYNXZoV0xSellqVnJST2NxV3dpV3BTcno1YlJWc0hjWGZ3engxblA1dm1rNUE?oc=5\" target=\"_blank\">Benchmarking Clubs</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">cipfa.org</font>","iso":"2026-09-11T12:51:38+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Council received a formal Best Value Notice from MHCLG in July 2026","summary":"A Best Value Notice is a serious marker for lenders; it signals regulatory intervention and formal governance weakness in a council already dependent on exceptional financial support.","url":"https://shropshire.gov.uk/committee-services/documents/s45376/45376.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Best Value Notice issued July 2026","quote":"In July 2026 the Council received a Best Value Notice from MHCLG.","paper":"Q1 Performance Report-01072026 1248","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Shropshire UA","title":"External audit issued statutory recommendations on value-for-money; Council under Non-Statutory Best Value Notice with formal MHCLG reviews beginning September 2026","summary":"Audit concerns, formal Best Value Notice, and active MHCLG oversight indicate external constraint. Governance and financial control weaknesses are matters lenders typically care about.","url":"https://shropshire.gov.uk/committee-services/documents/s45413/45413.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Seven years of Limited Assurance on internal audit; statutory audit recommendations; Best Value Notice in place","quote":"The external auditor felt bound to issue statutory recommendations as part of their annual audit for 2024/25 which cast doubt on the integrity of the Council's value for money arrangements... This coincided with the issue of a Non-Statutory Best Value Notice that requires the Council to be reviewed by MHCLG on a regular basis. These reviews begin in September.","paper":"UPDATED Financial Monitoring Report Quarter 1 2026.27-02072026 1235 v8","committee":"Finance and Improvement Overview and Scrutiny Committee"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - cipfa.org","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-06T17:16:15+00:00"},{"lane":"ours","source":"Swansea","title":"Welsh Government has no protocol for supporting councils that issue section 114 (cannot balance budget) reports","summary":"A lender assessing financial sustainability risk needs to understand that if a Welsh council does get into severe financial difficulty (unable to balance budget), there is no published framework for intervention or support. This affects the lender's understanding of worst-case escalation.","url":"https://swansea.moderngov.co.uk/documents/s129728/129728.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"W06000011","council":"Swansea","tag":"s114","figures":"No section 114 reports made in Wales to date; draft protocol in development but not finalised","quote":"Not being clear on what would happen after a section 114 report is made can have a negative impact on financial decision-making. For example, during our interviews we heard there is a misconception amongst some members and officers that issuing a section 114 report will lead to the Welsh Government providing more funding.","paper":"07 (1 of 1) - Funding_councils_How_the_Welsh_Government_funds_councils","committee":"Governance & Audit Committee"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates es":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement process costs","summary":"Seeks views on exceptions to the rule that parties pay their own process costs in leasehold transactions under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-process-costs","iso":"2026-07-15T14:14:00Z","closes":"2026-09-23T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"CIPFA and the codes","title":"CIPFA prudential code changes aim for greater council transparency - localgov.co.uk","url":"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2VjdzZMYVRKY2FPV3FhS0dTU01pS2ZMUWlwbWtOVU1RSzdTV2l3SXZudjlCVHlmZUFnajBNb2pCR1Znckd6MTFDTm4xUktYNldMTFVrVHJlaWNjWl9HcmFaVEI5cFFiMHhvODRST0N4UEpMeElhVDdvNlBLX3ByRDN4?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2VjdzZMYVRKY2FPV3FhS0dTU01pS2ZMUWlwbWtOVU1RSzdTV2l3SXZudjlCVHlmZUFnajBNb2pCR1Znckd6MTFDTm4xUktYNldMTFVrVHJlaWNjWl9HcmFaVEI5cFFiMHhvODRST0N4UEpMeElhVDdvNlBLX3ByRDN4?oc=5\" target=\"_blank\">CIPFA prudential code changes aim for greater council transparency</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">localgo","iso":"2026-07-06T07:00:00+00:00"},{"lane":"policy","source":"CIPFA and the codes","title":"CIPFA prudential code changes aim for gre function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
</body></html>
