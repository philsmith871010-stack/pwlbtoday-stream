<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

<script>
const DATA = {"generated":"2026-10-02T08:37:36.827319+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":5,"councils":25,"policy":41,"markets":35},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":5,"hm-treasury":2,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"CIPFA and CIPFA/LASAAC":"nothing open"},"items":[{"lane":"ours","source":"Barnet","title":"Barnet reports \u00a3113.5m budget gap for 2027/28 and a plan to reach financial sustainability by March 2029","summary":"Barnet Council faces a budget gap of \u00a3113.5m for 2027/28, after counting \u00a37.9m of savings already identified by departments, according to its medium-term financial strategy (MTFS), the five-year financial plan that sets out the gap between expected spending and expected income. The paper puts the gap at \u00a3144.1m in 2028/29, rising to \u00a3228.2m by 2031/32. The council says it will apply to government for exceptional financial support (EFS), permission to borrow or sell assets to cover day-to-day spending, as part of closing the 2027/28 gap.\n\nThe figures went to the new Finance and Growth Overview and Scrutiny Sub-Committee on 8 October. The committee was created for 2026/27 to add review and challenge on the council's finances, budget and regeneration.\n\nEFS has already been approved at \u00a355.7m for 2025/26, of which \u00a345.9m was drawn, and up to \u00a379.6m for 2026/27, with \u00a373.6m expected to be needed. Borrowing carries interest and a minimum revenue provision, the sum a council must set aside each year to repay past borrowing. The strategy puts these costs at \u00a39.6m in 2027/28, rising to \u00a322.6m in 2030/31, \u00a362.75m over four years.\n\nThe council's answer is a Financial Sustainability Plan, due at Cabinet in October 2026, with a target of financial sustainability by March 2029. It is built around the causes of demand, using predictive analytics to tackle the root of costs in high-cost services, and has five delivery blocks and three enabling blocks. The council's finance officer, in a assessment by the Chartered Institute of Public Finance and Accountancy (CIPFA), described the position entering 2026/27 as \"extremely challenging\", citing demand in children's and adults' social care, special educational needs and homelessness.\n\nThe general reserve is held at \u00a315m, which the finance officer judged prudent provided money set aside for specific purposes is rebuilt to at least the approved \u00a340m. Barnet Homes came third of 14 London housing providers for cost per property in 2023/24, at \u00a31,870 against a peer average of \u00a32,499.","url":"https://barnet.moderngov.co.uk/documents/s100129/100129.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000003","council":"Barnet","tag":"EFS","figures":"\u00a379.298m EFS (2026/27); then unbalanced budgets of \u00a3113.495m, \u00a3144.080m, \u00a3183.653m, \u00a3220.542m, \u00a3228.223m (2027/28\u20132031/32)","quote":"0.000 (Surplus)/Shortfall after EFS 113.495 144.080 183.653 220.542 228.223","paper":"Printed plan Finance and Growth Overview and Scrutiny Sub-Committee Finance and Growth Overview","committee":"Finance and Growth Overview and Scrutiny Sub-Committee"},{"lane":"ours","source":"Bedford UA","title":"Bedford Borough Council ended 2025/26 \u00a317.7m over budget; 2026/27 forecast overspend is \u00a33.6m","summary":"Bedford Borough Council ended 2025/26 with a \u00a317.7m overspend, largely from children's external placements and adult social care. The Audit Committee's annual report to Full Council on 7 October says the government gave \u00a322m of exceptional financial support (permission to borrow or sell assets to cover day-to-day spending, a last resort) for that year. It also gave \u00a358m to enable a balanced budget for 2026/27.\n\nBudget monitoring (the in-year check of spending against budget) forecasts an overspend of \u00a33.647m for 2026/27 as at 30 June. That figure includes proposed use of \u00a325m of support, with final approval conditional on the external audit being completed at year end. Looked after children placements account for \u00a33.139m, driven by residential homes, especially for 12 to 14-year-olds. The paper says new entries to care are at their slowest rate in two years, excluding the effects of Yarl's Wood. Four social workers joined in mid-August, and the council is working to move children from residential to foster care. Housing benefit lost \u00a31.817m in subsidy, mostly on supported exempt accommodation (\u00a31.185m, 47% of benefit paid) because government rates have not kept pace with market rents. The council is lobbying MPs and the Local Government Association.\n\nThe council's medium-term plan shows gaps of \u00a332.1m in 2027/28, then \u00a38.0m, \u00a33.9m and \u00a34.4m, \u00a348.4m in all by 2030/31. In June the Executive committed to using no more than \u00a310m of support beyond 2027/28, aiming to end reliance on it. Savings targets are set for each directorate, and preparation of the 2027/28 budget has been brought forward.\n\nThe Head of Audit, Insurance and Risk rates the council's governance and internal controls \"Reasonable\", with weaknesses limited to specific services. Five audits (16%) got limited assurance, against 58% with full or substantial assurance. Ofsted and the Care Quality Commission both rated children's and adults' services \"requiring improvement\", and improvement boards have been set up. The 2024/25 accounts again received a disclaimer of opinion, which the report attributes to the previous auditor's lack of capacity.","url":"https://councillorsupport.bedford.gov.uk/documents/s82098/82098.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000055","council":"Bedford UA","tag":"EFS","figures":"\u00a317.7 million overspend; \u00a322 million exceptional support 2025/26; \u00a358 million for 2026/27 balanced budget","quote":"During 2025/26, the Council continued to experience significant financial pressures culminating in a budget overspend of \u00a317.7 million. This was largely driven by increased costs of Children's External Placements and Adult Social Care... The Council received Exceptional Financial Support from MHCLG of \u00a322 million for 2025/26 and \u00a358 million to enable a balanced budget to be set for 2026/27.","paper":"Item 14 Audit Committee Annual Report for Full Council - 2025-26","committee":"Full Council"},{"lane":"ours","source":"Cheshire East UA","title":"Cheshire East's 2026/27 budget relies on \u00a324.995m of government-approved support; Place plans target \u00a315m of sales","summary":"Cheshire East Council balanced its 2026/27 budget using \u00a324.995m of exceptional financial support (EFS), government permission to borrow or sell assets to cover day-to-day spending, which is a last resort. The support comes through a capitalisation direction, which lets the council treat day-to-day spending as if it were capital spending, and is part of its medium-term financial strategy to 2030. The figures are in the first-quarter budget forecast before the Place Overview and Scrutiny Committee.\n\nThe papers also set out what the council plans to do about its finances. A Corporate Landlord Programme, approved on 3 September, includes a \u00a315m programme of asset sales and a \u00a320m future asset programme, with extra staff being recruited. The council is also taking what it calls a \"bolder and quicker\" approach at Tatton Park, with \"a stronger emphasis on commercialisation to remove the current subsidy\". It plans to commission a commercial consultancy to draw up a delivery plan, test a heritage operating model with a charitable partner, and review the National Trust lease. The subsidy's size is not given. The park's trading reserve, \u00a30.531m, is fully drawn on vehicle replacement and transformation projects.\n\nSome income targets are falling short. The council expects \u00a30.033m from piloting sales of Biodiversity Net Gain credits against a \u00a31.000m budget. Environmental Services commercialisation is forecast at \u00a30.050m against \u00a30.200m. Parking income of \u00a30.250m and advertising income of \u00a30.075m are marked non-deliverable. Housing forecasts a \u00a30.700m pressure on temporary accommodation, no longer funded by government grant. Highways and Transport forecasts an overspend of \u00a30.099m, with highway contract costs up \u00a31.111m and street lighting energy \u00a30.268m, partly offset by \u00a30.621m from vacancy management and \u00a30.751m of extra income.\n\nCapital financing costs are forecast at \u00a335.152m against a \u00a332.255m budget. The council plans \u00a311.0m of capital receipts (money from asset sales) against \u00a32.677m last year, and says it must keep transforming its capital programme to cut the need to borrow. In waste, a recovery plan for missed collections is monitored fortnightly, and recruiting 13 permanent drivers is the key risk to the new food waste service.","url":"https://moderngov.cheshireeast.gov.uk/documents/s136676/136676.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m capitalisation direction","quote":"The budget was balanced, as required by statute, with planned use of EFS, by way of a capitalisation direction, totalling \u00a324.995m.","paper":"2026/27 Budget \u2013 Quarter 1 Forecast OutturnCabinet and Committee Report Template","committee":"Place Overview and Scrutiny Committee"},{"lane":"ours","source":"Derby City UA","title":"Derby's \u00a335m Market Hall came in on budget, but its first-year net cost ran above forecast","summary":"Derby City Council's \u00a335m refurbishment of the Grade II* listed Market Hall was delivered within its approved budget and opened in May 2025, a commercial review before Cabinet on 7 October says. In its first year of trading, though, the hall's net cost was higher than budgeted.\n\nThe paper says the cause was \"lower than expected rental and commercial income and higher event spend\". The business case had forecast a deficit of \u00a3523,000 in the first year, falling to \u00a3107,000 by year three. The review does not give the actual first-year figure. It also cites rent incentives offered to attract traders.\n\nVisitor numbers are strong: an average of 16,000 people a week in November 2025, and 51,000 over Christmas 2025. Opening-day occupancy targets of 50% for non-food stalls and 100% for food stalls were met. Trader turnover since then has been higher than expected, with under-occupancy in some areas and an imbalanced trader mix. The paper says the operation \"is currently more reliant on subsidy than originally envisaged\".\n\nThe review also says systems for billing rent, utilities and storage charges were not fully in place at the outset. Monthly billing and a regular finance meeting are now in place. It suggests the original model's allowance for unpaid bills was set low for the early years. It recommends soft market testing and a structured appraisal of in-house, hybrid and outsourced operating models, alongside a time-limited \"prove and review\" period for an improved in-house model.\n\nElsewhere on the agenda, Cabinet is asked to approve a 10-year framework for care home placements, valued at \u00a3447.2m. In 2025/26 the council supported 1,287 people in 221 care homes at a net cost of \u00a344.7m. New premiums of 8.7% for residential dementia care and 9.5% for nursing dementia care will apply. The council says no extra funding is sought.","url":"https://democracy.derby.gov.uk/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=o4lzpTG9Bi3E5Sf4ggrAgoyeg9%2fddy%2fcTwVeZkpSqRlsiRAoKAZkNg%3d%3d&amp;rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&amp;mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&amp;kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&amp;uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&amp;FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&amp;d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&amp;WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&amp;WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d","iso":"2026-10-02T09:00:00+00:00","gss":"E06000015","council":"Derby City UA","tag":"capitalisation","figures":"Impairment and write-back impact c.\u00a351.407m","quote":"requires current estimates indicating an impairment and write-back impact for the City Council of approximately \u00a351.407m...The Director of Finance and Section 151 Officer is required to seek a Capitalisation Directive","paper":"Item 12 Appendix 1 - Commercial Review","committee":"Council Cabinet"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock adult social care forecasts \u00a34.842m pressure; children's services has delivered \u00a33.2m of savings","summary":"Thurrock Council's adult social care and public health directorate is forecasting a \u00a34.842m overspend for 2026/27 at the end of the first quarter, even after applying \u00a39.579m of one-off reserves (money set aside for a named purpose). The figures are in budget monitoring papers for the Corporate Overview and Scrutiny Committee on 8 October.\n\nThe papers attribute the pressure to rising care costs and complexity of need, particularly in learning disabilities, where external placements are \u00a32.719m over. Of the directorate's \u00a33.97m savings target, \u00a3750,000 is forecast to be delivered, all of it from public health. A \u00a31.5m \"smarter commissioning\" saving is not materialising, and other initiatives are \"yet to be finalised\". The directorate is drawing up a resilience plan to reach a broadly balanced position by year end, but implementation has not begun.\n\nChildren's services has delivered its full \u00a33.2m savings target, including \u00a31.5m from reviewing placements, with six children moved to alternative provision so far. A cut in the employer contribution to the Local Government Pension Scheme from 20.8% to 18.8% has saved \u00a31.513m. Homelessness is forecast \u00a30.067m under budget and on track for its \u00a3995,000 saving, with temporary accommodation placements planned to fall from 645 in April to 487 by March.\n\nIn Place, \u00a30.557m of the \u00a32.990m savings target is at risk, including all \u00a3143,428 expected from commercial waste income. A \u00a31m saving from consolidating third-party spend has \u00a323,000 identified so far.\n\nThe dedicated schools grant (the government grant that funds schools) is forecast to overspend by \u00a310.307m, 13% of its \u00a378.560m allocation, on support for children with special needs. Government will cover 90% of the deficit built up to March 2026; Thurrock's 10% share totals \u00a32.739m over three years. The papers project the deficit reaching \u00a342.530m by 2028/29.","url":"https://thurrock.moderngov.co.uk/documents/s54724/54724.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"N/A","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential to improve delivery","paper":"Appendix 1 - Revenue Budget Commentary","committee":"Corporate Overview and Scrutiny Committee"},{"lane":"ours","source":"The West Yorkshire Combined Authority","title":"West Yorkshire reports 27 of 91 outstanding audit recommendations overdue, 46 on track","summary":"Twenty-seven of the 91 outstanding internal audit recommendations at West Yorkshire are overdue, according to a follow-up report for the Governance and Audit Committee on 8 October. Internal audit is the council's in-house check on its own controls. The report puts 46 actions on track with no issues and 18 with a revised date or concerns about delivery.\n\nThe report says the total number of recommendations has fallen but the number of older ones has risen. Two risk-management actions have moved back: a condensed risk register template from 30 September 2026 to 31 December 2027, and automated risk reporting from 31 March 2027 to 31 March 2028. The paper says the automated version cannot be built until the template has been tested and approved. Debt management actions have been delayed by the long-term sickness of the officer responsible; a Financial Controller starts on 12 October and will take them on. In People and Transformation, four consecutive directorate outcome board meetings took place without finance representation. The directorate did not accept three recommendations, citing finance resources, and audit has rebutted its responses. A review of the Climate and Environment Plan has been completed but not yet followed up.\n\nInternal audit's own plan is also behind. Delivery stands at 20% against a 30% target for the end of September, which the paper says is unlikely to be met because of staff absences and slow filling of vacancies. The 50% target for January is \"at risk\", though 43% of the work is under way or complete. The team's most significant findings concern human resources time recording and purchase card policy, and recommendations have been made.\n\nA separate treasury management report, covering how the council manages its borrowing and spare cash, shows net investments up \u00a3464m in the first quarter, from \u00a3567m to \u00a31,031m. The paper says new Integrated Settlement funding arrangements now deliver money at the start of the year rather than in instalments. Following a short-term borrowing requirement, the council is reviewing its cashflow forecasting and investment strategy ahead of expected property transactions in 2026/27.","url":"https://westyorkshire.moderngov.co.uk/documents/s45838/45838.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E47000003","council":"The West Yorkshire Combined Authority","tag":"audit opinion","figures":"2025/26 proposed scale fee \u00a3264,270 (TBC); 2024/25 scale fee \u00a3237,072 reduced by \u00a384,086 to \u00a3152,986 paid; additional non-audit work \u00a310,000","quote":"Where an auditor is required to undertake substantially more or less work to deliver their responsibilities a fee variation may be proposed which is subject to approval by PSAA. When we have completed the 2025/26 audit, PSAA will again determine the level of fees payable for 2025/26.","paper":"10. Quarterly Internal Audit Progress Update","committee":"Governance & Audit Committee"},{"lane":"ours","source":"Derbyshire CC","title":"Derbyshire forecasts \u00a31.183m underspend on \u00a3820.425m budget, with 91% of 2026-27 savings expected","summary":"Derbyshire County Council is forecasting a net underspend of \u00a31.183m against its \u00a3820.425m day-to-day budget (revenue spending) for 2026-27, according to first-quarter budget monitoring, the in-year check of spending against budget, presented to Cabinet on 10 September. The council expects to deliver 91% of its planned savings in the year.\n\nThe savings programme, the cuts and efficiencies the council has committed to in order to balance its budget, totals \u00a330.863m. By the September report, \u00a33.488m (11%) had been delivered. A further \u00a322.062m (72%) is rated green, expected to be delivered; \u00a32.854m (9%) is amber and \u00a32.328m (8%) is red, not expected to be delivered. The red items are \u00a31.500m from Adult Care's further direct care transformation, \u00a30.533m from a review of the Children's Services educational psychology service and \u00a30.295m from Human Resources team efficiency.\n\nAdult Care carries the largest share of the programme: \u00a313.475m, 44% of the total, of which \u00a31.681m has been delivered. The Environment portfolio's largest line, \u00a36.7m of Extended Producer Responsibility income, is described in the papers as \"not a saving but additional income\". It is rated green, with nothing yet received. In Council Efficiency, \u00a30.106m of unachieved savings from last year and \u00a30.150m still to be found through finance restructures are both rated amber.\n\nElsewhere, the Communities and Safety portfolio forecasts spending \u00a37.106m against a \u00a37.841m controllable budget, an underspend of \u00a30.735m, largely from vacancies in prevention, needs and intelligence, and community safety. Its Public Health Grant reserve opened the year at \u00a37.608m, just under 14% of the \u00a355.5m annual grant; the limit is 20%.\n\nPressures are reported too. The backlog of open assessments for Education, Health and Care plans, the legal documents setting out support for children with special needs, stands at 1,600, and only 20% were issued within the 20-week statutory timescale in the quarter. The paper says throughput is improving but \"not yet enough\" to reduce the backlog. Regeneration schemes with revised timescales and rising costs have put the economic growth objective at \"review\". A \"rapid review\" of the Derby and Derbyshire Waste Treatment Centre will go to Cabinet later this year. The government announced on 16 July two new unitary councils, which run all local services in their area, for North and South Derbyshire.","url":"https://derbyshire.moderngov.co.uk/documents/s36258/36258.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E10000007","council":"Derbyshire CC","tag":"DSG / SEND","figures":"\u00a379.044m overspend, \u00a3127.479m budget, \u00a3206.523m forecast, 7.6% growth to 9,063 EHCPs, \u00a361.744m prior-year above-grant allocation, \u00a36.670m grant increase","quote":"The current forecast is \u00a3206.523m against a \u00a3127.479m budget, giving a \u00a379.044m overspend, driven by continuing demand, capacity constraints and increased use of higher-cost independent and non-maintained placements, alongside special-school, mainstream and post-16 pressures.","paper":"Appendix 2 Performance Against the Council Plan, 10/09/2026 Cabinet","committee":"Council"},{"lane":"ours","source":"Kirklees","title":"Kirklees Cabinet papers show \u00a324.0m gap in 2027/28 budget and \u00a337.9m cut from capital plan","summary":"Kirklees Council faces a gap of \u00a324.0m in its 2027/28 budget, according to the medium-term financial strategy (MTFS, its financial plan for the next five years) before Cabinet on 6 October. Forecast spending needs of \u00a3532.3m compare with available funding of \u00a3508.3m, a gap equal to 4.5% of the available budget. The paper says it must be closed \"at pace\" by reducing budget pressures or bringing forward more savings.\n\nThe strategy forecasts a deficit in every year to 2031/32, reaching \u00a367.8m cumulatively. That assumes council tax rises of 4.99% a year, the maximum allowed, and includes contributions to rebuild reserves (money put aside). Annual deficits are \u00a324.0m, \u00a39.3m, \u00a38.5m, \u00a315.6m and \u00a310.4m.\n\nThis year, the first-quarter check of spending against budget forecasts an overspend of \u00a313.6m after \u00a35.2m from the Strategic Budget Contingency Reserve. If it persists, unallocated reserves could fall below the \u00a326m minimum working balance set with the budget. The council is using recruitment freezes, agency spend reviews and possible stops to non-priority spending. The Service Director Finance says these actions remain necessary to avoid a section 114 notice, a formal warning that the council cannot balance its budget.\n\nThe council has begun cutting its capital programme, its planned spending on things that last, by \u00a337.9m to reduce forecast debt. Phase 5 of Our Cultural Heart, \"The Venue\", comes out after over \u00a367m of funding was lost over two years and the remaining c\u00a323m was judged \"clearly insufficient\". The Huddersfield District Heat Network is paused pending clarification of viability and funding. Both go on a \"Pipeline\" list for later review.\n\nElsewhere, the annual deficit on high needs funding for children with special educational needs fell by \u00a33m to \u00a317m in 2025/26. The cumulative deficit stands at \u00a382.2m. The council has also set \u00a34m-a-year targets for asset sales from 2026/27 to 2029/30, after raising \u00a37.5m in 2025/26. The council also says it has received equal pay claims from unions, which it cannot yet put a figure on.","url":"https://democracy.kirklees.gov.uk/documents/s77626/77626.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E08000034","council":"Kirklees","tag":"DSG / SEND","figures":"\u00a382.2m cumulative deficit at 31 March 2026; c\u00a313m General Fund cost over 2026/27-2027/28; \u00a33.4m p.a. treasury servicing; annual deficit \u00a317m in 2025/26 (\u00a33m improvement)","quote":"cumulative High Needs Block Deficit was \u00a382.2m. Progress is being made in Kirklees with a reduction in the annual deficit in 2025/26 being some \u00a33m lower at \u00a317m than the previous year","paper":"MTFS Combined Report v3","committee":"Cabinet"},{"lane":"ours","source":"Sutton","title":"Sutton's budget gap forecast at \u00a313.6m for 2027/28, rising to \u00a336.5m by 2029/30","summary":"Sutton Council expects a gap between spending and income of \u00a313.6m in 2027/28, rising to \u00a336.5m by 2029/30, according to papers for the Strategy and Resources Committee on 5 October. The medium-term financial strategy (MTFS), the council's plan for the next three to five years, says the gap \"will need to be closed\". The 2026/27 net budget is \u00a3222.6m.\n\nThe papers say the new government funding formula cuts the council's core spending power, the government's measure of its funding, by 9.3%, despite an 8.1% cash increase in the December 2025 three-year settlement. Government grants fall by \u00a32.4m in 2027/28 and a further \u00a33.2m in 2028/29. Adult social care packages costing \u00a32,000 or more have risen from 67 to 87 clients this year, and the plan allows \u00a33.0m to \u00a33.6m of annual growth in that service. Temporary accommodation now costs \u00a35.5m a year, with costs up 75% over the previous strategy period.\n\nThe papers also record savings already made. Agency spending fell from \u00a312.6m in 2021/22 to \u00a310.4m in 2025/26, with agency workers down from about 270 to 170. Sickness absence fell from 3.9 days per employee in 2022 to 2 days in 2026. In children's social care, looked-after children fell from 228 to 213, external residential placements from 27 to 18, and placements costing over \u00a310,000 a week from two to none by July 2026. The workforce strategy calls a fall in staff aged 16-24, from 6% to 3%, \"an area of concern\", linked to lower recruitment under budget pressure.\n\nThe plan assumes all \u00a313.3m of 2026/27 savings are delivered in full. The general reserve, the cushion for the unexpected, stands at \u00a311.1m, 5% of the budget. The papers call that \"very low compared\" with other councils. The schools-funding deficit, \u00a321.6m, is forecast to grow by \u00a314m. Government will cover 90% of high-needs arrears, leaving the council to meet at least \u00a33.6m. It has budgeted \u00a30.5m towards this in 2027/28 and \u00a32m in 2028/29.","url":"https://sutton.moderngov.co.uk/documents/s97290/97290.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000029","council":"Sutton","tag":"DSG / SEND","figures":"Accumulated deficit: \u00a321.6m rising to \u00a335.6m; council share: at least \u00a33.6m; government funding: 90% (up to ~\u00a332m); reserve contributions: \u00a30.5m (2027/28), \u00a32m (2028/29)","quote":"accumulated deficit at was \u00a321.6m and is forecast to further \u00a314m in","paper":"Appendix B - Workforce Strategy 2027-32","committee":"Strategy and Resources Committee"},{"lane":"ours","source":"Middlesbrough UA","title":"Unrestricted reserves would fall to negative balance by 2029/30 if provisional budget gap is not closed by permanent recurring measures, triggering Section 114 notice","summary":"The Council held \u00a325.530m unrestricted reserves at 31 March 2026. If the forecast budget gaps are covered by reserves rather than solved through permanent measures, the usable unrestricted balance would deplete to (\u00a30.2m) negative by 2029/30.","url":"https://moderngov.middlesbrough.gov.uk/documents/s45328/45328.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000002","council":"Middlesbrough UA","tag":"s114 risk","figures":"Reserves at 31 March 2026: \u00a325.530m; forecast negative balance: (\u00a30.2m) by 2029/30","quote":"If the current forecast provisional budget gap for each year of the MTFP shown in Table 2 is not solved by permanent recurring measures then the level of Usable, Unrestricted Reserves would fall from \u00a325.5m at the end of 2025/26, to a negative balance of (\u00a30.2m) in 2029/30, i.e. all usable unrestricted reserves would be exhausted by 2029/30 and in that case the s151 Officer would be forced to issue a S114 notice","paper":"Report","committee":"Executive"},{"lane":"ours","source":"Runnymede","title":"Council maintained under-borrowed position in Q1, using \u00a389.1m of reserves and cash rather than external borrowing","summary":"No new borrowing was undertaken in the quarter. The Council deliberately did not access the PWLB or money markets, instead using its own reserves and cash balances to support operations. Total borrowings fell by \u00a3306k to \u00a3586,808k, while the Capital Financing Requirement (borrowing need) remained at \u00a3672.931m. This strategy avoids external borrowing costs but commits reserves to internal financing.","url":"https://runnymede.moderngov.co.uk/documents/s18967/18967.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"borrowing","figures":"Investments held \u00a389.1m; total borrowings \u00a3586,808k (down from \u00a3587,114k); CFR \u00a3672,931k; under-borrowing of \u00a386,123k","quote":"No new borrowing was undertaken during the quarter meaning that the Council continued to maintain an under-borrowed position. This meant that the capital borrowing need, the CFR, was not fully funded with loan debt, as cash supporting the Council's reserves, balances and cash flow was used as an interim measure in the high interest rates environment and the period of low capital spend.","paper":"2026-27 Q1 Treasury Management Report v1 - Final","committee":"Overview and Scrutiny Select Committee"},{"lane":"ours","source":"Blackburn with Darwen UA","title":"Blackburn with Darwen plans to close \u00a38.97m 2027/28 gap with savings, debt recovery and \u00a33m of reserves","summary":"Blackburn with Darwen Council has set out how it intends to close a forecast funding gap of \u00a38.971m in 2027/28, in an update to its medium-term financial strategy (the three-to-five-year plan showing the gap between expected spending and expected income) for the Executive Board on 8 October. The plan proposes \u00a34.471m of savings from portfolio budgets, \u00a31.5m from debt recovery and collection fund improvements, and \u00a33.0m from the Budget Support Reserve.\n\nThe gap is forecast to grow to \u00a311.433m in 2028/29 and \u00a315.177m in 2029/30. The paper does not say how those later gaps will be closed. The 2026/27 budget balances only through \u00a38.88m taken from reserves (money the council has put aside), including \u00a32m from the Invest to Save Reserve. The Budget Support Reserve falls from \u00a313.9m to \u00a311.9m this year and to \u00a38.9m by March 2028, where it then holds. Total reserves fall from \u00a3102.9m to \u00a383.7m by March 2030, almost all of it in the first two years.\n\nQuarter 1 budget monitoring (the in-year check of spending against budget) forecasts a \u00a31.982m overspend for 2026/27: a \u00a32.982m overspend on portfolio budgets, partly offset by \u00a31.0m more investment income than budgeted. That comes despite \u00a34.5m of permanent savings agreed for the year. If it holds to year end, reserves would be drawn on to balance the budget.\n\nSeveral lines in the plan change shape. Debt charges rise from \u00a317.4m to \u00a324.6m by 2029/30. The \u00a310.3m LA Better Care Grant and an \u00a38.5m revenue contribution to capital spending (money spent on things that last) appear in 2026/27 but not afterwards. Contingencies rise from \u00a33.8m to \u00a316.5m.\n\nOn schools, the high needs part of the dedicated schools grant (funding for children with special educational needs) went into deficit for the first time, by \u00a35.094m, at 31 March 2026. Without government action it could reach about \u00a333m by March 2028, when the statutory override (the rule keeping such deficits off the main balance sheet) expires. The council expects about \u00a34.585m in High Needs Stability Grant and has raised a shadow reserve from \u00a31.0m to \u00a33.3m to cover its share.","url":"https://blackburn.moderngov.co.uk/documents/s37523/37523.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000008","council":"Blackburn with Darwen UA","tag":"reserves","figures":"Budget Support Reserve: \u00a313,914k opening balance (31-Mar-26); \u00a31,981k used to balance 2026/27; \u00a311,933k forecast (31-Mar-27); \u00a33,000k planned drawdown for 2027/28; \u00a38,933k forecast (31-Mar-28 through 31-Mar-30)","quote":"Budget Support Reserve | 13,914 | - | - | (1,981) | 11,933 | (3,000) | 8,933 | - | 8,933 | - | 8,933","paper":"Appendix 1 for Update to Medium Term Financial Plan 2027/30","committee":"Executive Board"},{"lane":"ours","source":"Waltham Forest","title":"Waltham Forest's three-year budget gap put at \u00a347.7m, up from \u00a323.9m in February; support need cut to \u00a36.4m","summary":"Waltham Forest Council's Cabinet is being asked to note a revised medium-term financial strategy (MTFS, the plan showing the gap between expected spending and expected funding over the next few years) that puts the shortfall at \u00a347.709m over the three years to March 2030. In February the council forecast a gap of \u00a323.927m for 2027/28 and 2028/29 alone. The revision reflects service pressures of \u00a319.901m at Month 3 of the current year, new demand pressures of \u00a325.3m over three years and \u00a318.5m of extra inflation costs.\n\nOver the same period the council's need for exceptional financial support (EFS, government permission to borrow to cover day-to-day spending) in 2026/27 has fallen. The Month 3 budget check forecasts \u00a36.4m, against \u00a319m agreed in principle in February. The paper attributes this to an extra \u00a33.8m from the Ministry of Housing, Communities and Local Government, \u00a35.7m of new savings found in-year and net underspends in corporate balances. It says the figure is \"subject to new pressures emerging by year end.\"\n\nThe largest pressures are in housing and care. Place directorate forecasts an \u00a311.883m overspend, mainly on temporary accommodation. Fewer households have been placed in recent months, but the paper says costs have not yet fallen with them because of high prices and limited supply. Adult social care forecasts a \u00a37.521m overspend: spending on external placements rose 21% in two years, from \u00a394.7m to \u00a3114.6m, while client numbers rose 7.4%. In schools funding, the high needs deficit (the overspend on support for children with special educational needs) is forecast at \u00a312.241m in-year, taking the cumulative deficit to \u00a326.562m. A \u00a312.889m High Needs Stability grant, subject to approval of the council's SEND Reform Plan, would leave \u00a313.673m to carry into 2027/28.\n\nThe strategy assumes \u00a342m of previously approved savings are delivered, though \u00a39.515m is expected to be delayed beyond the end of 2027/28 and \u00a33.489m not delivered at all. The \u00a322m of flexible capital receipts (money from asset sales that can fund transformation) will be fully used by the end of 2027/28. Inflation for 2027/28 and 2028/29 is now assumed at 3%, not 2%. The gap ranges from \u00a331.717m to \u00a360.432m under optimistic and pessimistic assumptions. The council holds central reserves of \u00a327.9m and a general working balance of \u00a314.9m, and the strategy assumes neither is drawn on.","url":"https://walthamforest.moderngov.co.uk/documents/s111274/111274.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000031","council":"Waltham Forest","tag":"overspend","figures":"\u00a347.709m (from \u00a323.927m in February 2026); Month 3 in-year overspend \u00a319.901m; new service demand pressures \u00a325.3m; additional inflation \u00a318.5m","quote":"The revised MTFS position is now indicating a total funding gap of \u00a347.709m over the 3-year period to March 2029/30 but assumes that \u00a342m of savings included within the 2026/27 MTFS will be delivered, subject to some reprofiling.","paper":"Medium Term Financial Strategy 2026 27 - Cabinet report","committee":"Cabinet"},{"lane":"ours","source":"Worthing","title":"Adur District Council systematically replaced \u00a325.3m of PWLB debt with \u00a320.9m of temporary inter-council borrowing at rates of 4.00% to 5.50%.","summary":"PWLB holdings fell from \u00a3165.143m to \u00a3139.855m whilst other borrowing rose from \u00a320.431m to \u00a341.283m. The new loans were sourced from other councils and fire authorities, mostly maturing within 12 months, at rates above the PWLB cost. This pivot toward expensive short-term funding likely reflects confidence in near-term capital receipts or a strategic decision to await better refinancing rates.","url":"https://democracy.adur-worthing.gov.uk/documents/s17588/17588.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E07000229","council":"Worthing","tag":"refinancing","figures":"PWLB reduced \u00a325.288m; other borrowing increased \u00a320.852m; new rates 4.00\u20135.50%; maturity range 12 months to 12 months (mostly under 1 year)","quote":"The following fixed interest rate loans were taken during the year: The London Treasury Liquidity Fund \u00a35m HRA 4.45% 17/12/2026; North Northamptonshire \u00a35m HRA 4.50% 03/07/2026; Merseyside Fire & Rescue Service \u00a33m HRA 4.00% 22/05/2026","paper":"Annual Treasury Management Report 25-26","committee":"Joint Strategic Committee"},{"lane":"markets","source":"City AM","title":"IG shares plunge as it slashes revenue forecast","url":"https://www.cityam.com/ig-shares-plunge-as-it-slashes-revenue-forecast/","summary":"IG\u2019s shares plunged in early morning trading on Friday after it was forced to cut its annual revenue forecast. The spread betting company saw its share drop 26 per cent to 950p per share. Shares are down 23.7 per cent since January. The sharp fall follows the group\u2019s revenue falling 14 per cent year on [...]","iso":"2026-10-02T08:25:12+00:00"},{"lane":"markets","source":"BBC business","title":"Why are minimum alcohol prices going up?","url":"https://www.bbc.co.uk/news/videos/cm2dwd97repyo?at_medium=RSS&at_campaign=rss","summary":"The minimum price of alcohol (MUP) in Wales has risen by 30%.","iso":"2026-10-02T08:23:31+00:00"},{"lane":"markets","source":"BBC business","title":"OpenAI fires workers for 'mishandling sensitive information'","url":"https://www.bbc.co.uk/news/articles/c6y9z9r4ejzwo?at_medium=RSS&at_campaign=rss","summary":"The former employees were investigated for sharing data with an outside AI evaluation group.","iso":"2026-10-02T08:20:32+00:00"},{"lane":"markets","source":"Guardian business","title":"World food prices hit near four-year high as heatwaves and El Ni\u00f1o hit farmers \u2013 business live","url":"https://www.theguardian.com/business/live/2026/oct/02/french-bond-sell-off-euro-crisis-cuts-tax-rises-eurozone-inflation-us-jobs-report-latest-news-updates","summary":"<p>Rolling coverage of the latest economic and financial news</p><p><strong>Newsflash: World food prices rose in Se
