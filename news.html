<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

<script>
const DATA = {"generated":"2026-09-23T06:37:12.351607+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":5,"councils":14,"policy":25,"markets":35},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":6,"hm-treasury":2,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"_":"no key"},"items":[{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Lambeth","title":"Lambeth still forecasts \u00a39.3m overspend despite \u00a3116m emergency government bailout","summary":"Lambeth Cabinet heard on 23 September that despite receiving \u00a3116m exceptional financial support (emergency government borrowing to cover day-to-day spending that cannot be balanced from council finances) in February, the council is forecasting a \u00a39.303m General Fund overspend for 2026-27. The council's single largest income failure is parking revenue, tracking at only \u00a30.5m against a \u00a36.7m target due to paused schemes and reduced compliance. Growth and Environment is forecasting an \u00a38.6m overspend driven by \u00a310m income shortfalls across parks events, markets, CCTV and sports facilities. The council remains under increased scrutiny from the Ministry of Housing, Communities and Local Government, including an independent review by accountancy firm CIPFA, with explicit government expectation that assets should be disposed of to repay the emergency support.","url":"https://moderngov.lambeth.gov.uk/documents/s179274/179274.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000022","council":"Lambeth","tag":"EFS","figures":"\u00a3116m EFS (General Fund), \u00a340m EFS (HRA); annual borrowing costs \u00a37.4m rising to \u00a38.4m from EFS funding","quote":"It is emphasised that as an EFS council, we will be under increased scrutiny from MHCLG as part of this an independent third-party review is currently being undertaken by CIPFA. Furthermore, we expect quarterly meetings with MHCLG to report on our progress in returning to a financially sustainable position.","paper":"Quarter 1 Budget Monitor 2026-27","committee":"Cabinet"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"EFS","figures":"\u00a31.497bn total General Fund debt; \u00a31.1bn overhanging debt; \u00a3545m from commercial ventures; \u00a3526m from EFS to date; \u00a3540m write-off requested","quote":"There are no assets attached to it: it was either incurred in pursuit of unsuccessful commercial ventures (\u00a3545m) or to fund the EFS that was a consequence of those (\u00a3526m to date).","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"ours","source":"Greenwich","title":"Greenwich misses nearly a quarter of planned savings, with delivery problems outweighing timing delays","summary":"Greenwich has failed to deliver nearly a quarter of its \u00a343.5m planned savings for 2026/27, with structural delivery failures accounting for more of the gap than timing slips. The council forecasts \u00a333.6m of savings will materialise, leaving \u00a39.9m unachieved. Of this shortfall, \u00a34.3m (43 per cent) stems from initiatives proving harder to deliver than expected, while \u00a35.0m (50 per cent) relates to timing delays expected to recover later. The shortfall comes amid mounting pressure on day-to-day budgets: adult social care unit costs have risen 12 per cent on residential placements and up to 42 per cent on some mental health packages; plans for children with special educational needs have grown from 3,626 to 4,060, creating a \u00a327.0m deficit on school funding; and demand management programmes are delivering only 74 per cent of target. The council is drawing \u00a36.1m from reserves to support recurring pressures, a step its finance director says \"is not sustainable\".","url":"https://committees.royalgreenwich.gov.uk/documents/s20827/20827.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000011","council":"Greenwich","tag":"DSG / SEND","figures":"DSG budgeted \u00a30.0m, forecast \u00a327.0m deficit, variance \u00a327.0m","quote":"Dedicated Schools Grant (DSG)  (294.2)  294.2 0.0 27.0 27.0","paper":"Appendix A 202526 MTFS Savings Outturn and Performance Analysis","committee":"Cabinet"},{"lane":"ours","source":"Brent","title":"Brent Council audit finds value for money concerns and accounting errors across \u00a3914m asset portfolio","summary":"Grant Thornton has identified two risks of significant weaknesses in Brent Council's arrangements for managing money and delivering value for money, the auditor's draft report to the council's Audit and Standards Advisory Committee shows. The weaknesses emerged alongside material accounting errors in the council's property valuations. Land and buildings were overstated by \u00a37.3m and council dwellings understated by \u00a36.5m due to incomplete valuation indices, while \u00a319.2m of operational assets were reclassified as surplus, reducing the council's core service capacity. The auditor also found the council departed from accounting standards by failing to conduct mandatory desktop valuations on \u00a310.4m of assets. Grant Thornton said similar indexation errors could accumulate over successive years and become material. The audit remains incomplete pending resolution of several outstanding matters, including council tax enforcement objections and bank confirmations from Danske Bank.","url":"https://democracy.brent.gov.uk/documents/s159907/159907.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000005","council":"Brent","tag":"DSG / SEND","figures":"\u00a320.2m cumulative DSG deficit; High Needs Stability Grant covers 90% of deficits; \u00a32.1m RSG increase allocated to cover remaining 10%","quote":"The cumulative DSG deficit at the end of 2025-26 rose to \u00a320.2m. Prior to recent government announcements the Council needed to meet deficits from its revenue reserves at the end of 2027-28. Now, the Council is eligible for government support, in the form of the High Needs Stability Grant, supporting up to 90% of deficits at the end of 2025-26.","paper":"10a. Appendix A - LB Brent Draft Audit Findings Report","committee":"Audit and Standards Advisory Committee"},{"lane":"ours","source":"Bath & North East Somerset UA","title":"Bath and North East Somerset faces \u00a346.5m schools funding crisis threatening council reserves","summary":"Bath and North East Somerset's audited accounts for 2025\u201326 received a clean opinion, but the council faces a significant underlying weakness: a \u00a346.5m deficit in dedicated schools grant funding, which pays for schools and support for children with special needs. If unresolved by 31 March 2028, the shortfall may require the council to draw on its reserve cushions, risking the council's medium-to-longer term financial stability. The council is managing the deficit under a Department for Education Safety Valve Agreement, a formal intervention triggered by unsustainable school deficits. Separately, the council's pension fund improved its funding position from 106 per cent to 109 per cent over the past year, moving employers out of deficit, and holds \u00a36.2bn in assets.","url":"https://democracy.bathnes.gov.uk/documents/s94110/94110.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000022","council":"Bath & North East Somerset UA","tag":"DSG / SEND","figures":"Deficit \u00a346.513m (2025/26), increase of \u00a313.717m (41.8%), equivalent to approximately 50% of usable reserves; forecast further deficits \u00a317.2m (2026/27) and \u00a318.8m (2027/28); HNSG expected to cover 90%.","quote":"The deficit increased by \u00a313.717m (41.8%) during 2025/26 to \u00a346.513m, equivalent to around 50% of usable reserves, indicating that current actions have not yet reduced the underlying cause of the deficit, as evidenced by the increase.","paper":"9z Audit Findings Reports &amp; audited Statement of Accounts 202526 Appendix 2","committee":"Audit Committee"},{"lane":"ours","source":"Salford","title":"Salford misses accounts deadline for second year as auditors plan third disclaimer of opinion","summary":"Salford City Council has failed to publish its draft accounts for 2025/26, missing the 30 June statutory deadline by nearly three months. The council faced the same delay last year, when accounts were published on 25 September due to problems valuing its property, plant and equipment (long-lived assets such as buildings). Auditors plan to issue a disclaimer of opinion for the third consecutive year, meaning they will not have completed enough work to confirm the accounts are correct. The council's auditors have identified a new risk of significant weakness in how it manages statutory financial reporting. The council is transitioning to a new financial system during 2026/27, and auditors have engaged specialists to verify that data transfers correctly before the next audit begins.","url":"https://salford.moderngov.co.uk/documents/s97289/97289.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"audit opinion","figures":"Disclaimer of Opinion for 2025/26; Qualified opinion target for 2026/27; Unmodified opinion target for 2028/29","quote":"For 2026/27, rebuilding work will aim to move from Disclaimer of Opinion on the 25/26 financial statements to 'Qualified' audit opinion before moving back to 'unmodified opinion' in 2028/29.","paper":"Salford City Council Audit Progress Report Sept 2026","committee":"Audit and Accounts Committee"},{"lane":"ours","source":"Preston","title":"Preston gets clean audit bill but auditors warn council to plan for budget gap ahead","summary":"Grant Thornton has issued an unqualified opinion on Preston's 2024/25 accounts, meaning the council's financial statements are without material concern. However, the external auditors have recommended the council develop savings plans to manage budget gaps identified in its Medium Term Financial Strategy, the three-to-five-year spending plan. The auditors specifically warn against relying on money set aside in reserves to cover the shortfall, citing the need for the council to remain financially sustainable. The council's Audit Committee received the recommendation at its meeting on 23 September.","url":"https://preston.moderngov.co.uk/documents/s62366/62366.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E07000123","council":"Preston","tag":"audit opinion","figures":"Opinion issued 18 February 2026; 2025/26 deadline 31 January 2027","quote":"Grant Thornton completed the audit of the 2024/25 financial statements and issued an unqualified opinion on the Council's financial statements for 2024/25 on 18 February 2026.","paper":"Internal Audit Progress report","committee":"Audit Committee"},{"lane":"ours","source":"Burnley","title":"Burnley council draws down reserves at sharp pace as unidentified savings threaten budget","summary":"Burnley council drew \u00a34.979m from its reserves in the first quarter of 2026/27, reducing its earmarked reserves from \u00a324.339m to \u00a319.360m in three months. The council is drawing on its money set aside for known future needs because it is funding capital schemes\u2014buildings, roads and equipment\u2014through internal borrowing, using its own cash instead of taking bank loans to save on interest. However, the papers show this approach's sustainability \"remains under continual review\". At the same time, the council has identified only \u00a383k of the \u00a3259k in budgeted savings it committed to deliver this year, leaving \u00a3176k unaccounted for. The council's own papers state that current economic pressures \"may threaten the achievement of these targets\". If those savings are not found, the council's forecast break-even position will not materialise, and reserves will deplete faster still.","url":"https://burnley.moderngov.co.uk/documents/s51968/51968.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E07000117","council":"Burnley","tag":"borrowing","figures":"Total borrowing Q1: \u00a362.670m; Capital budget increase: \u00a324.832m \u2192 \u00a331.025m; Borrowing need increase: \u00a38.442m \u2192 \u00a39.261m","quote":"with existing Treasury Limits for borrowing, notably the Operational Boundary and Authorised Limit, still deemed prudent, given the Council maintains an under-borrowed position.","paper":"Revenue Monitoring Q1 2627 Revenue Report","committee":"Full Council"},{"lane":"ours","source":"Greenwich","title":"Greenwich Council repays \u00a351m debt while planning shift to major borrowing","summary":"Greenwich Council repaid \u00a351 million in government loans (Public Works Loan Board debt) in the first four months of this financial year, continuing to reduce its borrowing costs by using its own cash reserves instead of taking new loans. However, the council's treasury management update shows this strategy is running out of runway. The council projects it will need to borrow \u00a3233 million in the 2027/28 financial year, followed by \u00a3181 million and \u00a3108 million in the two years after \u2014 a marked shift from its current position of having more cash than it needs to cover its long-term commitments. The timing of that borrowing matters: interest rate forecasts have risen due to global uncertainties, which will increase the cost of future loans. The council has made no new borrowing so far this year, concentrating its decisions into the final quarter, when rates may be higher.","url":"https://committees.royalgreenwich.gov.uk/documents/s20897/20897.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000011","council":"Greenwich","tag":"borrowing","figures":"Projected borrowing \u00a3233m (2027/28), \u00a3181m (2028/29), \u00a3108m (2029/30); under-borrowing \u00a3288m at 31 March 2027","quote":"The projected new borrowing requirement is \u00a3233m in 27/28, and \u00a3181m and \u00a3108m for the two years after.","paper":"Treasury Management and Capital Mid-Year Update","committee":"Council"},{"lane":"markets","source":"City AM","title":"Airtel Money confirms plans for multi-billion London IPO","url":"https://www.cityam.com/airtel-money-confirms-plans-for-multi-billion-london-ipo/","summary":"Airtel Money has confirmed plans for a London IPO in what would mark one of the London Stock Exchange\u2019s biggest flotations in years. The African mobile payments business, which is controlled by Indian-owned telecoms group Airtel Africa, is reportedly seeking a valuation at as high as $9bn (\u00a36.8bn). The fintech, which operates via branches and [...]","iso":"2026-09-23T06:23:58+00:00"},{"lane":"markets","source":"City AM","title":"JD Sports bemoans \u2018tough trading\u2019 as US sales slip","url":"https://www.cityam.com/jd-sports-faces-tough-trading-as-us-sales-slip/","summary":"JD Sports has seen revenue and profit slip so far this ye t person not \u2018just another adviser\u2019","url":"https://www.lgcplus.com/lgps/lgps-independent-person-not-just-another-adviser-22-09-2026/","summary":"The new independent person council pension funds have to appoint should not duplicate investment advice, the LGC Investment & Pensions Summit has been told. As part of the government\u2019s Fit for the Future reforms to the Local Government Pension Scheme, pension funds have to appoint\u2026\nThe post LGPS independent person not \u2018just another adviser\u2019 appeared first on Local Government Chronicle (LGC).","iso":"2026-09-22T09:56:38+00:00"},{"lane":"councils","source":"LGC","title":"Five districts sign LGR legal letter despite pause","url":"https://www.lgcplus.com/politics/governance-and-structure/five-districts-sign-lgr-legal-letter-despite-pause-22-09-2026/","summary":"Five districts in Leicestershire have jointly signed a legal action protocol letter, despite the government pausing the local government reorganisation programme. Communities secretary Angela Rayner announced earlier this month that four LGR programmes in Essex, Hampshire, Suffolk and Norfolk have been withdrawn and the remaining\u2026\nThe post Five districts sign LGR legal letter despite pause appeare","iso":"2026-09-22T09:49:12+00:00"},{"lane":"ours","source":"West Berkshire UA","title":"West Berkshire faces depleted reserves and external borrowing spiral, Q1 figures show","summary":"West Berkshire Council's financial position is deteriorating faster than budgeted, with reserves forecast to run out by 2028 and external borrowing projected to reach \u00a3486m by 2029, the council's Q1 financial report reveals. The council is currently overspending by \u00a39.3m against its \u00a3210.9m revenue budget, driven by a \u00a310.3m overspend in Children's Services where residential care placements have surged 27% annually to 36 clients costing \u00a3543,000 each. Though a schools funding deficit is tracking \u00a33.1m better than expected, this gain is insufficient to offset the wider pressure. The council's General Fund Reserve\u2014its financial cushion\u2014is forecast to fall to \u00a31m by year-end, below the level the council's chief finance officer considers sustainable. With cash resources depleting from \u00a347.2m to \u00a31.3m by 2028, the council will exhaust internal reserves and become dependent on external borrowing, exposing it to higher interest rate risks.","url":"https://decisionmaking.westberks.gov.uk/documents/s147933/147933.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000037","council":"West Berkshire UA","tag":"EFS","figures":"MRP 2025/26: \u00a36.6m; MRP 2026/27 Q1 forecast: \u00a37.1m; MRP forecast 2032/33: \u00a315.3m; EFS-related portion: c.\u00a36.7m","quote":"the annual MRP charge is forecast to increase to approximately \u00a315.3m by 2032/33. Of this total, around \u00a36.7m relates to the repayment of borrowing associated with Exceptional Financial Support (EFS)","paper":"7d. Appendix D - Gross and net revenue expenditure by Directorate for 2026_27 Budget vs 2026_27 Q1 Outturn","committee":"Resources and Place Scrutiny Committee"},{"lane":"ours","source":"Cardiff","title":"Cardiff faces higher borrowing costs as cash reserves near limits and interest rates stay elevated","summary":"Cardiff Council must shift from using its own cash to external borrowing just as interest rates remain at four-year highs, the Governance and Audit Committee heard. The council holds \u00a390 million of internal borrowing\u2014money set aside instead of taking loans\u2014against a maximum target of about \u00a3100 million. As this cash declines, it will be forced to borrow externally. The council's entire borrowing strategy assumes interest rates will fall, allowing it to refinance cheaply when loans mature. However, Public Works Loan Board rates\u2014the government's lending arm\u2014ended the year at about 6.5 per cent, the highest in four years. The council notes that expected rate falls \"have not yet materialised\" and the timing \"look increasingly uncertain.\" A separate \u00a318 million of existing bank loans face renewal in 2026/27 at potentially higher rates. The council acknowledged it needs additional treasury resources to manage the resulting complexity.","url":"https://cardiff.moderngov.co.uk/documents/s97126/97126.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"LOBO","figures":"\u00a351m LOBO portfolio at start of year; \u00a328m repaid during year; \u00a318m at call in 2026/27","quote":"Of the remaining \u00a323 million, \u00a318 million of the LOBO loans are subject to the lender having the right to change the rate of interest payable during 2026/27. The Council has the right to refuse the change, triggering early repayment and the need to re-finance. These loans have been in place for some years and with longer term interest rates remaining high, some or all of these loans are likely to be refinanced.","paper":"Item 9.1 - Appendix 1","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Bridgend","title":"Bridgend faces \u00a319.25m refinancing bill as lender raises rate on decades-old loans","summary":"Bridgend Council will repay \u00a319.25 million of bank loans after the lender exercised its right to increase the interest rate from 4.65 per cent to 7.52 per cent, effective 22 July 2026. Rather than accept the higher rate on the LOBO loans\u2014long-term borrowing where lenders may propose rate increases on set dates\u2014the council chose to repay at par and refinance. The repayment comes as the council faces a broader tightening of its financial position. Its underlying need to borrow, the amount it has spent on long-lived assets it has not yet paid for, is forecast to grow from \u00a3182.56 million to \u00a3200.82 million by March 2028 as capital commitments progress. The council is currently using \u00a369.97 million of its own cash reserves to fund capital spending instead of borrowing, a position the treasury report suggests cannot be sustained indefinitely as reserves deplete.","url":"https://democratic.bridgend.gov.uk/documents/s38639/38639.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"W06000013","council":"Bridgend","tag":"LOBO","figures":"\u00a370.58 million forecast borrowing need; \u00a319.25 million LOBO component","quote":"the forecast need to borrow during the year is \u00a370.58 million, although this is likely to reduce as capital expenditure and use of earmarked reserves forecasts are updated during the year. This figure includes the repayment of the LOBO loans of \u00a3 19.25 million, which may need to be refinanced either in total or in part duing the year.","paper":"Treasury Management Report Quarter 1 2026-27","committee":"Cabinet"},{"lane":"ours","source":"Tameside","title":"Tameside complaints upheld at above-average rate, with SEN failures dominating remedies","summary":"The ombudsman upheld complaints against Tameside at a rate of 89% in 2025-26, exceeding the 83% average for similar councils. Eight of the 11 cases where the council paid financial remedy \u2014 totalling \u00a37,850 \u2014 involved failures in children's special educational needs support, including delays in issuing Education, Health and Care Plans and loss of educational provision. The council has committed to adopt the ombudsman's Complaint Handling Code by April 2028, requiring it to respond to complaints within 10 working days instead of the current 20. However, the council met that existing timescale in only 69% of cases in 2025-26, down from 73% the previous year, signalling it may struggle to meet tighter targets without additional investment.","url":"https://tameside.moderngov.co.uk/documents/s211535/211535.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E08000008","council":"Tameside","tag":"LOBO","figures":"\u00a35m LOBO; original coupon 4.5%; proposed rate 6.68%; replacement short-term borrowing at 4.3%; maturity would have been 2054; PWLB alternative was 6.28%","quote":"The \u00a35m Dexia loan originally had an interest rate of 4.5% with an option date every 6 months. When the lender option was exercised, the proposed rate from 16 June 2026 was 6.68%. At the time of the new rate being proposed, replacement PWLB loans with the same duration to 2054 were available at a lower rate of 6.28% for a maturity loan with certainty discount.","paper":"ITEM 7 SWAP Internal Audit Progress Report - September 2026","committee":"Audit Committee"},{"lane":"ours","source":"Medway Towns UA","title":"Medway faces \u00a326.7m current-year overspend and \u00a365m structural deficit dependent on government funding","summary":"Medway Council faces a \u00a326.7m overspend forecast in the current financial year, exceeding its total general reserves of \u00a310.1m, and a structural budget gap of \u00a365.9m in 2027/28 rising to \u00a3359.3m cumulatively across the medium term. The financial plan cannot be balanced without exceptional financial support from government\u2014permission to borrow to cover day-to-day spending\u2014which has not been confirmed for 2027/28. If the government refuses, the Section 151 officer, the council's chief finance officer, may be forced to issue a Section 114 notice, a formal warning that the council cannot balance its budget, which freezes new spending until councillors agree a plan. The Cabinet heard pressures of \u00a338.6m in adult social care and \u00a39.2m in children's services, with adult social care costs having more than doubled since 2020-21.","url":"https://democracy.medway.gov.uk/documents/s91492/91492.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000035","council":"Medway Towns UA","tag":"s114 risk","figures":"\u00a365.858m 2027/28 gap dependent on EFS; EFS already granted for 2025/26 (\u00a39.856m) and agreed in-principle for 2026/27 (total \u00a328.003m borrowed)","quote":"The current MTFO projections cannot be balanced through the use of reserves and assume that further exceptional financial support from Government will be required. There remains a significant risk to the Council's financial resilience should additional support not be forthcoming...In the unlikely event that the MHCLG rejects the Council's latest application for EFS, the Section 151 Officer may be forced to issue a Section 114 notice to the Council.","paper":"Report","committee":"Cabinet"},{"lane":"ours","source":"North Hertfordshire","title":"North Hertfordshire capital plan hit by \u00a34.4m backlog and \u00a33m funding loss","summary":"North Hertfordshire's capital spending plan for 2026/27 has been disrupted by project delays and a significant loss of planned funding. The capital programme is forecast at \u00a313.57m, but \u00a34.4m represents slippage from 2025/26 \u2014 projects originally scheduled for last year that remain incomplete. The council also expected \u00a33m from selling assets, but a review by the estates team has eliminated this funding source: one site will be let rather than sold, and two others cannot be disposed of while securing best value. The loss forces increased internal borrowing \u2014 using the council's own cash reserves instead of loans \u2014 which will increase the minimum revenue provision, money set aside annually for repayment, in future years. Cabinet noted the capital programme requires close monitoring for affordability.","url":"https://democracy.north-herts.gov.uk/documents/s32129/32129.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E07000099","council":"North Hertfordshire","tag":"borrowing","figures":"\u00a33M","quote":"The delay would mean an increase in internal borrowing and the minimum revenue provision in future years until those capital receipts were realised and could be applied as capital funding.","paper":"6B - FAR - First Quarter Revenue Budget Monitoring 2026-27","committee":"Cabinet"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: OSCAR II \u2013 publishing data from the database: September 2026","url":"https://www.gov.uk/government/publications/oscar-ii-publishing-data-from-the-database-september-2026","summary":"The first quarterly OSCAR transparency release for 2026-27.","iso":"2026-09-22T08:30:02+00:00"},{"lane":"policy","source":"HM Treasury","title":"Accredited official statistics: Public sector finances bulletin","url":"https://www.gov.uk/government/statistics/public-sector-finances-bulletin","summary":"The public sector finances statistical bulletin.","iso":"2026-09-22T06:52:50+00:00"},{"lane":"markets","source":"Reuters UK","title":"UK borrowing overshoot darkens backdrop for Healey's budget - Reuters","url":"https://news.google.com/rss/articles/CBMioAFBVV95cUxQZnBHZkZrWjg0UVJnWXozTWJ4NkZGSlM1M3B2Y0ZEdC13WTU4WExqTTB2QzhtUjVZSXhCbndXNVFfMUsyRFE5bl84LXdieVhMUVVLRWpXTVkxUzVkVlI2dW9Rc0hKY0FQVTVSdXFiMmo0TDByMFBKT05Od3ZuNlI5dUQxLWt0RGdyempjVk5xZUpVbjFWcTZPLUlQZ0RCM1pJ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMioAFBVV95cUxQZnBHZkZrWjg0UVJnWXozTWJ4NkZGSlM1M3B2Y0ZEdC13WTU4WExqTTB2QzhtUjVZSXhCbndXNVFfMUsyRFE5bl84LXdieVhMUVVLRWpXTVkxUzVkVlI2dW9Rc0hKY0FQVTVSdXFiMmo0TDByMFBKT05Od3ZuNlI5dUQxLWt0RGdyempjVk5xZUpVbjFWcTZPLUlQZ0RCM1pJ?oc=5\" target=\"_blank\">UK borrowing overshoot darkens backdrop for Healey's budget</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Reuters</font>","iso":"2026-09-22T06:36:00+00:00"},{"lane":"markets","source":"Reuters UK","title":"Australia's central bank says inflation risks may be materialising - Reuters","url":"https://news.google.com/rss/articles/CBMivAFBVV95cUxPTHRkdUFHa0ZLX21aZlg5S1Q1NS1kMk1uY0ZVd0xoRTV5ZXVDR3BPWHpCeEgyaGVlUk9acEEzUzlxb3lsb2lyN3FzU3JueWRoUDVpaUtHQWI5TDFpWXFENjBUUXZqS3RqdE9iRTFQTmJWSV9vcU1Obk9SS1NCcWdoZTJ4MEhEVXF0V3Q5YzFZU3RPSUhlc1hTYTNIQ1VyNzJPTTdpaVJvb0htdjc5UkhqNnZfNjZneDdhaDFvdg?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMivAFBVV95cUxPTHRkdUFHa0ZLX21aZlg5S1Q1NS1kMk1uY0ZVd0xoRTV5ZXVDR3BPWHpCeEgyaGVlUk9acEEzUzlxb3lsb2lyN3FzU3JueWRoUDVpaUtHQWI5TDFpWXFENjBUUXZqS3RqdE9iRTF our business by making it easier for small businesses to access public sector supply chains, removing unnecessary burdens and costs.","iso":"2026-09-21T10:30:33+00:00"},{"lane":"councils","source":"LGC","title":"How councils are tackling climate adaptation","url":"https://www.lgcplus.com/politics/climate-change/how-councils-are-tackling-climate-adaptation-21-09-2026/","summary":"Following a summer which saw record breaking temperatures and drought, James Wilmore examines local government\u2019s track record on adapting to the changing climate. \u201cI just find it surprising that after so much effort the final act of our existence should be suicide.\u201d These are among\u2026\nThe post How councils are tackling climate adaptation appeared first on Local Government Chronicle (LGC).","iso":"2026-09-21T09:58:28+00:00"},{"lane":"councils","source":"LGC","title":"County leader: Whitehall has a \u2018total lack of understanding\u2019","url":"https://www.lgcplus.com/politics/governance-and-structure/county-leader-whitehall-has-a-total-lack-of-understanding-21-09-2026/","summary":"The relationship between local and central government is \u201cdysfunctional\u201d and Whitehall has a \u201ctotal lack of understanding of how local government operates\u201d, a Liberal Democrat county leader said this weekend. Speaking at the Liberal Democrat party conference at the weekend, Gloucestershire CC leader Lisa Spivey\u2026\nThe post County leader: Whitehall has a \u2018total lack of understanding\u2019 appeared first o","iso":"2026-09-21T09:55:57+00:00"},{"lane":"councils","source":"LGC","title":"Graham Chapman: The devolution paradox","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/graham-chapman-the-devolution-paradox-21-09-2026/","summary":"If devolution is to succeed it requires substantial central coordination, writes the former leader of Nottingham City Council. The buzz word of the moment is devolution. There is hardly anyone among the commentariat or political classes who does not think it is a good thing.\u2026\nThe post Graham Chapman: The devolution paradox appeared first on Local Government Chronicle (LGC).","iso":"2026-09-21T09:19:30+00:00"},{"lane":"policy","source":"MHCLG","title":"Capacity to Build","url":"https://www.gov.uk/guidance/capacity-to-build","summary":"The government's Capacity to Build programme supports councils to increase their current levels of housebuilding.","iso":"2026-09-21T09:00:06+00:00"},{"lane":"ours","source":"Slough UA","title":"Slough Council faces \u00a319.9m overspend with government-appointed commissioners warning of financial collapse by year-end.","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"councils","source":"LGC","title":"Shadow unitary seeks legal advice behind LGR pause","url":"https://www.lgcplus.com/politics/governance-and-structure/shadow-unitary-seeks-legal-advice-behind-lgr-pause-21-09-2026/","summary":"West Surrey shadow authority has requested to see the legal advice that led to the wider pause in the local government reorganisation programme. The timeline in Surrey is unchanged, with vesting day set for 1 April 2027, but shadow leader Paul Follows (Lib Dem) said\u2026\nThe post Shadow unitary seeks legal advice behind LGR pause appeared first on Local Government Chronicle (LGC).","iso":"2026-09-21T07:05:52+00:00"},{"lane":"councils","source":"Distress watch","title":"High Court of Karnataka Dismisses Review Petition in Land Acquisition Compensation Dispute \u2014 No Error Apparent on Record. Review Petition under Section 114 r/w Order 47 Rule 1 CPC fails as petitioners seek re-argument on merits, not correction of error. - Lawtext","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBGeVNKLWlkOGVlSFVTZVBHN2lCZ1Q4WlQ2dWdNOUliUGZvWEw1ZERmUmVYb0w0d2NUazVJQVBWZkZSVWRJUG5qQ2xnRjZoU0l5eEgyblNWdllJZWZCSmEyMUtVQ3ZPQQ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBGeVNKLWlkOGVlSFVTZVBHN2lCZ1Q4WlQ2dWdNOUliUGZvWEw1ZERmUmVYb0w0d2NUazVJQVBWZkZSVWRJUG5qQ2xnRjZoU0l5eEgyblNWdllJZWZCSmEyMUtVQ3ZPQQ?oc=5\" target=\"_blank\">High Court of Karnataka Dismisses Review Petition in Land Acquisition Compensation Dispute \u2014 No Error Apparent on Record. Review Petition under Section 114 r/w Order 47 Rule 1 CPC fails as ","iso":"2026-09-20T22:56:57+00:00"},{"lane":"councils","source":"Distress watch","title":"High Court Acquits Appellants in Abetment of Suicide Case Due to Lack of Evidence of Instigation or Abetment. Conviction under Section 306 IPC read with Section 114 IPC set aside as prosecution failed to prove any positive act of instigation or intentional aid - Lawtext","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTE1qZE96dDJZb0FvZkJYY0hkaGpCR1VveC1GVlJwdG9XM0JVSjR5ZkV4ZWZHclVISWItNzRRWnJmNFg5Y09uaC14TzMxVHZud0gzb3JzSXVZdTA3eTM2Y0g4U3pmOTJzUQ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTE1qZE96dDJZb0FvZkJYY0hkaGpCR1VveC1GVlJwdG9XM0JVSjR5ZkV4ZWZHclVISWItNzRRWnJmNFg5Y09uaC14TzMxVHZud0gzb3JzSXVZdTA3eTM2Y0g4U3pmOTJzUQ?oc=5\" target=\"_blank\">High Court Acquits Appellants in Abetment of Suicide Case Due to Lack of Evidence of Instigation or Abetment. Conviction under Section 306 IPC read with Section 114 IPC set aside as prosecu","iso":"2026-09-20T10:21:47+00:00"},{"lane":"councils","source":"Distress watch","title":"Havering Council Forecasts \u00a354.2m Use Of Exceptional Financial Support - The Havering Daily","url":"https://news.google.com/rss/articles/CBMisgFBVV95cUxNamNvM3JsNkpKOFZyUVJTX2dKbEFjS1hfaC14UG5teXZVNjlSZm1iRTF1YUtXemZyUnQwdi1Bb0FOdllFQk9BRy0zWmlPcUNxV0pFNGJJM0NZZ2tncW9JQjVzaWdoVG9FSE1JMjh3RUV5VWQ3alRLeENnS3NGZ0cwU2JkaERzNkZNb1hSTnFpaWIzX3FmdEkwdmFEdGFjWVpqRVhPdDRzSWtVTnMwbXpaVHpB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMisgFBVV95cUxNamNvM3JsNkpKOFZyUVJTX2dKbEFjS1hfaC14UG5teXZVNjlSZm1iRTF1YUtXemZyUnQwdi1Bb0FOdllFQk9BRy0zWmlPcUNxV0pFNGJJM0NZZ2tncW9JQjVzaWdoVG9FSE1JMjh3RUV5VWQ3alRLeENnS3NGZ0cwU2JkaERzNkZNb1hSTnFpaWIzX3FmdEkwdmFEdGFjWVpqRVhPdDRzSWtVTnMwbXpaVHpB?oc=5\" target=\"_blank\">Havering Council Forecasts \u00a354.2m Use Of Exceptional Financial Support</a>&nbsp;&nbsp;<","iso":"2026-09-20T07:21:00+00:00"},{"lane":"ours","source":"Croydon","title":"Croydon's debt servicing costs force reliance on Government support to balance budget","summary":"Croydon spent \u00a382m servicing its \u00a31.5bn General Fund debt in 2025/26, according to its annual governance statement. The council required \u00a3108.7m of capitalisation directions from Government \u2014 permission to treat day-to-day spending as capital spending and pay for it through borrowing \u2014 to balance its budget. The external auditor has rated the council's financial sustainability Red, the lowest possible rating, citing significant weakness in the council's arrangements for debt and cost reduction. An auditor's statutory recommendation, carried forward from the prior year unchanged, states the council must work with newly appointed Commissioners to develop measures enabling reduced operating costs and return to self-sufficiency, and that \"a solution to the debt issue is vital\" to assess the council's capability to manage its finances sustainably.","url":"https://croydon.moderngov.co.uk/documents/s72885/72885.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"General Fund debt c\u00a31.5bn, debt servicing cost c\u00a382m in 2025/26, capitalisation directions \u00a3108.7m for 2025/26 (down from \u00a3136m), \u00a327.3m underspend in 2025/26","quote":"General Fund debt stood at c\u00a31.5bn at the end of 2025-26 with a debt servicing cost of c\u00a382m in 2025-26. The Financial Strategy forecasts continuing reliance on Exceptional Financial Support through capitalisation directions.","paper":"Progress Update and Annual Head of Internal Audit Report","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Liverpool","title":"Liverpool council's reserves hit 'very low level' as financial pressures mount","summary":"Liverpool's reserves \u2014 money a council sets aside as a financial cushion \u2014 have fallen to \u00a325.4m after overspends of \u00a323.8m in 2024/25 and \u00a311.7m in 2025/26. The council's chief finance officer said the council is now holding \"a very low level of usable reserves which will reduce the ability of the council to manage its continuing financial challenges going forward.\"\n\nThe overspends were driven by demand-led service pressures: adult social care (\u00a315.3m), children's services (\u00a317.5m), and homelessness and transport (\u00a321.2m). The council forecasts a cumulative budget gap\u2014the difference between expected spending and available funding\u2014of \u00a363.9m by 2028/29. The council has raised council tax by the maximum allowed 4.99% for 2026/27, despite a 5.8% increase in government grant, signalling limited room for further local revenue-raising.","url":"https://councillors.liverpool.gov.uk/documents/s328596/328596.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E08000012","council":"Liverpool","tag":"audit opinion","figures":"General Fund Reserve \u00a325.389m as buffer against \u00a3756m revenue spend","quote":"Nevertheless, the issues of sustainability and liquidity are overriding concerns for the council despite the going concern prescription. In this respect the key risks for the council are the ability to manage its budget within available resources and the need to maintain adequate reserve balances to mitigate the risks of unexpected cost pressures and difficulties in delivering approved savings programmes.","paper":"Appendix 1 for Draft Statement of Accounts and Draft Annual Governance Statement for 2025/26","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"ours","source":"Stockport MBC","title":"The council is moving closer to the threshold for Exceptional Financial Support (EFS), a form of government-administered distress funding","summary":"EFS signals distress and typically carries restrictions on discretionary borrowing and service reduction mandates. For a lender, it means the council's capacity to service debt becomes a government concern, not just a council one.","url":"https://democracy.stockport.gov.uk/documents/s267445/267445.pdf","iso":"2026-09-15T09:00:00+00:00","gss":"E08000007","council":"Stockport MBC","tag":"s114","figures":"36 councils required EFS in 2026/27; Stockport's likelihood of Section 114 currently low but trajectory worsening","quote":"early and prudent consideration of its timing, conditions and longer-term consequences is necessary to preserve options and avoid a more acute financial intervention","paper":"Part A: Medium Term Financial Plan (MTFP) Summer Review Update","committee":"Cabinet"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"ours","source":"Shropshire UA","title":"Council received a formal Best Value Notice from MHCLG in July 2026","summary":"A Best Value Notice is a serious marker for lenders; it signals regulatory intervention and formal governance weakness in a council already dependent on exceptional financial support.","url":"https://shropshire.gov.uk/committee-services/documents/s45376/45376.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Best Value Notice issued July 2026","quote":"In July 2026 the Council received a Best Value Notice from MHCLG.","paper":"Q1 Performance Report-01072026 1248","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Shropshire UA","title":"External audit issued statutory recommendations on value-for-money; Council under Non-Statutory Best Value Notice with formal MHCLG reviews beginning September 2026","summary":"Audit concerns, formal Best Value Notice, and active MHCLG oversight indicate external constraint. Governance and financial control weaknesses are matters lenders typically care about.","url":"https://shropshire.gov.uk/committee-services/documents/s45413/45413.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Seven years of Limited Assurance on internal audit; statutory audit recommendations; Best Value Notice in place","quote":"The external auditor felt bound to issue statutory recommendations as part of their annual audit for 2024/25 which cast doubt on the integrity of the Council's value for money arrangements... This coincided with the issue of a Non-Statutory Best Value Notice that requires the Council to be reviewed by MHCLG on a regular basis. These reviews begin in September.","paper":"UPDATED Financial Monitoring Report Quarter 1 2026.27-02072026 1235 v8","committee":"Finance and Improvement Overview and Scrutiny Committee"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-01T07:00:00+00:00"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement process costs","summary":"Seeks views on exceptions to the rule that parties pay their own process costs in leasehold transactions under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-process-costs","iso":"2026-07-15T14:14:00Z","closes":"2026-09-23T23:59:00.000+0 function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
</body></html>
