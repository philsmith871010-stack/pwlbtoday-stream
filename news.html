<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

er.","iso":"2026-09-25T13:10:23+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Social housing lettings in England, April 2025 to March 2026","url":"https://www.gov.uk/government/statistics/announcements/social-housing-lettings-in-england-april-2025-to-march-2026","summary":"Statistics on new social housing lettings in England in 2025/26 by local authorities and private registered providers, covering tenancies and tenants.","iso":"2026-09-25T13:01:03+00:00"},{"lane":"councils","source":"LGC","title":"Shadow unitary accuses county of withholding Send plan","url":"https://www.lgcplus.com/services/children/shadow-unitary-accuses-county-of-withholding-send-plan-25-09-2026/","summary":"East Surrey shadow unitary authority has accused Surrey CC of withholding the plans to reform the services for children with special needs and disabilities. The Department for Education required every upper tier authority submits a Send reform plan by June as a condition for writing\u2026\nThe post Shadow unitary accuses county of withholding Send plan appeared first on Local Government Chronicle (LGC).","iso":"2026-09-25T10:39:16+00:00"},{"lane":"councils","source":"LGC","title":"Steve Kay: Building a civic alliance for every child","url":"https://www.lgcplus.com/services/children/steve-kay-building-a-civic-alliance-for-every-child-25-09-2026/","summary":"The local outcomes framework offer a chance to organise around the outcomes children experience rather than the institutions that deliver individual services, writes the director of belonging at Sheffield City Council. For more than two decades, education reform has rightly focused on making schools better.\u2026\nThe post Steve Kay: Building a civic alliance for every child appeared first on Local Gove","iso":"2026-09-25T10:31:48+00:00"},{"lane":"councils","source":"LGC","title":"Analysis: Possible fair funding legal challenge","url":"https://www.lgcplus.com/finance/analysis-possible-fair-funding-legal-challenge-25-09-2026/","summary":"London boroughs have been exploring legal routes to challenge fair funding, Jonathan Knott reports. The government\u2019s fair funding settlement is \u201cprobably immune\u201d from legal challenge due to the time passed since it was announced, a lawyer who works with councils has told LGC. However, Victoria\u2026\nThe post Analysis: Possible fair funding legal challenge appeared first on Local Government Chronicle (L","iso":"2026-09-25T09:49:58+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Shropshire Council operating under financial emergency with systemic control failures across payroll, procurement and schools","summary":"Shropshire Council is operating within a declared financial emergency, with an Improvement Plan established in December 2025 to address governance and financial weaknesses. Internal audit findings from April to August 2026 show 42% of reports rated as receiving limited or unsatisfactory assurance, indicating significant control problems. Payroll audit received limited assurance for the fourth consecutive year, with 12 fundamental recommendations following previous unsatisfactory ratings. Procurement review identified 386 cases where combined purchase order values exceeded authorisation limits within \u00a3125.1m of same-day orders. At Bishops Castle Community College, a deficit is forecast to reach approximately \u00a31 million by 2027/28 despite a recovery plan signed in October 2025, and five of six schools forecasting deficits missed formal notification deadlines. The council's Section 151 Officer, the statutory chief finance officer, is serving in interim capacity. The pension fund audit, by contrast, is substantially complete with an unqualified opinion anticipated and no material misstatements identified.","url":"https://shropshire.gov.uk/committee-services/documents/s46580/46580.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Progress update deadline: end September 2026; subsequent quarterly meetings","quote":"Responding to the CIPFA Review recommendations is a requirement of the EFS arrangements and will be monitored by MHCLG as part of the Best Value Notice process.","paper":"SPF Draft 9-107 LGPS Audit Findings Report 2025-26 v2","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Powys","title":"Powys Council receives clean audit as financial pressure persists","summary":"The council's accounts for 2025/26 have been signed off without qualification by the Auditor General, meaning the financial statements are accurate and complete. However, the council's risk register identifies financial sustainability over the short and medium term as a strategic risk affecting all three of its main priorities, with a residual risk score remaining high at 16 out of 25. The council attributes this to ongoing uncertainty around future funding settlements, inflationary pressures, pay awards and demand-led service costs. Specific operational pressures also persist: adult social care waiting times have improved, but nursing bed capacity remains constrained and care package costs remain high. School premises maintenance is flagged as underfunded, with the council preparing a business case to secure additional funding.","url":"https://powys.moderngov.co.uk/documents/s106689/106689.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"W06000023","council":"Powys","tag":"audit opinion","figures":"Draft accounts prepared on time (30 June 2025); unqualified opinion issued in advance of statutory deadline (31 October 2025)","quote":"There were no other significant issues to report but they did include some considerations for the Council to consider when delivering future years financial statements within the shorter statutory deadlines.","paper":"20.10.26 Qtr 1 2026-2027 App A NON-CONFIDENTIAL strategic risks","committee":"Governance and Audit Committee"},{"lane":"policy","source":"MHCLG","title":"Form: ived by special advisers, and meetings they attended with senior media figures.","iso":"2026-09-24T15:00:05+00:00"},{"lane":"policy","source":"MHCLG","title":"Research: Votes at 16 research","url":"https://www.gov.uk/government/publications/votes-at-16-research","summary":"\u200b\u200bThis report outlines the findings of a major research study with young people aged 14 to 17 to inform the government\u2019s work to extend the right to vote to 16- and 17-year-olds.","iso":"2026-09-24T15:00:02+00:00"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: HM Treasury: Senior officials\u2019 business expenses, hospitality, and meetings January to March 2026","url":"https://www.gov.uk/government/publications/hm-treasury-senior-officials-business-expenses-hospitality-and-meetings-january-to-march-2026","summary":"Data on senior officials\u2019 (SCS2+) business expenses, hospitality, and meetings with external individuals and organisations.","iso":"2026-09-24T15:00:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Detailed analysis of non-fire incidents, year ending March 2026","url":"https://www.gov.uk/government/statistics/announcements/detailed-analysis-of-non-fire-incidents-year-ending-march-2026","summary":"Detailed analysis of non-fire incidents attended by fire and rescue services, England, April 2025 to March 2026.","iso":"2026-09-24T14:17:01+00:00"},{"lane":"policy","source":"HM Treasury","title":"Corporate report: National Lottery Distribution Fund Investment Account Report & Accounts 2025 to 2026","url":"https://www.gov.uk/government/publications/national-lottery-distribution-fund-investment-account-report-accounts-2025-to-2026","summary":"Annual report and accounts of the National Lottery Distribution Fund Investment Account.","iso":"2026-09-24T14:06:47+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Social Housing Quality and Residents Programme Evaluation: privacy notice","url":"https://www.gov.uk/government/publications/social-housing-quality-and-residents-programme-evaluation-privacy-notice","summary":"Privacy notice for evaluation of the Social Housing Quality and Residents Programme.","iso":"2026-09-24T13:21:29+00:00"},{"lane":"councils","source":"LG finance press","title":"\u2018Learn from England\u2019s failings\u2019: warnings over \u2018half-baked\u2019 Scottish LGR - Room151","url":"https://news.google.com/rss/articles/CBMiowFBVV95cUxPWTlLdkFnbzZfTHE4dDR6M25lRURvT0RXczNBTTRVN2E1bnB1MkpJMEUyQnZNLWRwZEtvTzVtdUhqajlKVjlBcjQyREZUR3M2bTRwQ1NBNTREemY0WGdKdWpkamVEamE0QkZMRnItWHczekV3dVlxd3VuRTduVEVpcWN4Um1VNHpIbldBcDc4bGoycFNvRWtBM2ZZUkRqaW9zLVpJ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiowFBVV95cUxPWTlLdkFnbzZfTHE4dDR6M25lRURvT0RXczNBTTRVN2E1bnB1MkpJMEUyQnZNLWRwZEtvTzVtdUhqajlKVjlBcjQyREZUR3M2bTRwQ1NBNTREemY0WGdKdWpkamVEamE0QkZMRnItWHczekV3dVlxd3VuRTduVEVpcWN4Um1VNHpIbldBcDc4bGoycFNvRWtBM2ZZUkRqaW9zLVpJ?oc=5\" target=\"_blank\">\u2018Learn from England\u2019s failings\u2019: warnings over \u2018half-baked\u2019 Scottish LGR</a>&nbsp;&nbsp;<font color=\"#6f6f6","iso":"2026-09-24T10:38:56+00:00"},{"lane":"councils","source":"LGC","title":"Mayoral candidate calls for election next year","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/mayoral-candidate-calls-for-election-next-year-24-09-2026/","summary":"The Labour mayoral candidate for the Hampshire & the Solent CCA has called for elections to be brought forward to 2027. The mayoral election for Hampshire & the Solent CCA was originally set to take place at in May 2026 before being delayed by two\u2026\nThe post Mayoral candidate calls for election next year appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T09:58:51+00:00"},{"lane":"councils","source":"LG finance press","title":"Are US equities still exceptional? - Room151","url":"https://news.google.com/rss/articles/CBMipgFBVV95cUxNbHExeFk5dk1jNzVCQVBFRGp1Z1VhaHRET0x5MDdNRl9KRGpBYzJtXy1uZjJnaDBrcTRWblg3VXJXUFJVTU8tM3cyZENhNTNURm1URzAwYzJpNVU4S2lVYkF3a2dXNVp0RDBXRUF3X2VhWnF4V3NYNHBJVF8xVVBVUlc2TFFPcXE1cW9aUElJd3ZZNWZmOHZBa3ljSEM4RXQ4ZUMwOENR?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMipgFBVV95cUxNbHExeFk5dk1jNzVCQVBFRGp1Z1VhaHRET0x5MDdNRl9KRGpBYzJtXy1uZjJnaDBrcTRWblg3VXJXUFJVTU8tM3cyZENhNTNURm1URzAwYzJpNVU4S2lVYkF3a2dXNVp0RDBXRUF3X2VhWnF4V3NYNHBJVF8xVVBVUlc2TFFPcXE1cW9aUElJd3ZZNWZmOHZBa3ljSEM4RXQ4ZUMwOENR?oc=5\" target=\"_blank\">Are US equities still exceptional?</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Room151</font>","iso":"2026-09-24T09:23:13+00:00"},{"lane":"councils","source":"LGC","title":"Shadow unitaries seek devolution update","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/shadow-unitaries-seek-devolution-update-24-09-2026/","summary":"Both of Surrey\u2019s new shadow unitary authorities are seeking clarity from the government over the future of devolution in the county, following the pause to local government reorganisation in other two-tier areas. East Surrey shadow authority will consider a motion this afternoon on whether to\u2026\nThe post Shadow unitaries seek devolution update appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T09:11:38+00:00"},{"lane":"ours","source":"Cardiff","title":"Cardiff identifies \u00a3167m budget gap as service change savings fall short of targets","summary":"Cardiff Council's medium-term financial strategy identifies a projected budget gap of \u00a3167.1 million for the four years from 2027/28 to 2030/31. The council's efficiency and income savings programme delivered 88 per cent of targets in 2025/26, but service change proposals achieved only 76 per cent of targets \u2014 a result the governance statement acknowledges as inevitable given the complexity of service restructuring, and notes that more such proposals will be needed in future years. Demand pressures in social care, schools and support for children with additional learning needs have contributed to the challenge. The council has restructured its senior finance function, appointing the existing Chief Finance Officer to formally hold the Section 151 Officer designation at Director level on an interim basis to ensure that role can provide independent financial advice from the Chief Executive, in line with governance best practice.","url":"https://cardiff.moderngov.co.uk/documents/s97282/97282.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"s114","figures":"None","quote":"On this basis, as the Section 151 Officer I have concluded that those conditions did not arise during the year and no Section 114 notice was issued in 2025/26.","paper":"Appointment of Section 151 Officer","committee":"Council"},{"lane":"ours","source":"Worcestershire CC","title":"Worcestershire seeks second year of emergency borrowing as social care demand outpaces cuts","summary":"Worcestershire's cabinet agreed a balanced 2026/27 budget only by securing \u00a359.9m of emergency borrowing permission from central government \u2014 treating day-to-day spending as capital investment to spread repayment over 20 years \u2014 and the council has signalled it will need the same support again in 2027/28 to avoid a formal declaration of financial crisis. The borrowing will cost \u00a35.4m in additional interest this year alone. The council's general reserves have fallen to \u00a322.8m, \u00a38.2m short of the prudent minimum, and its risk reserves will shrink to \u00a39.4m by year-end. Adult social care is overshooting budget by \u00a312.8m driven by 70 new care packages since March, while children's placements are \u00a32.8m over forecast. Schools funding, which the council does not directly control, carries a \u00a3122.2m accumulated deficit expected to persist after a \u00a3162.7m government high needs grant. The council has achieved 98 per cent of its \u00a39m savings target, but those gains come from transport and administration; social care services, which are overspending, have delivered minimal savings, suggesting the shortfall is driven by demand rather than inefficiency.","url":"https://worcestershire.moderngov.co.uk/documents/s61939/61939.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"EFS","figures":"\u00a359,933k total; \u00a349,933k borrowing, \u00a310,000k capital receipts","quote":"Exceptional Financial Support 0 59,933 59,933 0 0 0 0 0 0 59,933 59,933","paper":"7 Budget Monitoring P3 Final","committee":"Cabinet"},{"lane":"ours","source":"North Somerset UA","title":"North Somerset gets clean audit as financial pressures tighten","summary":"North Somerset's auditor is issuing an unmodified audit opinion on the council's 2025-26 accounts, with no material adjustments identified. However, the audit has flagged risks of significant weakness in the council's financial sustainability and in managing demand and costs in adult and children's social care. The council is pursuing a High Needs Stability Grant scheme under which up to 90 per cent of its dedicated schools grant deficit \u2014 the money set aside annually to fund schools \u2014 could be written off if the council funds the remaining 10 per cent. The council's medium-term financial plan deficit has worsened since March, with the section 151 officer, the council's chief finance officer, now updating budget assumptions. The council has delivered significant savings in high-cost social care placements and is pursuing additional contributions from the local integrated care board.","url":"https://n-somerset.moderngov.co.uk/documents/s9091/9091.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000024","council":"North Somerset UA","tag":"EFS","figures":"\u00a36m additional recurring income from EFS; 8.99% total council tax rise","quote":"Due to the structural deficit between increasing costs and the Council's capacity to increase income, the Council had to request EFS from the government to balance the 2026/27 budget.","paper":"11. Audit Findings Report 2025-26","committee":"Audit Committee"},{"lane":"ours","source":"Cheshire East UA","title":"Cheshire East uses emergency government permission to balance budget as adult care demand surges","summary":"Cheshire East balanced its 2026/27 budget with \u00a324.995m of exceptional financial support \u2014 permission from government to borrow to cover day-to-day running costs, normally a measure of last resort. The council faced a structural Adult Social Care demand crisis: the forecast for care spending is \u00a311.455m against a budgeted \u00a35.958m, a \u00a35.497m overspend driven by an ageing population and rising complexity. The council is pursuing a transformation programme targeting \u00a322.45m of savings across Adult Social Care by 2030, up from the \u00a314.99m originally planned. Early results show promise: a Prevent, Reduce, Enable pilot programme has generated \u00a31.37m of cost avoidance, and Learning Disability reviews have delivered \u00a3705k in savings. However, the council faces sustained annual demand growth of around \u00a36m over the next five years \u2014 roughly double what its current savings programmes are delivering \u2014 and acknowledges that extrapolating pilot results across the whole borough carries material risk.","url":"https://moderngov.cheshireeast.gov.uk/documents/s136550/136550.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m","quote":"The budget was balanced, as required by statute, with plan ned use of EFS, by way of a capitalisation direction, totalling \u00a324.995m.","paper":"2026/27 Budget \u2013 Quarter 1 Forecast OutturnCabinet and Committee Report Template","committee":"Adults Overview and Scrutiny Committee"},{"lane":"ours","source":"Bradford","title":"Bradford Council's revenue overspend of \u00a3113m funded through government support as reserves increase","summary":"Bradford Council's day-to-day spending exceeded its budget by \u00a3113 million in 2025-26, requiring funding through a Capitalisation Direction, a form of government financing that allows councils to treat certain spending as capital to be paid for through borrowing or asset sales. The overspend was \u00a314 million better than initially forecast. Despite the deficit, the council's usable reserves\u2014money set aside as a cushion\u2014increased by \u00a355 million to \u00a3229.2 million, partly because costs funded through the Capitalisation Direction were earmarked rather than drawn immediately. The council's General Fund balance stands at \u00a353.1 million, representing 3.5 per cent of its annual gross spending. External auditors anticipate issuing an unqualified audit opinion on the financial statements, subject to completion of outstanding audit work.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Runnymede","title":"Runnymede's reserves forecast to fall by two-thirds by 2032, driven by pay costs and property relet risk","summary":"Runnymede's General Fund working balance is forecast to decline from \u00a321.6m in March 2027 to \u00a32.0m by 2032, according to budget monitoring presented to the Corporate Management Committee. The trajectory accelerates from 2029 onwards, with reserves falling \u00a311.7m in two years. The council's own report states this rate of depletion is unsustainable without further savings and efficiencies. A pay and grading review approved in 2025 created a structural cost pressure of \u00a31.241m that drives the forecast. The council's largest income source is investment property rents of \u00a325.9m annually, but the report warns it must \"be wary\" about reletting at current levels. The Housing Revenue Account, which funds council housing, forecasts a \u00a39.1m deficit in 2026/27. The council is exploring early loan repayment and property disposals to ease medium-term pressure, with decisions on timelines and amounts to follow in later monitoring reports.","url":"https://runnymede.moderngov.co.uk/documents/s18927/18927.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"intervention","figures":"Notice issued December 2023; now withdrawn as of September 2026 meeting date","quote":"Following the non-statutory best value notice, which has now been withdrawn","paper":"Q1 - Budget Monitoring report - Appenxix 6 v3 - final","committee":"Corporate Management Committee"},{"lane":"ours","source":"West Suffolk","title":"West Suffolk audit recovery delayed to 2027-28 by \u00a37.8m property revaluation backlog","summary":"West Suffolk's recovery from the national audit backlog will not complete until 2027-28, due to \u00a37.8 million of property assets last valued in 2022-23 that fall outside the council's current five-year revaluation cycle. The council received disclaimed audit opinions\u2014indicating no assurance\u2014for 2022-23 and 2023-24, recovered to a qualified opinion in 2024-25, and expects one for 2025-26. Once these assets are revalued as part of its cycle, the auditor will require two further years to verify the impact on the accounts before clearing the qualification. Part of the qualification, relating to reserve classification, can be resolved in 2025-26. The council's auditors found no concerns with its value-for-money arrangements. It produced unaudited accounts on 29 May, ahead of the statutory deadline of 30 June.","url":"https://democracy.westsuffolk.gov.uk/documents/s59460/59460.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000245","council":"West Suffolk","tag":"audit opinion","figures":"\u00a329.5m cash and investments at 31 March 2026; \u00a310m forecast cash at March 2027; \u00a36.13m General Fund; \u00a352.01m earmarked reserves","quote":"Overall, based on its cash flow forecast, borrowing potential and access to investment funds, as well as the level of general fund and reserve balances it holds, the council determines that it has sufficient liquidity to continue to deliver services for the foreseeable future.","paper":"6-PAS-WS-26-015-EY-Risk-Assessment-Update","committee":"Performance and Audit Scrutiny Committee"},{"lane":"ours","source":"Hammersmith & Fulham","title":"Hammersmith and Fulham balanced budget this year but faces \u00a389m gap in two years","summary":"Hammersmith and Fulham Council balanced its revenue and capital accounts for 2025/26 despite inflation and interest rate pressures, according to audit reports. However, the medium-term outlook is more challenging. A government funding review and changes to the business rates system will reduce the council's grants and retained business rates\u2014the share of local business tax it keeps\u2014by \u00a323.5m from 2026/27. Though transitional funding will help through 2028/29, budget gaps of \u00a331.4m and \u00a357.3m are forecast for the following two years. The auditor noted that while the council holds \u00a3122.1m in reserves\u2014money set aside\u2014these are finite and cannot sustainably address recurring pressures alone. The council will need to increase council tax and make additional savings.","url":"https://lbhf.moderngov.co.uk/documents/s136009/136009.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000013","council":"Hammersmith & Fulham","tag":"audit opinion","figures":"Total net assets: \u00a31,462.070 million; materiality: \u00a323 million","quote":"Our anticipated financial statements audit report opinion will be unmodified.","paper":"Appendix 4 - LBHF Pension Fund Audit Findings Report 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Sutton","title":"Sutton faces schools funding crisis unless government backs special needs reform plan","summary":"Sutton Council has accumulated a \u00a321.48m deficit in its schools budget for children with special educational needs, with spending projected to overspend by a further \u00a313.55m next year. The council's own papers show this threatens its financial stability. The government has offered to write off 90 per cent of the accumulated deficit\u2014worth \u00a319.35m\u2014but only if the council's special needs reform plan wins approval. The council is betting on that approval: it has set aside \u00a31.64m and budgets \u00a30.58m a year to cover the remaining 10 per cent liability it would owe even after a write-down. The deficit stems from a 43.7 per cent rise in children needing specialist support since December 2020, with Sutton receiving roughly 180 more assessment requests than other London boroughs of its size. The council is also facing a shortfall in capital funding: the \u00a32.83m allocated for 2026/27 is insufficient to deliver the reform plan's requirements, the council's papers state.","url":"https://sutton.moderngov.co.uk/documents/s96615/96615.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000029","council":"Sutton","tag":"DSG / SEND","figures":"\u00a32.15m residual 10% liability; \u00a31.64m High Needs Block Repayment Reserve established; \u00a30.58m annual contribution budgeted","quote":"The Council's residual 10% liability is estimated at \u00a32.15m. To fund this, the Council established a High Needs Block Repayment Reserve of \u00a31.64m and budgets an annual contribution of \u00a30.58m.","paper":"SEND Update Report","committee":"People Committee"},{"lane":"ours","source":"Harrow","title":"Harrow pins savings plan on acquisitions scheme as temporary housing costs spiral to \u00a315.7m annual loss","summary":"Harrow is forecasting a net revenue overspend of \u00a33.039m in 2026\u201327 and faces a structural financial pressure driven by temporary accommodation. The council reports housing in nightly paid accommodation has grown from 234 households in April 2023 to 726 in June 2026, creating a mismatch between government subsidy levels and actual costs. This generates an annual subsidy loss of \u00a315.7m. Nearly half of the council's planned savings\u2014\u00a32.012m out of \u00a34.062m\u2014depend on the Property Acquisition Programme, a capital scheme to buy 50 additional homes and reduce reliance on expensive external accommodation. The programme is rated Amber, meaning the savings are contingent on the project completing on schedule. The capital programme overall is running behind forecast at only 47% spend by the end of the first quarter, with \u00a3183.743m slippage into future years. However, the financing position has improved by \u00a35.859m due to delayed borrowing and savings on repayment costs, a benefit that depends on lower borrowing requirements being sustained for the remainder of the year.","url":"https://harrow.moderngov.co.uk/documents/s201854/201854.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000015","council":"Harrow","tag":"DSG / SEND","figures":"Total variance \u00a335,859,859 (all slippage to 27/28); SEN Expansion \u00a310,448,369; Schools Capital Maintenance \u00a37,597,098; High Needs Provision \u00a34,200,000; Additional Basic Need Funding \u00a37,761,893","quote":"Total Children's Services Directorate 41,282,293 0 41,282,293 5,422,434 (35,859,859)","paper":"Appendix 2 - 2026-27 MTFS Tracker","committee":"Cabinet"},{"lane":"ours","source":"Gloucestershire CC","title":"Gloucestershire identifies control gaps in adult social care","summary":"Internal auditors reviewing Gloucestershire County Council's adult social care spending have identified control gaps, with 68 per cent of bed-based residential care contracts lacking formal acceptance despite continued payments. The council's audit found that care homes and domiciliary care providers were not managed through a centrally maintained contracts register. A related audit identified cash-flow timing risks where Gloucestershire pays care providers upfront and seeks reimbursement from the Integrated Care Board based on prior-year spending. These findings coincide with the council flagging financial sustainability as a new governance issue requiring oversight in 2026-27. Separately, the council's counter-fraud team recovered \u00a324,690 through newly available data-matching on adult social care spending. The council's pension fund assets increased by \u00a3197m to \u00a31.878bn following the triennial valuation.","url":"https://gloucestershire.moderngov.co.uk/documents/s120233/120233.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000013","council":"Gloucestershire CC","tag":"DSG / SEND","figures":"\u00a346.28 million increase; \u00a3124.7 million cumulative deficit; \u00a336.3 million general fund balance; approximately \u00a312.5m residual local contribution; statutory override expires March 2028","quote":"The DSG deficit increased by \u00a346.28 million in 2025/26 to \u00a3124.7 million, compared to a General Fund balance at year end of \u00a336.3 million.","paper":"ISA260 202526 GCC draft for papers","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Babergh","title":"Councils defer \u00a3973k in interest payments as commercial ventures struggle","summary":"Babergh and Mid Suffolk agreed to defer approximately \u00a3974,000 in interest payments from CIFCO Ltd, their main investment subsidiary, across the next two years, on top of \u00a31.3m in deferrals already accumulated. The deferral, representing about 13 per cent of annual interest owed by CIFCO to the two councils combined, comes as both authorities' commercial housing schemes underperformed. Babergh's Hadleigh scheme has \u00a34.889m in expected credit losses with units unsold since practical completion, while Mid Suffolk cancelled phase two of its Needham Market development entirely and sold the land for \u00a32.7m after writing off \u00a3877,000 in costs. Both councils hold \u00a343.3m in loans to CIFCO. The councils' mainstream debt position improved: Mid Suffolk reduced borrowing by \u00a314.2m, cutting expensive short-term debt from \u00a318m to \u00a35m. Babergh's general fund financing costs rose to 33 per cent of annual revenue from 28 per cent budgeted, reducing the cushion for service delivery.","url":"https://baberghmidsuffolk.moderngov.co.uk/documents/s43661/43661.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000200","council":"Babergh","tag":"LOBO","figures":"\u00a34m LOBO loans outstanding; average rate 4.21%; call dates February and August each year","quote":"The lender has not exercised its option during 2025/26.","paper":"MC/26/15 Annual Treasury Management Report 2025-26","committee":"Mid Suffolk Council"},{"lane":"ours","source":"City of Edinburgh","title":"Edinburgh's \u00a332m surplus masks savings shortfalls and forward spending pressures ahead","summary":"Edinburgh ended 2025-26 with an underspend of \u00a332.2m, but the council acknowledged it relied on a one-time \u00a324.9m legal settlement and other one-off measures to reach that position. The underlying picture is less reassuring. Only 70 per cent of \u00a343.2m of approved budget savings were delivered in year, with delays concentrated in demand-led services such as Home to School Transport and property maintenance. Council Tax revenue fell by \u00a31.7m due to reduced tax base buoyancy\u2014a structural loss of recurring income. The auditor's report flags that the council plans to increase substantially its borrowing and debt levels over the next five years, presenting significant risk to longer-term financial sustainability. The council has set aside the remaining underspend, acknowledging projected overspend in the current year. Capital spending also underspent by \u00a338.2m, including \u00a320m in delayed housing acquisitions for temporary accommodation where the property market could not meet targets.","url":"https://edinburgh.moderngov.co.uk/documents/s103738/103738.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"S12000036","council":"City of Edinburgh","tag":"LOBO","figures":"\u00a332m market debt repaid (including two LOBOs); outstanding LOBO debt \u00a3122.4m","quote":"The lenders exercised their option to request an increase in the interest rate paid on the loans and the Council exercised its option to repay the loans at par with no penalty.","paper":"8.3 Revenue monitoring outturn 25-26","committee":"Finance and Resources Committee"},{"lane":"ours","source":"Thanet","title":"Thanet reserves fall below safety level as overspends persist despite spending controls","summary":"Thanet Council's reserves have fallen to \u00a34.1m of unrestricted money, below the \u00a36m floor its chief finance officer has advised it maintain. The shortfall follows a second consecutive year of major overspending: \u00a34.7m in 2024-25 and \u00a33.5m in 2025-26. Despite introducing weekly spending panels and vacancy freezes, the council's day-to-day running costs exceeded budget across three major service areas. Temporary accommodation overspent by \u00a3597k, waste and cleansing by \u00a31.001m, and housing benefit subsidy fell \u00a3662k short\u2014all described as ongoing structural deficits rather than one-off problems. An early forecast for 2026-27 indicates a further overspend exceeding \u00a31m is highly likely, offset only by a non-recurring collection fund surplus. The council is preparing for local government reorganisation with transition costs estimated at \u00a3700k to \u00a31.2m and no identified funding source.","url":"https://thanet.moderngov.co.uk/documents/s97590/97590.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000114","council":"Thanet","tag":"LOBO","figures":"\u00a34.5m LOBO at 4.19%, repaid 9 December 2025","quote":"The Council had a Lender Option Borrower Option (LOBO) loan for \u00a34.5m at 4.19% and the lender exercised its option to increase the interest rate from 9 December 2025. Accordingly, the Council exercised its option to repay this loan on the same date.","paper":"Council - 2025-26 Budget Approvals Report","committee":"Council"},{"lane":"ours","source":"Tunbridge Wells","title":"Tunbridge Wells council starts year with stronger cash position as investment income outperforms","summary":"Tunbridge Wells Cabinet heard on 24 September that the council opened the financial year with \u00a341.9 million in cash, \u00a31.9 million more than budgeted, after capital projects totalling \u00a314.074 million were rescheduled into 2026/27. The stronger liquidity position has boosted investment returns. The council forecasts investment income of \u00a32.2 million for the year against a \u00a32 million budget, a surplus of \u00a3200,000 that will be transferred to reserves, after achieving an average interest rate of 4.13 per cent rather than the budgeted 3.94 per cent. Q1 investment balances reached \u00a348.3 million, well above the year-end budget assumption of \u00a328.9 million. The council holds no external debt. However, the capital programme is forecast to spend \u00a319.9 million in 2026/27 against a budget of \u00a38.9 million\u2014more than double\u2014and the Grant Volatility Reserve, which buffers against swings in government funding, is forecast to be completely depleted by March 2027.","url":"https://tunbridgewells.moderngov.co.uk/documents/s84985/84985.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000116","council":"Tunbridge Wells","tag":"borrowing","figures":"Internal Borrowing: \u00a33,687k","quote":"Internal Borrowing still to be repaid (projects not yet financed/MRP) (3,687)","paper":"Quarter 1 Treasury Management 202627","committee":"Cabinet"},{"lane":"ours","source":"Herefordshire UA","title":"Herefordshire Council faces \u00a311.6m overspend on day-to-day spending as reserve depletes","summary":"Herefordshire Council is forecasting a \u00a311.6 million overspend on day-to-day spending in the first quarter of 2026/27, equivalent to 5 per cent of its budget of \u00a3234.1 million. The overspend stems from \u00a33.6 million in new cost pressures and \u00a38.0 million of savings the council planned to make but has not yet delivered. The council has drawn down its Budget Resilience Reserve \u2014 money set aside for financial resilience \u2014 from \u00a311.0 million to \u00a31.0 million over the past two years. In response to the Q1 position, the council states that \"corrective action must be taken immediately to recover in-year forecast cost pressures and mitigate at-risk savings.\" Demand pressures in adult social care (Community Wellbeing overspend of \u00a34.9 million) and special educational needs home-to-school transport (\u00a33.0 million overspend) are the main drivers.","url":"https://councillors.herefordshire.gov.uk/documents/s50135886/50135886.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000019","council":"Herefordshire UA","tag":"borrowing","figures":"Capital Financing Requirement \u00a3330.3m, long-term borrowing \u00a3184.7m","quote":"It is anticipated that significant borrowing will be undertaken in the last 3 quarters of the financial year due to replacement of internal borrowing with external borrowing, depending on actual expenditure within the capital programme.","paper":"Q1 2026/27 Budget Report, main report","committee":"Cabinet"},{"lane":"councils","source":"LGC","title":"Social care ombudsman complaints rise 22%","url":"https://www.lgcplus.com/services/health-and-care/social-care-ombudsman-complaints-rise-22-24-09-2026/","summary":"Complaints to the ombudsman about adult social care rose by 22% last year, new figures show. The Local Government & Social Care Ombudsman received 3,938 complaints about adult social care in 2025-26, according to its annual review published today. The largest share of complaints to\u2026\nThe post Social care ombudsman complaints rise 22% appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T04:38:19+00:00"},{"lane":"councils","source":"LGC","title":"LGA calls for \u2018alternative\u2019 to EFS","url":"https://www.lgcplus.com/finance/lga-calls-for-alternative-to-efs-24-09-2026/","summary":"The Local Government Association has called for a revision of the exceptional financial support programme, with its chair warning councils are \"financially fragile\". In its Autumn Budget submission to the chancellor the LGA said it is \u201cconcerned about the effectiveness\u201d of EFS for those councils\u2026\nThe post LGA calls for \u2018alternative\u2019 to EFS appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T03:27:03+00:00"},{"lane":"councils","source":"LGC","title":"WEBINAR: How Burnley became Council of the Year","url":"https://www.lgcplus.com/politics/governance-and-structure/webinar-how-burnley-became-council-of-the-year-23-09-2026/","summary":"Burnley BC was named Council of the Year at the LGC Awards 2026. The judges said: \u201cThis council has demonstrated exceptional work in place leadership and community cohesion. The judges were inspired by the council\u2019s passion and fearless leadership, with outstanding results in areas from\u2026\nThe post WEBINAR: How Burnley became Council of the Year appeared first on Local Government Chronicle (LGC).","iso":"2026-09-23T10:06:30+00:00"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"ours","source":"Medway Towns UA","title":"Medway faces \u00a326.7m current-year overspend and \u00a365m structural deficit dependent on government funding","summary":"Medway Council faces a \u00a326.7m overspend forecast in the current financial year, exceeding its total general reserves of \u00a310.1m, and a structural budget gap of \u00a365.9m in 2027/28 rising to \u00a3359.3m cumulatively across the medium term. The financial plan cannot be balanced without exceptional financial support from government\u2014permission to borrow to cover day-to-day spending\u2014which has not been confirmed for 2027/28. If the government refuses, the Section 151 officer, the council's chief finance officer, may be forced to issue a Section 114 notice, a formal warning that the council cannot balance its budget, which freezes new spending until councillors agree a plan. The Cabinet heard pressures of \u00a338.6m in adult social care and \u00a39.2m in children's services, with adult social care costs having more than doubled since 2020-21.","url":"https://democracy.medway.gov.uk/documents/s91492/91492.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000035","council":"Medway Towns UA","tag":"s114 risk","figures":"\u00a365.858m 2027/28 gap dependent on EFS; EFS already granted for 2025/26 (\u00a39.856m) and agreed in-principle for 2026/27 (total \u00a328.003m borrowed)","quote":"The current MTFO projections cannot be balanced through the use of reserves and assume that further exceptional financial support from Government will be required. There remains a significant risk to the Council's financial resilience should additional support not be forthcoming...In the unlikely event that the MHCLG rejects the Council's latest application for EFS, the Section 151 Officer may be forced to issue a Section 114 notice to the Council.","paper":"Report","committee":"Cabinet"},{"lane":"ours","source":"Slough UA","title":"Slough Council faces \u00a319.9m overspend with government-appointed commissioners warning of financial collapse by year-end.","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a ty"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 20 function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
</body></html>
