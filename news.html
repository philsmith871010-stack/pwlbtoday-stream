<title>PWLBintel — the newsroom</title>

<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

<script>
const DATA = {"generated":"2026-09-29T09:16:23.416028+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":4,"councils":10,"policy":26,"markets":32},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":5,"hm-treasury":2,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"CIPFA and CIPFA/LASAAC":"nothing open"},"items":[{"lane":"markets","source":"BBC business","title":"OpenAI scraps rollout of new model over safety concerns","url":"https://www.bbc.co.uk/news/articles/cm5y5nynl75ko?at_medium=RSS&at_campaign=rss","summary":"The firm also issued an update on incidents in which its models accessed Australian government systems.","iso":"2026-09-29T09:14:13+00:00"},{"lane":"markets","source":"Guardian business","title":"UK mortgage approvals lowest since December 2023 as borrowing costs rise \u2013 business live","url":"https://www.theguardian.com/business/live/2026/sep/29/anthropic-ipo-warning-existential-risks-to-humanity-from-ai-astrazeneca-2bn-cancer-drug-tie-up-diesel-stock-market-live-news-updates","summary":"<p>Rolling coverage of the latest economic and financial news</p><p><strong>Newsflash: the number of mortgages approved by UK lenders has fallen to its lowest level since the end of 2023.</strong></p><p>Just 54,918 new home loans were approved in August on a seasonally-adjusted basis, new Bank of England data shows, as rising borrowing costs deterred potential home buyers.</p><p>The average 2-year","iso":"2026-09-29T09:04:05+00:00"},{"lane":"ours","source":"Windsor & Maidenhead UA","title":"Windsor and Maidenhead capital spending forecast at less than half of annual budget","summary":"Windsor and Maidenhead council is forecasting only \u00a334.3m in capital spending \u2014 money spent on buildings, vehicles and equipment \u2014 against a \u00a367.2m annual budget for 2026-27, a shortfall of \u00a331.2m. The shortfall has worsened in recent months, declining by \u00a39.1m between month 2 and month 4 forecasts. Waste collection vehicles (\u00a37.2m), Heatherwood Royal (\u00a33.4m) and street lighting enhancement (\u00a31.7m) are all forecast at or near zero. The council's largest shortfall is the ICB Health Hub: council papers provide no explanation for the \u00a314.7m underspend, with the project forecast at \u00a39.7m against a \u00a324.4m budget. Other delays include \u00a32.3m of school funding for children with special educational needs unallocated while awaiting government reforms, and a bus improvement plan \u00a30.4m lower because contracted works exceeded what is deliverable. Capital reserves have grown to \u00a3111.5m.","url":"https://rbwm.moderngov.co.uk/documents/s73201/73201.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000040","council":"Windsor & Maidenhead UA","tag":"EFS","figures":"\u00a348,754k budgeted EFS; \u00a30 received to date; represents 26% of total funding budget of \u00a3187,055k","quote":"Exceptional Financial Support (48,754) 0 (48,754) 0 (48,754) 0 0","paper":"Appendix E - Reserves","committee":"Cabinet"},{"lane":"ours","source":"East Sussex CC","title":"East Sussex home-to-school transport \u00a33.8m over budget as SEND demand rises","summary":"East Sussex's home-to-school transport budget overran by \u00a33.8m in 2024-25, a 16.5 per cent overspend on a \u00a323m budget, driven by rising demand for pupils with special educational needs and disabilities (SEND). National SEND transport spending has increased 70 per cent in real terms since 2015-16. The council is promoting two cost-mitigation schemes: a Personal Travel Budget offering 65p per mile has generated \u00a3221,000 in annual savings, while Independent Travel Training, costing \u00a32,750 per pupil, saves \u00a37,734 to \u00a318,112 annually in transport costs. However, uptake remains low. Only 10 families have accepted the enhanced Personal Travel Budget offer despite it being extended to 184 families, and 22 pupils completed the training in 2024-25. The council identified awareness gaps and practical barriers, including parental concerns about safety, as obstacles to wider uptake.","url":"https://democracy.eastsussex.gov.uk/documents/s79408/79408.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E10000011","council":"East Sussex CC","tag":"EFS","figures":"\u00a355.6m deficit for 2026/27; \u00a370m capitalisation requested; cumulative deficit of \u00a3117.7m by 2028/29","quote":"Our revenue budget for 2026/27 includes a \u00a355.6m deficit, which has led us to request Exceptional Financial Support from Government... we have notified MHCLG that without further Government funding to address the challenges we face, we are likely to require EFS for 2027/28 to deliver our statutory duties.","paper":"Appendix 1","committee":"Cabinet"},{"lane":"ours","source":"Bristol UA","title":"Bristol faces \u00a39.8m overspend in first quarter despite \u00a362.7m budget increase for social care","summary":"Bristol City Council is forecasting a \u00a39.8m overspend in the first quarter of 2026/27 despite setting a balanced general fund budget of \u00a3634.1m for the year, with spending pressures driven by unbudgeted social care costs. The budget itself increased by \u00a362.7m from the previous year, predominantly to address service pressures in social care, yet the council's auditors note continued pressure in children's and adults' services. In children's education, the council is forecasting a \u00a35m overspend; in adults' and communities, \u00a32.3m. This follows a pattern from 2025/26, when the council reported underlying overruns of \u00a314.5m in children's education and \u00a33.6m in adults' services. The council's 2026/27 savings programme requires \u00a321.1m in reductions from social care \u2014 more than half of its total \u00a340.9m saving requirement \u2014 with adults' and communities flagging \u00a32.7m of delivery risk against those targets.","url":"https://bristol.moderngov.co.uk/documents/s131453/131453.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000023","council":"Bristol UA","tag":"DSG / SEND","figures":"\u00a329.5m in-year deficit; \u00a385.4m cumulative deficit at 31 March 2026","quote":"The DSG position remains a significant financial challenge, with an in-year deficit of \u00a329.5m million and a cumulative deficit of \u00a385.4m million at 31 March 2026, subject to national funding arrangements and local recovery plans.","paper":"11 - Interim Bristol City Council 2025-26 Auditors Annual Report","committee":"Audit Committee"},{"lane":"ours","source":"Bristol UA","title":"Bristol schools grant deficit reaches \u00a387.8m after \u00a346.7m overspend in 2025-26; first-quarter 2026-27 forecast projects \u00a344.8m in-year overspend","summary":"Bristol City Council is carrying forward a cumulative shortfall of \u00a387.8m on its dedicated schools grant, the government funding that pays for school provision, after spending \u00a346.7m more than allocated in the 2025-26 financial year. A first-quarter forecast for 2026-27 projects an in-year overspend of \u00a344.8m, driven by rising numbers of pupils with complex additional needs and inflationary pressures on specialist provision. The council's recovery plan depends partly on a High Needs Stability Grant from the Department for Education, pending approval of its Local SEND Reform Plan by the end of October. The strain is visible across the sector: 24 of 53 maintained schools are now in cumulative deficit, up from 21 a year ago, while 11 of 12 maintained nursery schools are in deficit totalling \u00a35.5m. The forum also heard the council is considering ending a maternity supply cover scheme for schools unless maintained schools accept increases in their de-delegation rates of 34 per cent for primary and 23 per cent for secondary.","url":"https://bristol.moderngov.co.uk/documents/s131422/131422.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000023","council":"Bristol UA","tag":"DSG / SEND","figures":"\u00a344.8m unmitigated forecast overspend; approval decision expected end of October 2026","quote":"The forecast does not currently assume receipt of the High Needs Stability Grant, pending Government confirmation of the outcome of our reform plan, which is expected by the end of October.","paper":"Item 5 - DSG and NFF 2027-28 - Update","committee":"Bristol Schools Forum"},{"lane":"ours","source":"Herefordshire UA","title":"Herefordshire DSG deficit doubles to \u00a336.3m as council faces \u00a383.4m funding gap with no savings plan yet","summary":"Herefordshire's schools-funding deficit, the cumulative overspend on the dedicated schools grant that funds education, nearly doubled to \u00a336.3m in the year to March 2026, up from \u00a320.0m a year earlier. The deficit now equals 45 per cent of all the council's usable reserves. The auditor notes a new significant weakness: the council faces a cumulative funding gap of \u00a383.4m from 2027/28 to 2029/30 for which no savings proposals have yet been developed. The 2026/27 savings target has risen to \u00a320.0m, with \u00a38m already flagged as at risk. The council's transformation programme to tackle the future gap is at an early stage. Against this, children's services delivered substantial improvement: an Ofsted Good rating in January 2026 resulted in removal of the statutory direction that had been in place. The auditor closed two prior-year recommendations on capital governance and children's services progress.","url":"https://councillors.herefordshire.gov.uk/documents/s50135991/50135991.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000019","council":"Herefordshire UA","tag":"DSG / SEND","figures":"Cumulative DSG deficit \u00a336.3m; \u00a316.3m High Needs Block overspend in 2025/26; High Needs Stability Grant covers approx. \u00a332.7m (90%); council liability \u00a33.6m (10%); statutory override expires March 2028","quote":"At 31 March 2026, the council's Dedicated Schools Grant (DSG) cumulative deficit is \u00a336.3 million following a \u00a316.3 million overspend within the High Needs Block... with the remaining balance of \u00a33.6 million (10%) to be a liability of the council once the statutory override period ends in March 2028.","paper":"Appendix A Internal Audit Q2 Progress Report 2026-27","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Dumfries and Galloway","title":"Dumfries and Galloway council secures \u00a350m Levelling Up grants but faces social care audit concerns","summary":"The council has received over \u00a350 million from the UK Government's Levelling Up Fund. Its capital projects \u2014 spending on buildings and other long-lived assets \u2014 are delivering on schedule: the Stranraer Watersports Hub is due to open in September, the Dalbeattie Rocks and Wheels facility is nearing completion, and the George building has attracted eight expressions of interest with a tender exercise in progress. The internal audit's overall opinion is Reasonable, meaning there is a generally sound system of governance, risk management and control in place. However, auditors have flagged two areas requiring ongoing monitoring: social care budgets and IT procurement, indicating these carry elevated risk requiring continuous attention.","url":"https://dumfriesgalloway.moderngov.co.uk/documents/s79230/79230.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"S12000006","council":"Dumfries and Galloway","tag":"audit opinion","figures":"2 areas flagged for ongoing monitoring","quote":"The Internal Audit Manager has regular discussions in particular on two areas of concern \u2013 social care budgets and IT procurement.","paper":"Internal Audit Annual Assurance Report 2025-26","committee":"Audit, Risk and Scrutiny Committee"},{"lane":"ours","source":"Stroud","title":"Stroud audit recommendations unimplemented after four years","summary":"The Audit and Standards Committee has been asked to note that recommendations from internal audits conducted in 2022-23, 2023-24, 2024-25 and 2025-26 remain open, without detail on what the recommendations are or why they have not progressed. The committee is simultaneously being asked to accept assurance opinions on how effectively the council manages its control environment. The meeting also heard that the council's capital financing requirement \u2014 the amount it needs to borrow to fund long-term assets \u2014 stands at \u00a3171.4m at the end of June 2026, \u00a38.1m higher than budgeted for the full year, driven largely by increased social housing spending. The council's cash position is deteriorating due to land acquisitions and housing expenditure, and it will need to borrow additional funds to finance its expanded housing programme, though amounts and timing were deferred to a later report.","url":"https://stroud.moderngov.co.uk/documents/s20993/20993.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000082","council":"Stroud","tag":"borrowing","figures":"External borrowing \u00a3100.717m at 30 June 2026, internal borrowing planned \u00a336,690, next repayment \u00a36m March 2032","quote":"The council's current actual external borrowing is \u00a3100.717m as of 30 June 2026 shown in Table 7 above. The council intends to use internal borrowing of \u00a336,690. The next borrowing to be repaid is \u00a36m in March 2032.","paper":"Internal Audit Progress Report 2026/27","committee":"Audit and Standards Committee"},{"lane":"ours","source":"Gwynedd","title":"Gwynedd accounting errors recur for third year despite remedial measures, auditor reports","summary":"Audit Wales has identified material errors totalling \u00a316.659 million in the council's related party disclosures for the third consecutive year, indicating that existing quality review arrangements are not working effectively in this area. Although the council introduced a dedicated working paper in 2025-26 to address prior-year issues, it was not completed or reviewed properly, and errors recurred. The auditor also noted approximately \u00a33.9 million in uncorrected misstatements in property, plant and equipment valuations and classifications, and over \u00a318 million in errors that required correction before the accounts could be signed off. A new asset indexation process introduced by CIPFA generated multiple errors in application. The council maintains a strong financial position, with \u00a379.2 million in available liquidity against a \u00a310 million target and no requirement for new long-term borrowing based on projections through 2029.","url":"https://democracy.gwynedd.llyw.cymru/documents/s51335/51335.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"W06000002","council":"Gwynedd","tag":"borrowing","figures":"Total borrowing \u00a373.9m (unchanged from 31 March); net investments \u00a311.4m","quote":"No new borrowing was undertaken in the first quarter of 2026/27. This strategy enabled the Council to reduce net borrowing costs (despite foregoing investment income) and reduce overall treasury risk.","paper":"ISA260 Cyngor Gwynedd 2025-26","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Folkestone & Hythe","title":"Folkestone and Hythe projects \u00a3504k deficit as reserve drawdown accelerates to \u00a33.1m","summary":"Folkestone and Hythe is projecting a \u00a3504k revenue deficit for 2026/27 despite budgeting for break-even, and will cover it by drawing down its usable reserves, money set aside for unexpected costs, faster than planned. The council's total reserves are projected to fall by \u00a33.1m to \u00a319.4m by the year-end, a 13.5 per cent decrease. The accelerated drawdown funds a \u00a3456k overspend on housing benefits \u2014 a demand-led area the council anticipated at budget-setting \u2014 plus \u00a3935k of additional capital spending approved in the first quarter. Two strategic projects, Folkestone: A Brighter Future and FOLCA 2, spent substantially more than their annual budgets in the first quarter alone, though the council notes the housing schemes are demand-driven and early-year volatility is common. The council says reserve funding was built in to cover additional pressures, and the deficit and reserve position are being managed within the plan set out in its medium-term financial strategy.","url":"https://folkestone-hythe.moderngov.co.uk/documents/s56726/56726.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000112","council":"Folkestone & Hythe","tag":"borrowing","figures":"Total borrowing cost \u00a35,092k (on budget, no variance). Internal borrowing \u00a354.8m available. 5-year PWLB rates 5.07%, 20-year 6.50%.","quote":"The total cost of borrowing is projected to be \u00a35,092k, mainly due to additional borrowing for the HRA to support the purchase of temporary accommodation, and long-term rates remaining high","paper":"Appendix 3 - Strategic Projects Capital Outturn 26_27 Dashboard","committee":"Finance and Performance Scrutiny Sub-Committee"},{"lane":"policy","source":"MHCLG","title":"Official Statistics: Wildfire incident statistics, England: January 2011 to August 2026 (Provisional)","url":"https://www.gov.uk/government/statistics/announcements/wildfire-incident-statistics-england-january-2011-to-august-2026-provisional","summary":"This ad hoc release provides provisional statistics on wildfire incidents in England from January 2011 to August 2026. It includes information on the number and size of wildfire incidents, associated fatalities and casualties, and fire and rescue service resources used in responding to them.","iso":"2026-09-29T08:57:33+00:00"},{"lane":"markets","source":"City AM","title":"Revive VAT-free shopping to boost high streets, Selfridges urges Burnham","url":"https://www.cityam.com/boost-high-streets-with-vat-free-shopping-selfridges-urges-burnham/","summary":"Selfridges has called on Andy Burnham to reinstate VAT-free shopping for t on Local Government Chronicle (LGC).","iso":"2026-09-28T16:32:51+00:00"},{"lane":"policy","source":"MHCLG","title":"Social Housing Bill to strengthen homelessness prevention and protect social housing stock","url":"https://www.gov.uk/government/news/social-housing-bill-to-strengthen-homelessness-prevention-and-protect-social-housing-stock","summary":"New amendments to the Social Housing Bill will deliver stronger protections for homeless households.","iso":"2026-09-28T16:00:04+00:00"},{"lane":"policy","source":"HM Treasury","title":"Chancellor backs young people into work by supporting jobs","url":"https://www.gov.uk/government/news/chancellor-backs-young-people-into-work-by-supporting-jobs","summary":"The Chancellor has announced a package to help people into work, education and training, while building the skilled workforce Britain needs for the future.","iso":"2026-09-28T15:56:37+00:00"},{"lane":"policy","source":"HM Treasury","title":"More overseas firms enticed to buy British","url":"https://www.gov.uk/government/news/more-overseas-firms-enticed-to-buy-british--2","summary":"Overseas buyers will be offered a new UK Export Finance loan guarantee to incentivise buying goods and services from British companies.","iso":"2026-09-28T15:43:57+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","summary":"Revenue Outturn time series data set covering 2017-18 to 2025-26.","iso":"2026-09-28T12:56:07+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Fire and rescue incident statistics, year ending September 2026","url":"https://www.gov.uk/government/statistics/announcements/fire-and-rescue-incident-statistics-year-ending-june-2026--2","summary":"Statistics on incidents and fires attended by fire and rescue services, fire-related fatalities, casualties from those fires and response times to those fires in England.","iso":"2026-09-28T10:22:35+00:00"},{"lane":"councils","source":"LG finance press","title":"Local-to-local lending pros and cons weighed up by treasury experts - Room151","url":"https://news.google.com/rss/articles/CBMipgFBVV95cUxPUFY5MUN0Vl9ZNG9ZNm9KU21QdTRGVGVUaUEyTUJObW5oOC1FVUZTU1NjTFhxUjZoMlIzQ2ZHV0pIRTVwbVFuOVFYb0s3TUpxNkxNZ0pFNFZWc3IwN0V4aFBVR2FxLUV2RDlBRFJPTmR6bWxTNmFBY2dpVzA4RXlSZXg2dmp3a2tLVEs5YzRQN3Vaa1oyQ19uak1VNWNvMkRNWXNaWTN3?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMipgFBVV95cUxPUFY5MUN0Vl9ZNG9ZNm9KU21QdTRGVGVUaUEyTUJObW5oOC1FVUZTU1NjTFhxUjZoMlIzQ2ZHV0pIRTVwbVFuOVFYb0s3TUpxNkxNZ0pFNFZWc3IwN0V4aFBVR2FxLUV2RDlBRFJPTmR6bWxTNmFBY2dpVzA4RXlSZXg2dmp3a2tLVEs5YzRQN3Vaa1oyQ19uak1VNWNvMkRNWXNaWTN3?oc=5\" target=\"_blank\">Local-to-local lending pros and cons weighed up by treasury experts</a>&nbsp;&nbsp;<font color=\"#6f6f6f","iso":"2026-09-28T09:49:22+00:00"},{"lane":"ours","source":"Isle of Wight UA","title":"Treasury saving of \u00a3925,000 helps Isle of Wight Council manage budget pressures","summary":"Isle of Wight Council's treasury management generated a forecast saving of \u00a3925,000 in the year to March, contributing to management of wider in-year budget pressures. The saving came from lower borrowing costs and increased investment income, the council reported. A further \u00a3655,000 saving is forecast for the current financial year from the same sources. However, the council holds \u00a338.2 million of commercial property investments and must review options for exiting these holdings before taking on further borrowing. Internal audit gave the highest assurance rating to the treasury management controls.","url":"https://iow.moderngov.co.uk/documents/s24049/24049.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000046","council":"Isle of Wight UA","tag":"s114","figures":"One loan outstanding; zero loans to S114 authorities","quote":"Close attention is taken to the financial situation of other local authorities, and no loans have been made to any authority that has issued a S114 notice.","paper":"7e. Treasury Management Report Quarter 4 2025-26","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Worcestershire CC","title":"Worcestershire County Council receives \u00a333.6m emergency support, but auditors warn of structural debt impact","summary":"Worcestershire County Council received \u00a333.6 million of exceptional financial support from the government for 2025/26 to cover day-to-day spending overspend, but auditors warn that the money represents a structural increase to the council's debt position rather than a one-off fix. The grant, provided via a capitalisation direction that treats day-to-day spending as capital spending, will require the council to charge \u00a318.4 million a year from its budget towards repaying the debt over the next 20 years\u2014up \u00a31.2 million from the previous year. Grant Thornton's audit assessment identified significant weaknesses in the council's financial sustainability arrangements, with a statutory recommendation from November 2025 still in progress. The auditors also found control weaknesses in financial systems, including journal entries that can be authorised by the person who writes them, and four IT control recommendations from 2020/21 that remain outstanding.","url":"https://worcestershire.moderngov.co.uk/documents/s61974/61974.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"EFS","figures":"60% of councils, median EFS request \u00a348.5m for social care-driven councils","quote":"Councils citing social care demand as their main driver typically requested higher levels of support, with a median EFS request of \u00a348.5m.","paper":"au 2026 09 28 2025-26 Interim External Auditors Annual Report","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Stockton-on-Tees UA","title":"Stockton-on-Tees increased borrowing by \u00a326.89m in 2025-26 despite capital spending 46% below budget","summary":"Stockton-on-Tees raised net borrowing from \u00a3111.43m to \u00a3138.32m during 2025-26, taking on \u00a340m of new government loans at rates between 4.31% and 4.57%, even as capital spending fell substantially short of plan. The council spent \u00a351.2m of a \u00a394.53m capital budget, leaving \u00a343.35m unspent. The mismatch reflects a deliberate strategy of internal borrowing\u2014using reserves instead of external loans to minimize interest costs\u2014but one that depletes cash cushions and commits the council to heavy future borrowing to meet its underlying need to borrow, or capital financing requirement, of \u00a3202.27m. The council also carries an accumulated schools funding deficit of \u00a317.1m, the costs of servicing which\u2014up to \u00a3500k annually\u2014fall on the general fund rather than schools budgets. Children in care placement costs have escalated the risk to Red, requiring immediate change, while commercial property investments of \u00a314.89m face mandatory review under new government borrowing rules.","url":"https://moderngov.stockton.gov.uk/documents/s23952/23952.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000004","council":"Stockton-on-Tees UA","tag":"LOBO","figures":"\u00a316.0m LOBO loans; average rate 4.87%; weighted average maturity 11.4 years","quote":"On 1st April 2025 the Authority held \u00a316m of LOBO (Lender's Option Borrower's Option) loans... As market interest rates have risen, there is an increased probability of call options on the LOBOs being exercised by lenders.","paper":"Sept 2026 - Risk Management Update - Report","committee":"Audit and Governance Committee"},{"lane":"councils","source":"LGC","title":"Total Place reforms \u2018most important in generations\u2019","url":"https://www.lgcplus.com/politics/governance-and-structure/total-place-reforms-most-important-in-generations-28-09-2026/","summary":"Total Place-style reforms represent \u201cthe biggest and most important reform to how the state delivers in generations,\u201d the first secretary of state has said. Louise Haigh, who is responsible for No10 North and the Cabinet Office, outlined the government\u2019s commitment to use AI and data\u2026\nThe post Total Place reforms \u2018most important in generations\u2019 appeared first on Local Government Chronicle (LGC).","iso":"2026-09-28T08:20:17+00:00"},{"lane":"councils","source":"LGC","title":"McMahon admits \u2018we don\u2019t always make it easy\u2019","url":"https://www.lgcplus.com/politics/governance-and-structure/mcmahon-admits-we-dont-always-make-it-easy-28-09-2026/","summary":"Local government minister Jim McMahon told Labour councillors he \u201crecognised\u201d the impact of government changing its position on local government reorganisation. Speaking at the Local Government Rally at Labour party conference in Liverpool yesterday, Mr McMahon, who returned to the role after Andy Burnham became\u2026\nThe post McMahon admits \u2018we don\u2019t always make it easy\u2019 appeared first on Local Govern","iso":"2026-09-28T07:53:36+00:00"},{"lane":"councils","source":"LGC","title":"Rayner wants councils \u2018to do more\u2019 on housing","url":"https://www.lgcplus.com/services/housing/rayner-wants-councils-to-do-more-on-housing-28-09-2026/","summary":"Councils will be asked to do \u201cmuch more\u201d housebuilding, the communities secretary said in a speech yesterday. Angela Rayner attended the Local Government Rally fringe event at Labour party conference on Sunday afternoon where she spoke about the progress so far on council and social\u2026\nThe post Rayner wants councils \u2018to do more\u2019 on housing appeared first on Local Government Chronicle (LGC).","iso":"2026-09-28T07:50:58+00:00"},{"lane":"policy","source":"HM Treasury","title":"Healey pledges \u201cnew age of industrialisation\u201d as Government backs British shipbuilding","url":"https://www.gov.uk/government/news/healey-pledges-new-age-of-industrialisation-as-government-backs-british-shipbuilding","summary":"Two major maritime projects to be part of \u201cnew age of industrialisation\u201d for Britain.","iso":"2026-09-27T23:01:00+00:00"},{"lane":"policy","source":"MHCLG","title":"New reforms to bring more long-term empty homes back into use","url":"https://www.gov.uk/government/news/new-reforms-to-bring-more-long-term-empty-homes-back-into-use--2","summary":"The changes will bring more long-term empty homes back into use, helping ensure that existing housing stock is used more effectively.","iso":"2026-09-27T05:30:08+00:00"},{"lane":"policy","source":"MHCLG","title":"New first-time buyer scheme to be confirmed at Budget","url":"https://www.gov.uk/government/news/new-first-time-buyer-scheme-to-be-confirmed-at-budget","summary":"The new scheme called Your First Home will support first-time buyers.","iso":"2026-09-26T16:31:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Boarded-up high streets brought back to life with \u00a3210m boost","url":"https://www.gov.uk/government/news/boarded-up-high-streets-brought-back-to-life-with-210m-boost","summary":"Delivers on the Prime Minister\u2019s promise to put power back in local hands and bring good growth to every postcode.","iso":"2026-09-25T19:00:00+00:00"},{"lane":"councils","source":"LGC","title":"Andy Haldane joins new university devolution institute","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/andy-haldane-joins-new-university-devolution-institute-25-09-2026/","summary":"Andy Haldane has been made the first professional fellow at the new Institute of Devolution at Newcastle University. Mr Haldane was previously the chief economist at the Bank of England and also served as the chief executive of the Royal Society of Arts. He is\u2026\nThe post Andy Haldane joins new university devolution institute appeared first on Local Government Chronicle (LGC).","iso":"2026-09-25T15:04:11+00:00"},{"lane":"policy","source":"MHCLG","title":"Correspondence: North East Lincolnshire Council: Local Plan intervention letter","url":"https://www.gov.uk/government/publications/north-east-lincolnshire-council-local-plan-intervention-letter","summary":"The Minister of State for Housing and Planning, the Right Honourable Matthew Pennycook MP, has written to North East Lincolnshire Council about their Local Plan.","iso":"2026-09-25T14:44:44+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Transition of Development Consent Orders and Transport and Work Act Orders to Lawmaker","url":"https://www.gov.uk/government/publications/transition-of-development-consent-orders-and-transport-and-work-act-orders-to-lawmaker","summary":"Guidance about the transition of Development Consent Orders and Transport and Work Act Orders from the SI template to Lawmaker.","iso":"2026-09-25T13:10:23+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Social housing lettings in England, April 2025 to March 2026","url":"https://www.gov.uk/government/statistics/announcements/social-housing-lettings-in-england-april-2025-to-march-2026","summary":"Statistics on new social housing lettings in England in 2025/26 by local authorities and private registered providers, covering tenancies and tenants.","iso":"2026-09-25T13:01:03+00:00"},{"lane":"councils","source":"LGC","title":"Shadow unitary accuses county of withholding Send plan","url":"https://www.lgcplus.com/services/children/shadow-unitary-accuses-county-of-withholding-send-plan-25-09-2026/","summary":"East Surrey shadow unitary authority has accused Surrey CC of withholding the plans to reform the services for children with special needs and disabilities. The Department for Education required every upper tier authority submits a Send reform plan by June as a condition for writing\u2026\nThe post Shadow unitary accuses county of withholding Send plan appeared first on Local Government Chronicle (LGC).","iso":"2026-09-25T10:39:16+00:00"},{"lane":"councils","source":"LGC","title":"Steve Kay: Building a civic alliance for every child","url":"https://www.lgcplus.com/services/children/steve-kay-building-a-civic-alliance-for-every-child-25-09-2026/","summary":"The local outcomes framework offer a chance to organise around the outcomes children experience rather than the institutions that deliver individual services, writes the director of belonging at Sheffield City Council. For more than two decades, education reform has rightly focused on making schools better.\u2026\nThe post Steve Kay: Building a civic alliance for every child appeared first on Local Gove","iso":"2026-09-25T10:31:48+00:00"},{"lane":"councils","source":"LGC","title":"Analysis: Possible fair funding legal challenge","url":"https://www.lgcplus.com/finance/analysis-possible-fair-funding-legal-challenge-25-09-2026/","summary":"London boroughs have been exploring legal routes to challenge fair funding, Jonathan Knott reports. The government\u2019s fair funding settlement is \u201cprobably immune\u201d from legal challenge due to the time passed since it was announced, a lawyer who works with councils has told LGC. However, Victoria\u2026\nThe post Analysis: Possible fair funding legal challenge appeared first on Local Government Chronicle (L","iso":"2026-09-25T09:49:58+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Shropshire payroll control failures persist after four years of audit interventions","summary":"Shropshire Council's payroll systems continue to show control weaknesses after four years of remedial action. The latest audit identified 12 fundamental and 15 significant recommendations for addressing systemic governance failures across payroll, human resources and finance, including management non-compliance, weak oversight and unclear responsibilities. The problems emerge as the council operates under a declared financial emergency with an interim chief financial officer in place. Other audit findings highlighted school deficit governance failures, with Bishops Castle Community College forecast to reach approximately \u00a31m deficit by 2027/28 despite a recovery plan, and purchase order control breaches in 386 of 2,068 same-day orders totalling \u00a3125.1m. The pension fund audit, completed following its three-yearly revaluation, found no material issues and is expected to be fully signed off.","url":"https://shropshire.gov.uk/committee-services/documents/s46580/46580.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Progress update deadline: end September 2026; subsequent quarterly meetings","quote":"Responding to the CIPFA Review recommendations is a requirement of the EFS arrangements and will be monitored by MHCLG as part of the Best Value Notice process.","paper":"SPF Draft 9-107 LGPS Audit Findings Report 2025-26 v2","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Cardiff","title":"Cardiff Council faces \u00a3167m budget gap over four years as savings plans fall short","summary":"Cardiff Council is facing a projected budget shortfall of \u00a3167.1 million between 2027/28 and 2030/31, the Governance and Audit Committee heard on 24 September. The council balanced its 2025/26 budget but acknowledged that delivery of its savings programme is proving uneven: efficiency savings hit 88 per cent of target at \u00a310.9 million, while service change proposals achieved only 76 per cent at \u00a32.3 million. The Audit Committee noted that while the overall position was balanced, some directorates recorded significant overspends requiring control improvements. The council is also facing sustained demand pressures in social care, schools and education, particularly in support for additional learning needs. In a separate governance change, the former Section 151 Officer (chief finance officer) was promoted to Chief Executive in August, with the Deputy Section 151 Officer holding the role on an interim basis for up to 12 months while the senior management structure is reviewed. The council has been explicit about the risk that a Chief Executive permanently holding both roles would compromise independent financial challenge \u2014 guidance from the profession's standards body requires the Section 151 Officer to operate independently from the Chief Executive.","url":"https://cardiff.moderngov.co.uk/documents/s97282/97282.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"s114","figures":"None","quote":"On this basis, as the Section 151 Officer I have concluded that those conditions did not arise during the year and no Section 114 notice was issued in 2025/26.","paper":"Appointment of Section 151 Officer","committee":"Council"},{"lane":"ours","source":"Bradford","title":"Bradford Council's \u00a3113m revenue overspend funded by government as reserves rise \u00a355m","summary":"Bradford Council's accounts for 2025-26 show a revenue overspend of \u00a3113 million, which was funded through a Capitalisation Direction \u2014 government permission to treat day-to-day spending as capital spending and pay for it by borrowing. The overspend was \u00a314 million better than initially forecast. Despite the operating deficit, the council's usable reserves (money set aside for unexpected costs or named purposes) increased by \u00a355 million to \u00a3229.2 million, with a General Fund balance of \u00a353.1 million representing 3.5 per cent of gross expenditure. The external auditors anticipate issuing an unqualified audit opinion on the financial statements. A post-balance-sheet decision to cancel the Square Lane capital project will reduce usable reserves by \u00a34.9 million once abortive costs are formally charged to revenue.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Runnymede","title":"Runnymede Council's General Fund reserves forecast to fall from \u00a321.6m to \u00a32m by 2032","summary":"The General Fund working balance, money set aside as a cushion against unexpected costs, is forecast to fall from \u00a321.6m to \u00a32.0m by 2032. Between 2029 and 2031 alone, reserves are forecast to fall by \u00a311.7m. The Housing Revenue Account (HRA), the council's separate account for its housing stock, faces a \u00a39.1m deficit forecast for 2026/27, reducing reserves from \u00a325.3m to \u00a315.0m, with ongoing annual deficits expected. The Pay and Grading review is the principal driver of General Fund deterioration, creating a \u00a31.241m structural cost pressure. The council is exploring early repayment of one loan using maturing investments and has approved property disposals to reduce borrowing and interest payments. Accounts for 2025/26 remain unfinalized due to resourcing and introduction of a new Financial Management System, meaning opening reserve figures are indicative only.","url":"https://runnymede.moderngov.co.uk/documents/s18927/18927.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"intervention","figures":"Notice issued December 2023; now withdrawn as of September 2026 meeting date","quote":"Following the non-statutory best value notice, which has now been withdrawn","paper":"Q1 - Budget Monitoring report - Appenxix 6 v3 - final","committee":"Corporate Management Committee"},{"lane":"ours","source":"West Suffolk","title":"West Suffolk's audit qualification will persist until \u00a37.8m property revaluation completes","summary":"West Suffolk moved out of audit limbo this year when its external auditor, Ernst & Young, issued a qualified opinion on the 2024-25 accounts\u2014the first audit assurance in three years following the national local audit backlog. The auditor reports no concerns with the council's value-for-money arrangements. However, the qualification cannot be lifted until the council completes revaluation of \u00a37.8 million in property assets last valued in 2022-23. Once revalued, a further two-year lag in the accounts will follow before an unqualified opinion can be issued, putting full clearance at 2027-28 at the earliest. The council signed its 2025-26 draft accounts a month ahead of the extended statutory deadline, and the auditor expects to issue an opinion well in advance of the January 2027 backstop date.","url":"https://democracy.westsuffolk.gov.uk/documents/s59460/59460.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000245","council":"West Suffolk","tag":"audit opinion","figures":"\u00a329.5m cash and investments at 31 March 2026; \u00a310m forecast cash at March 2027; \u00a36.13m General Fund; \u00a352.01m earmarked reserves","quote":"Overall, based on its cash flow forecast, borrowing potential and access to investment funds, as well as the level of general fund and reserve balances it holds, the council determines that it has sufficient liquidity to continue to deliver services for the foreseeable future.","paper":"6-PAS-WS-26-015-EY-Risk-Assessment-Update","committee":"Performance and Audit Scrutiny Committee"},{"lane":"ours","source":"Hammersmith & Fulham","title":"Hammersmith and Fulham cleared audit despite cyber incident and unadjusted investment errors","summary":"Hammersmith and Fulham's accounts for 2025/26 received an unmodified audit opinion, with no going-concern doubts identified, though auditors have yet to complete their assessment of wider legal and fraud impacts from a cyber incident that took the council's pension fund systems offline during the year. The Pension Fund itself also received a clean audit opinion with net assets of \u00a31,462m. However, auditors identified but did not correct a \u00a31.4m overstatement of pension fund Level 3 investments \u2014 valuations used December 2025 figures instead of March 2026 year-end valuations \u2014 and a \u00a31.22m understatement of council property valuations, both exceeding reporting thresholds. Management agreed to reclassify \u00a310m of a \u00a325m joint venture investment from short-term to long-term after auditor challenge. Looking ahead, the council faces medium-term budget gaps of \u00a331.4m in 2027/28 and \u00a357.3m in 2028/29 as government funding reductions take effect, though it holds \u00a3122.1m in reserves.","url":"https://lbhf.moderngov.co.uk/documents/s136009/136009.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000013","council":"Hammersmith & Fulham","tag":"audit opinion","figures":"Total net assets: \u00a31,462.070 million; materiality: \u00a323 million","quote":"Our anticipated financial statements audit report opinion will be unmodified.","paper":"Appendix 4 - LBHF Pension Fund Audit Findings Report 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Babergh","title":"Mid Suffolk cuts borrowing by \u00a314m as Babergh housing scheme loss grows to \u00a34.9m","summary":"Mid Suffolk reduced total borrowing by \u00a314.2m in 2025-26, cutting short-term debt from \u00a318m to \u00a35m and avoiding exposure to rates that had risen to 7 per cent by year-end. Babergh held borrowing steady at \u00a3123.6m. However, Babergh Growth's Hadleigh housing scheme, financed through \u00a313.7m in loans, saw its expected credit loss rise from \u00a33.1m to \u00a34.889m as completed units remained unsold; the final loss will not be known until 2026-27. Both councils' commercial housing ventures underperformed: Mid Suffolk cancelled phase two of its Needham Market scheme, writing off \u00a3877k in costs before selling the land for \u00a32.7m. The councils' main investment subsidiary, CIFCO Ltd, held \u00a343.3m in loans from each council with \u00a3434k in expected credit losses and \u00a31.3m in cumulative deferred interest payments as it defers roughly 13 per cent of annual interest due through 2028.","url":"https://baberghmidsuffolk.moderngov.co.uk/documents/s43661/43661.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000200","council":"Babergh","tag":"LOBO","figures":"\u00a34m LOBO loans outstanding; average rate 4.21%; call dates February and August each year","quote":"The lender has not exercised its option during 2025/26.","paper":"MC/26/15 Annual Treasury Management Report 2025-26","committee":"Mid Suffolk Council"},{"lane":"ours","source":"City of Edinburgh","title":"Edinburgh Council's \u00a332m surplus masks structural budget pressures and reliance on one-off income","summary":"Edinburgh Council's accounts for 2025-26 were approved by auditors without qualification, showing an overall underspend of \u00a332.2m. However, the council's own papers acknowledge that the surplus masks underlying financial pressures. More than \u00a324.9m of the underspend came from a non-recurring legal settlement, and the council states the outturn position reflects \"one-off mitigations of underlying pressures or savings shortfalls\". The council delivered only 70% of \u00a343.2m in planned savings, with delays concentrated in demand-led services such as home to school transport and property maintenance. Council tax income fell by \u00a31.7m due to reduced growth in the property tax base, a permanent structural loss. Capital spending underspent by \u00a338.2m, partly because housing acquisitions for temporary accommodation fell \u00a320m short of target. The auditor noted that the council plans substantial increases in borrowing and debt over the next five years, presenting significant risk to longer-term financial sustainability, and identified governance weaknesses requiring attention.","url":"https://edinburgh.moderngov.co.uk/documents/s103738/103738.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"S12000036","council":"City of Edinburgh","tag":"LOBO","figures":"\u00a332m market debt repaid (including two LOBOs); outstanding LOBO debt \u00a3122.4m","quote":"The lenders exercised their option to request an increase in the interest rate paid on the loans and the Council exercised its option to repay the loans at par with no penalty.","paper":"8.3 Revenue monitoring outturn 25-26","committee":"Finance and Resources Committee"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"ours","source":"Slough UA","title":"Slough forecasts \u00a319.9m overspend in 2026-27, with \u00a315.955m driven by children's social care placements","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consulta function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
