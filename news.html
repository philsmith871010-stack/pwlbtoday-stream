<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

m schools deficit dependent on government funding approval","summary":"Lincolnshire's spending on schools overspent by \u00a313.4m in 2025-26, revealing a structural deficit of \u00a325m once school reserves are excluded. The dedicated schools grant (DSG), which funds schools, was strained by continued pressure in the high needs block (support for children with special educational needs and disabilities). The council states that government will support approximately 90 per cent of the deficit through 31 March 2026, but only if the council submits an approved special educational needs and disabilities reform plan. The council also wrote off \u00a35.3m in carry-forward overspends from day-to-day services\u2014including \u00a35m in children's social care and adult care combined\u2014rather than roll them into next year's budget, to avoid compounding existing demand pressures already forecast for 2026-27.","url":"https://lincolnshire.moderngov.co.uk/documents/s75550/75550.pdf","iso":"2026-09-18T09:00:00+00:00","gss":"E10000019","council":"Lincolnshire CC","tag":"DSG / SEND","figures":"\u00a313.406m DSG overspend in 2025-26; structural deficit of \u00a325.005m; government support for approximately 90% of deficits to 31 March 2026","quote":"The Dedicated Schools Grant overspent by \u00a313.406m, driven by continued pressure within the High Needs block. Excluding school balances, this reflects a structural deficit of \u00a325.005m carried forward.","paper":"Review of Financial Performance 2025-26 v4","committee":"Council"},{"lane":"ours","source":"Leicestershire CC","title":"Leicestershire restrains borrowing to \u00a387m as capital programme expands","summary":"Leicestershire County Council has expanded its capital programme\u2014its spending on buildings, roads and equipment\u2014to \u00a3181m, \u00a317m above forecast, but is borrowing just \u00a387m against a forecast of \u00a3145m, suggesting greater reliance on internal resources. This financial caution comes against economic headwinds: the economy has contracted for the first time since August 2025, and income from commercial activities has fallen to 1.0% of annual spending from a forecast 1.3%. The council's prior-year accounts were signed off with an unmodified audit opinion, meaning the auditor found no issues with them. The council has flagged that expansion of services for children with special educational needs depends on capital investment that may not be available.","url":"https://democracy.leics.gov.uk/documents/s198423/198423.pdf","iso":"2026-09-18T09:00:00+00:00","gss":"E10000018","council":"Leicestershire CC","tag":"LOBO","figures":"FMS: \u00a310m at 4.75%, maturity 2054; Dexia: \u00a310m at 4.50%, maturity 2065; zero premiums on LOBO repayments","quote":"The lender exercised their call option to change the interest rates on the loans (to a significantly higher rate). As a result, the Council took the opportunity to repay these loans, no premiums apply in these circumstances.","paper":"Appendix B - Prudential and Treasury Indicators 2026-27","committee":"Corporate Governance Committee"},{"lane":"policy","source":"HM Treasury","title":"Transparency data: HMT workforce management information: August 2026","url":"https://www.gov.uk/government/publications/hmt-workforce-management-information-august-2026","summary":"This document details monthly management information on staff numbers and paybill costs within HM Treasury and its agencies.","iso":"2026-09-18T08:35:10+00:00"},{"lane":"markets","source":"Reuters UK","title":"Sterling ticks up after UK retail sales beat expectations - Reuters","url":"https://news.google.com/rss/articles/CBMipAFBVV95cUxNeDlZZGxoVWp3MkprcjEySnFtWlp4SlJYRkVzMWhwTU5BM1JFZmtNU0tBeWkyZ01OX1dsYVBHQlk5SjM2QWRsaGY5ZXZRYk1VdVEwM0FmLWZ3THZDTkl2Wmp0ZlVzbUJac1JfTmdweDFWck9OUVFLSWRfTlhlV0o0c0FRMldPUlFtaXFIYkRhUWU0UXZEeDhBcW84Q3FZZDBhaFJMcQ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMipAFBVV95cUxNeDlZZGxoVWp3MkprcjEySnFtWlp4SlJYRkV erism\u2019 to make devolution work, says LATIF panel</a>&nbsp","iso":"2026-09-17T14:05:33+00:00"},{"lane":"markets","source":"Bank of England","title":"Transcript of the Governor's pooled broadcast interview given on 17 September 2026","url":"https://www.bankofengland.co.uk/news/2026/september/the-governor-interview-transcript-17-september-2026","summary":"Following the publication of the Monetary Policy Summary and minutes of the Monetary Policy Committee meeting","iso":"2026-09-17T13:30:00+00:00"},{"lane":"markets","source":"Bank of England","title":"Monetary Policy Committee dates for 2027","url":"https://www.bankofengland.co.uk/news/2026/september/mpc-dates-for-2027","summary":"2027 confirmed dates","iso":"2026-09-17T13:30:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Pride in Place Programme: Plans for Phase 2 places","url":"https://www.gov.uk/government/publications/pride-in-place-programme-pride-in-place-plans-for-phase-2-places","summary":"Information on how places can draft their Pride in Place Plan, what content to include, and the submission process.","iso":"2026-09-17T13:00:02+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Pride in Place Programme prospectus and guidance","url":"https://www.gov.uk/government/publications/pride-in-place-programme-prospectus","summary":"The Pride in Place Programme is our flagship communities programme which empowers local people to shape the future of their neighbourhood.","iso":"2026-09-17T13:00:02+00:00"},{"lane":"councils","source":"LGC","title":"West Yorkshire chief exec set to leave","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/west-yorkshire-chief-exec-set-to-leave-17-09-2026/","summary":"The chief executive of the West Yorkshire CA, Ben Still, is set to leave the position in November. Dr Still will stand down after ten years in the position and is set to join Thames Freeport. He began his tenure as managing director in 2016,\u2026\nThe post West Yorkshire chief exec set to leave appeared first on Local Government Chronicle (LGC).","iso":"2026-09-17T12:30:48+00:00"},{"lane":"policy","source":"HM Treasury","title":"Correspondence: Open letters between HM Treasury and Bank of England, September 2026","url":"https://www.gov.uk/government/publications/open-letters-between-hm-treasury-and-bank-of-england-september-2026","summary":"CPI inflation was 3.1% in August 2026, prompting an open letter from the Governor of the Bank of England to the Chancellor on 17 September 2026. The Chancellor replied to the Governor on 17 September 2026.","iso":"2026-09-17T11:18:11+00:00"},{"lane":"policy","source":"HM Treasury","title":"Correspondence: Update on the Asset Purchase Facility (APF)","url":"https://www.gov.uk/government/publications/update-on-the-asset-purchase-facility-apf","summary":"The Chancellor of the Exchequer and Governor of the Bank of England announced updates relating to the Asset Purchase Facility (APF) through an exchange of letters.","iso":"2026-09-17T11:10:35+00:00"},{"lane":"markets","source":"Bank of England","title":"Exchange of letters between the Governor and the Chancellor regarding CPI Inflation - September 2026","url":"https://www.bankofengland.co.uk/letter/2026/cpi-inflation-september-2026","summary":"Exchange of letters between the Governor and the Chancellor","iso":"2026-09-17T11:00:00+00:00"},{"lane":"markets","source":"Bank of England","title":"Exchange of letters between the Governor and the Chancellor regarding QT and the APF - September 2026","url":"https://www.bankofengland.co.uk/letter/2026/exchange-of-letters-between-the-governor-and-the-chancellor-regarding-qt-and-the-apf","summary":"Exchange of letters between the Governor and the Chancellor","iso":"2026-09-17T11:00:00+00:00"},{"lane":"markets","source":"Bank of England","title":"Bank rate maintained at 3.75% - September 2026 Monetary Policy Summary and Minutes","url":"https://www.bankofengland.co.uk/monetary-policy-summary-and-minutes/2026/september-2026","summary":"The Bank of England\u2019s Monetary Policy Committee is responsible for making decisions about Bank Rate.","iso":"2026-09-17T11:00:00+00:00"},{"lane":"markets","source":"Bank of England","title":"Asset Purchase Facility: Gilt Sales \u2013 Market Notice 17 September 2026","url":"https://www.bankofengland.co.uk/markets/market-notices/2026/asset-purchase-facility-gilt-sales-market-notice-17-september-2026","summary":"This Market Notice outlines the Bank Executive\u2019s approach to implementing the Monetary Policy Committee\u2019s (MPC) decision to unwind the gilts held for monetary policy purposes in the Asset Purchase Facility (APF). As part of this, Bank APF auctions will be paused while the Bank reviews a model of selling gilts to the Government.","iso":"2026-09-17T11:00:00+00:00"},{"lane":"councils","source":"Distress watch","title":"Bradford Council awarded extra \u00a312m in SEND funding - Rayo","url":"https://news.google.com/rss/articles/CBMiiwFBVV95cUxQaXEyQVYxaXJjVnpHajM0b2sxeXU2ODlCOE1pLXV3NTYtSlQ2VkV5S0N5SDdUNEFEMmxJaE9zZTN6bDEzQmdUQjJ5VlFsUU1BMHE4YXEyck1wRHZubk90elJXckFJQ0w1WEtXWHVzYW9wVG41LXFVeURqMlp0OTFDTmg0ZmV5dHZBbFh3?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiiwFBVV95cUxQaXEyQVYxaXJjVnpHajM0b2sxeXU2ODlCOE1pLXV3NTYtSlQ2VkV5S0N5SDdUNEFEMmxJaE9zZTN6bDEzQmdUQjJ5VlFsUU1BMHE4YXEyck1wRHZubk90elJXckFJQ0w1WEtXWHVzYW9wVG41LXFVeURqMlp0OTFDTmg0ZmV5dHZBbFh3?oc=5\" target=\"_blank\">Bradford Council awarded extra \u00a312m in SEND funding</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Rayo</font>","iso":"2026-09-17T10:20:33+00:00"},{"lane":"councils","source":"LGC","title":"How we put nature at the heart of growth","url":"https://www.lgcplus.com/idea-exchange/how-we-put-nature-at-the-heart-of-growth-17-09-2026/","summary":"Enfield LBC\u2019s rural transformation team won the small team of the year category at the LGC Awards 2026. Here is an edited version of their winning submission. The LGC Awards 2027 are moving from June to March, with an earlier entry deadline of 16 October.\u00a0Explore\u2026\nThe post How we put nature at the heart of growth appeared first on Local Government Chronicle (LGC).","iso":"2026-09-17T10:01:51+00:00"},{"lane":"councils","source":"LGC","title":"Chiefs continue LGR prep despite the pause","url":"https://www.lgcplus.com/politics/governance-and-structure/chiefs-continue-lgr-prep-despite-the-pause-17-09-2026/","summary":"Council chief executives are continuing preparations for local government reorganisation despite the government\u2019s decision to pause the programme. Communities secretary Angela Rayner announced last week that four LGR programmes in Essex, Hampshire, Suffolk and Norfolk have been withdrawn and the remaining 14 areas have been\u2026\nThe post Chiefs continue LGR prep despite the pause appeared first on Loc","iso":"2026-09-17T09:59:04+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Common Ground Award 2026 to 2027: prospectus","url":"https://www.gov.uk/government/publications/common-ground-award-2026-to-2027-prospectus","summary":"Grant prospectus for a competitive award that will invest capital funding into organisations effectively promoting social cohesion in England.","iso":"2026-09-17T09:24:21+00:00"},{"lane":"ours","source":"Croydon","title":"Croydon's auditor renews demand to solve debt crisis as \u00a31.5bn burden persists","summary":"Croydon's auditor has carried forward its core statutory recommendation unchanged, requiring the council to work with newly appointed Commissioners to develop a plan that will reduce operating costs and return the authority to financial self-sufficiency. The council's General Fund debt stands at \u00a31.5bn, costing \u00a382m a year to service. The 2025/26 budget relied on \u00a3108.7m of government capitalisation directions\u2014temporary permission to treat day-to-day spending as capital spending, allowing it to be financed by borrowing. The auditor has rated the council's financial sustainability as red, the lowest possible rating, citing continued weakness in cost reduction and reliance on government support. A separate schools funding deficit has reached \u00a357.6m, growing by \u00a329.4m in the past year alone, and the council faces a \u00a345m annual subsidy gap on temporary accommodation.","url":"https://croydon.moderngov.co.uk/documents/s72885/72885.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"EFS","figures":"\u00a327.3m Stabilisation Plan achieved; continued reliance on Exceptional Financial Support","quote":"The Council's financial position remains the most significant governance weakness and the delivery of the outcomes in the Financial Strategy 2027-30 provides the road map to achieving financial sustainability","paper":"Progress Update and Annual Head of Internal Audit Report","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Hillingdon","title":"Hillingdon's homelessness budget masks rising demand, council warns","summary":"Hillingdon Council started the financial year 2026/27 with 155 fewer households than budgeted in nightly-paid emergency accommodation, putting the homelessness budget on track for a \u00a33.4m underspend. But the council's month-four budget monitoring reveals a troubling reversal. Placements in the first four months increased by 11, against a budgeted reduction of 7 over the same period. The cabinet has identified a \u00a31.2m risk should this trend continue for the remainder of the year. The underlying demand for emergency housing is moving in the wrong direction, the council concluded, and the favourable variance that opened the year is closing.","url":"https://modgov.hillingdon.gov.uk/documents/b15940/Cabinet Agenda B - Budget Monitoring 17th-Sep-2026 19.00 CABINET.pdf?T=9","iso":"2026-09-17T09:00:00+00:00","gss":"E09000017","council":"Hillingdon","tag":"EFS","figures":"\u00a361.388m revenue costs capitalized under Exceptional Financial Support","quote":"Excluding the in-principle approval from the Ministry of Housing, Communities and Local Government [MHCLG] to allow the Council to capitalise \u00a361.388m of revenue costs as part of its Exceptional Financial Support","paper":"Cabinet Agenda B - Budget Monitoring","committee":"CABINET"},{"lane":"ours","source":"Brighton & Hove UA","title":"Brighton and Hove faces severe budget crisis as adult social care demand outpaces savings","summary":"Brighton and Hove is forecasting an overspend of \u00a320.852m on its main operating budget in 2026/27, with additional risks of \u00a316.949m, driven primarily by soaring demand in adult social care and temporary accommodation. The council's transformation programmes are delivering projects on time, but savings are being overwhelmed by rising demand and costs. Residential placements in adult social care cost around \u00a320,000 per week, with small changes in placement numbers significantly affecting the forecast. Temporary accommodation faces a \u00a312m budget increase, but only \u00a35.14m of proposed mitigations. The council is requesting government borrowing of up to \u00a330m, called Exceptional Financial Support, to cover the shortfall. It warns that without approval, the chief financial officer must file a Section 114 notice, a formal warning that the council cannot balance its budget.","url":"https://democracy.brighton-hove.gov.uk/documents/s217111/217111.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E06000043","council":"Brighton & Hove UA","tag":"EFS","figures":"\u00a330m EFS request for 2026/27","quote":"The forecast position has required the Council to approach MHCLG to request more Exceptional Financial Support for 2026/27, expected to be a sum of up to \u00a330m. It should be noted that this is additional borrowing, not additional funding.","paper":"Appendix 1- Adult Social Care savings extract from Full Council Budget report 26th February pages 51,52 and 53","committee":"Cabinet"},{"lane":"ours","source":"Liverpool","title":"Liverpool reserves fall to critical low after repeated budget overruns","summary":"Liverpool City Council's financial cushion has shrunk to its smallest level in years, leaving it dangerously exposed to unexpected costs or service pressures. The council's general reserves\u2014money set aside for emergencies\u2014fell to \u00a325.4m at the end of March 2026, down from the \u00a336.8m originally planned, after the council overspent its budget for the second year running. It overspent by \u00a323.8m in 2024/25 and \u00a311.7m in 2025/26. The council's chief finance officer stated the authority now holds \"a very low level of usable reserves which will reduce the ability of the council to manage its continuing financial challenges going forward.\" The audit committee heard this follows years of demand-driven overspends in adult social care (\u00a315.3m), children's services (\u00a317.5m) and homelessness (\u00a321.2m), pressures the council says reflect national trends but will persist unless it delivers planned savings and manages rising demand more effectively.","url":"https://councillors.liverpool.gov.uk/documents/s328596/328596.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E08000012","council":"Liverpool","tag":"audit opinion","figures":"General Fund Reserve \u00a325.389m as buffer against \u00a3756m revenue spend","quote":"Nevertheless, the issues of sustainability and liquidity are overriding concerns for the council despite the going concern prescription. In this respect the key risks for the council are the ability to manage its budget within available resources and the need to maintain adequate reserve balances to mitigate the risks of unexpected cost pressures and difficulties in delivering approved savings programmes.","paper":"Appendix 1 for Draft Statement of Accounts and Draft Annual Governance Statement for 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Stockton-on-Tees UA","title":"Stockton-on-Tees council faces \u00a35.8m revenue overspend with reserves at risk","summary":"The council is forecasting a \u00a35.8m overspend on day-to-day spending of \u00a3293.8m, which it describes as a \"significant financial challenge\". If it materialises, reserves would fall to \u00a316.3m by year-end, which the council states is \"materially below the reserve levels assumed when the budget was approved in February and is not considered sustainable over the medium term.\"\n\nThe pressures include a \u00a315.2m overspend in the schools budget, particularly in the dedicated schools grant high needs block, the funding for children with special educational needs. Independent special school placements are \u00a35.15m over and out-of-area placements \u00a33.6m over. Children's external residential placements are \u00a32.96m overspent. The new waste service, launched in April, is \u00a31.1m over budget on vehicles.\n\nThe council expects the government to write off approximately \u00a315.4m of a cumulative \u00a317.13m schools funding deficit, with approval expected in October, but would still need to fund approximately \u00a31.52m annually. For the coming year, the council must find \u00a31.48m in savings, with larger gaps of \u00a310.3m and \u00a314.8m forecast in the following two years.","url":"https://moderngov.stockton.gov.uk/documents/s23864/23864.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E06000004","council":"Stockton-on-Tees UA","tag":"DSG / SEND","figures":"\u00a315.2m in-year DSG overspend; independent special schools \u00a35.15m overspend; out-of-area schools \u00a33.6m overspend (177 placements vs 138 budgeted); Academy high needs top-ups \u00a34.4m overspend; assumed council contribution 10% = \u00a31.52m","quote":"The overall DSG is forecast to show an in year overspend of \u00a315.2m, we are therefore assuming \u00a31.52m will be required to be funded in the current financial year.","paper":"MTFP Q1 Position June","committee":"Cabinet"},{"lane":"ours","source":"Redbridge","title":"Redbridge's budget shortfall widens to \u00a38.5m as council struggles to deliver savings plan","summary":"Redbridge Council's forecast overspend for 2026-27 has worsened by more than half in one month, reaching \u00a38.5m by the end of quarter one, the Cabinet was told this week. In July the overspend stood at \u00a35.4m. The council is meeting this position only by relying on \u00a316.1m of mitigating actions \u2014 unplanned cuts and savings that have yet to materialise. Officials warned that \u00a34.2m of the overspend is ongoing and will carry forward, making next year's budget-setting \"far more difficult\". The Cabinet also heard that only 17 per cent of the council's planned \u00a315.8m savings programme is on track; 56 per cent is at risk of non-delivery. A separate crisis is building in school funding: high needs special education spending is forecast to overspend by \u00a317.4m this year alone, creating a cumulative deficit of \u00a326.5m by March 2027. Redbridge remains dependent on government emergency financial support.","url":"https://moderngov.redbridge.gov.uk/documents/s175109/175109.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000026","council":"Redbridge","tag":"DSG / SEND","figures":"\u00a37.034m estimated High Needs Stability Grant (90% of \u00a37.815m eligible to March 2026); \u00a30.782m residual deficit requiring general fund cover; \u00a30.536m additional amount under DfE review; \u00a317.352m additional forecast deficit in 2026/27","quote":"If not mitigated this will need to be met from the General Fund when the statutory override ceases.","paper":"Budgetary Control Report for Quarter 1 (2) - Report (1)","committee":"Cabinet"},{"lane":"ours","source":"Guildford","title":"Guildford Council forecasts \u00a31m overspend as income and staffing costs slip","summary":"Guildford Borough Council is projecting a General Fund overspend of \u00a31.066 million for 2026\u201327, the council's Executive heard on 17 September. The shortfall reflects a combination of income failures and cost pressures across multiple services. Trade Waste income is underachieving by \u00a3487,000 against a budgeted \u00a31.857 million; agency and casual staffing costs in Environmental Services are running \u00a3350,000 over budget; a delayed staffing restructure in Community Services has added \u00a375,000 to costs; and the council is requesting a supplementary estimate of \u00a3200,000 for unbudgeted IT expenses, to be funded from reserves. Officers are monitoring the position and will review pressures during the year, but the forecast suggests the council's original budget materially underestimated both its spending and the income it would receive.","url":"https://guildford.moderngov.co.uk/documents/s45595/45595.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E07000209","council":"Guildford","tag":"audit opinion","figures":"2 prior years unaudited; disclaimer issued Q3 2025/26; 4-year improvement plan in place","quote":"An audit of the Statement of Accounts for 2025/26 was undertaken by external audit in Q3 2025/26 and was given a disclaimer of opinion due to the 2 previous years accounts being unaudited.","paper":"Risk Management &amp; Corp Risk Registers (Q1 2026-27)","committee":"Executive"},{"lane":"ours","source":"Aberdeenshire","title":"Aberdeenshire faces \u00a330.5m refinancing bill as three bank loans called at higher rates","summary":"Aberdeenshire Council has repaid three bank loans totalling \u00a330.5m after lenders exercised their option to raise interest rates by 2\u20133 percentage points. The loans, known as LOBO loans (lender option, borrower's option), were called with proposed rates of between 6.70% and 7.48%, compared to existing rates of between 3.70% and 4.65%. The Council chose to repay rather than accept the higher charges, but must now refinance the debt in a market where interest rates are expected to remain elevated. The refinancing need coincides with a deeper structural budget challenge. The council's Business Services directorate is forecasting a \u00a31.865m underspend this year, but has warned this is temporary: it stems from vacant posts that will be filled, uncertain property income, and timing effects that will unwind. Of \u00a3479,000 in savings the council agreed to make, only \u00a3220,000 has been achieved nine months in. The council has explicitly stated that reserves \u2014 currently providing temporary support \u2014 cannot solve its fundamental budget shortfall and that \"reliance on reserves do not remove the need to identify and deliver recurring savings.\"","url":"https://aberdeenshire.moderngov.co.uk/documents/s48155/48155.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"S12000034","council":"Aberdeenshire","tag":"LOBO","figures":"\u00a310.0m at 3.70% (proposed 6.70%); \u00a35.5m at 4.40% (proposed 6.72%); \u00a315.0m at 4.65% (proposed 7.48%); total \u00a330.5m","quote":"The lender option exercises resulted in proposed revised rates that were significantly above the existing loan rates. The Council therefore exercised its option to repay the loans without breakage cost.","paper":"Appendix 1 - Business Services Performance 2026/27","committee":"Business Services Committee"},{"lane":"ours","source":"Wolverhampton","title":"Wolverhampton repays \u00a317m in loans amid sharp rate hike demands","summary":"Wolverhampton Council rejected proposals to increase rates on three bank loans totaling \u00a317m and chose instead to repay them in full. LOBO loans are bank loans where lenders can propose new terms on set dates. Between July 2025 and January 2026, a \u00a37m Commerzbank loan came with a proposed rate of 6.19%, compared with its existing 3.60%; two \u00a35m Dexia loans proposed 6.21% and 6.26%, against existing rates of 4.26% and 4.29%. According to the Treasury Management Annual Report, this refinancing required \u00a317m in cash but protected the council from substantially higher day-to-day running costs.","url":"https://wolverhampton.moderngov.co.uk/documents/s329075/329075.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E08000031","council":"Wolverhampton","tag":"LOBO","figures":"\u00a317m total LOBO calls: Commerzbank \u00a37m (3.60% to 6.19%), Dexia \u00a35m (4.26% to 6.21%), Dexia \u00a35m (4.29% to 6.26%)","quote":"During 2025-2026 the following LOBOs were 'called' and the Council decided to reject the proposal and the loans were repaid:","paper":"Appendix A Treasury Management Annual Report 2526 Activity Monitoring Quarter One 2627","committee":"Resources and Equality Scrutiny Panel"},{"lane":"ours","source":"East Dunbartonshire","title":"East Dunbartonshire to exhaust cash reserves funding housing investment by 2029","summary":"East Dunbartonshire Council plans to spend down nearly all its cash buffer over the next three years to fund a sharply expanding housing investment programme, figures released at its audit committee show. The council's under-borrowed position \u2014 the difference between what it has borrowed and what it needs to borrow \u2014 will narrow from \u00a327.6m to just \u00a31.7m by 2028/29, a reduction of 94%. The shift reflects capital spending on the Housing Revenue Account peaking at \u00a386.4m in 2027/28, more than five times the \u00a316m spent in 2024/25. Once cash reserves are exhausted, the council will need to borrow for all new capital projects. The plans come as auditors raised concerns about the strength of the council's financial controls, identifying material errors in asset accounting and recommending a full reconciliation of the fixed asset register.","url":"https://eastdunbarton.moderngov.co.uk/documents/s18646/18646.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"S12000045","council":"East Dunbartonshire","tag":"borrowing","figures":"Under-borrowing 2025/26 \u00a327.565m, 2026/27 \u00a319.906m, 2027/28 \u00a312.004m, 2028/29 \u00a31.684m","quote":"Under/(Over) borrowing  30.248 27.565 19.906 12.004 1.684","paper":"Annual Audit Report 2023/24","committee":"Audit & Risk Management Committee"},{"lane":"ours","source":"Halton UA","title":"Halton faces \u00a372.567m five-year deficit despite \u00a329.8m savings plan","summary":"Halton Council will face cumulative deficits of \u00a372.567m over five years from 2027 to 2032, according to a medium-term financial strategy approved by the Executive Board on 17 September. It will face annual shortfalls throughout the period, starting with \u00a311.667m in 2027/28. A savings programme of \u00a329.8m will still leave a structural deficit of \u00a372.567m. A review by CIPFA, commissioned by government, found the council's position \"extremely fragile\" and said it is \"unlikely to be stabilised without continued Exceptional Financial Support\" \u2014 permission from government to borrow to cover day-to-day spending. The council has drawn on such support for three consecutive years. If government does not approve further support, the Section 151 Officer (the council's chief finance officer) must issue a Section 114 Notice, freezing all new spending and requiring the council to meet within 21 days to reduce expenditure.","url":"https://moderngov.halton.gov.uk/documents/s83255/83255.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E06000006","council":"Halton UA","tag":"EFS risk","figures":"\u00a333.873m EFS in 2026/27; \u00a327.504m annual revenue cost by 2031/32 (12.7% of resources); \u00a310m (2024/25), \u00a314.7m (2025/26)","quote":"the revenue costs associated with Exceptional Financial Support will reach an estimated \u00a327.504m in 2031/32, representing approximately 12.7% of the anticipated total resources. It is therefore essential that the Council's costs are reduced significantly, and at pace","paper":"9 - MTFS 2027-2031 Executive Board","committee":"Executive Board"},{"lane":"councils","source":"LGC","title":"CCN call for \u2018material change\u2019 to LGR","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/ccn-call-for-material-change-to-lgr-17-09-2026/","summary":"The pause and review of local government reorganisation should result in a \u201cmaterial change of direction\u201d, the County Councils Network has said. Last Monday the government announced it was reviewing LGR and withdrew its decisions in four areas \u2013 Norfolk, Suffolk, Essex and Hampshire. CCN\u2026\nThe post CCN call for \u2018material change\u2019 to LGR appeared first on Local Government Chronicle (LGC).","iso":"2026-09-17T08:42:28+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","summary":"Revenue Outturn time series data set covering 2017-18 to 2025-26.","iso":"2026-09-17T08:30:09+00:00"},{"lane":"councils","source":"LG finance press","title":"People with very different severities of disability currently get the same amount of PIP - IFS | Institute for Fiscal Studies","url":"https://news.google.com/rss/articles/CBMingFBVV95cUxOcmdRQ0lBUVNvRC1YTXQtSFVENU9YVXZWemlhYWVyOEE1Y3gzTVByNzlZSDBDWllnem9HbF8tc2xlS2tBaUlKSEhJcnAyUWhyc0NfaGZQeVlrcmxjSE5ScE5oajlqbW41d2RBYTRYckpBWjRmOFN3a2FzN1NHU3hkNzg1Ymg1cGNPX2VjUlEySHRrUTBPY29GTkpyczRSQQ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMingFBVV95cUxOcmdRQ0lBUVNvRC1YTXQtSFVENU9YVXZWemlhYWVyOEE1Y3gzTVByNzlZSDBDWllnem9HbF8tc2xlS2tBaUlKSEhJcnAyUWhyc0NfaGZQeVlrcmxjSE5ScE5oajlqbW41d2RBYTRYckpBWjRmOFN3a2FzN1NHU3hkNzg1Ymg1cGNPX2VjUlEySHRrUTBPY29GTkpyczRSQQ?oc=5\" target=\"_blank\">People with very different severities of disability currently get the same amount of PIP</a>&nbsp;&nbsp;<font col","iso":"2026-09-17T03:05:41+00:00"},{"lane":"councils","source":"LG finance press","title":"Options for reforming personal independence payment - IFS | Institute for Fiscal Studies","url":"https://news.google.com/rss/articles/CBMihgFBVV95cUxPMmlyS2h nt Survey 2025/26: heritage","url":"https://www.gov.uk/government/statistics/community-and-engagement-survey-202526-heritage","summary":"The findings of the Community and Engagement Survey for heritage in 2025/26.","iso":"2026-09-16T13:42:32+00:00"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"councils","source":"LGC","title":"\u2018Blueprint\u2019 for fiscal devolution","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/blueprint-for-fiscal-devolution-16-09-2026/","summary":"Scrapping integrated funding settlements and instead allowing mayors to keep a share of local tax revenues could help regional economies grow faster, according to an influential think tank. Centre for Cities has published a cost-neutral \u201cblueprint\u201d for how locally-generated tax receipts could replace Treasury funding\u2026\nThe post \u2018Blueprint\u2019 for fiscal devolution appeared first on Local Government Ch","iso":"2026-09-16T09:00:05+00:00"},{"lane":"policy","source":"HM Treasury","title":"Official Statistics: Forecasts for the UK economy: September 2026","url":"https://www.gov.uk/government/statistics/forecasts-for-the-uk-economy-september-2026","summary":"A comparison of independent forecasts for the UK economy in September 2026.","iso":"2026-09-16T09:00:04+00:00"},{"lane":"ours","source":"Thurrock UA","title":"Commissioners flagged ongoing capital delivery challenges and demand stronger governance and oversight.","summary":"Operating under commissioner oversight with flagged delivery failures indicates governance weaknesses affecting major infrastructure deployment and future cost control.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"ours","source":"Ceredigion","title":"Internal borrowing strategy is delivering \u00a30.5m interest savings against the annual budget.","summary":"The revenue budget includes this \u00a30.5m interest saving as a benefit of the internal borrowing strategy, but the benefit depends on the council maintaining adequate investment balances; if cash pressures increase or capital needs require deploying these funds, this structural budget benefit disappears.","url":"https://council.ceredigion.gov.uk/documents/s11570/11570.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"W06000008","council":"Ceredigion","tag":"borrowing","figures":"\u00a352.5m investments, \u00a30.5m favourable variance, \u00a35.7m interest budget","quote":"the Council has a fairly significant cash balance and is maintaining an internal borrowing position which is helping to deliver revenue savings","paper":"Appendix 3 - Quarterly Treasury Management Performance Report 2026-27","committee":"Corporate Resources Overview and Scrutiny Committee"},{"lane":"ours","source":"Salford","title":"Available investment balances declined by 32% in one year while internal borrowing increased, tightening financial flexibility.","summary":"Declining investment balances constrain the council's financial flexibility and raise questions about medium-term sustainability of capital spending and reserve adequacy.","url":"https://salford.moderngov.co.uk/documents/s97038/97038.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"borrowing","figures":"Available for investment: \u00a3106.2m (2025) \u2192 \u00a372.7m (2026); Internal (over) borrowing: \u00a3224.7m \u2192 \u00a3256.6m","quote":"available for investment 106.2 72.7","paper":"11 Treasury Management Annual Report 2025-26","committee":"Council"},{"lane":"ours","source":"Durham UA","title":"County Durham faces cash crisis as \u00a383.7m budget deficit exhausts reserves in two years","summary":"County Durham's budget deficit has grown to \u00a383.7 million over the next four years, the council said at its cabinet meeting this week. The shortfall has worsened by \u00a338.9 million since last year's forecast. The council has identified \u00a321.5 million in new savings but faces a remaining gap of \u00a362.1 million. More urgently, the cash deficit in 2027/28 and 2028/29 alone \u2014 \u00a349.7 million \u2014 exceeds the council's available reserves of \u00a334.6 million. The council warned that authorities forced to over-rely on reserves have been required into exceptional financial support, where central government removes local control. Thirty-six councils entered such regimes in the year to March 2026. County Durham must find sustainable savings or raise council tax significantly to avoid the same path.","url":"https://democracy.durham.gov.uk/documents/s228665/228665.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000047","council":"Durham UA","tag":"EFS risk","figures":"\u00a349.703 million cumulative cash deficit 2027/28-2028/29; \u00a334.576 million unallocated MTFP reserve; 36 councils in EFS in 2026/27 (up from 29 in 2025/26)","quote":"This cash deficit exceeds the unallocated MTFP Support Reserve of \u00a334.576 million. It is not financially sustainable to place an over-reliance on reserves to balance the budget, therefore further sustainable measures from either council tax or further savings will be required to secure a balanced financial position.","paper":"Cabinet 16.09.26 - 2026-27 Corporate Performance Report","committee":"Cabinet"},{"lane":"councils","source":"LGC","title":"Districts question county\u2019s security patrols","url":"https://www.lgcplus.com/services/service-delivery/districts-question-countys-security-patrols-16-09-2026/","summary":"Leaders of district councils in Essex have called for a more collaborative and evidence-based approach from Essex CC after the county sent daily private security patrols into three areas near an asylum centre. Essex says that the measures are a \u201cpositive and proportionate\u201d response to\u2026\nThe post Districts question county\u2019s security patrols appeared first on Local Government Chronicle (LGC).","iso":"2026-09-16T08:35:48+00:00"},{"lane":"councils","source":"LG finance press","title":"LGR \u2018pause and review\u2019: the real story of what happened \u2013 and why - Room151","url":"https://news.google.com/rss/articles/CBMimwFBVV95cUxQZjJnT3VacjZDcTBvdEtZZ2YyUVVzUTl4aVdSSm4zZmFMc0VVREFIQVQtYllsTHpWeXp2NHpqQmpTZWRPVG91a2prd1E0NHV4VnRjOFpxUUlPQXNDWGlhcU4tTjAyb0xjb1RmdE82RkpIUkl0TVpOVGJ4eVVBY2ZmaEZwYXlRSnhOSmtmVm80Qy0tTW1XeWR2SE5yRQ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMimwFBVV95cUxQZjJnT3VacjZDcTBvdEtZZ2YyUVVzUTl4aVdSSm4zZmFMc0VVREFIQVQtYllsTHpWeXp2NHpqQmpTZWRPVG91a2prd1E0NHV4VnRjOFpxUUlPQXNDWGlhcU4tTjAyb0xjb1RmdE82RkpIUkl0TVpOVGJ4eVVBY2ZmaEZwYXlRSnhOSmtmVm80Qy0tTW1XeWR2SE5yRQ?oc=5\" target=\"_blank\">LGR \u2018pause and review\u2019: the real story of what happened \u2013 and why</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Room151</font>","iso":"2026-09-16T08:35:02+00:00"},{"lane":"councils","source":"LGC","title":"What it takes to run a strategic authority","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/what-it-takes-to-run-a-strategic-authority-16-09-2026/","summary":"With the wheels in motion to set up more strategic authorities, Elliot Topham looks at what leadership skills are needed for regional government. As part of prime minister Andy Burnham\u2019s vision to rewire the state the government plans to \u201ccomplete the map\u201d and make sure\u2026\nThe post What it takes to run a strategic authority appeared first on Local Government Chronicle (LGC).","iso":"2026-09-16T08:02:33+00:00"},{"lane":"policy","source":"CIPFA","title":"Programme - CIPFA","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOM0RxWTVWaTZUYlZtRHdMTkdhbEZycmdmU1B0bkJSVzJXNDNLS1FpSVR5ODRJeHp5SmlxTmpURTA4cTdOMlpLb0dKMVIzUTJPMXFLRkpqWUw1cmZvOXZ2WVZLdGN3azFQZ0RoSGVVT3dfWnRfRkRhcnJzR242WHRoRzVncmxuWEQx?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOM0RxWTVWaTZUYlZtRHdMTkdhbEZycmdmU1B0bkJSVzJXNDNLS1FpSVR5ODRJeHp5SmlxTmpURTA4cTdOMlpLb0dKMVIzUTJPMXFLRkpqWUw1cmZvOXZ2WVZLdGN3azFQZ0RoSGVVT3dfWnRfRkRhcnJzR242WHRoRzVncmxuWEQx?oc=5\" target=\"_blank\">Programme</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font>","iso":"2026-09-16T07:00:00+00:00"},{"lane":"councils","source":"LG finance press","title":"\u2018Baffling, oxymoronic, pie in the sky\u2019: concerns intensify around local government reform in Scotland - Room151","url":"https://news.google.com/rss/articles/CBMiywFBVV95cUxQOWU1SzZDTUJ5eS1RQlNPVzNXZkxJTDFmV1laemNMeWZTMGhELXFRZHV3TW1ZX1F4UC0xM25aMGd4ck5ENnFzQm5SVWxHbTN4LVFZRVNKS1JSaDBIVkNPSVRuM0hDR0pmeVZ4VGl0bV9FYklNWmZJYmJod05XanlDcDZxMUY1d2otOWZFRWx4c1lqeVByVGh2WHhnc1FhQy1ndEQ1S1hXYzlwV3ZiamVNRkhqYTFyWV8tbjA3b2VtV2IzOHEzeloyUmc3NA?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiywFBVV95cUxQOWU1SzZDTUJ5eS1RQlNPVzNXZkxJTDFmV1laemNMeWZTMGhELXFRZHV3TW1ZX1F4UC0xM25aMGd4ck5ENnFzQm5SVWxHbTN4LVFZRVNKS1JSaDBIVkNPSVRuM0hDR0pmeVZ4VGl0bV9FYklNWmZJYmJod05XanlDcDZxMUY1d2otOWZFRWx4c1lqeVByVGh2WHhnc1FhQy1ndEQ1S1hXYzlwV3ZiamVNRkhqYTFyWV8tbjA3b2VtV2IzOHEzeloyUmc3NA?oc=5\" target=\"_blank\">\u2018Baffling, oxymoronic, pie in the sky\u2019 y and prudent consideration of its timing, conditions and longer-term consequences is necessary to preserve options and avoid a more acute financial intervention","paper":"Part A: Medium Term Financial Plan (MTFP) Summer Review Update","committee":"Cabinet"},{"lane":"ours","source":"Norwich City","title":"Multi-year audit assurance failures: Property, Plant and Equipment still cannot be fully assured in 2025/26 following 2021/22 disclaimer of opinion","summary":"A lender needs audited, reliable asset values to assess security and covenant positions. Inability to obtain full audit assurance on \u00a31.1 billion in property assets four years after a disclaimer indicates persistent control weaknesses or valuation governance failures that could affect financial reporting reliability.","url":"https://cmis.norwich.gov.uk/Live/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=9gIsSsyMkYHLLpO8rJay7VfhgxHPJo%2fMGEngkhWR7C9j40daLc6RoA%3d%3d&amp;rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&amp;mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&amp;kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&amp;uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&amp;FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&amp;d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&amp;WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&amp;WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d","iso":"2026-09-15T09:00:00+00:00","gss":"E07000148","council":"Norwich City","tag":"audit opinion","figures":"Property, Plant and Equipment: \u00a31,075.25 million net book value; Investment Properties: \u00a396.20 million; Prior disclaimer issued in 2021/22; multiple years without substantial assurance","quote":"The maximum assurance level we will be able to report in 2025/26 will be partial, as due to the valuations cycle in place at the Council, there are a number of assets that have not been subject to revaluation in the period that, following previous disclaimers of opinion, have not been subject to audit procedures.","paper":"Supplementary Agenda Document Pack - Audit committee - 15/09/2026","committee":"15 September 2026"},{"lane":"ours","source":"Derbyshire CC","title":"\u00a36+ million structural deficit in special educational needs (EHCPs), demand up 140% since 2019 with no funding solution","summary":"A mandatory, growing service with a known multi-million pound unfunded deficit is a structural liability with no identified resolution path. The NAO warning places Derbyshire at risk of needing a Section 114 notice.","url":"https://derbyshire.moderngov.co.uk/documents/s35910/35910.pdf","iso":"2026-09-15T09:00:00+00:00","gss":"E10000007","council":"Derbyshire CC","tag":"s114 risk","figures":"Budget deficit over \u00a36m (June 2024); Demand increased from 3,666 (2019) to 8,801 (2025); NAO: national SEN deficit \u00a34.6bn; warning of potential Section 114 notices by March 2026","quote":"The council's budget deficit for EHCPs and HTST is over \u00a36m (June 2024). There is a national financial deficit estimated at \u00a34.6bn contributing in part to the risk of two-fifths of local authorities issuing a Section 114 notice by March 2026.","paper":"Strategic Risk Register - 2026-27 Quarter 1","committee":"Audit Committee"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"CIPFA","title":"FAN - Introduction to Collection Fund Accounting in England - CIPFA","url":"https://news.google.com/rss/articles/CBMiogFBVV95cUxNRnY1OWtzT1RVVFVhWXRKTDRkejVTanFESU9hdFo5eWt6LWd5VFRvRkpUXzdQOU5FYk14Nnl4ZEtRcDEzNkFGa05aMTRpdUNtaHZ6b25CMzJZQjdoQ0l5LUtTRm14V0dhSUotWGlCMUxBVlRLZGVzQjEzYkotQzV3Rnh6c2E3bkptYnF6S0p4STNCLUszekRuTFhKaDJkVnpEOGc?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiogFBVV95cUxNRnY1OWtzT1RVVFVhWXRKTDRkejVTanFESU9hdFo5eWt6LWd5VFRvRkpUXzdQOU5FYk14Nnl4ZEtRcDEzNkFGa05aMTRpdUNtaHZ6b25CMzJZQjdoQ0l5LUtTRm14V0dhSUotWGlCMUxBVlRLZGVzQjEzYkotQzV3Rnh6c2E3bkptYnF6S0p4STNCLUszekRuTFhKaDJkVnpEOGc?oc=5\" target=\"_blank\">FAN - Introduction to Collection Fund Accounting in England</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font","iso":"2026-09-12T05:20:31+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Council received a formal Best Value Notice from MHCLG in July 2026","summary":"A Best Value Notice is a serious marker for lenders; it signals regulatory intervention and formal governance weakness in a council already dependent on exceptional financial support.","url":"https://shropshire.gov.uk/committee-services/documents/s45376/45376.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Best Value Notice issued July 2026","quote":"In July 2026 the Council received a Best Value Notice from MHCLG.","paper":"Q1 Performance Report-01072026 1248","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Shropshire UA","title":"External audit issued statutory recommendations on value-for-money; Council under Non-Statutory Best Value Notice with formal MHCLG reviews beginning September 2026","summary":"Audit concerns, formal Best Value Notice, and active MHCLG oversight indicate external constraint. Governance and financial control weaknesses are matters lenders typically care about.","url":"https://shropshire.gov.uk/committee-services/documents/s45413/45413.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Seven years of Limited Assurance on internal audit; statutory audit recommendations; Best Value Notice in place","quote":"The external auditor felt bound to issue statutory recommendations as part of their annual audit for 2024/25 which cast doubt on the integrity of the Council's value for money arrangements... This coincided with the issue of a Non-Statutory Best Value Notice that requires the Council to be reviewed by MHCLG on a regular basis. These reviews begin in September.","paper":"UPDATED Financial Monitoring Report Quarter 1 2026.27-02072026 1235 v8","committee":"Finance and Improvement Overview and Scrutiny Committee"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-06T17:16:15+00:00"},{"lane":"ours","source":"Swansea","title":"Welsh Government has no protocol for supporting councils that issue section 114 (cannot balance budget) reports","summary":"A lender assessing financial sustainability risk needs to understand that if a Welsh council does get into severe financial difficulty (unable to balance budget), there is no published framework for intervention or support. This affects the lender's understanding of worst-case escalation.","url":"https://swansea.moderngov.co.uk/documents/s129728/129728.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"W06000011","council":"Swansea","tag":"s114","figures":"No section 114 reports made in Wales to date; draft protocol in development but not finalised","quote":"Not being clear on what would happen after a section 114 report is made can have a negative impact on financial decision-making. For example, during our interviews we heard there is a misconception amongst some members and officers that issuing a section 114 report will lead to the Welsh Government providing more funding.","paper":"07 (1 of 1) - Funding_councils_How_the_Welsh_Government_funds_councils","committee":"Governance & Audit Committee"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief cost lation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Consultation on Reforming Land Remediation Relief","summary":"The government is consultation on potential reforms to make Land Remediation Relief more accessible, better targeted, and more closely aligned with the practical realities of brownfield development.","url":"https://www.gov.uk/government/consultations/consultation-on-reforming-land-remediation-relief","iso":"2026-07-13T12:08:00Z","closes":"2026-09-21T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Tax Treatment of Predevelopment costs","summary":"The government is consulting on the tax treatment of predevelopment costs. The consultation seeks views and evidence from stakeholders on the types of costs incurred, their treatment under the current rules, and the impact on investment decisions.","url":"https://www.gov.uk/government/consultations/tax-treatment-of-predevelopment-costs--2","iso":"2026-07-13T12:08:00Z","closes":"2026-09-21T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"CIPFA and the codes","title":"CIPFA prudential code changes aim for greater council transparency - localgov.co.uk","url":"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2VjdzZMYVRKY2FPV3FhS0dTU01pS2ZMUWlwbWtOVU1RSzdTV2l3SXZudjlCVHlmZUFnajBNb2pCR1Znckd6MTFDTm4xUktYNldMTFVrVHJlaWNjWl9HcmFaVEI5cFFiMHhvODRST0N4UEpMeElhVDdvNlBLX3ByRDN4?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2VjdzZMYVRKY2FPV3FhS0dTU01pS2ZMUWlwbWtOVU1RSzdTV2l3SXZudjlCVHlmZUFnajBNb2pCR1Znckd6MTFDTm4xUktYNldMTFVrVHJlaWNjWl9HcmFaVEI5cFFiMHhvODRST0N4UEpMeElhVDdvNlBLX3ByRDN4?oc=5\" target=\"_blank\">CIPFA prudential code changes aim for greater council function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
