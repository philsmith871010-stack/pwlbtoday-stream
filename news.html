<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

const DATA = {"generated":"2026-10-02T08:16:53.385356+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":5,"councils":25,"policy":41,"markets":35},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":5,"hm-treasury":2,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"CIPFA and CIPFA/LASAAC":"nothing open"},"items":[{"lane":"ours","source":"Barnet","title":"Barnet balances 2026/27 through \u00a379.298m of Exceptional Financial Support but shows unbalanced budgets of \u00a3113.495m to \u00a3228.223m in years 2\u20136 with no identified funding solution","summary":"A lender must assess whether there is a credible funding path to balance these budgets, or whether further emergency support or reserve drawdowns will be required and may not be forthcoming.","url":"https://barnet.moderngov.co.uk/documents/s100140/100140.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000003","council":"Barnet","tag":"EFS","figures":"\u00a379.298m EFS (2026/27); then unbalanced budgets of \u00a3113.495m, \u00a3144.080m, \u00a3183.653m, \u00a3220.542m, \u00a3228.223m (2027/28\u20132031/32)","quote":"0.000 (Surplus)/Shortfall after EFS 113.495 144.080 183.653 220.542 228.223","paper":"Appendix A Medium Term Financial Strategy (MTFS)","committee":"Finance and Growth Overview and Scrutiny Sub-Committee"},{"lane":"ours","source":"Bedford UA","title":"Budget overspend of \u00a317.7 million in 2025/26, driven by Children's External Placements and Adult Social Care; \u00a322 million exceptional government support received for this year and \u00a358 million for 2026/27.","summary":"A council this large running a \u00a317.7m overspend while dependent on exceptional government funding signals structural financial instability that finance directors elsewhere will watch closely, particularly around demand-led services.","url":"https://councillorsupport.bedford.gov.uk/documents/s82098/82098.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000055","council":"Bedford UA","tag":"EFS","figures":"\u00a317.7 million overspend; \u00a322 million exceptional support 2025/26; \u00a358 million for 2026/27 balanced budget","quote":"During 2025/26, the Council continued to experience significant financial pressures culminating in a budget overspend of \u00a317.7 million. This was largely driven by increased costs of Children's External Placements and Adult Social Care... The Council received Exceptional Financial Support from MHCLG of \u00a322 million for 2025/26 and \u00a358 million to enable a balanced budget to be set for 2026/27.","paper":"Item 14 Audit Committee Annual Report for Full Council - 2025-26","committee":"Full Council"},{"lane":"ours","source":"Cheshire East UA","title":"Budget balanced with \u00a324.995m capitalisation direction from Exceptional Financial Support","summary":"A lender or peer council needs to know whether structural budget balance relies on one-off emergency support, and how much of the EFS allocation has been consumed and for what.","url":"https://moderngov.cheshireeast.gov.uk/documents/s136676/136676.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m capitalisation direction","quote":"The budget was balanced, as required by statute, with planned use of EFS, by way of a capitalisation direction, totalling \u00a324.995m.","paper":"2026/27 Budget \u2013 Quarter 1 Forecast OutturnCabinet and Committee Report Template","committee":"Place Overview and Scrutiny Committee"},{"lane":"ours","source":"Derby City UA","title":"Waste Treatment Centre impairment of \u00a351.407m requires government Capitalisation Directive","summary":"A \u00a351m impairment is material and unusual; a Capitalisation Directive is a rare government intervention signalling severe accounting pressures. The event indicates a major capital investment outcome fundamentally not materialising as planned.","url":"https://democracy.derby.gov.uk/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=tCiVKttyRwICAIzRId64bugtQMZJQ%2btesHjB9ceomY%2bXPH6jkoOe0g%3d%3d&amp;rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&amp;mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&amp;kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&amp;uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&amp;FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&amp;d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&amp;WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&amp;WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d","iso":"2026-10-02T09:00:00+00:00","gss":"E06000015","council":"Derby City UA","tag":"capitalisation","figures":"Impairment and write-back impact c.\u00a351.407m","quote":"requires current estimates indicating an impairment and write-back impact for the City Council of approximately \u00a351.407m...The Director of Finance and Section 151 Officer is required to seek a Capitalisation Directive","paper":"Item 14 - Medium Term Financial Strategy including National Issues and Derby Focus","committee":"Council Cabinet"},{"lane":"ours","source":"Thurrock UA","title":"Commissioners noted slippage signals 'ongoing challenges' and called for stronger governance and stricter oversight","summary":"External commissioner oversight of governance weaknesses in capital delivery indicates systemic control deficits and delivery risk that would affect a lender's confidence in the council's ability to execute.","url":"https://thurrock.moderngov.co.uk/documents/s54727/54727.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"N/A","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential to improve delivery","paper":"Appendix 4 - Capital Budget Summary","committee":"Corporate Overview and Scrutiny Committee"},{"lane":"ours","source":"The West Yorkshire Combined Authority","title":"Audit fee for 2025/26 remains to be determined; 2024/25 saw significant reduction from disclaimed opinion.","summary":"Audit fee uncertainty affects budget planning. The scale reduction applied in 2024/25 (36% reduction) shows PSAA adjusts fees for non-clean opinions, but the magnitude and timing of the 2025/26 adjustment creates budget risk for the Authority's planning.","url":"https://westyorkshire.moderngov.co.uk/documents/s45843/45843.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E47000003","council":"The West Yorkshire Combined Authority","tag":"audit opinion","figures":"2025/26 proposed scale fee \u00a3264,270 (TBC); 2024/25 scale fee \u00a3237,072 reduced by \u00a384,086 to \u00a3152,986 paid; additional non-audit work \u00a310,000","quote":"Where an auditor is required to undertake substantially more or less work to deliver their responsibilities a fee variation may be proposed which is subject to approval by PSAA. When we have completed the 2025/26 audit, PSAA will again determine the level of fees payable for 2025/26.","paper":"12. Appendix 1 WYCA 2025-26 Audit Strategy Memorandum","committee":"Governance & Audit Committee"},{"lane":"ours","source":"Derbyshire CC","title":"High Needs Block forecast overspend of \u00a379.044m against \u00a3127.479m budget, driven by 7.6% growth in EHCPs to 9,063 and higher-cost placements, with grant providing no funding for demand inflation","summary":"High Needs demand growth materially exceeding funding is structural. Derbyshire's forecast shows the gap between demographics and funding widening significantly, making this overspend persistent rather than one-time and difficult to resolve without additional funding or service change.","url":"https://derbyshire.moderngov.co.uk/documents/s36269/36269.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E10000007","council":"Derbyshire CC","tag":"DSG / SEND","figures":"\u00a379.044m overspend, \u00a3127.479m budget, \u00a3206.523m forecast, 7.6% growth to 9,063 EHCPs, \u00a361.744m prior-year above-grant allocation, \u00a36.670m grant increase","quote":"The current forecast is \u00a3206.523m against a \u00a3127.479m budget, giving a \u00a379.044m overspend, driven by continuing demand, capacity constraints and increased use of higher-cost independent and non-maintained placements, alongside special-school, mainstream and post-16 pressures.","paper":"Appendix 13 Dedicated Schools Grant, 10/09/2026 Cabinet","committee":"Council"},{"lane":"ours","source":"Kirklees","title":"Accumulated High Needs Block deficit of \u00a382.2m at March 2026; annual deficit improved to \u00a317m but ongoing General Fund subsidy required.","summary":"A large accumulated specialist education deficit that requires ongoing General Fund subsidy reduces flexible resources for other council services and creates structural budget pressure.","url":"https://democracy.kirklees.gov.uk/documents/s77626/77626.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E08000034","council":"Kirklees","tag":"DSG / SEND","figures":"\u00a382.2m cumulative deficit at 31 March 2026; c\u00a313m General Fund cost over 2026/27-2027/28; \u00a33.4m p.a. treasury servicing; annual deficit \u00a317m in 2025/26 (\u00a33m improvement)","quote":"cumulative High Needs Block Deficit was \u00a382.2m. Progress is being made in Kirklees with a reduction in the annual deficit in 2025/26 being some \u00a33m lower at \u00a317m than the previous year","paper":"MTFS Combined Report v3","committee":"Cabinet"},{"lane":"ours","source":"Sutton","title":"Dedicated Schools Grant deficit will reach \u00a335.6m total; council to bear at least \u00a33.6m (10%) after government covers 90% of High Needs arrears","summary":"DSG deficits are a structural feature of many councils' balance sheets. A lender needs to know whether Sutton's 10% share will be funded by reserves, cash, or future cuts\u2014and whether the government's 90% promise is secure or subject to later clawback.","url":"https://sutton.moderngov.co.uk/documents/s97291/97291.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000029","council":"Sutton","tag":"DSG / SEND","figures":"Accumulated deficit: \u00a321.6m rising to \u00a335.6m; council share: at least \u00a33.6m; government funding: 90% (up to ~\u00a332m); reserve contributions: \u00a30.5m (2027/28), \u00a32m (2028/29)","quote":"accumulated deficit at was \u00a321.6m and is forecast to further \u00a314m in","paper":"Appendix C - Medium Term Financial Strategy 2026 - 2030","committee":"Strategy and Resources Committee"},{"lane":"ours","source":"Middlesbrough UA","title":"Unrestricted reserves would fall to negative balance by 2029/30 if provisional budget gap is not closed by permanent recurring measures, triggering Section 114 notice","summary":"This is the critical constraint. It quantifies precisely how much time the Council has to close the gap before formal financial distress. Section 114 notices signal effective insolvency and restrict authority operations.","url":"https://moderngov.middlesbrough.gov.uk/documents/s45328/45328.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000002","council":"Middlesbrough UA","tag":"s114 risk","figures":"Reserves at 31 March 2026: \u00a325.530m; forecast negative balance: (\u00a30.2m) by 2029/30","quote":"If the current forecast provisional budget gap for each year of the MTFP shown in Table 2 is not solved by permanent recurring measures then the level of Usable, Unrestricted Reserves would fall from \u00a325.5m at the end of 2025/26, to a negative balance of (\u00a30.2m) in 2029/30, i.e. all usable unrestricted reserves would be exhausted by 2029/30 and in that case the s151 Officer would be forced to issue a S114 notice","paper":"Report","committee":"Executive"},{"lane":"ours","source":"Runnymede","title":"Council maintained under-borrowed position in Q1, using \u00a389.1m of reserves and cash rather than external borrowing","summary":"Choice of internal financing over external borrowing has material implications for cash position, opportunity cost, and reported net borrowing; signals Council preference for liquidity over market access during high-rate environment.","url":"https://runnymede.moderngov.co.uk/documents/s18967/18967.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"borrowing","figures":"Investments held \u00a389.1m; total borrowings \u00a3586,808k (down from \u00a3587,114k); CFR \u00a3672,931k; under-borrowing of \u00a386,123k","quote":"No new borrowing was undertaken during the quarter meaning that the Council continued to maintain an under-borrowed position. This meant that the capital borrowing need, the CFR, was not fully funded with loan debt, as cash supporting the Council's reserves, balances and cash flow was used as an interim measure in the high interest rates environment and the period of low capital spend.","paper":"2026-27 Q1 Treasury Management Report v1 - Final","committee":"Overview and Scrutiny Select Committee"},{"lane":"ours","source":"Blackburn with Darwen UA","title":"Budget Support Reserve deployed to balance 2026/27 budget with \u00a31,981k drawdown, further \u00a33m planned for 2027/28, reserve falling from \u00a313.9m to \u00a38.9m","summary":"A council using its budget support reserve to balance the budget signals underlying financial pressure. A finance director needs to understand whether this is temporary or structural, and whether the stated stabilization from 2028 onwards is realistic.","url":"https://blackburn.moderngov.co.uk/documents/s37525/37525.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000008","council":"Blackburn with Darwen UA","tag":"reserves","figures":"Budget Support Reserve: \u00a313,914k opening balance (31-Mar-26); \u00a31,981k used to balance 2026/27; \u00a311,933k forecast (31-Mar-27); \u00a33,000k planned drawdown for 2027/28; \u00a38,933k forecast (31-Mar-28 through 31-Mar-30)","quote":"Budget Support Reserve | 13,914 | - | - | (1,981) | 11,933 | (3,000) | 8,933 | - | 8,933 | - | 8,933","paper":"Appendix 3 for Update to Medium Term Financial Plan 2027/30","committee":"Executive Board"},{"lane":"ours","source":"Waltham Forest","title":"Three-year budget gap revised to \u00a347.709m from \u00a323.927m forecast in February 2026, approximately doubling in six months","summary":"Doubling of the forward funding gap in six months signals either deteriorating service cost pressures or that savings plans are not delivering sufficiently; indicates structural challenges in deficit closure despite management action","url":"https://walthamforest.moderngov.co.uk/documents/s111274/111274.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000031","council":"Waltham Forest","tag":"overspend","figures":"\u00a347.709m (from \u00a323.927m in February 2026); Month 3 in-year overspend \u00a319.901m; new service demand pressures \u00a325.3m; additional inflation \u00a318.5m","quote":"The revised MTFS position is now indicating a total funding gap of \u00a347.709m over the 3-year period to March 2029/30 but assumes that \u00a342m of savings included within the 2026/27 MTFS will be delivered, subject to some reprofiling.","paper":"Medium Term Financial Strategy 2026 27 - Cabinet report","committee":"Cabinet"},{"lane":"ours","source":"Worthing","title":"Adur District Council systematically replaced \u00a325.3m of PWLB debt with \u00a320.9m of temporary inter-council borrowing at rates of 4.00% to 5.50%.","summary":"Systematic replacement of cheaper long-term debt with expensive short-term borrowing signals either strong confidence in cash generation or constraints on long-term borrowing appetite\u2014both of which matter to lenders and peer finance directors tracking tr /25 accounts unsigned-off. The council's auditors have now drawn up a rebuild plan to restore assurance on account balances, at an estimated cost of \u00a3245,524 beyond the standard audit fee. The council states this additional cost will create pressure on its revenue budget across 2026/27 and 2027/28. Capacity constraints in both the audit team and the council's own finance function are the main risk to completing the work and securing an audit opinion by the statutory deadline of 31 January 2027. The rebuild work coincides with the council's transition to a unitary authority merging with Broxbourne, with shadow authority elections scheduled for May 2027.","url":"https://democracy.eastherts.gov.uk/documents/s74022/74022.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000242","council":"East Hertfordshire","tag":"audit opinion","figures":"Base fee \u00a3185,917; building back assurance \u00a3245,524; total \u00a3444,441","quote":"Building back assurance as per the build back plan 245,524","paper":"Appendix A - 2026/27 Revenue outturn","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Teignbridge","title":"Teignbridge cuts forecast funding gaps by nearly half as audit work to regain assurance accelerates","summary":"Teignbridge District Council faces a disclaimed audit opinion, the lowest form of external audit assurance, for 2025/26 and has held this status since 2020/21. However, the council's financial position is improving. Forecast funding gaps for 2027/28 and 2028/29 have fallen from \u00a33.6 million and \u00a32.8 million to \u00a31.13 million and \u00a30.95 million, driven partly by drawing only \u00a3680,000 from reserves in 2025/26 against a budgeted \u00a31.5 million. The Ministry of Housing and Communities and Local Government upgraded Teignbridge's audit assessment ranking from D to C. Regaining assurance work, originally scheduled for 2030\u201331, is now prioritised to begin in 2027, backed by \u00a342,388 in government grant funding. Internal audits have identified control gaps: licensing income lacks regular reconciliation; the self-build register requires cleansing; and car park audit recommendations from February 2024 remain largely unimplemented, with only two of ten completed. Financial resilience has been marked as a critical audit priority.","url":"https://democracy.teignbridge.gov.uk/documents/s26101/26101.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000045","council":"Teignbridge","tag":"audit opinion","figures":"\u00a342,388 Section 31 grant; remediation timeline accelerated from 2030-2031 to starting 2027","quote":"The audit opinion for this year will still have to be disclaimed. The original proposed date for the regaining assurance work was 2030-2031 however Teignbridge has now been prioritised.","paper":"TDC - Audit progress report and sector update - August 2026","committee":"Audit Committee"},{"lane":"councils","source":"Distress watch","title":"High Court of Karnataka Allows Relief Against Forfeiture of Lease Under Section 114 of Transfer of Property Act, 1882 \u2014 Tenant Granted One Month to Deposit Arrears of Rent. Court holds that forfeiture of lease for non-payment of rent is not automatic and ten - Lawtext","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBzMWlJdThDMlBCRVNEMVB5R3dLY1h4OTVUN0JsWnFuZk5TT0JDUU52dGtSVHBvSUJYWFhxN2pqZmJuTTRzXzA3OE5NMFk2Q3NvTW5GUlNkeXA1cWFvbEdmVVNheVZPdw?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBzMWlJdThDMlBCRVNEMVB5R3dLY1h4OTVUN0JsWnFuZk5TT0JDUU52dGtSVHBvSUJYWFhxN2pqZmJuTTRzXzA3OE5NMFk2Q3NvTW5GUlNkeXA1cWFvbEdmVVNheVZPdw?oc=5\" target=\"_blank\">High Court of Karnataka Allows Relief Against Forfeiture of Lease Under Section 114 of Transfer of Property Act, 1882 \u2014 Tenant Granted One Month to Deposit Arrears of Rent. Court holds that","iso":"2026-09-29T06:01:12+00:00"},{"lane":"policy","source":"HM Treasury","title":"Chancellor backs young people into work by supporting jobs","url":"https://www.gov.uk/government/news/chancellor-backs-young-people-into-work-by-supporting-jobs","summary":"The Chancellor has announced a package to help people into work, education and training, while building the skilled workforce Britain needs for the future.","iso":"2026-09-28T15:56:37+00:00"},{"lane":"policy","source":"HM Treasury","title":"More overseas firms enticed to buy British","url":"https://www.gov.uk/government/news/more-overseas-firms-enticed-to-buy-british--2","summary":"Overseas buyers will be offered a new UK Export Finance loan guarantee to incentivise buying goods and services from British companies.","iso":"2026-09-28T15:43:57+00:00"},{"lane":"ours","source":"Stockton-on-Tees UA","title":"Stockton-on-Tees increased borrowing by \u00a326.89m in 2025-26 despite capital spending 46% below budget","summary":"Stockton-on-Tees raised net borrowing from \u00a3111.43m to \u00a3138.32m during 2025-26, taking on \u00a340m of new government loans at rates between 4.31% and 4.57%, even as capital spending fell substantially short of plan. The council spent \u00a351.2m of a \u00a394.53m capital budget, leaving \u00a343.35m unspent. The mismatch reflects a deliberate strategy of internal borrowing\u2014using reserves instead of external loans to minimize interest costs\u2014but one that depletes cash cushions and commits the council to heavy future borrowing to meet its underlying need to borrow, or capital financing requirement, of \u00a3202.27m. The council also carries an accumulated schools funding deficit of \u00a317.1m, the costs of servicing which\u2014up to \u00a3500k annually\u2014fall on the general fund rather than schools budgets. Children in care placement costs have escalated the risk to Red, requiring immediate change, while commercial property investments of \u00a314.89m face mandatory review under new government borrowing rules.","url":"https://moderngov.stockton.gov.uk/documents/s23952/23952.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000004","council":"Stockton-on-Tees UA","tag":"LOBO","figures":"\u00a316.0m LOBO loans; average rate 4.87%; weighted average maturity 11.4 years","quote":"On 1st April 2025 the Authority held \u00a316m of LOBO (Lender's Option Borrower's Option) loans... As market interest rates have risen, there is an increased probability of call options on the LOBOs being exercised by lenders.","paper":"Sept 2026 - Risk Management Update - Report","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Worcestershire CC","title":"Worcestershire receives \u00a333.6m emergency support as auditor flags persistent financial sustainability concerns","summary":"Worcestershire County Council received \u00a333.6m of Exceptional Financial Support from the government for 2025/26, treated as a capitalisation direction (permission to borrow money to cover day-to-day spending). The external auditor, Grant Thornton, notes in its Value for Money assessment that this support \"represents a structural increase to the Authority's debt position rather than a one-off adjustment, and increases the annual MRP charge going forward\" \u2014 the amount the council must set aside each year to repay borrowed money. The council's minimum revenue provision charge rose by \u00a31.2m to \u00a318.4m in 2025/26 as a result. Grant Thornton identifies financial sustainability as the most concerning issue in its overall assessment, and has retained a statutory recommendation on the dedicated schools grant deficit (government funding for schools) from the prior year, indicating the underlying problem persists. The auditor also found significant weaknesses in the council's arrangements for financial sustainability and improving economy and efficiency.","url":"https://worcestershire.moderngov.co.uk/documents/s61974/61974.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"MRP","figures":"\u00a310m savings delivered over 2 years from 2023/24 MRP policy changes","quote":"A comprehensive review of MRP policy was completed in January 2024 by external experts, and changes were implemented in 2023/24, saving \u00a310m over 2 years.","paper":"au 2026 09 28 2025-26 Interim External Auditors Annual Report","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Shropshire UA","title":"Shropshire payroll control failures persist after four years of audit interventions","summary":"Shropshire Council's payroll systems continue to show control weaknesses after four years of remedial action. The latest audit identified 12 fundamental and 15 significant recommendations for addressing systemic governance failures across payroll, human resources and finance, including management non-compliance, weak oversight and unclear responsibilities. The problems emerge as the council operates under a declared financial emergency with an interim chief financial officer in place. Other audit findings highlighted school deficit governance failures, with Bishops Castle Community College forecast to reach approximately \u00a31m deficit by 2027/28 despite a recovery plan, and purchase order control breaches in 386 of 2,068 same-day orders totalling \u00a3125.1m. The pension fund audit, completed following its three-yearly revaluation, found no material issues and is expected to be fully signed off.","url":"https://shropshire.gov.uk/committee-services/documents/s46580/46580.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Progress update deadline: end September 2026; subsequent quarterly meetings","quote":"Responding to the CIPFA Review recommendations is a requirement of the EFS arrangements and will be monitored by MHCLG as part of the Best Value Notice process.","paper":"SPF Draft 9-107 LGPS Audit Findings Report 2025-26 v2","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Bradford","title":"Bradford Council's \u00a3113m revenue overspend funded by government as reserves rise \u00a355m","summary":"Bradford Council's accounts for 2025-26 show a revenue overspend of \u00a3113 million, which was funded through a Capitalisation Direction \u2014 government permission to treat day-to-day spending as capital spending and pay for it by borrowing. The overspend was \u00a314 million better than initially forecast. Despite the operating deficit, the council's usable reserves (money set aside for unexpected costs or named purposes) increased by \u00a355 million to \u00a3229.2 million, with a General Fund balance of \u00a353.1 million representing 3.5 per cent of gross expenditure. The external auditors anticipate issuing an unqualified audit opinion on the financial statements. A post-balance-sheet decision to cancel the Square Lane capital project will reduce usable reserves by \u00a34.9 million once abortive costs are formally charged to revenue.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"ours","source":"Slough UA","title":"Slough forecasts \u00a319.9m overspend in 2026-27, with \u00a315.955m driven by children's social care placements","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"intervention","figures":"\u00a319.9m overspend requiring mitigation, governance intervention in place","quote":"This is an extremely serious financial position for the Council and managing an in-year forecasted overspends of this scale, requires structured and swift intervention, if a sustainable position is to be restored before the financial year closes.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-01T07:00:00+00:00"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"CIPFA and the codes","title":"CIPFA prudential code changes aim for greater council transparency - localgov.co.uk","url":"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2VjdzZMYVRKY2FPV3FhS0dTU01pS2ZMUWlwbWtOVU1RSzdTV2l3SXZudjlCVHlmZUFnajBNb2pCR1Znckd6MTFDTm4xUktYNldMTFVrVHJlaWNjWl9HcmFaVEI5cFFiMHhvODRST0N4UEpMeElhVDdvNlBLX3ByRDN4?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2VjdzZMYVRKY2FPV3FhS0dTU01pS2ZMUWlwbWtOVU1RSzdTV2l3SXZudjlCVHlmZUFnajBNb2pCR1Znckd6MTFDTm4xUktYNldMTFVrVHJlaWNjWl9HcmFaVEI5cFFiMHhvODRST0N4UEpMeElhVDdvNlBLX3ByRDN4?oc=5\" target=\"_blank\">CIPFA prudential code changes aim for greater function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
</body></html>
