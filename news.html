<title>PWLBintel — the newsroom</title>

<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

const DATA = {"generated":"2026-09-16T06:55:03.929039+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":23,"national":5,"councils":14,"policy":33,"markets":34},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":6,"hm-treasury":4,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"CIPFA and CIPFA/LASAAC":"2 open"},"items":[{"lane":"ours","source":"Thurrock UA","title":"Council budget is fundamentally dependent on \u00a368.908m Exceptional Financial Support via Capitalisation Direction","summary":"Structural reliance on government support to meet treasury costs (not one-off pressures) indicates debt sustainability concerns and governance risk if support is withdrawn or reduced.","url":"https://thurrock.moderngov.co.uk/documents/s54451/54451.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"EFS","figures":"Capitalisation Direction \u00a368.908m; treasury costs budget \u00a363.080m; operational deficit covered \u00a35.9m; net revenue budget \u00a3267.290m","quote":"The Council set a net revenue budget of \u00a3267.290m for 2026/27, supported by \u00a368.908m of Exceptional Financial Support through a Capitalisation Direction","paper":"Q1 Financial Outturn 2026/27","committee":"Cabinet"},{"lane":"ours","source":"Havering","title":"The council cannot balance its budget and needs \u00a354.2m exceptional borrowing in this quarter.","summary":"A lender needs to understand if a council has structural funding gaps and is dependent on temporary borrowing solutions rather than sustainable revenue raising.","url":"https://democracy.havering.gov.uk/documents/s85580/85580.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E09000016","council":"Havering","tag":"EFS","figures":"\u00a354.2m EFS noted this quarter, \u00a377m budgeted for full year EFS, \u00a311.1m contingency held, net underspend of \u00a322.8m","quote":"the budget assumes the need for Exceptional Financial Support of up to \u00a377m. This is necessary as our current funding is not in line with the demographic and demand pressures","paper":"10.1 Appendix 1 revenue monitoring quarter 1","committee":"Cabinet"},{"lane":"ours","source":"Havering","title":"Council requires \u00a354.2m of exceptional financial support to balance 2026/27 budget despite forecast underspend.","summary":"EFS dependency signals the council cannot meet statutory obligations from its own resources; repeated annual reliance on exceptional support is a key credit risk indicator.","url":"https://democracy.havering.gov.uk/documents/s85579/85579.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E09000016","council":"Havering","tag":"EFS","figures":"\u00a354.2m EFS required; down from \u00a377m worst-case assumption; General Fund budget \u00a3356.8m; forecast outturn \u00a3334.0m","quote":"This will require Exceptional Financial Support of \u00a354.2m. Havering has for several years been in a position of intense financial pressure due to the mismatch between the funding allocated by Central Government based on outdated metrics and the current reality of rapid demographic change and growth.","paper":"10.0 P3 26-27 Budget Monitoring Q1 Cabinet report - Final week DRAFT - post agenda clearing - Copy","committee":"Cabinet"},{"lane":"ours","source":"Luton UA","title":"\u00a32.2m capital investment committed for SEND reform infrastructure by end September 2026.","summary":"Material capital commitment affecting the council's capital budget; financial benefit depends on the reform achieving planned cost reductions in high-needs placement spending.","url":"https://democracy.luton.gov.uk/CMIS5Public/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=UzTjhwlUYM8N0zIXotGLPLcK7fuKP1WF8rCk3gve3clCzcy0df%2fWZQ%3d%3d&amp;rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&amp;mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&amp;kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&amp;uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&amp;FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&amp;d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&amp;WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&amp;WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d","iso":"2026-09-16T09:00:00+00:00","gss":"E06000032","council":"Luton UA","tag":"DSG / SEND","figures":"\u00a32.2m released by end of September 2026","quote":"Finance \u00a32.2mill released by end of September 2026","paper":"11a. Appendix A - SEND Reform Plan","committee":"16 September 2026"},{"lane":"ours","source":"Luton UA","title":"\u00a32.2m conditional grant funding in year 1 to implement SEND reforms, with DfE approval decision imminent on 21 September.","summary":"Material grant funding of up to \u00a36.2m over three years is at risk and approval will be determined within four days. Non-approval would require the council to fund SEND service changes from other sources.","url":"https://democracy.luton.gov.uk/CMIS5Public/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=0RLy8t9VZPJCcEQNdzdZ0lUmVKvGRN7S%2fzKZP5JfWutD75TgAfI9bA%3d%3d&amp;rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&amp;mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&amp;kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&amp;uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&amp;FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&amp;d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&amp;WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&amp;WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d","iso":"2026-09-16T09:00:00+00:00","gss":"E06000032","council":"Luton UA","tag":"DSG / SEND","figures":"\u00a32.2mill first year, \u00a32mill for second and third year","quote":"if the plan is agreed, this will release additional funding to the value of \u00a32.2mill for the first year of the plan's implementation and a further \u00a32mill for each of the second and third year of the plan's implementation. Loca authorities are to be informed on whether their plans have been agreed on 21 September.","paper":"SEND Reform Plan Update","committee":"16 September 2026"},{"lane":"ours","source":"St Helens MBC","title":"The Dedicated Schools Grant is forecasting a \u00a312.793m in-year pressure, driven by insufficient High Needs Block funding for EHCP demand.","summary":"The DSG statutory override expires in 2028; accumulated deficits will then impact the general fund, representing a deferred liability that will worsen the council's position in future years unless resolved.","url":"https://sthelens.moderngov.co.uk/documents/s180590/180590.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E08000013","council":"St Helens MBC","tag":"DSG / SEND","figures":"\u00a312.793m in-year DSG pressure; held in separate reserve under statutory override to 31 March 2028","quote":"The underlying financial challenge remains that available funding within the High Needs Block is insufficient to meet current levels of demand, particularly given the continued growth in the number of pupils with Education, Health and Care Plans (EHCPs).","paper":"Appendix 1 - Financial Monitoring Report Period 1 2026-27, 02/09/2026 Cabinet","committee":"Council"},{"lane":"ours","source":"Stevenage","title":"Four consecutive years of disclaimed audit opinions mean opening balances and past transactions carry material uncertainty","summary":"A lender cannot confidently assess the historical accuracy of reported figures or identify whether material errors exist in major balance sheet items. Four years without an audit opinion represents a critical control failure that undermines confidence in the council's financial management and reporting.","url":"https://democracy.stevenage.gov.uk/documents/s43827/43827.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E07000243","council":"Stevenage","tag":"audit opinion","figures":"Four consecutive disclaimed opinions (2021/22, 2022/23, 2023/24, 2024/25)","quote":"Disclaimed audit opinions have also been provided on the Council's accounts for the 2021/22, 2022/23 and 2023/24 financial years.","paper":"3. Stevenage Borough Council Audit Plan - 31 March 2026","committee":"Audit Committee"},{"lane":"ours","source":"Portsmouth UA","title":"Prior-year disclaimers and qualifications mean financial statements lack full audit assurance","summary":"Lenders rely on audited financial statements; qualified opinions signal that some positions are not fully assured and therefore carry elevated risk of misstatement.","url":"https://portsmouth.moderngov.co.uk/documents/s64232/64232.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000044","council":"Portsmouth UA","tag":"audit opinion","figures":"Disclaimers for years ended 31 March 2023 and 31 March 2024; qualified opinion for 2024/25","quote":"A qualified audit opinion was issued for 2024/25 which drew attention to remaining areas which we have yet to obtain sufficient appropriate audit evidence over as a result of the disclaimers of opinion for the years ended 31 March 2023 and 31 March 2024.","paper":"PCC Audit Plan Addendum 2025-26","committee":"Governance & Audit & Standards Committee"},{"lane":"ours","source":"Oldham","title":"\u00a339m of LOBO loans have call dates within 12 months, creating concentrated refinancing exposure","summary":"Lenders controlling half the LOBO portfolio can force refinancing at rates beyond the council's control, creating uncertainty in forward debt servicing costs as demonstrated by this year's high-rate calls.","url":"https://committees.oldham.gov.uk/documents/s161270/161270.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E08000004","council":"Oldham","tag":"LOBO","figures":"\u00a375.500m total LOBO loans, \u00a339.000m with call dates within 12 months, prior calls at 6.70\u20137.67%","quote":"As at 31st March 2026 Oldham Council has \u00a375.500m, LOBO loans and \u00a339.000m with call dates within the next 12 months. Of this sum, \u00a39.000m is held with Dexia Finance over 2 loans, and the remaining \u00a320m is 3 separate loans with three other providers, Danske Bank, Just Retirement and KBC Bank.","paper":"Annual Review of Treasury Management","committee":"Council"},{"lane":"ours","source":"Ceredigion","title":"Internal borrowing strategy is delivering \u00a30.5m interest savings against the annual budget.","summary":"The revenue budget includes this \u00a30.5m interest saving as a benefit of the internal borrowing strategy, but the benefit depends on the council maintaining adequate investment balances; if cash pressures increase or capital needs require deploying these funds, this structural budget benefit disappears.","url":"https://council.ceredigion.gov.uk/documents/s11570/11570.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"W06000008","council":"Ceredigion","tag":"borrowing","figures":"\u00a352.5m investments, \u00a30.5m favourable variance, \u00a35.7m interest budget","quote":"the Council has a fairly significant cash balance and is maintaining an internal borrowing position which is helping to deliver revenue savings","paper":"Appendix 3 - Quarterly Treasury Management Performance Report 2026-27","committee":"Corporate Resources Overview and Scrutiny Committee"},{"lane":"ours","source":"York UA","title":"Council is maintaining an under-borrowed position, using investment cash rather than taking on long-term debt at elevated rates","summary":"A lender needs to understand that the Council is making a tactical decision to delay borrowing until rates fall, which has a finite runway before forced borrowing becomes necessary. This signals confidence the council can absorb elevated refinancing costs when unavoidable.","url":"https://democracy.york.gov.uk/documents/s195387/195387.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000014","council":"York UA","tag":"borrowing","figures":"Capital Financing Requirement \u00a3532.10m; total borrowin th immediate effect until the end of the current parliamentary term. Ms Oppong-Asare has been MP for Erith and\u2026\nThe post New communities committee chair elected appeared first on Local Government Chronicle (LGC).","iso":"2026-09-15T09:28:13+00:00"},{"lane":"markets","source":"Bank of England","title":"Statistical Notice 2026/08 - Changes to the criteria for monthly form BT reporting","url":"https://www.bankofengland.co.uk/statistics/notice/2026/statistical-notice-2026-08","summary":"Statistical Notices update the definitions and guidance contained in the Banking Statistics Yellow Folder","iso":"2026-09-15T09:21:31+00:00"},{"lane":"ours","source":"Stockport MBC","title":"The council is moving closer to the threshold for Exceptional Financial Support (EFS), a form of government-administered distress funding","summary":"EFS signals distress and typically carries restrictions on discretionary borrowing and service reduction mandates. For a lender, it means the council's capacity to service debt becomes a government concern, not just a council one.","url":"https://democracy.stockport.gov.uk/documents/s267445/267445.pdf","iso":"2026-09-15T09:00:00+00:00","gss":"E08000007","council":"Stockport MBC","tag":"s114","figures":"36 councils required EFS in 2026/27; Stockport's likelihood of Section 114 currently low but trajectory worsening","quote":"early and prudent consideration of its timing, conditions and longer-term consequences is necessary to preserve options and avoid a more acute financial intervention","paper":"Part A: Medium Term Financial Plan (MTFP) Summer Review Update","committee":"Cabinet"},{"lane":"ours","source":"Norwich City","title":"Multi-year audit assurance failures: Property, Plant and Equipment still cannot be fully assured in 2025/26 following 2021/22 disclaimer of opinion","summary":"A lender needs audited, reliable asset values to assess security and covenant positions. Inability to obtain full audit assurance on \u00a31.1 billion in property a ndidates warns Electoral Commission appeared first on Local Government Chronicle","iso":"2026-09-14T09:56:49+00:00"},{"lane":"councils","source":"LGC","title":"Ann Graham: What is care for?","url":"https://www.lgcplus.com/services/children/ann-graham-what-is-care-for-14-09-2026/","summary":"Our laws, guidance and practice need to catch up with the older cohort of children entering the system, writes the president of the Association of Directors of Children\u2019s Services (ADCS) 2026-27. When ADCS originally asked, What is care for?, back in 2012, we were addressing\u2026\nThe post Ann Graham: What is care for? appeared first on Local Government Chronicle (LGC).","iso":"2026-09-14T09:18:38+00:00"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"ours","source":"Brent","title":"Two LOBO loans repaid in 2025-26 when lenders exercised options at rates 2+ percentage points higher","summary":"Concrete evidence that rate environment has shifted and Brent faces material cost increases when LOBO options are exercised","url":"https://democracy.brent.gov.uk/documents/s159652/159652.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E09000005","council":"Brent","tag":"LOBO","figures":"\u00a310m at 4.1% and \u00a310m at 5.2% refinanced at 6.41% and 6.24%; average rate increase of 2.2 percentage points","quote":"The Council repaid two LOBO loans in 2025/26 after the lender exercised their option. As a result, the Council's borrowing requirement increased, with the additional financing being met through borrowing from the Public Works Loan Board (PWLB) during the year within our overall borrowing need.","paper":"13. Treasury Management Outturn 2025-26","committee":"Council"},{"lane":"policy","source":"MHCLG","title":"Correspondence: Spelthorne Borough Council: Commissioner appointment letter (1 September 2026)","url":"https://www.gov.uk/government/publications/spelthorne-borough-council-commissioner-appointment-letter-1-september-2026","summary":"Copy of the letter confirming the appointment of Barry Scarr at Spelthorne Borough Council.","iso":"2026-09-14T08:47:15+00:00"},{"lane":"policy","source":"MHCLG","title":"Correspondence: Woking Borough Council: Commissioner appointment letter (1 September 2026)","url":"https://www.gov.uk/government/publications/woking-borough-council-commissioner-appointment-letter-1-september-2026","summary":"Copy of the letter confirming the appointment of Barry Scarr at Woking Borough Council.","iso":"2026-09-14T08:46:44+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Fire risk appraisals of external walls (FRAEWs)","url":"https://www.gov.uk/government/publications/fire-risk-appraisals-of-external-walls-fraews","summary":"Information about fire risk appraisals of external walls (FRAEWs).","iso":"2026-09-14T08:00:02+00:00"},{"lane":"policy","source":"CIPFA","title":"Introduction to Fire Finance (England) - CIPFA","url":"https://news.google.com ":"In July 2026 the Council received a Best Value Notice from MHCLG.","paper":"Q1 Performance Report-01072026 1248","committee":"Cabinet"},{"lane":"ours","source":"Somerset Council","title":"Somerset's budget depends on delivering \u00a3135m savings from a \u00a345m transformation investment, with section 114 risk if it fails","summary":"A council's solvency depending on discretionary transformation savings rather than statutory process changes represents higher execution risk for lenders, particularly if delivery is delayed.","url":"https://somerset.moderngov.co.uk/documents/s69209/69209.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000066","council":"Somerset Council","tag":"s114 risk","figures":"\u00a345m transformation fund, \u00a3135m anticipated savings (3:1 ratio)","quote":"Financial savings reduced or not realised which may contribute towards a section 114.","paper":"Appendix J - Inspiring Innovation Programme Risks","committee":"Scrutiny Committee - Corporate and Strategic"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Shropshire UA","title":"External audit issued statutory recommendations on value-for-money; Council under Non-Statutory Best Value Notice with formal MHCLG reviews beginning September 2026","summary":"Audit concerns, formal Best Value Notice, and active MHCLG oversight indicate external constraint. Governance and financial control weaknesses are matters lenders typically care about.","url":"https://shropshire.gov.uk/committee-services/documents/s45413/45413.pdf","iso":"2026-09-07T09:00 ://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Time-limited relief from the Community Infrastructure Levy in London","summary":"We are seeking views on proposed regulations to implement a time-limited relief from the Community Infrastructure Levy (CIL) to support housebuilding in London.","url":"https://www.gov.uk/government/consultations/time-limited-relief-from-the-community-infrastructure-levy-in-london","iso":"2026-07-17T16:01:48Z","closes":"2026-09-18T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement process costs","summary":"Seeks views o function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
</body></html>
