<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

fied persistent control weaknesses across multiple functions. Payroll received limited assurance for 2025\u201326, the same rating it received in 2023\u201324 and an unsatisfactory rating in both 2021\u201322 and 2020\u201321. A root cause review found systemic governance failures including weak oversight, unclear responsibilities across departments and management non-compliance. Separately, Bishops Castle Community College's deficit is forecast to reach approximately \u00a31 million by 2027\u201328, despite a recovery plan signed in October 2025. Six schools forecasting deficits in 2025\u201326 failed to meet the formal notification deadline. The council's own risk register acknowledges that low assurance opinions and fundamental audit recommendations are being repeated without adequate management response.","url":"https://shropshire.gov.uk/committee-services/documents/s46580/46580.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Progress update deadline: end September 2026; subsequent quarterly meetings","quote":"Responding to the CIPFA Review recommendations is a requirement of the EFS arrangements and will be monitored by MHCLG as part of the Best Value Notice process.","paper":"SPF Draft 9-107 LGPS Audit Findings Report 2025-26 v2","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Powys","title":"Powys Council flags persistent financial risk despite reserves boost","summary":"Powys Council has identified financial sustainability as a core strategic risk for the year ahead, despite setting aside additional money and strengthening its financial planning. The council's risk register, reviewed by its Governance and Audit Committee, shows the risk remains high with no planned reduction. The council faces ongoing uncertainty over future government funding, inflation, pay awards and rising demand for services \u2014 particularly in adult social care and school maintenance. Auditors cleared the council's 2025/26 accounts without qualification. However, the council separately faces a potential data protection fine of up to \u00a317m, with active complaints about delays in responding to data access requests and training compliance at 89 per cent, short of its 95 per cent target.","url":"https://powys.moderngov.co.uk/documents/s106689/106689.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"W06000023","council":"Powys","tag":"audit opinion","figures":"Draft accounts prepared on time (30 June 2025); unqualified opinion issued in advance of statutory deadline (31 October 2025)","quote":"There were no other significant issues to report but they did include some considerations for the Council to consider when delivering future years financial statements within the shorter statutory deadlines.","paper":"20.10.26 Qtr 1 2026-2027 App A NON-CONFIDENTIAL strategic risks","committee":"Governance and Audit Committee"},{"lane":"policy","source":"MHCLG","title":"Form: Council Tax base calculation","url":"https://www.gov.uk/government/publications/council-tax-base-calculation","summary":"Forms and guidance notes for the calculation of Council Tax base (CTB).","iso":"2026-09-25T07:30:03+00:00"},{"lane":"markets","source":"Bank of England","title":"Minutes of the Market Participants Group meeting \u2013 24 September 2026","url":"https://www.bankofengland.co.uk/minutes/2026/september/market-participants-group-meeting-25-september-2026","summary":"The Market Participants Group (MPG) is a senior-level forum for financial market participants to share their views on relevant themes and narratives in financial markets with members of the Bank of England\u2019s Monetary Policy Committee.","iso":"2026-09-25T06:30:00+00:00"},{"lane":"councils","source":"LG finance press","title":"Could the government\u2019s pay deal with teachers set a precedent for the LGPS? - Room151","url":"https://news.google.com/rss/articles/CBMi2wFBVV95cUxNTlYwWkJ0cENmR3lrTFJmemhiNlNsNE8xc0RUQ1ZpWmdZdkl3d rce":"MHCLG","title":"Accredited official statistics: Detailed analysis of non-fire incidents, year ending March 2026","url":"https://www.gov.uk/government/statistics/announcements/detailed-analysis-of-non-fire-incidents-year-ending-march-2026","summary":"Detailed analysis of non-fire incidents attended by fire and rescue services, England, April 2025 to March 2026.","iso":"2026-09-24T14:17:01+00:00"},{"lane":"policy","source":"HM Treasury","title":"Corporate report: National Lottery Distribution Fund Investment Account Report & Accounts 2025 to 2026","url":"https://www.gov.uk/government/publications/national-lottery-distribution-fund-investment-account-report-accounts-2025-to-2026","summary":"Annual report and accounts of the National Lottery Distribution Fund Investment Account.","iso":"2026-09-24T14:06:47+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Social Housing Quality and Residents Programme Evaluation: privacy notice","url":"https://www.gov.uk/government/publications/social-housing-quality-and-residents-programme-evaluation-privacy-notice","summary":"Privacy notice for evaluation of the Social Housing Quality and Residents Programme.","iso":"2026-09-24T13:21:29+00:00"},{"lane":"councils","source":"LG finance press","title":"\u2018Learn from England\u2019s failings\u2019: warnings over \u2018half-baked\u2019 Scottish LGR - Room151","url":"https://news.google.com/rss/articles/CBMiowFBVV95cUxPWTlLdkFnbzZfTHE4dDR6M25lRURvT0RXczNBTTRVN2E1bnB1MkpJMEUyQnZNLWRwZEtvTzVtdUhqajlKVjlBcjQyREZUR3M2bTRwQ1NBNTREemY0WGdKdWpkamVEamE0QkZMRnItWHczekV3dVlxd3VuRTduVEVpcWN4Um1VNHpIbldBcDc4bGoycFNvRWtBM2ZZUkRqaW9zLVpJ?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiowFBVV95cUxPWTlLdkFnbzZfTHE4dDR6M25lRURvT0RXczNBTTRVN2E1bnB1MkpJMEUyQnZNLWRwZEtvTzVtdUhqajlKVjlBcjQyREZUR3M2bTRwQ1NBNTREemY0WGdKdWpkamVEamE0QkZMRnItWHczekV3dVlxd3VuRTduVEVpcWN4Um1VNHpIbldBcDc4bGoycFNvRWtBM2ZZUkRqaW9zLVpJ?oc=5\" target=\"_blank\">\u2018Learn from England\u2019s failings\u2019: warnings over \u2018half-baked\u2019 Scottish LGR</a>&nbsp;&nbsp;<font color=\"#6f6f6","iso":"2026-09-24T10:38:56+00:00"},{"lane":"councils","source":"LGC","title":"Mayoral candidate calls for election next year","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/mayoral-candidate-calls-for-election-next-year-24-09-2026/","summary":"The Labour mayoral candidate for the Hampshire & the Solent CCA has called for elections to be brought forward to 2027. The mayoral election for Hampshire & the Solent CCA was originally set to take place at in May 2026 before being delayed by two\u2026\nThe post Mayoral candidate calls for election next year appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T09:58:51+00:00"},{"lane":"councils","source":"LG finance press","title":"Are US equities still exceptional? - Room151","url":"https://news.google.com/rss/articles/CBMipgFBVV95cUxNbHExeFk5dk1jNzVCQVBFRGp1Z1VhaHRET0x5MDdNRl9KRGpBYzJtXy1uZjJnaDBrcTRWblg3VXJXUFJVTU8tM3cyZENhNTNURm1URzAwYzJpNVU4S2lVYkF3a2dXNVp0RDBXRUF3X2VhWnF4V3NYNHBJVF8xVVBVUlc2TFFPcXE1cW9aUElJd3ZZNWZmOHZBa3ljSEM4RXQ4ZUMwOENR?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMipgFBVV95cUxNbHExeFk5dk1jNzVCQVBFRGp1Z1VhaHRET0x5MDdNRl9KRGpBYzJtXy1uZjJnaDBrcTRWblg3VXJXUFJVTU8tM3cyZENhNTNURm1URzAwYzJpNVU4S2lVYkF3a2dXNVp0RDBXRUF3X2VhWnF4V3NYNHBJVF8xVVBVUlc2TFFPcXE1cW9aUElJd3ZZNWZmOHZBa3ljSEM4RXQ4ZUMwOENR?oc=5\" target=\"_blank\">Are US equities still exceptional?</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Room151</font>","iso":"2026-09-24T09:23:13+00:00"},{"lane":"councils","source":"LGC","title":"Shadow unitaries seek devolution update","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/shadow-unitaries-seek-devolution-update-24-09-2026/","summary":"Both of Surrey\u2019s new shadow unitary authorities are seeking clarity from the government over the future of devolution in the county, following the pause to local government reorganisation in other two-tier areas. East Surrey shadow authority will consider a motion this afternoon on whether to\u2026\nThe post Shadow unitaries seek devolution update appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T09:11:38+00:00"},{"lane":"ours","source":"Cardiff","title":"Cardiff Council appoints interim finance chief as independence concerns shape future structure","summary":"Cardiff Council has appointed its Chief Finance Officer to the Section 151 Officer role on an interim basis for up to 12 months following the promotion of the previous holder to Chief Executive in August. The council received an independent pay review and adjusted the interim role's salary to \u00a3152,392 at Director level, a saving of \u00a312,519 against recruiting to the vacant Corporate Director post at \u00a3164,911. The arrangement creates a defined period of uncertainty about permanent structure. The council explicitly acknowledged the risk that a Chief Executive who permanently held both roles could diminish the independence of financial challenge and assurance required under CIPFA guidance on the 'golden triangle' of governance. The decision reflects the council's commitment to keeping the financial governance function independent from the Chief Executive's operational authority.","url":"https://cardiff.moderngov.co.uk/documents/s97282/97282.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"s114","figures":"None","quote":"On this basis, as the Section 151 Officer I have concluded that those conditions did not arise during the year and no Section 114 notice was issued in 2025/26.","paper":"Appointment of Section 151 Officer","committee":"Council"},{"lane":"ours","source":"Worcestershire CC","title":"Worcestershire required \u00a359.9m emergency support to set 2026/27 budget","summary":"Worcestershire Council required \u00a359.9m in government permission to borrow for day-to-day spending (a Capitalisation Directive) to balance its 2026/27 budget. The borrowing costs \u00a35.4m this year and is repaid over 20 years. The council faces an estimated \u00a385m budget gap for 2027/28 and has warned that significant cuts are required to avoid a Section 114 notice, the formal warning that the council cannot balance its budget. Overspending in social care is the main pressure: Adult Services is \u00a312.8m over budget due to 70 additional care packages and rising unit costs, while Children's Services overspends by \u00a36.8m, with 193 children in agency residential placements at \u00a37,412 weekly. The council's savings programme is 98 per cent on track, but savings are concentrated in controllable areas; Adult and Children's Services show lower savings levels than other directorates.","url":"https://worcestershire.moderngov.co.uk/documents/s61939/61939.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"EFS","figures":"\u00a359,933k total; \u00a349,933k borrowing, \u00a310,000k capital receipts","quote":"Exceptional Financial Support 0 59,933 59,933 0 0 0 0 0 0 59,933 59,933","paper":"7 Budget Monitoring P3 Final","committee":"Cabinet"},{"lane":"ours","source":"North Somerset UA","title":"North Somerset's auditor flags financial sustainability risks despite clean accounts opinion","summary":"The council's external auditor anticipates issuing an unmodified audit opinion on its 2025-26 financial statements, with no material adjustments identified to date. However, the auditor has identified a risk of significant weakness in financial sustainability reflecting continued pressure on the dedicated schools grant (DSG), the government funding for schools, and the need to deliver recurrent savings. The auditor also identified a separate risk of significant weakness in managing demand and costs in adult and children's social care. To address the schools funding crisis, the council intends to apply for the High Needs Stability Grant and DSG Deficit Support Scheme, under which up to 90 per cent of its deficit can be written off provided the council funds the remaining 10 per cent. Meanwhile, unplanned audit work on high-cost social care placements found they represent a material budget pressure, but the council has already recovered significant savings and is in discussion with local health partners to increase contributions to placement costs.","url":"https://n-somerset.moderngov.co.uk/documents/s9091/9091.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000024","council":"North Somerset UA","tag":"EFS","figures":"\u00a36m additional recurring income from EFS; 8.99% total council tax rise","quote":"Due to the structural deficit between increasing costs and the Council's capacity to increase income, the Council had to request EFS from the government to balance the 2026/27 budget.","paper":"11. Audit Findings Report 2025-26","committee":"Audit Committee"},{"lane":"ours","source":"Cheshire East UA","title":"Cheshire East uses emergency support to balance Adult Social Care budget","summary":"Cheshire East balanced its 2026/27 budget only with \u00a324.995m in emergency government support, a capitalisation direction permitting day-to-day spending to be treated as capital spending and paid for by borrowing. The underlying pressure is Adult Social Care. Demand is forecast to grow \u00a36m annually while savings programmes deliver \u00a33-4m, creating an annual structural gap of \u00a32-3m. The council states in its transformation plan that the current system cannot simultaneously meet increasing demand, deliver statutory duties, and achieve financial sustainability. Early pilots, however, show progress. The Prevent, Reduce, Enable scheme generated \u00a31.37m in cost avoidance, and Learning Disability reviews have delivered \u00a3705k from 181 reviews completed. The council has increased its Adult Social Care transformation savings target to \u00a322.45m over four years, from \u00a314.99m previously.","url":"https://moderngov.cheshireeast.gov.uk/documents/s136550/136550.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m","quote":"The budget was balanced, as required by statute, with plan ned use of EFS, by way of a capitalisation direction, totalling \u00a324.995m.","paper":"2026/27 Budget \u2013 Quarter 1 Forecast OutturnCabinet and Committee Report Template","committee":"Adults Overview and Scrutiny Committee"},{"lane":"ours","source":"Bradford","title":"Bradford council's \u00a3113m overspend met with government loan as reserves strengthen to \u00a3229m","summary":"Bradford Council spent \u00a3113 million more than its budgeted revenue, day-to-day running costs, in the year to March 2026, but the overspend was \u00a314 million lower than initially forecast. The council met the shortfall using a capitalisation direction, a government loan permitting councils to borrow for day-to-day spending rather than capital projects. Despite the deficit, usable reserves\u2014money set aside for emergencies and named purposes\u2014increased by \u00a355 million to \u00a3229.2 million, with the general reserve rising to \u00a353.1 million, representing 3.5 per cent of the council's gross expenditure base of \u00a31.5 billion. External auditors issued an unqualified opinion on the financial statements, subject to completion of outstanding audit procedures, and the council is ahead of the statutory deadline for publishing its accounts.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Runnymede","title":"Runnymede's reserves forecast to fall to \u00a32m by 2032 as costs mount","summary":"Runnymede Council's General Fund working balance\u2014its main cushion against unexpected costs\u2014is forecast to fall from \u00a321.6m in March 2027 to just \u00a32.0m by March 2032, with reserves dropping \u00a311.7m between 2029 and 2031. The deterioration is driven by a \u00a31.2m recurring cost from the council's 2025 pay and grading review and a \u00a39.1m deficit this year on its housing revenue account, the separate account for council-owned homes. The council's \u00a325.9m annual rental income from its investment property portfolio is its largest revenue source, but it has acknowledged it must be wary about reletting properties at current rates. To address the pressures, the council is exploring early repayment of one loan, has agreed to sell properties to reduce borrowing and interest costs, and commissioned a 30-year housing asset management plan.","url":"https://runnymede.moderngov.co.uk/documents/s18927/18927.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"intervention","figures":"Notice issued December 2023; now withdrawn as of September 2026 meeting date","quote":"Following the non-statutory best value notice, which has now been withdrawn","paper":"Q1 - Budget Monitoring report - Appenxix 6 v3 - final","committee":"Corporate Management Committee"},{"lane":"ours","source":"West Suffolk","title":"West Suffolk audit will remain qualified until 2027-28 due to \u00a37.8m in unaudited property assets","summary":"West Suffolk received a qualified audit opinion for 2024-25 \u2014 the auditor could not fully sign off the accounts \u2014 and another is expected for 2025-26. The qualification relates to property assets worth \u00a37.8 million last valued in 2022-23, which remain unaudited. These assets fall outside the council's current five-year revaluation programme and will not be revalued for some years; once they are, the accounts impact will take a further two years to flow through. Full audit clearance is not anticipated until 2027-28. This represents improvement from 2022-23 and 2023-24, when the national audit backlog left West Suffolk without any audit assurance. Reserves, another element of the qualification, can be resolved in the 2025-26 audit. The auditor found no concerns with the council's arrangements to manage money or decision-making properly.","url":"https://democracy.westsuffolk.gov.uk/documents/s59460/59460.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000245","council":"West Suffolk","tag":"audit opinion","figures":"\u00a329.5m cash and investments at 31 March 2026; \u00a310m forecast cash at March 2027; \u00a36.13m General Fund; \u00a352.01m earmarked reserves","quote":"Overall, based on its cash flow forecast, borrowing potential and access to investment funds, as well as the level of general fund and reserve balances it holds, the council determines that it has sufficient liquidity to continue to deliver services for the foreseeable future.","paper":"6-PAS-WS-26-015-EY-Risk-Assessment-Update","committee":"Performance and Audit Scrutiny Committee"},{"lane":"ours","source":"Hammersmith & Fulham","title":"Hammersmith and Fulham faces budget gaps of \u00a331m and \u00a357m as government funding cuts take effect","summary":"Hammersmith and Fulham Council's external auditors say the council faces medium-term budget gaps of \u00a331.4m in 2027/28 and \u00a357.3m in 2028/29, driven by government's Fair Funding Review and Business Rates reset, which reduce grants and retained business rates by \u00a323.5m in 2026/27. Transitional funding of \u00a36m will partly offset this through 2028/29. The council balanced its accounts for 2025/26 and holds total reserves of \u00a3122.1m, but the auditors say these are finite and cannot sustainably address the recurring pressures; the council will need to explore alternatives including Council Tax rises and additional savings. The council's external audit for 2025/26 cannot yet be formally certified due to unresolved pension fund matters from the prior year and a cyber incident that affected council and pension fund operations, whose wider legal, risk and fraud impacts are still being assessed.","url":"https://lbhf.moderngov.co.uk/documents/s136009/136009.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000013","council":"Hammersmith & Fulham","tag":"audit opinion","figures":"Total net assets: \u00a31,462.070 million; materiality: \u00a323 million","quote":"Our anticipated financial statements audit report opinion will be unmodified.","paper":"Appendix 4 - LBHF Pension Fund Audit Findings Report 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Sutton","title":"Sutton faces schools funding crisis unless government backs special needs reform plan","summary":"Sutton Council has accumulated a \u00a321.48m deficit in its schools budget for children with special educational needs, with spending projected to overspend by a further \u00a313.55m next year. The council's own papers show this threatens its financial stability. The government has offered to write off 90 per cent of the accumulated deficit\u2014worth \u00a319.35m\u2014but only if the council's special needs reform plan wins approval. The council is betting on that approval: it has set aside \u00a31.64m and budgets \u00a30.58m a year to cover the remaining 10 per cent liability it would owe even after a write-down. The deficit stems from a 43.7 per cent rise in children needing specialist support since December 2020, with Sutton receiving roughly 180 more assessment requests than other London boroughs of its size. The council is also facing a shortfall in capital funding: the \u00a32.83m allocated for 2026/27 is insufficient to deliver the reform plan's requirements, the council's papers state.","url":"https://sutton.moderngov.co.uk/documents/s96615/96615.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000029","council":"Sutton","tag":"DSG / SEND","figures":"\u00a32.15m residual 10% liability; \u00a31.64m High Needs Block Repayment Reserve established; \u00a30.58m annual contribution budgeted","quote":"The Council's residual 10% liability is estimated at \u00a32.15m. To fund this, the Council established a High Needs Block Repayment Reserve of \u00a31.64m and budgets an annual contribution of \u00a30.58m.","paper":"SEND Update Report","committee":"People Committee"},{"lane":"ours","source":"Harrow","title":"Harrow forecasts \u00a33m revenue overspend as temporary accommodation and school funding deficits deepen","summary":"Harrow Council is forecasting a net revenue overspend of \u00a33.039m for 2026-27 after planned use of reserves, according to its Q1 budget monitoring report to Cabinet this week. The Budget Planning Reserve would fall to \u00a323.366m if the overspend is not contained by year-end. The council's savings programme depends heavily on capital projects: nearly half of all planned savings (\u00a32.012m of \u00a34.062m) are rated Amber and contingent on delivery of the Property Acquisition Programme, the Corporate Estates Review and adult services capital investment. Underlying the overspend are structural pressures beyond the council's control. Temporary accommodation costs a \u00a315.7m annual subsidy loss as household numbers tripled from 234 in April 2023 to 726 in June 2026. The high needs school funding deficit is forecast to grow to \u00a354.181m by year-end; the government has committed to fund 90 per cent via a Section 31 grant conditional on approval of a local special educational needs reform plan. One area of progress: capital financing costs are \u00a35.859m better than budget, driven by programme slippage reducing borrowing requirements and minimum revenue provision costs.","url":"https://harrow.moderngov.co.uk/documents/s201854/201854.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000015","council":"Harrow","tag":"DSG / SEND","figures":"Total variance \u00a335,859,859 (all slippage to 27/28); SEN Expansion \u00a310,448,369; Schools Capital Maintenance \u00a37,597,098; High Needs Provision \u00a34,200,000; Additional Basic Need Funding \u00a37,761,893","quote":"Total Children's Services Directorate 41,282,293 0 41,282,293 5,422,434 (35,859,859)","paper":"Appendix 2 - 2026-27 MTFS Tracker","committee":"Cabinet"},{"lane":"ours","source":"Gloucestershire CC","title":"Gloucestershire's adult social care contracts lack basic controls, auditors find","summary":"Gloucestershire County Council's contracts with care homes and domiciliary care providers lack central management and formal acceptance, according to audits reviewed by the Audit and Governance Committee on 24 September. A centrally maintained contracts register does not exist for any category of care provider. Testing found that 68 per cent of residential and nursing care contracts and 34 per cent of domiciliary care contracts had not been formally accepted, despite the council continuing to make payments. A separate audit identified a further risk: the council pays care providers the full cost upfront but reclaims only a fixed monthly amount from the Integrated Care Board, creating a cash flow timing gap that affects treasury management. Testing of joint-funded packages found errors in half the sample reviewed. Internal audit gave the contracts audit a limited assurance rating and identified seven high and medium-priority recommendations.","url":"https://gloucestershire.moderngov.co.uk/documents/s120233/120233.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E10000013","council":"Gloucestershire CC","tag":"DSG / SEND","figures":"\u00a346.28 million increase; \u00a3124.7 million cumulative deficit; \u00a336.3 million general fund balance; approximately \u00a312.5m residual local contribution; statutory override expires March 2028","quote":"The DSG deficit increased by \u00a346.28 million in 2025/26 to \u00a3124.7 million, compared to a General Fund balance at year end of \u00a336.3 million.","paper":"ISA260 202526 GCC draft for papers","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Babergh","title":"Councils defer \u00a3973k in interest payments as commercial ventures struggle","summary":"Babergh and Mid Suffolk agreed to defer approximately \u00a3974,000 in interest payments from CIFCO Ltd, their main investment subsidiary, across the next two years, on top of \u00a31.3m in deferrals already accumulated. The deferral, representing about 13 per cent of annual interest owed by CIFCO to the two councils combined, comes as both authorities' commercial housing schemes underperformed. Babergh's Hadleigh scheme has \u00a34.889m in expected credit losses with units unsold since practical completion, while Mid Suffolk cancelled phase two of its Needham Market development entirely and sold the land for \u00a32.7m after writing off \u00a3877,000 in costs. Both councils hold \u00a343.3m in loans to CIFCO. The councils' mainstream debt position improved: Mid Suffolk reduced borrowing by \u00a314.2m, cutting expensive short-term debt from \u00a318m to \u00a35m. Babergh's general fund financing costs rose to 33 per cent of annual revenue from 28 per cent budgeted, reducing the cushion for service delivery.","url":"https://baberghmidsuffolk.moderngov.co.uk/documents/s43661/43661.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000200","council":"Babergh","tag":"LOBO","figures":"\u00a34m LOBO loans outstanding; average rate 4.21%; call dates February and August each year","quote":"The lender has not exercised its option during 2025/26.","paper":"MC/26/15 Annual Treasury Management Report 2025-26","committee":"Mid Suffolk Council"},{"lane":"ours","source":"City of Edinburgh","title":"Edinburgh plans substantial borrowing rise despite auditor warning on debt sustainability","summary":"Edinburgh Council ended 2025-26 with a \u00a332.2m underspend but auditors warned that planned substantial increases in borrowing over the next five years present a significant risk to longer-term financial sustainability. The underspend masked structural pressures: \u00a324.9m came from a one-off legal settlement, and the council acknowledged relying on \"one-off mitigations\" to balance the year. Only 70% of \u00a343.2m of planned savings were delivered, with delays in demand-led services including home to school transport and property maintenance. Capital spending underspent by \u00a338.2m, including \u00a320m in delayed housing acquisitions for temporary accommodation where property availability fell short of expectations. Auditors gave the accounts an unqualified opinion but identified governance weaknesses requiring action and found the council's approach to strategic asset management fragmented, making it harder to set spending priorities.","url":"https://edinburgh.moderngov.co.uk/documents/s103738/103738.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"S12000036","council":"City of Edinburgh","tag":"LOBO","figures":"\u00a332m market debt repaid (including two LOBOs); outstanding LOBO debt \u00a3122.4m","quote":"The lenders exercised their option to request an increase in the interest rate paid on the loans and the Council exercised its option to repay the loans at par with no penalty.","paper":"8.3 Revenue monitoring outturn 25-26","committee":"Finance and Resources Committee"},{"lane":"ours","source":"Thanet","title":"Thanet council reserves fall to critically low level as structural deficits persist","summary":"Thanet council's general reserves have fallen to \u00a35.1m, leaving only \u00a34.1m of unrestricted reserves available to cover unexpected costs. This is below the \u00a36m floor the chief finance officer has advised the council should maintain, particularly given the impending local government reorganisation and rising service pressures forecast for the coming year. The council has drawn down \u00a34.7m from reserves over two years to cover deficits of \u00a34.7m in 2024-25 and \u00a33.5m in 2025-26. Structural overspends in temporary accommodation, housing benefit and waste services are expected to continue, with the 2026-27 budget forecast to exceed \u00a31m overspend before accounting for a non-recurring collection fund surplus. Reorganisation transition costs of \u00a3700k to \u00a31.2m have not yet been funded. The council is pursuing spending controls including weekly approval panels for orders over \u00a310,000, but these have not arrested the underlying cost pressures.","url":"https://thanet.moderngov.co.uk/documents/s97590/97590.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000114","council":"Thanet","tag":"LOBO","figures":"\u00a34.5m LOBO at 4.19%, repaid 9 December 2025","quote":"The Council had a Lender Option Borrower Option (LOBO) loan for \u00a34.5m at 4.19% and the lender exercised its option to increase the interest rate from 9 December 2025. Accordingly, the Council exercised its option to repay this loan on the same date.","paper":"Council - 2025-26 Budget Approvals Report","committee":"Council"},{"lane":"ours","source":"Tunbridge Wells","title":"Tunbridge Wells council starts year with stronger cash position as investment income outperforms","summary":"Tunbridge Wells Cabinet heard on 24 September that the council opened the financial year with \u00a341.9 million in cash, \u00a31.9 million more than budgeted, after capital projects totalling \u00a314.074 million were rescheduled into 2026/27. The stronger liquidity position has boosted investment returns. The council forecasts investment income of \u00a32.2 million for the year against a \u00a32 million budget, a surplus of \u00a3200,000 that will be transferred to reserves, after achieving an average interest rate of 4.13 per cent rather than the budgeted 3.94 per cent. Q1 investment balances reached \u00a348.3 million, well above the year-end budget assumption of \u00a328.9 million. The council holds no external debt. However, the capital programme is forecast to spend \u00a319.9 million in 2026/27 against a budget of \u00a38.9 million\u2014more than double\u2014and the Grant Volatility Reserve, which buffers against swings in government funding, is forecast to be completely depleted by March 2027.","url":"https://tunbridgewells.moderngov.co.uk/documents/s84985/84985.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000116","council":"Tunbridge Wells","tag":"borrowing","figures":"Internal Borrowing: \u00a33,687k","quote":"Internal Borrowing still to be repaid (projects not yet financed/MRP) (3,687)","paper":"Quarter 1 Treasury Management 202627","committee":"Cabinet"},{"lane":"ours","source":"Herefordshire UA","title":"Herefordshire Council forecasts \u00a311.6m revenue overspend as social care and transport demand pressures continue","summary":"Herefordshire Council is facing a forecast overspend of \u00a311.6 million, or 5% of its net budget, in the year to March 2027, driven by continuing demand pressures in adult social care and special educational needs transport. The Community Wellbeing directorate is running \u00a34.9 million over budget, and home-to-school transport for children with special needs is overspending by \u00a33.0 million. The council's budget resilience reserve has been depleted to \u00a31.0 million from \u00a311.0 million two years ago, leaving it with insufficient reserves to absorb the overspend without immediate action. One-third of the council's approved savings for the year remain at-risk, with activity to deliver them not yet commenced. Meanwhile, the council expects government grant to cover approximately 90% of its \u00a362.2 million cumulative schools funding deficit, pending Department for Education approval, with the remaining \u00a33.6 million to become a council liability from March 2028 onwards.","url":"https://councillors.herefordshire.gov.uk/documents/s50135886/50135886.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E06000019","council":"Herefordshire UA","tag":"borrowing","figures":"Capital Financing Requirement \u00a3330.3m, long-term borrowing \u00a3184.7m","quote":"It is anticipated that significant borrowing will be undertaken in the last 3 quarters of the financial year due to replacement of internal borrowing with external borrowing, depending on actual expenditure within the capital programme.","paper":"Q1 2026/27 Budget Report, main report","committee":"Cabinet"},{"lane":"policy","source":"MHCLG","title":"Correspondence: City of London Corporation Local Plan: letters from the Housing Minister","url":"https://www.gov.uk/government/publications/city-of-london-corporation-local-plan-letters-from-the-housing-minister","summary":"Letters from the Minister of State for Housing and Planning, the Right Honourable Matthew Pennycook MP, to the Planning Inspectorate in respect of the City of London Corporation Local Plan.","iso":"2026-09-24T08:43:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Live tables on housing supply: indicators of new supply","url":"https://www.gov.uk/government/statistical-data-sets/live-tables-on-house-building","summary":"The latest data tables on housing supply: indicators of new supply.","iso":"2026-09-24T08:30:20+00:00"},{"lane":"councils","source":"LGC","title":"Social care ombudsman complaints rise 22%","url":"https://www.lgcplus.com/services/health-and-care/social-care-ombudsman-complaints-rise-22-24-09-2026/","summary":"Complaints to the ombudsman about adult social care rose by 22% last year, new figures show. The Local Government & Social Care Ombudsman received 3,938 complaints about adult social care in 2025-26, according to its annual review published today. The largest share of complaints to\u2026\nThe post Social care ombudsman complaints rise 22% appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T04:38:19+00:00"},{"lane":"councils","source":"LGC","title":"LGA calls for \u2018alternative\u2019 to EFS","url":"https://www.lgcplus.com/finance/lga-calls-for-alternative-to-efs-24-09-2026/","summary":"The Local Government Association has called for a revision of the exceptional financial support programme, with its chair warning councils are \"financially fragile\". In its Autumn Budget submission to the chancellor the LGA said it is \u201cconcerned about the effectiveness\u201d of EFS for those councils\u2026\nThe post LGA calls for \u2018alternative\u2019 to EFS appeared first on Local Government Chronicle (LGC).","iso":"2026-09-24T03:27:03+00:00"},{"lane":"councils","source":"LG finance press","title":"IFS Recruitment Event 2026 - IFS | Institute for Fiscal Studies","url":"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9oS3JrT2ZoaUEwY1BHZ2F2ckU2R0ZOdTNCN1Nkc1lwQ2hud2c1VkhhNFFtdkx5WHBpc1pFcHo3TDVRWkRYLXFqd1ZkUGRVTC1BWDBxSVplUXp6YW5tQXBCaTZB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiYkFVX3lxTE9oS3JrT2ZoaUEwY1BHZ2F2ckU2R0ZOdTNCN1Nkc1lwQ2hud2c1VkhhNFFtdkx5WHBpc1pFcHo3TDVRWkRYLXFqd1ZkUGRVTC1BWDBxSVplUXp6YW5tQXBCaTZB?oc=5\" target=\"_blank\">IFS Recruitment Event 2026</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">IFS | Institute for Fiscal Studies</font>","iso":"2026-09-23T15:42:56+00:00"},{"lane":"councils","source":"LGC","title":"WEBINAR: How Burnley became Council of the Year","url":"https://www.lgcplus.com/politics/governance-and-structure/webinar-how-burnley-became-council-of-the-year-23-09-2026/","summary":"Burnley BC was named Council of the Year at the LGC Awards 2026. The judges said: \u201cThis council has demonstrated exceptional work in place leadership and community cohesion. The judges were inspired by the council\u2019s passion and fearless leadership, with outstanding results in areas from\u2026\nThe post WEBINAR: How Burnley became Council of the Year appeared first on Local Government Chronicle (LGC).","iso":"2026-09-23T10:06:30+00:00"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"markets","source":"Bank of England","title":"Foreign Currency Reserves 2026 \u2013 Market Notice 22 September 2026","url":"https://www.bankofengland.co.uk/markets/market-notices/2026/september/foreign-currency-reserves-2026-market-notice-22-september-2026","summary":"Not for distribution, directly or indirectly, in or into the United States, Canada, Australia, Japan or any other jurisdiction where it is unlawful to distribute this announcement","iso":"2026-09-22T15:30:00+00:00"},{"lane":"ours","source":"Medway Towns UA","title":"Medway faces \u00a326.7m current-year overspend and \u00a365m structural deficit dependent on government funding","summary":"Medway Council faces a \u00a326.7m overspend forecast in the current financial year, exceeding its total general reserves of \u00a310.1m, and a structural budget gap of \u00a365.9m in 2027/28 rising to \u00a3359.3m cumulatively across the medium term. The financial plan cannot be balanced without exceptional financial support from government\u2014permission to borrow to cover day-to-day spending\u2014which has not been confirmed for 2027/28. If the government refuses, the Section 151 officer, the council's chief finance officer, may be forced to issue a Section 114 notice, a formal warning that the council cannot balance its budget, which freezes new spending until councillors agree a plan. The Cabinet heard pressures of \u00a338.6m in adult social care and \u00a39.2m in children's services, with adult social care costs having more than doubled since 2020-21.","url":"https://democracy.medway.gov.uk/documents/s91492/91492.pdf","iso":"2026-09-22T09:00:00+00:00","gss":"E06000035","council":"Medway Towns UA","tag":"s114 risk","figures":"\u00a365.858m 2027/28 gap dependent on EFS; EFS already granted for 2025/26 (\u00a39.856m) and agreed in-principle for 2026/27 (total \u00a328.003m borrowed)","quote":"The current MTFO projections cannot be balanced through the use of reserves and assume that further exceptional financial support from Government will be required. There remains a significant risk to the Council's financial resilience should additional support not be forthcoming...In the unlikely event that the MHCLG rejects the Council's latest application for EFS, the Section 151 Officer may be forced to issue a Section 114 notice to the Council.","paper":"Report","committee":"Cabinet"},{"lane":"ours","source":"Slough UA","title":"Slough Council faces \u00a319.9m overspend with government-appointed commissioners warning of financial collapse by year-end.","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV tturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"CIPFA and the codes","title":"CIPFA prudential code changes aim for grea function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
</body></html>
