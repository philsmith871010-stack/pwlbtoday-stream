<title>PWLBintel — the newsroom</title>

<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

<script>
const DATA = {"generated":"2026-09-21T06:13:04.057666+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":4,"councils":16,"policy":31,"markets":39},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":6,"hm-treasury":4,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"_":"no key"},"items":[{"lane":"ours","source":"Slough UA","title":"Slough braces for financial collapse as children's care costs spiral \u00a316m over budget","summary":"Slough council faces a general fund overspend of \u00a319.9m in the current financial year, with government-appointed commissioners declaring the position \"extremely serious\" and requiring \"structured and swift intervention\" to avoid financial collapse by year-end. Children's social care accounts for \u00a315.955m of the shortfall \u2014 80 per cent of the total deficit \u2014 driven by a 26 per cent rise in the number of children in placements and a 40 per cent jump in average costs per child. About 15 children in specialist placements each cost more than \u00a3500,000 a year. The council is drawing on reserves and racing to sell assets to plug the gap, but has received only \u00a33m of a planned \u00a327.7m in property sales so far. Commissioners have demanded visible leadership from elected members and a willingness to defer or pause non-statutory projects to signal seriousness about recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"ours","source":"E08000039","title":"Sheffield faces \u00a329m schools funding gap it says only government can solve","summary":"Sheffield City Council expects to overspend its dedicated schools grant\u2014the government funding that pays for schools\u2014by \u00a329m in 2026/27, a figure the council says cannot be closed without additional money from central government. The overspend stems from sustained pressure on high needs funding, the part of schools money for children with special educational needs and disabilities, driven by increases in special educational needs placements that took effect last September and further growth in post-16 college places. The council states that \"increased SEN costs and number of places continue to create pressures,\" indicating the structural nature of the demand. A separate \u00a313.6m budget increase for children's services placements has also failed to contain costs, with external residential care running \u00a30.8m over budget due to rising prices, suggesting demand is outpacing funding across the board.","url":"https://democracy.sheffield.gov.uk/documents/s87874/87874.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E08000039","council":"E08000039","tag":"DSG / SEND","figures":"\u00a329m overspend forecast; \u00a327m budgeted over-commitment; SEN placements from September 2025; further Post 16 college place increases","quote":"The DSG overspend of \u00a329m is unlikely to be resolved without additional funding and increased SEN costs and number of places continue to create pressures.","paper":"Appendix 2 - 2627 Q1 Capital Monitoring Report","committee":"Finance and Performance Policy Committee"},{"lane":"ours","source":"Gateshead","title":"Gateshead's financial surplus masks underlying crisis in adult and children's care spending","summary":"Gateshead Council reported a \u00a38.4m revenue surplus for 2025/26, but the figure masks significant financial strain. A \u00a36.7m one-off dividend from Newcastle International Airport shareholding accounted for most of the surplus; the underlying operational position was far weaker. Adult and Children's Social Care overspent by a combined \u00a36.5m despite the council approving an additional \u00a310.2m in budget for 2026/27, signalling that demand for high-cost placements is outpacing the council's ability to manage costs. The council drew \u00a38.5m from its Budget Sustainability Reserve (the pot of money set aside to bridge to planned savings) in 2025/26 and has budgeted a further \u00a34m draw for 2026/27. A five-year financial plan presented to the committee projects a structural funding gap of \u00a332.5m, and the council acknowledges that \"substantial additional interventions and efficiencies will need to be developed\" beyond the identified social care savings to close it.","url":"https://gateshead.moderngov.co.uk/documents/s50355/50355.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E08000037","council":"Gateshead","tag":"DSG / SEND","figures":"\u00a33.792m cumulative deficit, \u00a33.176m 2025/26 overspend, override expiry 31 March 2028","quote":"The Dedicated Schools Grant (DSG) outturn position for 2025/26 was an overspend of \u00a33.176m, primarily within the High Needs Block. As a result, the cumulative DSG deficit increased to \u00a33.792m at 31 March 2026. In line with the current statutory override, the deficit balance on the DSG is held separately and is not charged to the Council's General Fund. The statutory override is due to end on 31 March 2028.","paper":"OSC 2026 Financial Outturn Report - Final","committee":"Corporate Resources Overview and Scrutiny Committee"},{"lane":"ours","source":"Newcastle","title":"Newcastle housing service found to have severe maladministration and systemic failures","summary":"Newcastle City Council's housing service has been found to have severe maladministration and systemic failures in repairs, complaint handling and record-keeping, according to eight determinations issued by the Housing Ombudsman in 2025\u201326. The independent regulator identified one case of severe maladministration and six of maladministration. The council is not meeting statutory timescales for responding to complaints: only 32.6 per cent of escalated complaints were answered within the required deadline, against a target of 100 per cent. Repairs and construction, which account for more than half of all housing complaints, were identified as a particular problem area, with delays, damp and mould, repeat issues and weak oversight of complex repairs. The Ombudsman found that investigations did not address every point raised by residents and that limited record-keeping weakened evidence of decisions and actions. The council has acknowledged it is not fully compliant with the Housing Ombudsman's statutory Complaints Handling Code and faces the risk of enforcement action.","url":"https://democracy.newcastle.gov.uk/documents/s219034/219034.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E08000021","council":"Newcastle","tag":"DSG / SEND","figures":"\u00a311.297 million overspend in 2026-27; cumulative DSG reserve deficit \u00a317.153 million; DSG reserve negative \u00a35.808 million at 1 April 2026; High Needs spend \u00a366.6m vs funding \u00a355.2m","quote":"The Dedicated Schools Grant (DSG) is projecting an overspend of \u00a311.297 million. As at 1 April 2026 the DSG reserve balance was a negative \u00a35.808 million... this would result in a negative reserve balance of \u00a317.153 million on the DSG. Currently, the Council can account for this as an unusable reserve due to a statutory override... This was due to expire in March 2026 however government has announced an extension to March 2028.","paper":"6. Council Tax Support Cabinet","committee":"Cabinet"},{"lane":"ours","source":"Carmarthenshire","title":"Carmarthenshire faces \u00a317m overspend in children's, adult care and schools","summary":"The council's 2025-26 outturn shows significant overspends across key services driven by rising demand and complexity. Children's services overspent by \u00a33.7m, mainly in commissioned placements, with the main children's home reporting no spare capacity. Adult social care overspent by \u00a35.1m across older people, learning disabilities and mental health services. School budgets overspent by \u00a37.7m, with transport costs also running ahead. These are structural pressures: housing repair demand has increased 30% annually and education spending has not kept pace with cost and statutory duty pressures. The council is allocating additional funding but it is not enough. During 2025-26, the council took \u00a330m of new borrowing from the Public Works Loan Board, the government's lending arm for councils.","url":"https://carmarthenshire.moderngov.co.uk/documents/s110374/110374.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"W06000010","council":"Carmarthenshire","tag":"borrowing","figures":"Total loans \u00a3434.13m (up from \u00a3415.83m, increase \u00a318.30m); PWLB \u00a3425.04m (up from \u00a3403.45m, increase \u00a321.59m); Market \u00a30m (repaid from \u00a33.00m); \u00a330.00m borrowed in six PWLB loans at 4.51-4.86%; under-borrowing \u00a3152m vs CFR \u00a3586m","quote":"The total loans outstanding at 1st April 2025 and 31st March 2026 were:","paper":"04. App B - HRA BM June 2026","committee":"Cabinet"},{"lane":"ours","source":"Torridge","title":"Torridge saves \u00a321.93 per household through treasury management outperformance","summary":"Torridge council delivered net interest income of \u00a321.93 per household in 2025-26, swinging from a budgeted cost of \u00a339.43 per property as investment returns grew and borrowing remained minimal. The council took in \u00a31.43 million from short-term investments\u201472 per cent more than the previous year\u2014by deploying additional cash into investments despite falling interest rates. This was achieved while managing capital spending of \u00a319.6 million without any new external borrowing, instead relying on grants, revenue contributions and its substantial cash reserves. The council holds only \u00a3191,000 of Public Works Loan Board debt (the government's lending arm for councils) and has built liquid reserves to \u00a328 million, a 40 per cent increase year-on-year. Treasury staff noted, however, that further interest rate cuts by the Bank of England toward its 2 per cent inflation target could pressure investment returns in future.","url":"https://democracy.torridge.gov.uk/documents/s40144/40144.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E07000046","council":"Torridge","tag":"borrowing","figures":"No new external borrowing; total capital spending \u00a319,589k; CFR \u00a33,901k; internal borrowing used \u00a32,152k against estimate of \u00a35,417k","quote":"No additional external borrowing was undertaken during 2025/26. Actual borrowing for the year as shown above, is significantly below the Authorised limit.","paper":"12 - Annual Report on Treasury Management 2025-26","committee":"Full Council"},{"lane":"ours","source":"The Scottish Borders","title":"Scottish Borders borrows \u00a350m more to fund capital spending as loan charges bite into budget","summary":"Scottish Borders Council increased its external debt by \u00a350 million to \u00a3399 million in 2025-26 to finance capital investment, driving borrowing from the Public Works Loan Board up from \u00a3330 million to \u00a3384 million. The council spent \u00a382.3 million on capital projects\u2014roads, buildings, equipment\u2014of which two-thirds was funded by borrowing. Yet the rising debt is straining the revenue budget, the day-to-day spending on services and staff. Interest payments jumped from \u00a319.7 million to \u00a322.4 million, and loan charges consumed 9.1 per cent of the council's net revenue funding, up from 8.1 per cent a year earlier. To manage the pressure, the council drew down \u00a39 million from its general reserves, money set aside as a cushion for the unexpected, to smooth the impact of loan charges. The council remains in an under-borrowed position relative to its long-term capital needs but faces a structural gap between the cost of servicing past borrowing and available resources.","url":"https://scottishborders.moderngov.co.uk/documents/s100208/100208.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"S12000026","council":"The Scottish Borders","tag":"borrowing","figures":"Under-borrowing \u00a3111.3m at 31 March 2026; prior year \u00a3127.9m","quote":"During the year the Council has again, where possible, deferred borrowing using surplus cash rather than undertaking new borrowing.","paper":"Item No. 06 - Covering Report Annual TM Report 25-26","committee":"Audit Committee"},{"lane":"markets","source":"BBC business","title":"US and China discuss AI safety plan ahead of Trump-Xi summit","url":"https://www.bbc.co.uk/news/articles/c8vgyzn2d31yo?at_medium=RSS&at_campaign=rss","summary":"Top US and Chinese officials held talks in New York on Sunday ahead of a Trump-Xi summit this week.","iso":"2026-09-21T05:50:56+00:00"},{"lane":"markets","source":"City AM","title":"FTSE 100 Live: Stocks to gain as oil prices slip","url":"https://www.cityam.com/ftse-100-live-stocks-to-drop-after-falling-oil-prices-weigh-on-bp-and-shell/","summary":"Welcome back to City AM\u2019s FTSE 100 liveblog. The UK\u2019s blue-chip index is set to make gains on Monday morning, according to futures from investment platform IG. This would see the FTSE 100 reverse some of the heavy losses it suffered on Friday, when the index closed 1.5 per cent lower. Falling oil prices pushed [...]","iso":"2026-09-21T05:30:00+00:00"},{"lane":"markets","source":"City AM","title":"Scotch is missing ncils","source":"LG finance press","title":"LGR reaction, debt backlash and EFS worry: Room151 survey highlights revealed - Room151","url":"https://news.google.com/rss/articles/CBMisAFBVV95cUxPX1kwdnZYN0drUThabVp5OXVHLWYwZkRZVlktSjJEcEJYSU05UFFvUENCbFdWVlY4SlBoVllsb0hsbzhRQ2hvb2MyWDlTc0RiTmd3MnE0RHI0Y1prclJKT0szSkhraUdTUHI1QzFSUGJFTzQ5SGxma3E4VzA4QWdiSENFeFhyazRYbkVLNjVYTkU5dmt0dmR4Y2dsNGJRa2c4QzB6OE1yc2s4YXNtMkIwRg?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMisAFBVV95cUxPX1kwdnZYN0drUThabVp5OXVHLWYwZkRZVlktSjJEcEJYSU05UFFvUENCbFdWVlY4SlBoVllsb0hsbzhRQ2hvb2MyWDlTc0RiTmd3MnE0RHI0Y1prclJKT0szSkhraUdTUHI1QzFSUGJFTzQ5SGxma3E4VzA4QWdiSENFeFhyazRYbkVLNjVYTkU5dmt0dmR4Y2dsNGJRa2c4QzB6OE1yc2s4YXNtMkIwRg?oc=5\" target=\"_blank\">LGR reaction, debt backlash and EFS worry: Room151 survey highlights revealed</a>&nbsp;&n","iso":"2026-09-17T10:30:59+00:00"},{"lane":"councils","source":"Distress watch","title":"Bradford Council awarded extra \u00a312m in SEND funding - Rayo","url":"https://news.google.com/rss/articles/CBMiiwFBVV95cUxQaXEyQVYxaXJjVnpHajM0b2sxeXU2ODlCOE1pLXV3NTYtSlQ2VkV5S0N5SDdUNEFEMmxJaE9zZTN6bDEzQmdUQjJ5VlFsUU1BMHE4YXEyck1wRHZubk90elJXckFJQ0w1WEtXWHVzYW9wVG41LXFVeURqMlp0OTFDTmg0ZmV5dHZBbFh3?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiiwFBVV95cUxQaXEyQVYxaXJjVnpHajM0b2sxeXU2ODlCOE1pLXV3NTYtSlQ2VkV5S0N5SDdUNEFEMmxJaE9zZTN6bDEzQmdUQjJ5VlFsUU1BMHE4YXEyck1wRHZubk90elJXckFJQ0w1WEtXWHVzYW9wVG41LXFVeURqMlp0OTFDTmg0ZmV5dHZBbFh3?oc=5\" target=\"_blank\">Bradford Council awarded extra \u00a312m in SEND funding</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Rayo</font>","iso":"2026-09-17T10:20:33+00:00"},{"lane":"councils","source":"LGC","title":"How we put nature at the heart of growth","url":"https://www.lgcplus.com/idea-exchange/how-we-put-nature-at-the-heart-of-growth-17-09-2026/","summary":"Enfield LBC\u2019s rural transformation team won the small team of the year category at the LGC Awards 2026. Here is an edited version of their winning submission. The LGC Awards 2027 are moving from June to March, with an earlier entry deadline of 16 October.\u00a0Explore\u2026\nThe post How we put nature at the heart of growth appeared first on Local Government Chronicle (LGC).","iso":"2026-09-17T10:01:51+00:00"},{"lane":"councils","source":"LGC","title":"Chiefs continue LGR prep despite the pause","url":"https://www.lgcplus.com/politics/governance-and-structure/chiefs-continue-lgr-prep-despite-the-pause-17-09-2026/","summary":"Council chief executives are continuing preparations for local government reorganisation despite the government\u2019s decision to pause the programme. Communities secretary Angela Rayner announced last week that four LGR programmes in Essex, Hampshire, Suffolk and Norfolk have been withdrawn and the remaining 14 areas have been\u2026\nThe post Chiefs continue LGR prep despite the pause appeared first on Loc","iso":"2026-09-17T09:59:04+00:00"},{"lane":"policy","source":"MHCLG","title":"Guidance: Common Ground Award 2026 to 2027: prospectus","url":"https://www.gov.uk/government/publications/common-ground-award-2026-to-2027-prospectus","summary":"Grant prospectus for a competitive award that will invest capital funding into organisations effectively promoting social cohesion in England.","iso":"2026-09-17T09:24:21+00:00"},{"lane":"ours","source":"Croydon","title":"Croydon's \u00a31.5bn debt continues to block return to financial self-sufficiency, auditor warns","summary":"Croydon's external auditor has renewed its formal statutory recommendation that the council must solve its \u00a31.5bn General Fund debt to achieve financial self-sufficiency, with annual debt servicing costs of \u00a382m. The council is operating under government directions for failure to meet its best value duty and continues to rely on exceptional financial support, including capitalisation directions (government permission to treat day-to-day spending as capital spending to be paid by borrowing or asset sales). The Financial Strategy forecasts this reliance will continue through 2030. The auditor rated the council's Financial Sustainability arrangements Red, the lowest rating, citing significant weakness in cost and debt reduction. A separate issue has emerged: the schools funding deficit reached \u00a357.6m by March 2026, growing by \u00a329.4m in a single year, and the council must show by March 2028 how to manage the residual shortfall when a temporary government override expires.","url":"https://croydon.moderngov.co.uk/documents/s72885/72885.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"EFS","figures":"\u00a327.3m Stabilisation Plan achieved; continued reliance on Exceptional Financial Support","quote":"The Council's financial position remains the most significant governance weakness and the delivery of the outcomes in the Financial Strategy 2027-30 provides the road map to achieving financial sustainability","paper":"Progress Update and Annual Head of Internal Audit Report","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Hillingdon","title":"Hillingdon faces adverse homelessness trend despite lower opening numbers","summary":"Hillingdon Council faces an adverse trend in homelessness demand despite opening the financial year with 155 fewer households in nightly-paid accommodation than budgeted. In the first four months, placements have increased by 11 against a budgeted reduction of 7, prompting the council to identify a \u00a31.2m risk for the rest of the year. The council also faces a \u00a313.1m overspend on schools funding for children with special needs, driven by parents applying before government reforms take effect; under a temporary government rule, this overspend is recorded outside the council's main accounts. The council has nonetheless delivered or is tracking to achieve three-quarters of its \u00a327.1m annual savings programme. Its capital programme shows a \u00a331.7m underspend\u2014a quarter of budgeted capital spending\u2014which the council plans to carry forward to later years.","url":"https://modgov.hillingdon.gov.uk/documents/b15940/Cabinet Agenda B - Budget Monitoring 17th-Sep-2026 19.00 CABINET.pdf?T=9","iso":"2026-09-17T09:00:00+00:00","gss":"E09000017","council":"Hillingdon","tag":"EFS","figures":"\u00a361.388m revenue costs capitalized under Exceptional Financial Support","quote":"Excluding the in-principle approval from the Ministry of Housing, Communities and Local Government [MHCLG] to allow the Council to capitalise \u00a361.388m of revenue costs as part of its Exceptional Financial Support","paper":"Cabinet Agenda B - Budget Monitoring","committee":"CABINET"},{"lane":"ours","source":"Brighton & Hove UA","title":"Brighton and Hove faces \u00a320.9m overspend, requests \u00a330m government loan","summary":"Brighton and Hove Council is requesting permission from government to borrow an additional \u00a330m \u2014 known as exceptional financial support \u2014 after forecasting a \u00a320.852m overspend for 2026/27. The council has warned that if the request is denied, its chief finance officer will file a Section 114 notice, a formal warning that the council cannot balance its budget from income. The overspend stems from three main pressures: temporary accommodation (\u00a312m), adult social care placements (\u00a312m), and schools funding for special educational needs (\u00a38.925m). The council's transformation programmes are on track but cannot keep pace with rising demand and costs. A CIPFA review found financial resilience weaknesses; the council reports improvements are being implemented, with a follow-up assessment scheduled for end of September.","url":"https://democracy.brighton-hove.gov.uk/documents/s217111/217111.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E06000043","council":"Brighton & Hove UA","tag":"EFS","figures":"\u00a330m EFS request for 2026/27","quote":"The forecast position has required the Council to approach MHCLG to request more Exceptional Financial Support for 2026/27, expected to be a sum of up to \u00a330m. It should be noted that this is additional borrowing, not additional funding.","paper":"Appendix 1- Adult Social Care savings extract from Full Council Budget report 26th February pages 51,52 and 53","committee":"Cabinet"},{"lane":"ours","source":"Liverpool","title":"Liverpool's reserves fall to critical low after \u00a335.5m in overspends","summary":"Liverpool City Council's usable reserves have fallen to \u00a325.4m after two successive years of major overspends, leaving it with what its chief finance officer describes as a \"very low level\" of financial cushion. The council overspent by \u00a323.8m in 2024/25 and \u00a311.7m in 2025/26, consuming contingency funds that had been earmarked to bolster reserves. The deterioration comes as the council faces a cumulative budget gap of \u00a363.9m by 2028/29, driven by structural pressures in social care, schools support and homelessness that the council acknowledges \"will continue into future years unless the council delivers on its approved savings programmes.\" The chief finance officer has warned that \"sustainability and liquidity are overriding concerns,\" citing the council's ability to manage its budget within available resources and maintain adequate reserves against unexpected pressures.\n\n---","url":"https://councillors.liverpool.gov.uk/documents/s328596/328596.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E08000012","council":"Liverpool","tag":"audit opinion","figures":"General Fund Reserve \u00a325.389m as buffer against \u00a3756m revenue spend","quote":"Nevertheless, the issues of sustainability and liquidity are overriding concerns for the council despite the going concern prescription. In this respect the key risks for the council are the ability to manage its budget within available resources and the need to maintain adequate reserve balances to mitigate the risks of unexpected cost pressures and difficulties in delivering approved savings programmes.","paper":"Appendix 1 for Draft Statement of Accounts and Draft Annual Governance Statement for 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Guildford","title":"Guildford Council forecasts \u00a31.1m budget shortfall as trade waste income collapses","summary":"Guildford Borough Council is projecting an overspend of \u00a31.066 million on its day-to-day spending for 2026-27, officers told the Executive on 17 September. The largest single pressure is a \u00a30.487 million shortfall in Trade Waste Services income \u2014 26 per cent below the budgeted \u00a31.857 million \u2014 which the council has now accepted will not recover and has rebased its forecasts accordingly. Environmental Services is also facing \u00a30.350 million in higher agency staffing costs to cover vacant posts, costs that exceed what was budgeted for permanent staff. A planned staffing restructure in Community Services has slipped, adding a further \u00a30.075 million. The council is requesting a \u00a3200,000 supplementary estimate from reserves to cover unbudgeted increases in IT costs. Officers are monitoring the position but have not yet set out how the overall \u00a31.1 million gap will be closed.","url":"https://guildford.moderngov.co.uk/documents/s45595/45595.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E07000209","council":"Guildford","tag":"audit opinion","figures":"2 prior years unaudited; disclaimer issued Q3 2025/26; 4-year improvement plan in place","quote":"An audit of the Statement of Accounts for 2025/26 was undertaken by external audit in Q3 2025/26 and was given a disclaimer of opinion due to the 2 previous years accounts being unaudited.","paper":"Risk Management &amp; Corp Risk Registers (Q1 2026-27)","committee":"Executive"},{"lane":"ours","source":"Aberdeenshire","title":"Aberdeenshire faces \u00a330.5m refinancing bill as three bank loans called at higher rates","summary":"Aberdeenshire Council has repaid three bank loans totalling \u00a330.5m after lenders exercised their option to raise interest rates by 2\u20133 percentage points. The loans, known as LOBO loans (lender option, borrower's option), were called with proposed rates of between 6.70% and 7.48%, compared to existing rates of between 3.70% and 4.65%. The Council chose to repay rather than accept the higher charges, but must now refinance the debt in a market where interest rates are expected to remain elevated. The refinancing need coincides with a deeper structural budget challenge. The council's Business Services directorate is forecasting a \u00a31.865m underspend this year, but has warned this is temporary: it stems from vacant posts that will be filled, uncertain property income, and timing effects that will unwind. Of \u00a3479,000 in savings the council agreed to make, only \u00a3220,000 has been achieved nine months in. The council has explicitly stated that reserves \u2014 currently providing temporary support \u2014 cannot solve its fundamental budget shortfall and that \"reliance on reserves do not remove the need to identify and deliver recurring savings.\"","url":"https://aberdeenshire.moderngov.co.uk/documents/s48155/48155.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"S12000034","council":"Aberdeenshire","tag":"LOBO","figures":"\u00a310.0m at 3.70% (proposed 6.70%); \u00a35.5m at 4.40% (proposed 6.72%); \u00a315.0m at 4.65% (proposed 7.48%); total \u00a330.5m","quote":"The lender option exercises resulted in proposed revised rates that were significantly above the existing loan rates. The Council therefore exercised its option to repay the loans without breakage cost.","paper":"Appendix 1 - Business Services Performance 2026/27","committee":"Business Services Committee"},{"lane":"ours","source":"Wolverhampton","title":"Wolverhampton repays \u00a317m in loans amid sharp rate hike demands","summary":"Wolverhampton Council rejected proposals to increase rates on three bank loans totaling \u00a317m and chose instead to repay them in full. LOBO loans are bank loans where lenders can propose new terms on set dates. Between July 2025 and January 2026, a \u00a37m Commerzbank loan came with a proposed rate of 6.19%, compared with its existing 3.60%; two \u00a35m Dexia loans proposed 6.21% and 6.26%, against existing rates of 4.26% and 4.29%. According to the Treasury Management Annual Report, this refinancing required \u00a317m in cash but protected the council from substantially higher day-to-day running costs.","url":"https://wolverhampton.moderngov.co.uk/documents/s329075/329075.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E08000031","council":"Wolverhampton","tag":"LOBO","figures":"\u00a317m total LOBO calls: Commerzbank \u00a37m (3.60% to 6.19%), Dexia \u00a35m (4.26% to 6.21%), Dexia \u00a35m (4.29% to 6.26%)","quote":"During 2025-2026 the following LOBOs were 'called' and the Council decided to reject the proposal and the loans were repaid:","paper":"Appendix A Treasury Management Annual Report 2526 Activity Monitoring Quarter One 2627","committee":"Resources and Equality Scrutiny Panel"},{"lane":"ours","source":"Halton UA","title":"Halton council faces \u00a373m five-year deficit despite \u00a330m savings plan","summary":"Halton council faces a cumulative budget deficit of \u00a372.6m over five years from 2027/28 onwards, according to its medium-term financial strategy (the council's financial plan for the next three to five years), even after applying \u00a329.8m of planned savings. Every year in the period will run a shortfall. The council plans to cover the gap using Exceptional Financial Support \u2014 emergency government funding for day-to-day running costs \u2014 which it has already drawn \u00a333.9m of in 2026/27. An independent review by CIPFA found the council's position \"extremely fragile\" and said stabilisation was unlikely without continued emergency support. If government does not approve that funding and the council cannot balance its budget, its Section 151 officer (the council's chief finance officer) will have to issue a Section 114 notice, a formal warning that freezes all new spending.","url":"https://moderngov.halton.gov.uk/documents/s83255/83255.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E06000006","council":"Halton UA","tag":"EFS risk","figures":"\u00a333.873m EFS in 2026/27; \u00a327.504m annual revenue cost by 2031/32 (12.7% of resources); \u00a310m (2024/25), \u00a314.7m (2025/26)","quote":"the revenue costs associated with Exceptional Financial Support will reach an estimated \u00a327.504m in 2031/32, representing approximately 12.7% of the anticipated total resources. It is therefore essential that the Council's costs are reduced significantly, and at pace","paper":"9 - MTFS 2027-2031 Executive Board","committee":"Executive Board"},{"lane":"councils","source":"LGC","title":"CCN call for \u2018material change\u2019 to LGR","url":"https://www.lgcplus.com/politics/devolution-and-economic-growth/ccn-call-for-material-change-to-lgr-17-09-2026/","summary":"The pause and review of local government reorganisation should result in a \u201cmaterial change of direction\u201d, the County Councils Network has said. Last Monday the government announced it was reviewing LGR and withdrew its decisions in four areas \u2013 Norfolk, Suffolk, Essex and Hampshire. CCN\u2026\nThe post CCN call for \u2018material change\u2019 to LGR appeared first on Local Government Chronicle (LGC).","iso":"2026-09-17T08:42:28+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","summary":"Revenue Outturn time series data set covering 2017-18 to 2025-26.","iso":"2026-09-17T08:30:09+00:00"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock council's budget depends entirely on \u00a368.9m government emergency support","summary":"Thurrock council set its 2026/27 net budget of \u00a3267.3m on the assumption of \u00a368.9m of Exceptional Financial Support \u2013 a government permission to treat day-to-day spending as capital spending and pay for it through borrowing or asset sales. This represents almost a quarter of the council's total budget. The commissioners' report flagged this dependency as a sustained red risk, noting the council 'remains dependent upon Exceptional Financial Support and the Capitalisation Direction to achieve a balanced budget'. The underlying drivers include the council's inability to deliver capital projects: it underspent its 2025/26 capital budget by \u00a387.5m (73% of the revised total), and is now forecasting that 43 per cent of planned savings will not be achieved. The council is drawing down \u00a317.9m of earmarked reserves during the year to manage current pressures, principally in adult social care.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"policy","source":"CIPFA","title":"Programme - CIPFA","url":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOM0RxWTVWaTZUYlZtRHdMTkdhbEZycmdmU1B0bkJSVzJXNDNLS1FpSVR5ODRJeHp5SmlxTmpURTA4cTdOMlpLb0dKMVIzUTJPMXFLRkpqWUw1cmZvOXZ2WVZLdGN3azFQZ0RoSGVVT3dfWnRfRkRhcnJzR242WHRoRzVncmxuWEQx?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiiAFBVV95cUxOM0RxWTVWaTZUYlZtRHdMTkdhbEZycmdmU1B0bkJSVzJXNDNLS1FpSVR5ODRJeHp5SmlxTmpURTA4cTdOMlpLb0dKMVIzUTJPMXFLRkpqWUw1cmZvOXZ2WVZLdGN3azFQZ0RoSGVVT3dfWnRfRkRhcnJzR242WHRoRzVncmxuWEQx?oc=5\" target=\"_blank\">Programme</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font>","iso":"2026-09-16T07:00:00+00:00"},{"lane":"ours","source":"Stockport MBC","title":"The council is moving closer to the threshold for Exceptional Financial Support (EFS), a form of government-administered distress funding","summary":"EFS signals distress and typically carries restrictions on discretionary borrowing and service reduction mandates. For a lender, it means the council's capacity to service debt becomes a government concern, not just a council one.","url":"https://democracy.stockport.gov.uk/documents/s267445/267445.pdf","iso":"2026-09-15T09:00:00+00:00","gss":"E08000007","council":"Stockport MBC","tag":"s114","figures":"36 councils required EFS in 2026/27; Stockport's likelihood of Section 114 currently low but trajectory worsening","quote":"early and prudent consideration of its timing, conditions and longer-term consequences is necessary to preserve options and avoid a more acute financial intervention","paper":"Part A: Medium Term Financial Plan (MTFP) Summer Review Update","committee":"Cabinet"},{"lane":"ours","source":"Norwich City","title":"Multi-year audit assurance failures: Property, Plant and Equipment still cannot be fully assured in 2025/26 following 2021/22 disclaimer of opinion","summary":"A lender needs audited, reliable asset values to assess security and covenant positions. Inability to obtain full audit assurance on \u00a31.1 billion in property assets four years after a disclaimer indicates persistent control weaknesses or valuation governance failures that could affect financial reporting reliability.","url":"https://cmis.norwich.gov.uk/Live/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=9gIsSsyMkYHLLpO8rJay7VfhgxHPJo%2fMGEngkhWR7C9j40daLc6RoA%3d%3d&amp;rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&amp;mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&amp;kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&amp;uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&amp;FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&amp;d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&amp;WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&amp;WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d","iso":"2026-09-15T09:00:00+00:00","gss":"E07000148","council":"Norwich City","tag":"audit opinion","figures":"Property, Plant and Equipment: \u00a31,075.25 million net book value; Investment Properties: \u00a396.20 million; Prior disclaimer issued in 2021/22; multiple years without substantial assurance","quote":"The maximum assurance level we will be able to report in 2025/26 will be partial, as due to the valuations cycle in place at the Council, there are a number of assets that have not been subject to revaluation in the period that, following previous disclaimers of opinion, have not been subject to audit procedures.","paper":"Supplementary Agenda Document Pack - Audit committee - 15/09/2026","committee":"15 September 2026"},{"lane":"ours","source":"Derbyshire CC","title":"Derbyshire Council fails to meet accounts deadlines for second year running","summary":"Derbyshire County Council has failed to publish its draft financial accounts by the statutory deadline for the second consecutive year, triggering auditor concern about \"potentially significant weakness\" in its financial reporting arrangements. The 2025-26 accounts were due on 30 June 2026 but were not published until 14 August; the previous year's accounts were similarly delayed to November 2025. The auditor will now investigate whether the recurring delays were accompanied by material errors, poor working papers, inadequate resources or significant audit adjustments. The missed deadlines come as the council faces multiple unfunded budget pressures: its High Needs school funding deficit is forecast to reach \u00a3173.8m by March 2027, with services including children's placements and adult care forecasting combined overspends of over \u00a37m and \"Red\" rated savings judged unlikely to be delivered.","url":"https://derbyshire.moderngov.co.uk/documents/s35897/35897.pdf","iso":"2026-09-15T09:00:00+00:00","gss":"E10000007","council":"Derbyshire CC","tag":"s114 risk","figures":"Budget deficit over \u00a36m (June 2024); Demand increased from 3,666 (2019) to 8,801 (2025); NAO: national SEN deficit \u00a34.6bn; warning of potential Section 114 notices by March 2026","quote":"The council's budget deficit for EHCPs and HTST is over \u00a36m (June 2024). There is a national financial deficit estimated at \u00a34.6bn contributing in part to the risk of two-fifths of local authorities issuing a Section 114 notice by March 2026.","paper":"Derbyshire County Council - Audit Progress Report - September 26","committee":"Audit Committee"},{"lane":"policy","source":"CIPFA","title":"Financial instruments - CIPFA","url":"https://news.google.com/rss/articles/CBMixgFBVV95cUxOa1YxLXVkNGxPOXdTRkNtNHlQTDhzZl9KaWNXOUNaR3VSWnZHMXAzYzhDY0FiYW94WUJwRFpYVzZxNzJLaWYyZTQzd3V4cUNzQ0NWNmJuWVY3eGFtRTJDc21iRWNxNDNNWjI4aDlhRUp0RHBNa0xwSWdCVDlCTld4ZnpBdzVfUG5PbHZCWmY1Ykk2TGRVekdQQl9Jak5WXzNtQkpvU0YyUXJMUXlrVzdZMzhGcnZpYTQtZWNfRjlKQnc1LWtuQVE?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMixgFBVV95cUxOa1YxLXVkNGxPOXdTRkNtNHlQTDhzZl9KaWNXOUNaR3VSWnZHMXAzYzhDY0FiYW94WUJwRFpYVzZxNzJLaWYyZTQzd3V4cUNzQ0NWNmJuWVY3eGFtRTJDc21iRWNxNDNNWjI4aDlhRUp0RHBNa0xwSWdCVDlCTld4ZnpBdzVfUG5PbHZCWmY1Ykk2TGRVekdQQl9Jak5WXzNtQkpvU0YyUXJMUXlrVzdZMzhGcnZpYTQtZWNfRjlKQnc1LWtuQVE?oc=5\" target=\"_blank\">Financial instruments</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">C","iso":"2026-09-14T17:48:11+00:00"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"A lender needs to assess whether the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"CIPFA","title":"FAN - Introduction to Collection Fund Accounting in England - CIPFA","url":"https://news.google.com/rss/articles/CBMiogFBVV95cUxNRnY1OWtzT1RVVFVhWXRKTDRkejVTanFESU9hdFo5eWt6LWd5VFRvRkpUXzdQOU5FYk14Nnl4ZEtRcDEzNkFGa05aMTRpdUNtaHZ6b25CMzJZQjdoQ0l5LUtTRm14V0dhSUotWGlCMUxBVlRLZGVzQjEzYkotQzV3Rnh6c2E3bkptYnF6S0p4STNCLUszekRuTFhKaDJkVnpEOGc?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiogFBVV95cUxNRnY1OWtzT1RVVFVhWXRKTDRkejVTanFESU9hdFo5eWt6LWd5VFRvRkpUXzdQOU5FYk14Nnl4ZEtRcDEzNkFGa05aMTRpdUNtaHZ6b25CMzJZQjdoQ0l5LUtTRm14V0dhSUotWGlCMUxBVlRLZGVzQjEzYkotQzV3Rnh6c2E3bkptYnF6S0p4STNCLUszekRuTFhKaDJkVnpEOGc?oc=5\" target=\"_blank\">FAN - Introduction to Collection Fund Accounting in England</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font","iso":"2026-09-12T05:20:31+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Council received a formal Best Value Notice from MHCLG in July 2026","summary":"A Best Value Notice is a serious marker for lenders; it signals regulatory intervention and formal governance weakness in a council already dependent on exceptional financial support.","url":"https://shropshire.gov.uk/committee-services/documents/s45376/45376.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Best Value Notice issued July 2026","quote":"In July 2026 the Council received a Best Value Notice from MHCLG.","paper":"Q1 Performance Report-01072026 1248","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Shropshire UA","title":"External audit issued statutory recommendations on value-for-money; Council under Non-Statutory Best Value Notice with formal MHCLG reviews beginning September 2026","summary":"Audit concerns, formal Best Value Notice, and active MHCLG oversight indicate external constraint. Governance and financial control weaknesses are matters lenders typically care about.","url":"https://shropshire.gov.uk/committee-services/documents/s45413/45413.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Seven years of Limited Assurance on internal audit; statutory audit recommendations; Best Value Notice in place","quote":"The external auditor felt bound to issue statutory recommendations as part of their annual audit for 2024/25 which cast doubt on the integrity of the Council's value for money arrangements... This coincided with the issue of a Non-Statutory Best Value Notice that requires the Council to be reviewed by MHCLG on a regular basis. These reviews begin in September.","paper":"UPDATED Financial Monitoring Report Quarter 1 2026.27-02072026 1235 v8","committee":"Finance and Improvement Overview and Scrutiny Committee"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-06T17:16:15+00:00"},{"lane":"ours","source":"Swansea","title":"Welsh Government has no protocol for supporting councils that issue section 114 (cannot balance budget) reports","summary":"A lender assessing financial sustainability risk needs to understand that if a Welsh council does get into severe financial difficulty (unable to balance budget), there is no published framework for intervention or support. This affects the lender's understanding of worst-case escalation.","url":"https://swansea.moderngov.co.uk/documents/s129728/129728.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"W06000011","council":"Swansea","tag":"s114","figures":"No section 114 reports made in Wales to date; draft protocol in development but not finalised","quote":"Not being clear on what would happen after a section 114 report is made can have a negative impact on financial decision-making. For example, during our interviews we heard there is a misconception amongst some members and officers that issuing a section 114 report will lead to the Welsh Government providing more funding.","paper":"07 (1 of 1) - Funding_councils_How_the_Welsh_Government_funds_councils","committee":"Governance & Audit Committee"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement process costs","summary":"Seeks views on exceptions to the rule that parties pay their own process costs in leasehold transactions under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-process-costs","iso":"2026-07-15T14:14:00Z","closes":"2026-09-23T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Consultation on Reforming Land Remediation Relief","summary":"The government is consultation on potential reforms to make Land Remediation Relief more accessible, better targeted, and more closely aligned with the practical realities of brownfield development.","url":"https://www.gov.uk/government/consultations/consultation-on-reforming-land-remediation-relief","iso":"2026-07-13T12:08:00Z","closes":"2026-09-21T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Tax Treatment of Predevelopment costs","summary":"The government is consulting on the tax treatment of predevelopment costs. The consultation seeks views and evidence from stakeholders on the types of costs incurred, their treatment under the current rules function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
