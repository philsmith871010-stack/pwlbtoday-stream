<meta charset="utf-8">

<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

ther the council can return to financial sustainability or remains permanently dependent on government bailouts; the capital financing structure is unusual and government-dependent.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"ours","source":"Gloucester","title":"The Council has no general fund balances and required \u00a315.5m Exceptional Financial Support to balance its accounts","summary":"A council with no general fund balances has no financial flexibility whatsoever and complete dependence on government support indicates severe structural distress.","url":"https://gloucester.moderngov.co.uk/documents/s67642/67642.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E07000081","council":"Gloucester","tag":"EFS","figures":"\u00a30 general fund balances; \u00a315.5m total EFS; \u00a34.28m EFS used in 2025/26","quote":"The Council has no general fund balances, the only option to present a balanced set of accounts was to apply for Exceptional Financial Support (EFS) from the Government. The application for EFS was \u00a315.5m in total covering three financial years. The EFS used in 2025/26 was \u00a34.28m.","paper":"Covering Report for draft SOAs 25-26v1","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Gloucester","title":"Council received Exceptional Financial Support and depleted all usable reserves","summary":"Loss of reserves and need for government bailout indicates severe financial distress and inability to service debt independently; critical for any lender assessment.","url":"https://gloucester.moderngov.co.uk/documents/s67681/67681.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E07000081","council":"Gloucester","tag":"EFS","figures":"Materiality set at \u00a30.922m (1% of \u00a392m gross expenditure); EFS received 2025/26","quote":"Weaknesses in financial monitoring and reporting processes has a significant adverse financial impact on the Council, resulting in the depletion of all usable reserves, the emergence of a negative general fund reserve position, and an inability to set a balanced budget. As a consequence, the Council is required to seek Exceptional Financial Support from Government","paper":"Provisional Audit Plan 2025-26","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Cheshire East UA","title":"Cheshire East is using \u00a324.995m of Exceptional Financial Support to balance its 2026/27 budget via capitalisation direction","summary":"A lender needs to understand the council is reliant on exceptional government support to balance its budget, indicating financial stress and ongoing dependency on the EFS regime.","url":"https://moderngov.cheshireeast.gov.uk/documents/s136188/136188.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m","quote":"The budget was balanced, as required by statute, with planned use of EFS, by way of a capitalisation direction, totalling \u00a324.995m.","paper":"Report - 2026-27 Budget - Quarter 1 Forecast Outturn","committee":"Childrens Overview and Scrutiny Committee"},{"lane":"ours","source":"St Helens MBC","title":"Dedicated Schools Grant deficit of \u00a312.509m, with \u00a312.009m in the high needs block for special educational needs","summary":"DSG deficits signal structural pressures in special education services; if government funding plans change, councils can be required to absorb deficits into their general fund.","url":"https://sthelens.moderngov.co.uk/documents/s180264/180264.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E08000013","council":"St Helens MBC","tag":"DSG / SEND","figures":"\u00a312.509m total DSG deficit; \u00a311.077m in-year overspend; \u00a312.009m in high needs block","quote":"The overall position as at 31 March 2026 is a deficit of \u00a312.509m. The most significant area of pressure is in relation to the school's high needs block (\u00a312.009m)","paper":"Revenue and Capital Outturn Report 202526 (cover report)","committee":"Overview and Scrutiny Commission"},{"lane":"ours","source":"St Helens MBC","title":"Dedicated Schools Grant deficit of \u00a312.509m driven by High Needs Block overspend of \u00a312.008m","summary":"DSG deficit will become a general fund liability when the statutory override expires in 2028; growing deficits signal the mismatch between need and national funding is widening","url":"https://sthelens.moderngov.co.uk/documents/s180265/180265.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E08000013","council":"St Helens MBC","tag":"DSG / SEND","figures":"Total DSG deficit \u00a312.509m (in-year overspend \u00a311.077m plus prior year \u00a31.432m); High Needs Block overspend \u00a312.008m","quote":"The most significant area of pressure relates to expenditure within the High Needs Block of the Dedicated Schools Grant (DSG), which reported an overspend of \u00a312.008m.","paper":"Appendix 1 Revenue Capital Outturn Report 2025 2026","committee":"Overview and Scrutiny Commission"},{"lane":"ours","source":"Cheshire East UA","title":"Education DSG deficit stands at \u00a3155.943m cumulative with \u00a346.995m budgeted deficit in 2026/27","summary":"DSG is a protected grant the council cannot borrow against; a deficit of this scale can only be resolved through DfE action (spending more on SEND or forgiving the debt), not through council action. It is a liability the council cannot control.","url":"https://moderngov.cheshireeast.gov.uk/documents/s136189/136189.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"DSG / SEND","figures":"\u00a3155.943m cumulative deficit; \u00a346.995m in-year budgeted deficit 2026/27","quote":"The Dedicated Schools Grant (DSG) position has a cumulative deficit brought forward of \u00a3155.943m with an in-year budgeted deficit of \u00a346.995m, there is no Q1 forecast for the DSG deficit.","paper":"Appendix 1 - Section 2 - Directorate Revenue Commentary and update on 2026-27 Approved Budget Change Items","committee":"Childrens Overview and Scrutiny Committee"},{"lane":"ours","source":"West Sussex CC","title":"Qualified audit opinion expected again for 2025/26, with unqualified opinion not targeted until 2026/27","summary":"A qualified audit opinion undermines market confidence in financial reporting and affects the council's creditworthiness; continued qualification into 2025/26 extends the period of heightened audit risk.","url":"https://westsussex.moderngov.co.uk/documents/s61890/61890.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E10000032","council":"West Sussex CC","tag":"audit opinion","figures":"2024/25 qualified opinion; 2026/27 unqualified opinion target","quote":"A qualified audit opinion was issued for 2024/25 which drew attention to remaining areas which we have yet to obtain sufficient appropriate audit evidence over as a result of the disclaimers of opinion for the years ended 31 March 2023 and 31 March 2024.","paper":"EY Rebuilding audit assurance","committee":"Regulation, Audit and Accounts Committee"},{"lane":"ours","source":"Thurrock UA","title":"Council expects three years minimum to move from disclaimed to unqualified audit opinions","summary":"Sustained period of audit disclaimed opinions impairs the council's financial credibility and reporting quality. Extended timeline for recovery indicates deep underlying audit or governance issues.","url":"https://thurrock.moderngov.co.uk/documents/s54329/54329.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"audit opinion","figures":"3 years expected minimum recovery period; target is unqualified opinion for 2027/28 accounts","quote":"Within LARRIG is an expectation that it may take 3 years for a local authority to move from disclaimed accounts to an unqualified opinion.","paper":"External Audit Report Update","committee":"Audit Committee"},{"lane":"ours","source":"Brent","title":"Two LOBO loans repaid in 2025-26 when lenders exercised options at rates 2+ percentage points higher","summary":"Concrete evidence that rate environment has shifted and Brent faces material cost increases when LOBO options are exercised","url":"https://democracy.brent.gov.uk/documents/s159652/159652.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E09000005","council":"Brent","tag":"LOBO","figures":"\u00a310m at 4.1% and \u00a310m at 5.2% refinanced at 6.41% and 6.24%; average rate increase of 2.2 percentage points","quote":"The Council repaid two LOBO loans in 2025/26 after the lender exercised their option. As a result, the Council's borrowing requirement increased, with the additional financing being met through borrowing from the Public Works Loan Board (PWLB) during the year within our overall borrowing need.","paper":"13. Treasury Management Outturn 2025-26","committee":"Council"},{"lane":"ours","source":"King's Lynn & West Norfolk","title":"Capital Financing Requirement grew 20% to \u00a399.9m but borrowing remained flat, funded from diminishing reserves","summary":"If capital spending continues and rates do not fall as assumed, reserves could deplete faster than planned, constraining financial flexibility and forcing either higher borrowing costs or capital programme cuts.","url":"https://democracy.west-norfolk.gov.uk/documents/s86463/86463.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E07000146","council":"King's Lynn & West Norfolk","tag":"borrowing","figures":"CFR increase \u00a383,431k to \u00a399,948k (20% growth); under-borrowing \u00a359,948k; investments \u00a317,015k to \u00a38,530k (50% decline)","quote":"During 2025/26, the Authority maintained an under-borrowed position. This meant that the capital borrowing need, (the Capital Financing Requirement), was not fully funded with loan debt as cash supporting the Authority's reserves, balances and cash flow was used as an interim measure.","paper":"Audit Committee Treasury Outturn Report 2025 2026 Final","committee":"Audit Committee"},{"lane":"ours","source":"Brent","title":"Internal borrowing reserves collapsed in one year, forcing shift to external debt markets","summary":"Depletion of internal cash reserves reduces financial flexibility and forces the council into external debt markets for all new capital spending, increasing vulnerability to market disruption.","url":"https://democracy.brent.gov.uk/documents/s159666/159666.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E09000005","council":"Brent","tag":"borrowing","figures":"Internal Borrowing 2024/25 \u00a3383.2m down to 2025/26 \u00a3276.5m; CFR increased from \u00a31,353.8m to \u00a31,412.3m","quote":"Internal Borrowing 383.2 276.5 336.5 324.0 301.2","paper":"13d. Appendix 4- Prudential Indicators 2025-26 Outturn","committee":"Council"},{"lane":"ours","source":"Rotherham","title":"Capital Programme expanded by \u00a325.8m (from \u00a3180.7m to \u00a3206.5m) with heavy reliance on unsupported borrowing (\u00a3162.8m of \u00a3284.3m General Fund = 57% over four years)","summary":"A capital programme 57%-funded by borrowing, in a council already running a \u00a35.9m operating deficit, increases financial risk materially. The acknowledgement that re-profiling may be needed suggests deliverability risk. Interest rate movements will directly impact the council's debt service capacity.","url":"https://moderngov.rotherham.gov.uk/documents/s159963/159963.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E08000018","council":"Rotherham","tag":"borrowing","figures":"\u00a3206.5m total capital (up from \u00a3180.7m); \u00a3120.9m General Fund; \u00a3162.8m of \u00a3284.3m (four-year) funded by unsupported borrowing (57%); HRA \u00a385.6m also includes \u00a384.95m borrowing","quote":"The Capital Programme for 2026/27 remains ambitious even with a significant level of re-profiling of schemes into 2027/28. The Council will therefore need to keep close control of project spend profiles and delivery milestones to keep these projects on track. The Council will also need to review the deliverability of this increased Capital Programme and potentially, re-profile some schemes into future financial years.","paper":"Final - July 2026 Financial Monitoring to Cabinet","committee":"Cabinet"},{"lane":"ours","source":"City of London","title":"HRA reserve remains critically low and is now planned on a one-year basis only, creating uncertainty beyond 2026-27.","summary":"A lender needs visibility of HRA sustainability. One-year planning of a critical reserve introduces annual uncertainty. The reliance on discretionary government support (EFS) is contingent and not guaranteed beyond 2026-27.","url":"https://democracy.cityoflondon.gov.uk/documents/s236917/236917.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E09000001","council":"City of London","tag":"EFS risk","figures":"HRA reserve \u00a30.205m at 31 March 2026 (budgeted \u00a30.042m); forecast to reach \u00a31.2m in 2026-27; \u00a32.65m EFS approved in principle for health and safety and repairs costs","quote":"The Authority forecasts its HRA on a one-year basis, and there is uncertainty as to the sustainability of its improved position beyond 2026-27.","paper":"Appendix 6 - City Fund Auditor&#39;s Annual Report 2025-26","committee":"Audit and Risk Management Committee"},{"lane":"councils","source":"LGC","title":"Smarter procurement, stronger councils amid LGR uncertainty","url":"https://www.lgcplus.com/politics/governance-and-st ciary-duty-weaponised-to-not-do-stuff-11-09-2026/","summary":"The most fundamental duty of council pension funds has been \u201cweaponised\u201d as a reason not to do things, a senior pool figure has said. The fiduciary duty requires Local Government Pension Scheme funds to act in the best interests of their members. However, there has\u2026\nThe post LGPS fiduciary duty \u2018weaponised\u2019 to \u2018not do stuff\u2019 appeared first on Local Government Chronicle (LGC).","iso":"2026-09-11T08:15:28+00:00"},{"lane":"policy","source":"HM Treasury","title":"Economic Secretary to the Treasury speech at UK Private Capital","url":"https://www.gov.uk/government/speeches/economic-secretary-to-the-treasury-speech-at-uk-private-capital","summary":"The Economic Secretary to the Treasury delivered her speech at UK Private Capital.","iso":"2026-09-10T15:02:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Government publishes reports on improving building safety","url":"https://www.gov.uk/government/news/government-publishes-reports-on-improving-building-safety","summary":"New reports have been published today on government's progress to improve building safety and deliver the Grenfell Tower Inquiry Phase 2 report recommendations.","iso":"2026-09-10T14:41:46+00:00"},{"lane":"councils","source":"LG finance press","title":"Tourist tax heralds new era for fiscal devolution - Room151","url":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQdjVDTlRYWEFkMlg0djcxQU9GQ05BSGZVLV90bjNjaUpEazdVaHppZWVGQTlaeTJjYXBwZUVSZEYxYnhMRmNDX3NlSkpHeVpxd3p3eHdwaWRfVmxqekJRRVRHZEpzY1VqQ2pDLWlkSE0xNTlCZ3FkbHhSMlFSek9lZ3VCN2dVVVBFcEdrbg?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMijAFBVV95cUxQdjVDTlRYWEFkMlg0djcxQU9GQ05BSGZVLV90bjNjaUpEazdVaHppZWVGQTlaeTJjYXBwZUVSZEYxYnhMRmNDX3NlSkpHeVpxd3p3eHdwaWRfVmxqekJRRVRHZEpzY1VqQ2pDLWlkSE0xNTlCZ3FkbHhSMlFSek9lZ3VCN2dVVVBFcEdrbg?oc=5\" target=\"_blank\">Tourist tax heralds new era for fiscal devolution</a>&nbsp;&nbsp;<font color=\"#6 e","summary":"This letter addresses the effect of the Building Safety Levy on the building control functions by local authorities and registered building control approvers.","iso":"2026-09-10T13:00:00+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Council received a formal Best Value Notice from MHCLG in July 2026","summary":"A Best Value Notice is a serious marker for lenders; it signals regulatory intervention and formal governance weakness in a council already dependent on exceptional financial support.","url":"https://shropshire.gov.uk/committee-services/documents/s45376/45376.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Best Value Notice issued July 2026","quote":"In July 2026 the Council received a Best Value Notice from MHCLG.","paper":"Q1 Performance Report-01072026 1248","committee":"Cabinet"},{"lane":"ours","source":"Oldham","title":"LOBO loan reset at 6.70% forced council to repay from cash reserves in April","summary":"Shows lenders are testing market conditions and willing to force borrowers into rate resets; council's repayment from cash preserves position but reduces liquidity buffer.","url":"https://committees.oldham.gov.uk/documents/s161182/161182.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E08000004","council":"Oldham","tag":"LOBO","figures":"\u00a34.0m LOBO called at proposed rate of 6.70%, versus council weighted average borrowing cost of 4.38%","quote":"One LOBO loan of \u00a34.000m was called in the period. The revised interest rate offered was 6.70% and the Council exercised its option to repay the loan in full, utilising available cash balances.","paper":"Treasury Management Quarter 1 - Audit Committee","committee":"Audit Committee"},{"lane":"ours","source":"Somerset Council","title":"Somerset's budget depends on delivering \u00a3135m savings from a \u00a345m transformation investment, with section 114 risk if it fails","summary":"A council's solvency depending on discretionary transformation savings rather than statutory process changes represents higher execution risk for lenders, particularly if delivery is delayed.","url":"https://somerset.moderngov.co.uk/documents/s69209/69209.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000066","council":"Somerset Council","tag":"s114 risk","figures":"\u00a345m transformation fund, \u00a3135m anticipated savings (3:1 ratio)","quote":"Financial savings reduced or not realised which may contribute towards a section 114.","paper":"Appendix J - Inspiring Innovation Programme Risks","committee":"Scrutiny Committee - Corporate and Strategic"},{"lane":"ours","source":"East Hertfordshire","title":"Council is proactively seeking CIPFA support to manage financial sustainability risks ahead of any Section 114 threshold","summary":"Proactive seeking of CIPFA support signals the council recognises its financial position requires external expert oversight; a Section 114 notice would indicate inability to balance the budget and trigger government intervention","url":"https://democracy.eastherts.gov.uk/documents/s74058/74058.pdf","iso":"2026-09-08T09:00:00+00:00","gss":"E07000242","council":"East Hertfordshire","tag":"s114 risk","figures":"None specified","quote":"CIPFA support is being sought ahead of reaching any Section 114 threshold to ensure robust financial oversight. Government support is being explored, although greater flexibility on capital receipts or borrowing could be counter\u2011productive at this stage.","paper":"Appendix A - Corporate Risk Register 2026-27 Quarter 1","committee":"Executive"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Shropshire UA","title":"External audit issued statutory recommendations on value-for-money; Council under Non-Statutory Best Value Notice with formal MHCLG reviews beginning September 2026","summary":"Audit concerns, formal Best Value Notice, and active MHCLG oversight indicate external constraint. Governance and financial control weaknesses are matters lenders typically care about.","url":"https://shropshire.gov.uk/committee-services/documents/s45413/45413.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Seven years of Limited Assurance on internal audit; statutory audit recommendations; Best Value Notice in place","quote":"The external auditor felt bound to issue statutory recommendations as part of their annual audit for 2024/25 which cast doubt on the integrity of the Council's value for money arrangements... This coincided with the issue of a Non-Statutory Best Value Notice that requires the Council to be reviewed by MHCLG on a regular basis. These reviews begin in September.","paper":"UPDATED Financial Monitoring Report Quarter 1 2026.27-02072026 1235 v8","committee":"Finance and Improvement Overview and Scrutiny Committee"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-06T17:16:15+00:00"},{"lane":"ours","source":"Swansea","title":"Welsh Government has no protocol for supporting councils that issue section 114 (cannot balance budget) reports","summary":"A lender assessing financial sustainability risk needs to understand that if a Welsh council does get into severe financial difficulty (unable to balance budget), there is no published framework for intervention or support. This affects the lender's understanding of worst-case escalation.","url":"https://swansea.moderngov.co.uk/documents/s129728/129728.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"W06000011","council":"Swansea","tag":"s114","figures":"No section 114 reports made in Wales to date; draft protocol in development but not finalised","quote":"Not being clear on what would happen after a section 114 report is made can have a negative impact on financial decision-making. For example, during our interviews we heard there is a misconception amongst some members and officers that issuing a section 114 report will lead to the Welsh Government providing more funding.","paper":"07 (1 of 1) - Funding_councils_How_the_Welsh_Government_funds_councils","committee":"Governance & Audit Committee"},{"lane":"ours","source":"Salford","title":"Council repaid one \u00a325m LOBO loan from cash but declined \u00a3143m of lenders' subsequent refinancing offers","summary":"LOBO loans carry refinancing risk if lenders exercise options to propose new rates; the council's selective approach to early repayment (paying cash on one loan, retaining others) reveals both liquidity position and debt management strategy, signalling whether refinancing at proposed rates remains affordable.","url":"https://salford.moderngov.co.uk/documents/s96840/96840.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"LOBO","figures":"\u00a325m repaid November 2024; \u00a3143m of refinancing offers (\u00a328m + \u00a320m + \u00a326m + \u00a328m + \u00a316m) declined between July 2025 and March 2026","quote":"There was one lender exercising an option and there were early prepayment offers on the following of the Authority's loans","paper":"Treasury Management Annual Report for 2025-26 v4 - Legal","committee":"Overview and Scrutiny Board"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"ours","source":"Stoke-on-Trent UA","title":"Council using capital receipts flexibility and reserves to offset revenue overspends; no Section 114 report yet, but mitigations are finite.","summary":"Capital receipts flexibility and reserve drawdown are tools of last resort. Their deployment signals the council is using contingency strategies to manage a \u00a313.6m social care overspend. If overspends persist into Q2-Q4, these tools will be depleted.","url":"https://moderngov.stoke.gov.uk/documents/s182418/182418.pdf","iso":"2026-08-11T09:00:00+00:00","gss":"E06000021","council":"Stoke-on-Trent UA","tag":"s114","figures":"\u00a32m corporate reserve deployed; \u00a33.293m capital receipts flexibility deployed","quote":"Despite the in-year pressures currently facing the Council, the Section 151 Officer has not considered it necessary to make any such report at the current juncture in light of ongoing mitigations.","paper":"Financial Performance Report 2026/27 - Quarter 1","committee":"Cabinet"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Time-limited relief from the Community Infrastructure Levy in London","summary":"We are seeking views on proposed regulations to implement a time-limited relief from the Community Infrastructure Levy (CIL) to support housebuilding in London.","url":"https://www.gov.uk/government/consultations/time-limited-relief-from-the-community-infrastructure-levy-in-london","iso":"2026-07-17T16:01:48Z","closes":"2026-09-18T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement process costs","summary":"Seeks views on exceptions to the rule that parties pay their own process costs in leasehold transactions under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-process-costs","iso":"2026-07-15T14:14:00Z","closes":"2026-09-23T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Consultation on Reforming Land Remediation Relief","summary":"The government is consultation on potential reforms to make Land Remediation Relief more accessible, better targeted, and more closely aligned with the practical realities of brownfield development.","url":"https://www.gov.uk/government/consultations/consultation-on-reforming-land-remediation-relief","iso":"2026-07-13T12:08:00Z","closes":"2026-09-21T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Tax Treatment of Predevelopment costs","summary":"The gov function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
