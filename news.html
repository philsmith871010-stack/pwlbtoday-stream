<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">

<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

<script>
const DATA = {"generated":"2026-09-17T06:58:25.332219+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":5,"councils":15,"policy":39,"markets":34},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":7,"hm-treasury":4,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"CIPFA and CIPFA/LASAAC":"nothing open"},"items":[{"lane":"ours","source":"Croydon","title":"Financial sustainability identified as the most significant governance weakness despite \u00a327.3m stabilisation plan","summary":"Ongoing reliance on exceptional financial support signals structural unsustainability; lenders require confidence in medium-term financial viability","url":"https://croydon.moderngov.co.uk/documents/s72907/72907.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"EFS","figures":"\u00a327.3m Stabilisation Plan achieved; continued reliance on Exceptional Financial Support","quote":"The Council's financial position remains the most significant governance weakness and the delivery of the outcomes in the Financial Strategy 2027-30 provides the road map to achieving financial sustainability","paper":"Annual Governance Statement 2025/26 And Action Plan","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Croydon","title":"Statutory recommendation from 2024-25 on addressing structural deficit and debt burden remains unresolved, with the council yet to identify its true structural deficit.","summary":"A lender needs to know whether the council has a credible plan to exit EFS dependency. This recommendation shows that after a year, the council has not yet done the foundational work (identifying its structural deficit) needed to negotiate a sustainable long-term solution with government.","url":"https://croydon.moderngov.co.uk/documents/s72865/72865.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"EFS","figures":"EFS modelled at \u00a3119m for 2026-27, \u00a399.7m for 2027-28, \u00a377.7m for 2028-29, \u00a369m for 2029-30; statutory recommendation in progress since 2024-25","quote":"Our statutory recommendation from 2024/25 is retained (SR1, page 34). The Council must use robust data to identify the true value of its structural deficit before it seeks to engage with MHCLG about any long-term approach to the debt burden.","paper":"Appendix 1 - Interim Auditors Annual Report for 2025-26","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Barnet","title":"\u00a373.3m exceptional financial support being used to finance revenue costs","summary":"Using EFS to borrow for revenue indicates the council cannot balance its day-to-day budget and is relying on temporary exceptional measures to cover the shortfall","url":"https://barnet.moderngov.co.uk/documents/s96826/96826.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000003","council":"Barnet","tag":"EFS","figures":"\u00a373.298m out of \u00a3164.901m General Fund borrowing requirement","quote":"Capitalisation Directive/ Exceptional Finance Support (EFS) (Revenue) 73,298","paper":"Appendix A - Treasury Management Performance Update Report \u2013 Q1 2627","committee":"Governance, Audit, Risk Management and Standards Committee (GARMS)"},{"lane":"ours","source":"Liverpool","title":"CFO explicitly flags 'sustainability and liquidity' as 'overriding concerns' despite going concern classification","summary":"When an s151 officer files accounts 'going concern' but privately warns of sustainability and liquidity concerns, there is a gap between technical accounting compliance and real operational risk. Lenders should read this as a warning that cash management will be tight.","url":"https://councillors.liverpool.gov.uk/documents/s328596/328596.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E08000012","council":"Liverpool","tag":"audit opinion","figures":"General Fund Reserve \u00a325.389m as buffer against \u00a3756m revenue spend","quote":"Nevertheless, the issues of sustainability and liquidity are overriding concerns for the council despite the going concern prescription. In this respect the key risks for the council are the ability to manage its budget within available resources and the need to maintain adequate reserve balances to mitigate the risks of unexpected cost pressures and difficulties in delivering approved savings programmes.","paper":"Appendix 1 for Draft Statement of Accounts and Draft Annual Governance Statement for 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Redbridge","title":"Government DSG funding support is conditional and time-limited; deficits will transfer to general fund when statutory override ends in 2028","summary":"Creates a funding certainty cliff in 2028 when accumulated DSG deficits (potentially exceeding \u00a326m) become an unfunded mandate on the general fund. Government support is explicitly limited and conditional on performance, creating budget risk.","url":"https://moderngov.redbridge.gov.uk/documents/s175112/175112.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000026","council":"Redbridge","tag":"DSG / SEND","figures":"\u00a37.034m estimated High Needs Stability Grant (90% of \u00a37.815m eligible to March 2026); \u00a30.782m residual deficit requiring general fund cover; \u00a30.536m additional amount under DfE review; \u00a317.352m additional forecast deficit in 2026/27","quote":"If not mitigated this will need to be met from the General Fund when the statutory override ceases.","paper":"Appendix C Outturn HRA DSG - Q1 (1)","committee":"Cabinet"},{"lane":"ours","source":"Redbridge","title":"High Needs Block DSG overspend of \u00a317.352m will create cumulative deficit of \u00a326.486m by year end","summary":"DSG is statutory funding with a growing structural deficit; this unfunded obligation will compound budget pressure in future years; indicates special educational needs cost escalation beyond council control","url":"https://moderngov.redbridge.gov.uk/documents/s175109/175109.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E09000026","council":"Redbridge","tag":"DSG / SEND","figures":"\u00a317.352m in-year DSG overspend; \u00a39.134m brought-forward deficit; \u00a326.486m cumulative deficit at end 2026/27; \u00a368.665m High Needs Block budget","quote":"The High Needs Block (\u00a368.665m) is forecasting an overspend of \u00a317.352m. This forecast is based upon an increase in the number of Education, Health Care Plans (EHCP's) which are exceeding our local capacity, an increase in placement numbers, alongside increased placement costs due to an increase in complexity of need.","paper":"Budgetary Control Report for Quarter 1 (2) - Report (1)","committee":"Cabinet"},{"lane":"ours","source":"Luton UA","title":"High Needs Block SEND overspend of \u00a32.83m driven by national reforms creating unexpected surge in assessment requests.","summary":"SEND is statutory. This is structural demand pressure resulting from national policy change that councils cannot avoid. If the funding formula does not match the actual caseload growth, this becomes a recurring structural deficit.","url":"https://democracy.luton.gov.uk/CMIS5Public/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=EpQsHMzHf%2bYqBlqXfyMeSQVT%2fNk%2bowW8rogg6Yo4EegY%2fN6EJFx22g%3d%3d&amp;rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&amp;mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&amp;kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&amp;uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&amp;FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&amp;d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&amp;WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&amp;WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d","iso":"2026-09-17T09:00:00+00:00","gss":"E06000032","council":"Luton UA","tag":"DSG / SEND","figures":"\u00a32.83m overspend in HNB at Q1; \u00a30.88m transferred from Schools Block to HNB to partially offset","quote":"The High Needs Block (HNB) allocation for 2026/27 is \u00a354.39m and is forecasting a \u00a32.83m overspend at Quarter 1, after taking account of the \u00a30.88m transfer from the Schools Block approved by Schools Forum in January 2026. The forecast continues to be driven by demand-led pressures and remains subject to significant uncertainty, particularly in light of national SEND reforms, which have led to a substantial increase in requests for Education, Health and Care Needs Assessments and are expected to place further pressure on both the High Needs Block and related General Fund services.","paper":"9. Appendix 1 - Detailed 2026-27 Quarter 1 Budget Monitoring Report","committee":"17 September 2026"},{"lane":"ours","source":"Guildford","title":"External audit issued a disclaimer of opinion on 2025/26 accounts because the 2 prior years were unaudited.","summary":"An audit disclaimer is a material red flag for lenders\u2014inability to verify opening balances undermines confidence in reported financial position and control environment.","url":"https://guildford.moderngov.co.uk/documents/s45597/45597.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E07000209","council":"Guildford","tag":"audit opinion","figures":"2 prior years unaudited; disclaimer issued Q3 2025/26; 4-year improvement plan in place","quote":"An audit of the Statement of Accounts for 2025/26 was undertaken by external audit in Q3 2025/26 and was given a disclaimer of opinion due to the 2 previous years accounts being unaudited.","paper":"Appendix 2 - Guildford Operational risk register Q1 (A&amp;R copy)","committee":"Executive"},{"lane":"ours","source":"Wolverhampton","title":"Three LOBO loans totaling \u00a317m were called in 2025-2026; the council repaid them at par rather than accept new rates of 6.19-6.26%","summary":"LOBO calls materialize the refinancing risk embedded in the council's debt portfolio. The high rates offered (60-173 basis points above existing rates) show market stress on LOBO lending at the time.","url":"https://wolverhampton.moderngov.co.uk/documents/s329075/329075.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E08000031","council":"Wolverhampton","tag":"LOBO","figures":"\u00a317m total LOBO calls: Commerzbank \u00a37m (3.60% to 6.19%), Dexia \u00a35m (4.26% to 6.21%), Dexia \u00a35m (4.29% to 6.26%)","quote":"During 2025-2026 the following LOBOs were 'called' and the Council decided to reject the proposal and the loans were repaid:","paper":"Appendix A Treasury Management Annual Report 2526 Activity Monitoring Quarter One 2627","committee":"Resources and Equality Scrutiny Panel"},{"lane":"ours","source":"Aberdeenshire","title":"Three LOBO loans totalling \u00a330.5m were called with proposed rates 2-3 percentage points higher than existing rates; Council chose to repay at par","summary":"A lender needs to track when councils face material refinancing events and how those are managed; this shows Aberdeenshire had a substantial short-term funding requirement and sufficient liquidity to execute the optimal decision","url":"https://aberdeenshire.moderngov.co.uk/documents/s47547/47547.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"S12000034","council":"Aberdeenshire","tag":"LOBO","figures":"\u00a310.0m at 3.70% (proposed 6.70%); \u00a35.5m at 4.40% (proposed 6.72%); \u00a315.0m at 4.65% (proposed 7.48%); total \u00a330.5m","quote":"The lender option exercises resulted in proposed revised rates that were significantly above the existing loan rates. The Council therefore exercised its option to repay the loans without breakage cost.","paper":"Appendix 4 - Treasury Management Update","committee":"Business Services Committee"},{"lane":"ours","source":"Brighton & Hove UA","title":"If EFS request is not approved, CFO will file S114 report indicating inability to fund current year expenditure from income.","summary":"S114 notification restricts operational autonomy and signals to the market that the council cannot fund its budget from normal revenues.","url":"https://democracy.brighton-hove.gov.uk/documents/s217220/217220.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E06000043","council":"Brighton & Hove UA","tag":"s114 risk","figures":"\u00a320.852m forecast overspend, \u00a316.949m additional risks not in forecast","quote":"The larger risk is that if our request for further EFS is not approved, the Council's Chief Financial Officer would be forced to file a S114 report on the grounds that expected expenditure in the current financial year cannot be met by expected income.","paper":"Targeted Budget Management (TBM) 2026/27 Month 4 (July)","committee":"Cabinet"},{"lane":"ours","source":"Halton UA","title":"Exceptional Financial Support usage of \u00a333.873m in 2026/27 with revenue costs forecast to reach \u00a327.504m annually by 2031/32.","summary":"EFS comes with government conditions and external assurance reviews, and the mounting annual cost crowds out service spending. Dependency on EFS indicates the council cannot operate from own resources and signals regulatory intervention risk.","url":"https://moderngov.halton.gov.uk/documents/s83255/83255.pdf","iso":"2026-09-17T09:00:00+00:00","gss":"E06000006","council":"Halton UA","tag":"EFS risk","figures":"\u00a333.873m EFS in 2026/27; \u00a327.504m annual revenue cost by 2031/32 (12.7% of resources); \u00a310m (2024/25), \u00a314.7m (2025/26)","quote":"the revenue costs associated with Exceptional Financial Support will reach an estimated \u00a327.504m in 2031/32, representing approximately 12.7% of the anticipated total resources. It is therefore essential that the Council's costs are reduced significantly, and at pace","paper":"9 - MTFS 2027-2031 Executive Board","committee":"Executive Board"},{"lane":"markets","source":"Guardian business","title":"Bank of England expected to slow bond-selling programme a w faster, according to an influential think tank. Centre for Cities has published a cost-neutral \u201cblueprint\u201d for how locally-generated tax receipts could replace Treasury funding\u2026\nThe post \u2018Blueprint\u2019 for fiscal devolution appeared first on Local Government Ch","iso":"2026-09-16T09:00:05+00:00"},{"lane":"policy","source":"HM Treasury","title":"Official Statistics: Forecasts for the UK economy: September 2026","url":"https://www.gov.uk/government/statistics/forecasts-for-the-uk-economy-september-2026","summary":"A comparison of independent forecasts for the UK economy in September 2026.","iso":"2026-09-16T09:00:04+00:00"},{"lane":"ours","source":"Thurrock UA","title":"Commissioners flagged ongoing capital delivery challenges and demand stronger governance and oversight.","summary":"Operating under commissioner oversight with flagged delivery failures indicates governance weaknesses affecting major infrastructure deployment and future cost control.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"ours","source":"Oldham","title":"\u00a339m of LOBO loans have call dates within 12 months, creating concentrated refinancing exposure","summary":"Lenders controlling half the LOBO portfolio can force refinancing at rates beyond the council's control, creating uncertainty in forward debt servicing costs as demonstrated by this year's high-rate calls.","url":"https://committees.oldham.gov.uk/documents/s161270/161270.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E08000004","council":"Oldham","tag":"LOBO","figures":"\u00a375.500m total LOBO loans, \u00a339.000m with call dates within 12 months, prior calls at 6.70\u20137.67%","quote":"As at 31st March 2026 Oldham Council has \u00a375.500m, LOBO loans and \u00a339.000m with call dates within the next 12 months. Of this sum, \u00a39.000m is held with Dexia Finance over 2 loans, and the remaining \u00a320m is 3 separate loans with three other providers, Danske Bank, Just Retirement and KBC Bank.","paper":"Annual Review of Treasury Management","committee":"Council"},{"lane":"ours","source":"Ceredigion","title":"Internal borrowing strategy is delivering \u00a30.5m interest savings against the annual budget.","summary":"The revenue budget includes this \u00a30.5m interest saving as a benefit of the internal borrowing strategy, but the benefit depends on the council maintaining adequate investment balances; if cash pressures increase or capital needs require deploying these funds, this structural budget benefit disappears.","url":"https://council.ceredigion.gov.uk/documents/s11570/11570.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"W06000008","council":"Ceredigion","tag":"borrowing","figures":"\u00a352.5m investments, \u00a30.5m favourable variance, \u00a35.7m interest budget","quote":"the Council has a fairly significant cash balance and is maintaining an internal borrowing position which is helping to deliver revenue savings","paper":"Appendix 3 - Quarterly Treasury Management Performance Report 2026-27","committee":"Corporate Resources Overview and Scrutiny Committee"},{"lane":"ours","source":"York UA","title":"Council is maintaining an under-borrowed position, using investment cash rather than taking on long-term debt at elevated rates","summary":"A lender needs to understand that the Council is making a tactical decision to delay borrowing until rates fall, which has a finite runway before forced borrowing becomes necessary. This signals confidence the council can absorb elevated refinancing costs when unavoidable.","url":"https://democracy.york.gov.uk/documents/s195387/195387.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000014","council":"York UA","tag":"borrowing","figures":"Capital Financing Requirement \u00a3532.10m; total borrowing \u00a3342.95m; investment balance \u00a321.62m; net treasury position (debt less investments) \u00a3370.68m.","quote":"During the first quarter of 2026/27, the Council has maintained its under-borrowed position. This meant that the capital borrowing need, (the Capital Financing Requirement), has not been fully funded with loan debt, and cash supporting the Council's reserves, balances and cash flow has continued to be used as an interim measure to fund the capital programme.","paper":"Treasury Management 2026-27 Qtr 1","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Salford","title":"Available investment balances declined by 32% in one year while internal borrowing increased, tightening financial flexibility.","summary":"Declining investment balances constrain the council's financial flexibility and raise questions about medium-term sustainability of capital spending and reserve adequacy.","url":"https://salford.moderngov.co.uk/documents/s97038/97038.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"borrowing","figures":"Available for investment: \u00a3106.2m (2025) \u2192 \u00a372.7m (2026); Internal (over) borrowing: \u00a3224.7m \u2192 \u00a3256.6m","quote":"available for investment 106.2 72.7","paper":"11 Treasury Management Annual Report 2025-26","committee":"Council"},{"lane":"councils","source":"LGC","title":"Districts question county\u2019s security patrols","url":"https://www.lgcplus.com/services/service-delivery/districts-question-countys-security-patrols-16-09-2026/","summary":"Leaders of district councils in Essex have called for a more collaborative and e 0a3500 million crackdown on money laundering, as part of the government's Anti-Money Laundering and Asset Recovery Strategy.","iso":"2026-09-15T10:53:00+00:00"},{"lane":"councils","source":"LGC","title":"LGPS funds \u2018should collaborate on pool oversight\u2019","url":"https://www.lgcplus.com/lgps/lgps-funds-should-collaborate-on-pool-oversight-15-09-2026/","summary":"Council pensions funds have been urged to work together on how they oversee the pool that invests their assets. Each of the 86 Local Government Pension Scheme funds in England and Wales is a member of one of six pools, which manages all their assets.\u2026\nThe post LGPS funds \u2018should collaborate on pool oversight\u2019 appeared first on Local Government Chronicle (LGC).","iso":"2026-09-15T09:54:39+00:00"},{"lane":"councils","source":"LGC","title":"Unitary replaces leader after four months","url":"https://www.lgcplus.com/politics/governance-and-structure/unitary-replaces-leader-after-four-months-15-09-2026/","summary":"Luton Council members have ousted their Labour leader after four months and elected a Lib Dem replacement. The move follows six Labour councillors quitting to sit as independents in July. At an extraordinary council meeting last night, Luton councillors passed a resolution to remove the\u2026\nThe post Unitary replaces leader after four months appeared first on Local Government Chronicle (LGC).","iso":"2026-09-15T09:50:19+00:00"},{"lane":"councils","source":"LGC","title":"Chiefs call for \u2018swift\u2019 LGR resolution","url":"https://www.lgcplus.com/politics/governance-and-structure/chiefs-call-for-swift-lgr-resolution-15-09-2026/","summary":"Chief executives are calling for a \"swift resolution\" to the local government reorganisation review to \"minimise sunk costs\", safeguard partnerships and provide clarity for the sector. Robin Tuddenham, president of\u00a0 Society of Local Authority Chief Executives & Senior Managers (Solace) has written to communities secretary\u2026\nThe post Chiefs call for \u2018swift\u2019 LGR resolution appeared first on Local Gov","iso":"2026-09-15T09:45:03+00:00"},{"lane":"councils","source":"LGC","title":"New communities committee chair elected","url":"https://www.lgcplus.com/politics/governance-and-structure/new-communities-committee-chair-elected-15-09-2026/","summary":"The Labour MP Abena Oppong-Asare was last night voted chair of the the Commons housing, communities & local government select committee. She takes up the position with immediate effect until the end of the current parliamentary term. Ms Oppong-Asare has been MP for Erith and\u2026\nThe post New communities committee chair elected appeared first on Local Government Chronicle (LGC).","iso":"2026-09-15T09:28:13+00:00"},{"lane":"markets","source":"Bank of England","title":"Statistical Notice 2026/08 - Changes to the criteria for monthly form BT reporting","url":"https://www.bankofengland.co.uk/statistics/notice/2026/statistical-notice-2026-08","summary":"Statistical Notices update the definitions and guidance contained in the Banking Statistics Yellow Folder","iso":"2026-09-15T09:21:31+00:00"},{"lane":"ours","source":"Stockport MBC","title":"The council is moving closer to the threshold for Exceptional Financial Support (EFS), a form of government-administered distress funding","summary":"EFS signals distress and typically carries restrictions on discretionary borrowing and service reduction mandates. For a lender, it means the council's capacity to service debt becomes a government concern, not just a council one.","url":"https://democracy.stockport.gov.uk/documents/s267445/267445.pdf","iso":"2026-09-15T09:00:00+00:00","gss":"E08000007","council":"Stockport MBC","tag":"s114","figures":"36 councils required EFS in 2026/27; Stockport's likelihood of Section 114 currently low but trajectory worsening","quote":"early and prudent consideration of its timing, conditions and longer-term consequences is necessary to preserve options and avoid a more acute financial intervention","paper":"Part A: Medium Term Financial Plan (MTFP) Summer Review Update","committee":"Cabinet"},{"lane":"ours","source":"Norwich City","title":"Multi-year audit assurance failures: Property, Plant and Equipment still cannot be fully assured in 2025/26 following 2021/22 disclaimer of opinion","summary":"A lender needs audited, reliable asset values to assess security and covenant positions. Inability to obtain full audit assurance on \u00a31.1 billion in property assets four years after a disclaimer indicates persistent control weaknesses or valuation governance failures that could affect financial reporting reliability.","url":"https://cmis.norwich.gov.uk/Live/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=9gIsSsyMkYHLLpO8rJay7VfhgxHPJo%2fMGEngkhWR7C9j40daLc6RoA%3d%3d&amp;rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&amp;mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&amp;kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&amp;uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&amp;FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&amp;d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&amp;WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&amp;WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d","iso":"2026-09-15T09:00:00+00:00","gss":"E07000148","council":"Norwich City","tag":"audit opinion","figures":"Property, Plant and Equipment: \u00a31,075.25 million net book value; Investment Properties: \u00a396.20 million; Prior disclaimer issued in 2021/22; multiple years without substantial assurance","quote":"The maximum assurance level we will be able to report in 2025/26 will be partial, as due to the valuations cycle in place at the Council, there are a number of assets that have not been subject to revaluation in the period that, following previous disclaimers of opinion, have not been subject to audit procedures.","paper":"Supplementary Agenda Document Pack - Audit committee - 15/09/2026","committee":"15 September 2026"},{"lane":"ours","source":"Derbyshire CC","title":"\u00a36+ million structural deficit in special educational needs (EHCPs), demand up 140% since 2019 with no funding solution","summary":"A mandatory, growing service with a known multi-million pound unfunded deficit is a structural liability with no identified resolution path. The NAO warning places Derbyshire at risk of needing a Section 114 notice.","url":"https://derbyshire.moderngov.co.uk/documents/s35910/35910.pdf","iso":"2026-09-15T09:00:00+00:00","gss":"E10000007","council":"Derbyshire CC","tag":"s114 risk","figures":"Budget deficit over \u00a36m (June 2024); Demand increased from 3,666 (2019) to 8,801 (2025); NAO: national SEN deficit \u00a34.6bn; warning of potential Section 114 notices by March 2026","quote":"The council's budget deficit for EHCPs and HTST is over \u00a36m (June 2024). There is a national financial deficit estimated at \u00a34.6bn contributing in part to the risk of two-fifths of local authorities issuing a Section 114 notice by March 2026.","paper":"Strategic Risk Register - 2026-27 Quarter 1","committee":"Audit Committee"},{"lane":"markets","source":"Bank of England","title":"Minutes of the Securities Lending Committee meeting \u2013 March 2026","url":"https://www.bankofengland.co.uk/minutes/2026/march/minutes-of-the-securities-lending-committee-meeting-march-2026","summary":"The Securities Lending Committee is a forum for market participants and authorities to discuss the UK securities lending market.","iso":"2026-09-15T08:09:58+00:00"},{"lane":"councils","source":"LGC","title":"Uncertainty, AI and trust","url":"https://www.lgcplus.com/politics/lgc-briefing/uncertainty-ai-and-trust-14-09-2026/","summary":"Local government reorganisation, AI and ethics were all on the agenda when democratic services staff gathered last week, reports head of content Kirsty Weakley. Todays news and views: NEW: Former Falkland Islands chief joins unitary Is there a future for LGR? Ann Graham: What is\u2026\ ion against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"CIPFA","title":"Introduction to Fire Finance (England) - CIPFA","url":"https://news.google.com/rss/articles/CBMiigFBVV95cUxNRnlhdU81eHp4eVQ1Y25WWlUyYVhZWEF4d2loTWl4RzJaU3NVemxFSWpOT2k2ajc0ZVZzNk1MMjBGUm0wUm1IZ3NJODBDWDktN093cUJ0NVVXaDllR3RsU3E1RFRTV1J2cnA5cUFGU1R5S2FweHVPcnZUQ0ZsR0pnZmR4VHJnT3cwZEE?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiigFBVV95cUxNRnlhdU81eHp4eVQ1Y25WWlUyYVhZWEF4d2loTWl4RzJaU3NVemxFSWpOT2k2ajc0ZVZzNk1MMjBGUm0wUm1IZ3NJODBDWDktN093cUJ0NVVXaDllR3RsU3E1RFRTV1J2cnA5cUFGU1R5S2FweHVPcnZUQ0ZsR0pnZmR4VHJnT3cwZEE?oc=5\" target=\"_blank\">Introduction to Fire Finance (England)</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font>","iso":"2026-09-14T03:48:32+00:00"},{"lane":"policy","source":"CIPFA","title":"FAN - Introduction to Collection Fund Accounting in England - CIPFA","url":"https://news.google.com/rss/articles/CBMiogFBVV95cUxNRnY1OWtzT1RVVFVhWXRKTDRkejVTanFESU9hdFo5eWt6LWd5VFRvRkpUXzdQOU5FYk14Nnl4ZEtRcDEzNkFGa05aMTRpdUNtaHZ6b25CMzJZQjdoQ0l5LUtTRm14V0dhSUotWGlCMUxBVlRLZGVzQjEzYkotQzV3Rnh6c2E3bkptYnF6S0p4STNCLUszekRuTFhKaDJkVnpEOGc?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiogFBVV95cUxNRnY1OWtzT1RVVFVhWXRKTDRkejVTanFESU9hdFo5eWt6LWd5VFRvRkpUXzdQOU5FYk14Nnl4ZEtRcDEzNkFGa05aMTRpdUNtaHZ6b25CMzJZQjdoQ0l5LUtTRm14V0dhSUotWGlCMUxBVlRLZGVzQjEzYkotQzV3Rnh6c2E3bkptYnF6S0p4STNCLUszekRuTFhKaDJkVnpEOGc?oc=5\" target=\"_blank\">FAN - Introduction to Collection Fund Accounting in England</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font","iso":"2026-09-12T05:20:31+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Council received a formal Best Value Notice from MHCLG in July 2026","summary":"A Best Value Notice is a serious marker for lenders; it signals regulatory intervention and formal governance weakness in a council already dependent on exceptional financial support.","url":"https://shropshire.gov.uk/committee-services/documents/s45376/45376.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Best Value Notice issued July 2026","quote":"In July 2026 the Council received a Best Value Notice from MHCLG.","paper":"Q1 Performance Report-01072026 1248","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Shropshire UA","title":"External audit issued statutory recommendations on value-for-money; Council under Non-Statutory Best Value Notice with formal MHCLG reviews beginning September 2026","summary":"Audit concerns, formal Best Value Notice, and active MHCLG oversight indicate external constraint. Governance and financial control weaknesses are matters lenders typically care about.","url":"https://shropshire.gov.uk/committee-services/documents/s45413/45413.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Seven years of Limited Assurance on internal audit; statutory audit recommendations; Best Value Notice in place","quote":"The external auditor felt bound to issue statutory recommendations as part of their annual audit for 2024/25 which cast doubt on the integrity of the Council's value for money arrangements... This coincided with the issue of a Non-Statutory Best Value Notice that requires the Council to be reviewed by MHCLG on a regular basis. These reviews begin in September.","paper":"UPDATED Financial Monitoring Report Quarter 1 2026.27-02072026 1235 v8","committee":"Finance and Improvement Overview and Scrutiny Committee"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-06T17:16:15+00:00"},{"lane":"policy","source":"CIPFA","title":"Sponsorship - CIPFA","url":"https://news.google.com/rss/articles/CBMiWEFVX3lxTFBfcHJWRjhia3VKWDY5SDBVREstY2VVbFBsYzVINVlNR3hlUlJEQjlvLWF6UkFqN1hwSzc2SFhpbFVXb1RLaFktVU53a0NaM19IQ2drM3V6Umk?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiWEFVX3lxTFBfcHJWRjhia3VKWDY5SDBVREstY2VVbFBsYzVINVlNR3hlUlJEQjlvLWF6UkFqN1hwSzc2SFhpbFVXb1RLaFktVU53a0NaM19IQ2drM3V6Umk?oc=5\" target=\"_blank\">Sponsorship</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font>","iso":"2026-09-05T10:18:02+00:00"},{"lane":"policy","source":"CIPFA","title":"Counter fraud training - CIPFA","url":"https://news.google.com/rss/articles/CBMiV0FVX3lxTE9PaDFJMjljSG04SEo1dXB4eDVDTW84YzJ6b1NyUHVfay1PYTVBTVhFZFdSVGZvSFE4WVFjS3BTTmY1THpvV296YklnZU5kSVpYTlhZdnJROA?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiV0FVX3lxTE9PaDFJMjljSG04SEo1dXB4eDVDTW84YzJ6b1NyUHVfay1PYTVBTVhFZFdSVGZvSFE4WVFjS3BTTmY1THpvV296YklnZU5kSVpYTlhZdnJROA?oc=5\" target=\"_blank\">Counter fraud training</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font>","iso":"2026-09-05T10:17:32+00:00"},{"lane":"ours","source":"Swansea","title":"Welsh Government has no protocol for supporting councils that issue section 114 (cannot balance budget) reports","summary":"A lender assessing financial sustainability risk needs to understand that if a Welsh council does get into severe financial difficulty (unable to balance budget), there is no published framework for intervention or support. This affects the lender's understanding of worst-case escalation.","url":"https://swansea.moderngov.co.uk/documents/s129728/129728.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"W06000011","council":"Swansea","tag":"s114","figures":"No section 114 reports made in Wales to date; draft protocol in development but not finalised","quote":"Not being clear on what would happen after a section 114 report is made can have a negative impact on financial decision-making. For example, during our interviews we heard there is a misconception amongst some members and officers that issuing a section 114 report will lead to the Welsh Government providing more funding.","paper":"07 (1 of 1) - Funding_councils_How_the_Welsh_Government_funds_councils","committee":"Governance & Audit Committee"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Time-limited relief from the Community Infrastructure Levy in London","summary":"We are seeking views on propo function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
</body></html>
