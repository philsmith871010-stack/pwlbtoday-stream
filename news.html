<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>
</head><body>

 and Investments appointment extended","url":"https://www.gov.uk/government/news/interim-chair-of-national-savings-and-investments-appointment-extended","summary":"Luke Jensen's appointment as Interim Chair has been extended.","iso":"2026-08-27T15:00:00+00:00"},{"lane":"policy","source":"HM Treasury","title":"Policy paper: Scottish Income Tax outturn reconciliation for 2024-25","url":"https://www.gov.uk/government/publications/scottish-income-tax-outturn-reconciliation-for-2024-25","summary":"This explanatory note sets out how the 2024-25 Income Tax data published by HMRC and population data published by the ONS is used to update the Scottish Government\u2019s funding.","iso":"2026-08-27T15:00:00+00:00"},{"lane":"policy","source":"HM Treasury","title":"Policy paper: Welsh Rates of Income Tax outturn reconciliation for 2024-25","url":"https://www.gov.uk/government/publications/welsh-rates-of-income-tax-outturn-reconciliation-for-2024-25","summary":"This explanatory note sets out how the 2024-25 Income Tax data published by HMRC is used to update the Welsh Government\u2019s funding.","iso":"2026-08-27T15:00:00+00:00"},{"lane":"policy","source":"HM Treasury","title":"Corporate report: Whole of Government Accounts 2025 to 2026: guidance for preparers","url":"https://www.gov.uk/government/publications/whole-of-government-accounts-2025-to-2026-guidance-for-preparers","summary":"Guidance for central government and local government preparers for Whole of Government Accounts.","iso":"2026-08-27T14:00:27+00:00"},{"lane":"markets","source":"Bank of England","title":"Delay to the November 2026 RTGS standards release","url":"https://www.bankofengland.co.uk/news/2026/august/delay-to-the-november-2026-rtgs-standards-release","summary":"Bank of England statement","iso":"2026-08-27T13:16:29+00:00"},{"lane":"councils","source":"LGC","title":"County issues LGR legal letter","url":"https://www.lgcplus.com/politics/governance-and-structure/county-issues-lgr-legal-letter-27-08-2026/","summary":"Lincolnshire CC has issued a pre-action protocol letter calling on the government to explain how it made its decision on local government reorganisation. In Greater Lincolnshire, four different proposals were put forward for LGR. Lincolnshire CC had backed a proposal for the existing unitary authorities\u2026\nThe post County issues LGR legal letter appeared first on Local Government Chronicle (LGC).","iso":"2026-08-27T09:45:33+00:00"},{"lane":"councils","source":"LGC","title":"LGPS pool receives FCA approval","url":"https://www.lgcplus.com/lgps/lgps-pool-receives-fca-approval-27-08-2026/","summary":"The organisation that pools the assets of council pension funds in Wales has received approval from the Financial Conduct Authority. Under the government's reforms to the Local Government Pension Scheme, all pools need to be investment management companies authorised and regulated by the Financial Conduct\u2026\nThe post LGPS pool receives FCA approval appeared first on Local Government Chronicle (LGC).","iso":"2026-08-27T09:37:57+00:00"},{"lane":"policy","source":"HM Treasury","title":"Ministers to boost innovation in payments with new objective for Bank of England","url":"https://www.gov.uk/government/news/ministers-to-boost-innovation-in-payments-with-new-objective-for-bank-of-england","summary":"The Government intends to give the Bank of England a new responsibility to support innovation in payment systems and emerging forms of digital money, whilst continuing to prioritise financial stability.","iso":"2026-08-27T09:04:34+00:00"},{"lane":"ours","source":"Wigan MBC","title":"Cumulative DSG High Needs deficit of \u00a325.934m, with \u00a32.594m gap remaining even after conditional government grant, and similar deficits forecast beyond 2028","summary":"This is a structural statutory education funding crisis that the council cannot solve alone and will face a cliff edge in 2028 when government support ends, potentially forcing very difficult choices.","url":"https://wigan.moderngov.co.uk/documents/s103630/103630.pdf","iso":"2026-08-27T09:00:00+00:00","gss":"E08000010","council":"Wigan MBC","tag":"DSG / SEND","figures":"\u00a325.934m cumulative deficit (2025/26), \u00a323.340m conditional grant, \u00a32.594m remaining deficit, similar in-year deficits projected for 2026/27","quote":"Each local area was required to submit a Local SEND Reform Plan to the DfE by the 19/06/2026. On condition that the plan is approved by the Secretary of State for Education the Government will award the Council a High Needs Stability Grant to cover 90% of the Authority's overall DSG deficit as at the 31 March 2026. The potential High Needs Stability grant awarded to Wigan Council would be \u00a323.340m, this will still leave a deficit amount of \u00a32.594m","paper":"Revenue &amp; Treasury Management Monitoring - Quarter 1","committee":"Cabinet"},{"lane":"ours","source":"Thanet","title":"Council repaid \u00a34.5m LOBO loan after lender exercised option to increase interest rate","summary":"LOBO loans embed the risk that lenders can force borrowers to accept higher rates. The council's decision to repay rather than accept the increase shows the new rate created material cost pressure, illustrating the council's vulnerability to rate risk.","url":"https://thanet.moderngov.co.uk/documents/s97246/97246.pdf","iso":"2026-08-27T09:00:00+00:00","gss":"E07000114","council":"Thanet","tag":"LOBO","figures":"LOBO loan \u00a34.5m at 4.19%, repaid 9 Dec 2025; new rate not disclosed; repayment funded from investments.","quote":"The Council had a Lender Option Borrower Option (LOBO) loan for \u00a34.5m at 4.19% and the lender exercised its option to increase the interest rate from 9 December 2025. Accordingly, the Council exercised its option to repay this loan on the same date.","paper":"Cabinet Treasury YE 25-26 - Google Docs","committee":"Cabinet"},{"lane":"ours","source":"Thanet","title":"Reserves depleted 66% since 2023-24; council remaining solvent only through non-recurring \u00a31m collection fund windfall","summary":"Critical reserve depletion signals liquidity stress. Masking structural spending deficits with one-off windfalls instead of fixing root causes indicates deteriorating financial resilience heading into LGR and final operational year.","url":"https://thanet.moderngov.co.uk/documents/s97223/97223.pdf","iso":"2026-08-27T09:00:00+00:00","gss":"E07000114","council":"Thanet","tag":"reserves","figures":"66% reduction in usable reserves since 2023-24 (\u00a310.4m); current reserves \u00a35.183m; \u00a31.145m forecast overspend; requires \u00a31.0m non-recurring collection fund surplus to avoid further depletion","quote":"Although total corporate balances are projected to hold at roughly \u00a35.2m through 31 March 2027, this stability is only temporary. It relies on an estimated \u00a31.000m one-off surplus from the Collection Fund (the account that holds council tax and business rates income) to absorb the current forecast overspend. Because this non-recurring windfall will not be repeated in 2027/28, it cannot be relied upon to support budget balancing during the council's final operational year.","paper":"2026-27 Budget Monitoring No.1 - Google Docs","committee":"Cabinet"},{"lane":"ours","source":"Ribble Valley","title":"Planning appeals driving unbudgeted consultancy and legal costs","summary":"Unbudgeted appeals and litigation costs are consuming resources and drawing on reserves, which signals ongoing pressure on the planning service that could persist if appeal activity remains at this rate","url":"https://ribblevalley.moderngov.co.uk/documents/s12181/12181.pdf","iso":"2026-08-27T09:00:00+00:00","gss":"E07000124","council":"Ribble Valley","tag":"overspend","figures":"\u00a338,068 overspend; \u00a321k to be funded from additional planning income; remainder from earmarked reserves","quote":"Consultancy advice and legal costs relating to planning applications have exceeded the budget for the period. This is largely due to expenditure on appeals.","paper":"4-26pd","committee":"Planning and Development"},{"lane":"ours","source":"Aberdeenshire","title":"Q1 forecast overspend of \u00a30.763m driven by school premises cost pressures","summary":"An active overspend forecast in Q1 signals budget control issues and ongoing cost pressures that may persist through the year.","url":"https://aberdeenshire.moderngov.co.uk/documents/s46592/46592.pdf","iso":"2026-08-27T09:00:00+00:00","gss":"S12000034","council":"Aberdeenshire","tag":"overspend","figures":"\u00a30.763m overspend; \u00a30.603m rates and refuse; \u00a30.450m unallocated savings","quote":"At this stage in the financial year, the functions within the remit of Education & Children's Services Committee are forecasting to be \u00a30.763m over budget.","paper":"Q1 Financial Performance 2026-27","committee":"Education and Children's Services Committee"},{"lane":"councils","source":"LGC","title":"Catherine Needham & Dave McKenna: Parish councils\u2019 LGR role","url":"https://www.lgcplus.com/politics/governance-and-structure/catherine-needham-dave-mckenna-parish-councils-lgr-role-27-08-2026/","summary":"New unitary authorities should see, value and promote parish and town councillors and clerks as vital elements of local services and democracy, write the professor of public policy and public management at the University of Birmingham, and a research associate at the Institute of Local\u2026\nThe post Catherine Needham & Dave McKenna: Parish councils\u2019 LGR role appeared first on Local Government Chronicl","iso":"2026-08-27T08:28:51+00:00"},{"lane":"councils","source":"LG finance press","title":"LGPS seeks clarification on Israel Palestine stance from new UK government - Room151","url":"https://news.google.com/rss/articles/CBMi3AFBVV95cUxPUjAxOVM4SDVGWi1wNGxyUjdlTmlnYVRQQmhCM050ZjU5cXVnOUVfVlIxZ2JsQklKVU9JYmU0cjNCdjhzaDRxQndVc2lLem8tYVp5RDFYZWRabmZqY2xMclJaN29QZ0Y4cmhUN25UdWpRaWx1OWJiZm9zMWhqNHZRenI0ZmZzWWRXUWFTNDBzNVQzT2 ounts 2025/26 (for the year ended 31 March 2026)","url":"https://www.gov.uk/government/publications/financial-conduct-authority-fca-annual-report-and-accounts-202526-for-the-year-ended-31-march-2026","summary":"The annual report for the Financial Conduct Authority for the year ended 31 March 2026.","iso":"2026-08-26T09:53:11+00:00"},{"lane":"councils","source":"LGC","title":"LGC Investment Awards 2026 shortlist revealed","url":"https://www.lgcplus.com/lgps/lgc-investment-awards-2026-shortlist-revealed-26-08-2026/","summary":"The shortlist for the LGC Investment Awards 2026 has been announced. The awards recognise excellence and showcase best practice in the Local Government Pension Scheme community. They saw a record number of organisations entering the 18 categories, which are split into nine LGPS categories and\u2026\nThe post LGC Investment Awards 2026 shortlist revealed appeared first on Local Government Chronicle (LGC)","iso":"2026-08-26T09:52:53+00:00"},{"lane":"councils","source":"LGC","title":"Andrew Husband: Prioritise rural homelessness","url":"https://www.lgcplus.com/services/housing/andrew-husband-prioritise-rural-homelessness-26-08-2026/","summary":"Homelessness is a deepening emergency in county and rural areas, writes the housing and planning spokesperson for the County Councils Network. The homelessness crisis in England requires no introduction: councils across the country spent \u00a32.8bn on this service in 2024-25 alone. Whilst the challenge is\u2026\nThe post Andrew Husband: Prioritise rural homelessness appeared first on Local Government Chroni","iso":"2026-08-26T08:07:35+00:00"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Medway Towns UA","title":"Council now expects to require Exceptional Financial Support in the current year, with debt reaching \u00a3800-900m by local government reorganisation","summary":"EFS is a clear signal the council cannot meet its statutory duties from its own resources. Combined with local government reorganisation, this indicates financial stress and elevated refinancing risk for the successor authority.","url":"https://democracy.medway.gov.uk/documents/s91075/91075.pdf","iso":"2026-08-25T09:00:00+00:00","gss":"E06000035","council":"Medway Towns UA","tag":"EFS","figures":"Projected debt \u00a3800m-\u00a3900m; Dartford and Gravesham combined debt \u00a3200m; EFS now required; only \u00a3900k government funding for LGR against significant need","quote":"By vesting day, it was likely that the Council's debt would reach between \u00a3800m-\u00a3900m","paper":"Treasury Management Report 2026/27: Quarter 1","committee":"Cabinet"},{"lane":"ours","source":"Salford","title":"DSG High Needs Block overspend of \u00a324.494m driven by rising SEND demand and complexity.","summary":"High Needs spending is statutory and driven by demand the council cannot refuse; a 21% overspend in the block signals either a shortfall in the stability grant, underestimation of demand, or failure of cost-containment measures; the council's ability to resolve this through SEND reform is unproven.","url":"https://salford.moderngov.co.uk/documents/s96568/96568.pdf","iso":"2026-08-25T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"DSG / SEND","figures":"\u00a3140.362m expenditure vs \u00a3115.868m budget = \u00a324.494m overspend; High Needs Block is subset of larger \u00a3239.077m DSG","quote":"Forecast expenditure totals \u00a3140.362m against a budget of \u00a3115.868m, resulting in an expected in year overspend of \u00a324.494m. Financial pressures continue to be concentrated within the High Needs Block, reflecting increasing demand and complexity of need across SEND services.","paper":"Revenue Budget Monitoring Report - Quarter 1 - Cabinet","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"CIPFA and the codes","title":"Mark Green: How to make local accountability work - Local Government Chronicle","url":"https://news.google.com/rss/articles/CBMilwFBVV95cUxNbkp1WTdLNUtoQXFhbEo5aDd3TnlGRTBmc2FjcHRZeW5QTDlRWGgtZ2FXNjY4b3E2MzE2QkUyOEtoSkRwT3l5OTF0d0lBQ0lDYkpGU29NR0ExMi1IQ0hhanQ5R1J5dlhTZ1pkUFZNMmxtVmdqam9YMHhHOTFPenpIVjJUYmVwd1BNa09paVpNWFQyM1hVam1B?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMilwFBVV95cUxNbkp1WTdLNUtoQXFhbEo5aDd3TnlGRTBmc2FjcHRZeW5QTDlRWGgtZ2FXNjY4b3E2MzE2QkUyOEtoSkRwT3l5OTF0d0lBQ0lDYkpGU29NR0ExMi1IQ0hhanQ5R1J5dlhTZ1pkUFZNMmxtVmdqam9YMHhHOTFPenpIVjJUYmVwd1BNa09paVpNWFQyM1hVam1B?oc=5\" target=\"_blank\">Mark Green: How to make local accountability work</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Local Government Chronicle</font>","iso":"2026-08-19T09:16:05+00:00"},{"lane":"ours","source":"Lincoln City","title":"Council has \u00a342m under-borrowing against its Capital Financing Requirement, with additional borrowing deferred to end of financial year.","summary":"A lender needs to understand borrowing trajectory. Deferred \u00a342m borrowing suggests either strong cash position or intentional rate timing; the deferral to year-end creates lumpy refinancing risk if rates move.","url":"https://lincoln.moderngov.co.uk/documents/s80928/80928.pdf","iso":"2026-08-18T09:00:00+00:00","gss":"E07000138","council":"Lincoln City","tag":"borrowing","figures":"CFR \u00a3160.432m, actual debt \u00a3118.395m, under-borrowing \u00a342.037m; capital expenditure revised to \u00a354.508m from original \u00a333.662m","quote":"Currently forecasting actual external debt at year end to be inline with the original budget, albeit additional borrowing pushed to the end of the financial year.","paper":"Treasury Management Q1 26.27 Exec","committee":"Executive"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"ours","source":"Blackburn with Darwen UA","title":"\u00a331.6m unsupported borrowing financing 2026/27 capital programme","summary":"Unsupported borrowing reduces the council's financial headroom and increases its debt service burden. Lenders assess whether the council's revenue budget can sustainably support this level of additional borrowing alongside existing debt obligations.","url":"https://blackburn.moderngov.co.uk/documents/s34755/34755.pdf","iso":"2026-08-13T09:00:00+00:00","gss":"E06000008","council":"Blackburn with Darwen UA","tag":"borrowing","figures":"Approved unsupported borrowing \u00a348,968k, Q1 revised \u00a356,854k, slipped (\u00a325,338k), leaving \u00a331,632k for 2026/27","quote":"Unsupported Borrowings 48,968 56,854 116 (25,338) 31,632","paper":"Appendix 1 for Capital Monitoring Quarter 1 2026/27","committee":"Executive Board"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"ours","source":"Somerset Council","title":"2026-27 funding gap \u00a325m; MTFP gap \u00a388.368m before EFS","summary":"A multi-year funding gap of this scale, dependent on continued EFS and one-offs, is unsustainable. The gap grows each year, signalling structural imbalance between spend and revenue that transformation is not yet closing at the required pace.","url":"https://democracy.somerset.gov.uk/documents/s68883/Appendix 2 Ministry of Housing Communities and Local Government MHCLG Somerset External Assuran.pdf","iso":"2026-08-12T09:00:00+00:00","gss":"E06000066","council":"Somerset Council","tag":"EFS","figures":"2026-27 funding gap \u00a325m; MTFP gap \u00a388.368m before EFS","quote":"The 2026-27 budget includes a funding gap before Exceptional Financial Support (EFS) of \u00a325.000 million, increasing to \u00a388.368 million across the medium term, reflecting sustained demand and cost pressures across key statutory services, particularly children's social care, adult social care and Special Education Needs and Disabilities (SEND). The budget for 2026-27 has been balanced only through the use of one-off resources, including Exceptional Financial Support (EFS) and an unplanned Collection Fund surplus. This approach does not provide a sustainable solution and increases financial risk in future years.","paper":"Appendix 2: Ministry of Housing, Communities and Local Government (MHCLG) Somerset External Assurance Review 2026 , item 28.","committee":"Scrutiny Committee - Corporate and Strategic"},{"lane":"ours","source":"Doncaster","title":"DSG High Needs Block cumulative deficit of \u00a380m and growing, with out-of-authority placements surging and government relief contingent on reform plan","summary":"This is a structural liability with a cliff edge. A \u00a312-23m liability hitting the general fund in 2028 would require either massive reserves, cuts elsewhere, or borrowing. For lenders, it reveals latent liabilities and dependency on government relief that may not materialise. The reform plan condition adds execution risk.","url":"https://doncaster.moderngov.co.uk/documents/s53074/53074.pdf","iso":"2026-08-12T09:00:00+00:00","gss":"E08000017","council":"Doncaster","tag":"DSG / SEND","figures":"\u00a380m cumulative DSG deficit 2026/27; \u00a3122.7m projected 2027/28; out-of-authority placements 217\u2192230\u2192323 (projected); revised cumulative balance after 90% DfE funding \u00a38m 2026/27, \u00a312.3m council liability over 3 years; 75% funding scenario: \u00a323m council liability; override ends 31 March 2028","quote":"cumulative overspend on DSG of \u00a380.0m at 31 March 2027...The total placement numbers were 217 at 1st April 2026 and are currently 230, then projected to rise further to 323 by 31st March 2027...Should DfE funding reduce to, say, 75% in 2026/27 and 2027/28, the Council would need to find \u00a323.0m in total","paper":"i7 Cabinet 120826 2026-27 Month 2 Financial Monitoring Report","committee":"Cabinet"},{"lane":"ours","source":"Stoke-on-Trent UA","title":"Council using capital receipts flexibility and reserves to offset revenue overspends; no Section 114 report yet, but mitigations are finite.","summary":"Capital receipts flexibility and reserve drawdown are tools of last resort. Their deployment signals the council is using contingency strategies to manage a \u00a313.6m social care overspend. If overspends persist into Q2-Q4, these tools will be depleted.","url":"https://moderngov.stoke.gov.uk/documents/s182418/182418.pdf","iso":"2026-08-11T09:00:00+00:00","gss":"E06000021","council":"Stoke-on-Trent UA","tag":"s114","figures":"\u00a32m corporate reserve deployed; \u00a33.293m capital receipts flexibility deployed","quote":"Despite the in-year pressures currently facing the Council, the Section 151 Officer has not considered it necessary to make any such report at the current juncture in light of ongoing mitigations.","paper":"Financial Performance Report 2026/27 - Quarter 1","committee":"Cabinet"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"ours","source":"Nottingham City UA","title":"Council issued a Section 114 notice in November 2023 for inability to set a balanced budget; recovery is now early-stage despite achievement of 2026/27 balanced budget without Exceptional Financial Support.","summary":"Section 114 is a critical threshold event for local authority lending. While recovery progress is welcome, it is very early-stage and dependent on continued financial discipline.","url":"https://committee.nottinghamcity.gov.uk/documents/s183981/183981.pdf","iso":"2026-07-31T09:00:00+00:00","gss":"E06000018","council":"Nottingham City UA","tag":"s114","figures":"Section 114 issued November 2023; Commissioners oversight concluded March 2026; EFS \u00a341.024m approved 2024/25, only \u00a37.737m required year-end; 2026/27 balanced budget achieved without EFS","quote":"In November 2023, a Section 114 (Part 3) report was issued to Councillors due to concerns regarding the financial sustainability of the Council","paper":"Enc. 1 for Draft Annual Governance Statement 2025 - 2026","committee":"Audit Committee"},{"lane":"ours","source":"Cheshire East UA","title":"Without continuing exceptional financial support, council faces formal Section 114 insolvency notice","summary":"Section 114 notice is the legal declaration of local authority financial insolvency; it signals the council cannot meet its statutory budget requirements and requires extraordinary intervention","url":"https://moderngov.cheshireeast.gov.uk/ecminutes/documents/s134923/Medium Term Financial Strategy Assumptions and Reporting Cycle for 202728 to 203132Cabinet and Com.pdf","iso":"2026-07-30T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"s114","figures":"\u00a324.995m exceptional financial support in 2026/27; no planning for EFS after 2026/27","quote":"Without Exceptional Financial Support (EFS), this will result in a Section 114 notice based on the Council's current low levels of available reserves and balances alongside the Dedicated Schools Grant (DSG) deficit","paper":"Medium Term Financial Strategy Assumptions and Reporting Cycle for 2027/28 to 2031/32","committee":"Corporate/Governance Overview and Scrutiny Committee"},{"lane":"ours","source":"Cheshire East UA","title":"Revised Best Value Notice issued July 2026 signals government remains unsatisfied with progress","summary":"A reissued Best Value Notice in summer 2026 (after 14 months of improvement plan work) signals government doubt that the council has achieved sustainable improvement","url":"https://moderngov.cheshireeast.gov.uk/ecminutes/documents/s134995/Progress Update on the Improvement Transformation Delivery PlanCabinet and Committee Report Templa.pdf","iso":"2026-07-30T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"intervention","figures":"Notice reissued 15 July 2026","quote":"The non-statutory Best Value Notice has been formally reviewed and a new notice issued on 15th July 2026","paper":"Progress Update on the Improvement & Transformation Delivery Plan","committee":"Corporate/Governance Overview and Scrutiny Committee"},{"lane":"ours","source":"Bournemouth, Christchurch and Poole UA","title":"Four consecutive years without a clean audit opinion, with no improvement expected for 2025/26","summary":"A lender or finance director needs verified financial statements to assess creditworthiness. Four years of qualified audit opinions\u2014with no resolution in sight\u2014means the council's true financial position cannot be independently verified.","url":"https://bcpcouncil.moderngov.co.uk/documents/s67996/67996.pdf","iso":"2026-07-30T09:00:00+00:00","gss":"E06000058","council":"Bournemouth, Christchurch and Poole UA","tag":"audit opinion","figures":"Disclaimers issued for 2022/23, 2023/24, 2024/25; no unqualified opinion expected for 2025/26","quote":"As a result of the disclaimer of opinion issued for the previous three financial years, and a lack of assurance over opening balances for the previous audit year we do not expect to be able to undertake sufficient work to support an unmodified audit opinion on the 2025/26 financial statements in advance of the backstop date.","paper":"Appendix A \u2013 BCP Council - Regaining assurance progress report and sector update","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Bournemouth, Christchurch and Poole UA","title":"Return to unmodified opinion targeted for 2027/28 but conditional on completing unspecified 'build-back programme'","summary":"The recovery timeline is material to credit assessment; the explicit conditions indicate the plan could slip if the unspecified build-back programme does not complete successfully.","url":"https://bcpcouncil.moderngov.co.uk/documents/s67995/67995.pdf","iso":"2026-07-30T09:00:00+00:00","gss":"E06000058","council":"Bournemouth, Christchurch and Poole UA","tag":"audit opinion","figures":"Disclaimer expected 2025/26; qualified opinion targeted 2026/27; unmodified opinion targeted 2027/28","quote":"the auditor's current assessment is that BCP Council is on a trajectory towards a qualified opinion in 2026/27 and a return to an unmodified audit opinion in 2027/28, subject to successful completion of the build-back programme and continued support from the Council.","paper":"External Auditor \u2013 Regaining Assurance Progress Report &amp; Sector Update","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Newport","title":"Auditor has issued a qualified opinion due to material uncertainty over Newport Transport Limited's ability to continue as a going concern.","summary":"A qualified audit opinion is a serious red flag for lenders assessing creditworthiness. Going concern uncertainty at a material subsidiary creates doubt about the group's financial viability.","url":"https://newport.moderngov.co.uk/documents/s36390/36390.pdf","iso":"2026-07-30T09:00:00+00:00","gss":"W06000022","council":"Newport","tag":"audit opinion","figures":"10 months, material component of the Group","quote":"However 10 months later, NTL is still working on improving its cashflow position and as noted in the group accounts, implementing a financial improvement plan which includes raising capital, to satisfy its auditors that the company is a going concern. As this uncertainty remains, there is a material uncertainty over entries in NCC's Group accounts given the scale of the NTL balances.","paper":"Audit of Accounts report 2024/25","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Nottingham City UA","title":"Council emerged from government intervention in February 2026","summary":"Recent government intervention signals prior financial distress; emergence from intervention is material to lending assessment but the scope/cause is not explained in this document.","url":"https://committee.nottinghamcity.gov.uk/documents/s184027/184027.pdf","iso":"2026-07-29T09:00:00+00:00","gss":"E06000018","council":"Nottingham City UA","tag":"intervention","figures":"Commissioners withdrawn February 2026; intervention began February 2024","quote":"Nottingham City Council (NCC) Improvement Plan, developed in response to the Commissioner-led intervention initiated in February 2024 under Section 15(5) of the Local Government Act 1999, concluded with the withdrawal of Commissioners in February 2026.","paper":"Financial Sustainability and Management","committee":"Corporate Scrutiny Committee"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"ours","source":"Woking BC","title":"Revenue expenditure continues to be funded through Capitalisation Direction due to structural deficit","summary":"This is a direct indicator of ongoing structural revenue deficit; the council remains dependent on special borrowing permissions to fund day-to-day expenditure, not just capital investment. This is the core condition that triggered the section 114 notice.","url":"https://woking.moderngov.co.uk/documents/s46562/46562.pdf","iso":"2026-07-23T09:00:00+00:00","gss":"E07000217","council":"Woking BC","tag":"capitalisation","figures":"Capitalisation Direction used to fund revenue expenditure pending financial restructuring; \u00a3482.13m total borrowing in 2025/26","quote":"the primary reason for new borrowing in 2025/26, excluding the refinancing of loans maturing during the year, was to support the Capitalisation Directive (CD) required to fund revenue expenditure while the Council works towards a more sustainable financial position. A significant element of the CD relates to the loss of income following the suspension of interest previously received from wholly owned companies.","paper":"EXE26-035 Treasury Management Annual Report 2025-26","committee":"Council"},{"lane":"ours","source":"Bradford","title":"The council emerged from a financial crisis in 2023 (Best Value Notice) but rapid change has created gaps in governance policy compliance.","summary":"The council's rapid operational and systems change post-crisis, while showing improvement, has left material policy compliance gaps. This is a known risk factor for ongoing control failure or relapse.","url":"https://bradford.moderngov.co.uk/documents/s56793/56793.pdf","iso":"2026-07-23T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"intervention","figures":"Best Value Notice issued 2023, withdrawn after 1 year (2024)","quote":"A key context for the thematic issues outlined below has been the Council's approach to addressing the significant financial crisis it faced in 2023 which resulted in a 'Best Value Notice'... [resulting in] a large number of internal audit reports identified material gaps in, and/or non-compliance with, policies and procedures.","paper":"DOC L - City of Bradford Metropolitan District Council - 2025-26 Annual Audit Report FINAL","committee":"Governance and Audit Committee"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Time-limited relief from the Community Infrastructure Levy in London","summary":"We are seeking views on proposed regulations to implement a time-limited relief from the Community Infrastructure Levy (CIL) to support housebuilding in London.","url":"https://www.gov.uk/government/consultations/time-limited-relief-from-the-community-infrastructure-levy-in-london","iso":"2026-07-17T16:01:48Z","closes":"2026-09-18T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-07-15T14:15:00Z","closes":"2026-09-23T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement process costs","summary":"Seeks views on exceptions to the rule that parties pay their own process costs in leasehold transactions under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-process-costs","iso":"2026-07-15T14:14:00Z","closes":"2026-09-23T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Updating the Bank of England\u2019s fee regime for recognised payment systems","summary":"The government is consulting on the fee regime for recognised payment systems, specified service providers and digital settlement asset service providers. ","url":"https://www.gov.uk/government/consultations/updating-the-bank-of-englands-fee-regime-for-recognised-payment-systems","iso":"2026-07-15T13:00:00Z","closes":"2026-08-31T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Safeguarding Stability, Enabling Growth: Consultation on Ring-fencing Reform","summary":"This consultation invites views on changes to the ring-fencing regime announced as part of the government's ring-fencing review, which are intended to be delivered via secondary legislation.","url":"https://www.gov.uk/government/consultations/safeguarding-stability-enabling-growth-consultation-on-ring-fencing-reform","iso":"2026-07-14T15:10:00Z","closes":"2026-09-08T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Consultation on Reforming Land Remediation Relief","summary":"The government is consultation on potential reforms to make Land Remediation Relief more accessible, better targeted, and more closely aligned with the practical realities of brownfield development.","url":"https://www.gov.uk/government/consultations/consultation-on-reforming-land-remediation-relief","iso":"2026-07-13T12:08:00Z","closes":"2026-09-21T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Tax Treatment of Predevelopment costs","summary":"The government is consulting on the tax treatment of predevelopment costs. The consultation seeks views and evidence from stakeholders on the types of costs incurred, their treatment under the current rules, and the impact on investment decisions.","url":"https://www.gov.uk/government/consultations/tax-treatment-of-predevelopment-costs--2","iso":"2026-07-13T12:08:00Z","closes":"2026-09-21T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"Consultation","title":"Improving proportionality and building safety outcomes in building control: emergency repairs under the higher-risk building regime","summary":"This consultation seeks views on proposals to change the emergency repairs route under the Higher-Risk Buildings (HRB) regime.","url":"https://www.gov.uk/government/consultations/improving-proportionality-and-building-safety-outcomes-in-building-control-emergency-repairs-under-the-higher-risk-building-regime","iso":"2026-07-09T09:55:00Z","closes":"2026-09-03T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"CIPFA and the codes","title":"CIPFA prudential code changes aim for greater council transparency - lo function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
