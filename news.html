<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

const DATA = {"generated":"2026-09-29T08:11:56.388582+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":4,"councils":9,"policy":27,"markets":32},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":5,"hm-treasury":2,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"CIPFA and CIPFA/LASAAC":"2 open"},"items":[{"lane":"ours","source":"Windsor & Maidenhead UA","title":"Windsor and Maidenhead capital spending forecast at less than half of annual budget","summary":"Windsor and Maidenhead council is forecasting only \u00a334.3m in capital spending \u2014 money spent on buildings, vehicles and equipment \u2014 against a \u00a367.2m annual budget for 2026-27, a shortfall of \u00a331.2m. The shortfall has worsened in recent months, declining by \u00a39.1m between month 2 and month 4 forecasts. Waste collection vehicles (\u00a37.2m), Heatherwood Royal (\u00a33.4m) and street lighting enhancement (\u00a31.7m) are all forecast at or near zero. The council's largest shortfall is the ICB Health Hub: council papers provide no explanation for the \u00a314.7m underspend, with the project forecast at \u00a39.7m against a \u00a324.4m budget. Other delays include \u00a32.3m of school funding for children with special educational needs unallocated while awaiting government reforms, and a bus improvement plan \u00a30.4m lower because contracted works exceeded what is deliverable. Capital reserves have grown to \u00a3111.5m.","url":"https://rbwm.moderngov.co.uk/documents/s73201/73201.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000040","council":"Windsor & Maidenhead UA","tag":"EFS","figures":"\u00a348,754k budgeted EFS; \u00a30 received to date; represents 26% of total funding budget of \u00a3187,055k","quote":"Exceptional Financial Support (48,754) 0 (48,754) 0 (48,754) 0 0","paper":"Appendix E - Reserves","committee":"Cabinet"},{"lane":"ours","source":"East Sussex CC","title":"East Sussex overspent school transport budget by \u00a33.8m in 2024-25, driven by rising SEND transport demand","summary":"East Sussex spent \u00a33.8m more than its \u00a323m budget on home to school transport in 2024-25, with the overspend driven almost entirely by rising demand for trips for pupils with special educational needs and disabilities. The increase reflects a national trend: SEND transport costs have risen 70 per cent in real terms since 2015-16. The council is trying to manage this demand through a Personal Travel Budget scheme, offering families up to 65p per mile to arrange their own transport instead of council-provided taxis, which has generated \u00a3221,000 in savings in its first year. It has also introduced Independent Travel Training, which teaches young people to use public transport independently at a cost of \u00a32,750 per pupil but avoids \u00a37,700-\u00a318,100 per child annually in transport costs. However, uptake remains limited: only 10 of 184 families offered the enhanced rate have accepted, and just 22 pupils completed training last year. The council found that families were often unaware of the schemes' flexibility or the programmes themselves, and that parental concerns about safety and practical barriers such as limited rural transport were holding uptake back.","url":"https://democracy.eastsussex.gov.uk/documents/s79408/79408.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E10000011","council":"East Sussex CC","tag":"EFS","figures":"\u00a355.6m deficit for 2026/27; \u00a370m capitalisation requested; cumulative deficit of \u00a3117.7m by 2028/29","quote":"Our revenue budget for 2026/27 includes a \u00a355.6m deficit, which has led us to request Exceptional Financial Support from Government... we have notified MHCLG that without further Government funding to address the challenges we face, we are likely to require EFS for 2027/28 to deliver our statutory duties.","paper":"Appendix 1","committee":"Cabinet"},{"lane":"ours","source":"Bristol UA","title":"Bristol forecast \u00a39.8m overspend in 2026/27 despite balanced budget, as social care pressures resurface","summary":"Bristol City Council forecast a \u00a39.8m overspend in the first quarter of 2026/27 despite setting a balanced general fund budget of \u00a3634.1m for the year, the auditors' report to the Audit Committee shows. The overspend is driven by unbudgeted costs in social care, with \u00a35.0m forecast in Children & Education and \u00a32.3m in Adults & Communities. This follows the pattern of 2025/26, when the council reported underlying overruns of \u00a314.5m in Children & Education and \u00a33.6m in Adults & Communities. The 2026/27 budget relies on delivering \u00a321.1m in social care savings \u2014 more than half of the council's \u00a340.9m total savings requirement \u2014 but Adults & Communities has flagged a \u00a32.7m delivery risk against those savings. The council delivered 93 per cent of its 2025/26 savings target, but Children & Education had \u00a33.9m slippage.","url":"https://bristol.moderngov.co.uk/documents/s131453/131453.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000023","council":"Bristol UA","tag":"DSG / SEND","figures":"\u00a329.5m in-year deficit; \u00a385.4m cumulative deficit at 31 March 2026","quote":"The DSG position remains a significant financial challenge, with an in-year deficit of \u00a329.5m million and a cumulative deficit of \u00a385.4m million at 31 March 2026, subject to national funding arrangements and local recovery plans.","paper":"11 - Interim Bristol City Council 2025-26 Auditors Annual Report","committee":"Audit Committee"},{"lane":"ours","source":"Bristol UA","title":"Bristol schools grant deficit reaches \u00a387.8m after \u00a346.7m overspend in 2025-26; first-quarter 2026-27 forecast projects \u00a344.8m in-year overspend","summary":"Bristol City Council is carrying forward a cumulative shortfall of \u00a387.8m on its dedicated schools grant, the government funding that pays for school provision, after spending \u00a346.7m more than allocated in the 2025-26 financial year. A first-quarter forecast for 2026-27 projects an in-year overspend of \u00a344.8m, driven by rising numbers of pupils with complex additional needs and inflationary pressures on specialist provision. The council's recovery plan depends partly on a High Needs Stability Grant from the Department for Education, pending approval of its Local SEND Reform Plan by the end of October. The strain is visible across the sector: 24 of 53 maintained schools are now in cumulative deficit, up from 21 a year ago, while 11 of 12 maintained nursery schools are in deficit totalling \u00a35.5m. The forum also heard the council is considering ending a maternity supply cover scheme for schools unless maintained schools accept increases in their de-delegation rates of 34 per cent for primary and 23 per cent for secondary.","url":"https://bristol.moderngov.co.uk/documents/s131422/131422.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000023","council":"Bristol UA","tag":"DSG / SEND","figures":"\u00a344.8m unmitigated forecast overspend; approval decision expected end of October 2026","quote":"The forecast does not currently assume receipt of the High Needs Stability Grant, pending Government confirmation of the outcome of our reform plan, which is expected by the end of October.","paper":"Item 5 - DSG and NFF 2027-28 - Update","committee":"Bristol Schools Forum"},{"lane":"ours","source":"Herefordshire UA","title":"Herefordshire's schools funding deficit nearly doubles to \u00a336.3m as reserves drain","summary":"Herefordshire Council's cumulative deficit on the dedicated schools grant (DSG), the government funding for schools, nearly doubled in a year to \u00a336.3m in March 2026, up from \u00a320.0m the previous year. The deficit now equals 45 per cent of all the council's usable reserves and exceeds its general fund balance by more than three times. Although a reform plan submitted to the Department for Education may secure a grant covering 90 per cent of the accrued deficit, the council forecasts further in-year shortfalls of \u00a326.0m in 2026/27 and \u00a324.7m in 2027/28. When the statutory override \u2014 a temporary government rule that allows councils to keep schools deficits off the main balance sheet \u2014 ends on 31 March 2028, a residual \u00a33.6m will fall due from the council's own resources. The external auditor identified this as a continuing weakness.","url":"https://councillors.herefordshire.gov.uk/documents/s50135991/50135991.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E06000019","council":"Herefordshire UA","tag":"DSG / SEND","figures":"Cumulative DSG deficit \u00a336.3m; \u00a316.3m High Needs Block overspend in 2025/26; High Needs Stability Grant covers approx. \u00a332.7m (90%); council liability \u00a33.6m (10%); statutory override expires March 2028","quote":"At 31 March 2026, the council's Dedicated Schools Grant (DSG) cumulative deficit is \u00a336.3 million following a \u00a316.3 million overspend within the High Needs Block... with the remaining balance of \u00a33.6 million (10%) to be a liability of the council once the statutory override period ends in March 2028.","paper":"Appendix A Internal Audit Q2 Progress Report 2026-27","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Dumfries and Galloway","title":"Dumfries and Galloway council secures \u00a350m Levelling Up grants but faces social care audit concerns","summary":"The council has received over \u00a350 million from the UK Government's Levelling Up Fund. Its capital projects \u2014 spending on buildings and other long-lived assets \u2014 are delivering on schedule: the Stranraer Watersports Hub is due to open in September, the Dalbeattie Rocks and Wheels facility is nearing completion, and the George building has attracted eight expressions of interest with a tender exercise in progress. The internal audit's overall opinion is Reasonable, meaning there is a generally sound system of governance, risk management and control in place. However, auditors have flagged two areas requiring ongoing monitoring: social care budgets and IT procurement, indicating these carry elevated risk requiring continuous attention.","url":"https://dumfriesgalloway.moderngov.co.uk/documents/s79230/79230.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"S12000006","council":"Dumfries and Galloway","tag":"audit opinion","figures":"2 areas flagged for ongoing monitoring","quote":"The Internal Audit Manager has regular discussions in particular on two areas of concern \u2013 social care budgets and IT procurement.","paper":"Internal Audit Annual Assurance Report 2025-26","committee":"Audit, Risk and Scrutiny Committee"},{"lane":"ours","source":"Stroud","title":"Stroud to borrow for housing as cash pressured by land acquisitions and higher interest rates","summary":"Stroud District Council faces cash pressure from its housing and land acquisition programme and will need to borrow additional funds to finance increased spending, the Audit and Standards Committee heard. Interest rates remain higher than the council anticipated when setting its budget, adding to the cost of new borrowing. The council's capital financing requirement \u2014 the total it has spent on long-lived assets not yet paid for \u2014 stands at \u00a3171.4m as of 30 June, overshooting the full-year budget by \u00a38.1m. The committee simultaneously noted that a \u00a35.9m loss on its property and multi-asset investment portfolio, now liquidated, will be funded from earmarked reserves. Audit recommendations from 2022-23, 2023-24, 2024-25 and 2025-26 remain open without the committee being told why implementation has stalled.","url":"https://stroud.moderngov.co.uk/documents/s20993/20993.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000082","council":"Stroud","tag":"borrowing","figures":"External borrowing \u00a3100.717m at 30 June 2026, internal borrowing planned \u00a336,690, next repayment \u00a36m March 2032","quote":"The council's current actual external borrowing is \u00a3100.717m as of 30 June 2026 shown in Table 7 above. The council intends to use internal borrowing of \u00a336,690. The next borrowing to be repaid is \u00a36m in March 2032.","paper":"Internal Audit Progress Report 2026/27","committee":"Audit and Standards Committee"},{"lane":"ours","source":"Gwynedd","title":"Gwynedd audit finds material errors for third year in row despite corrective measures","summary":"Audit Wales has identified material errors in Gwynedd Council's related party disclosures for the third consecutive year, with cumulative corrections totalling \u00a316.659 million. The council introduced a dedicated working paper in 2025-26 to address errors found in prior years, but it was not completed or reviewed effectively, and the auditor concludes that existing quality review arrangements are not operating effectively in this area. The audit also found approximately \u00a33.9 million in uncorrected errors in property, plant and equipment valuations, and a further \u00a318 million in material errors that management corrected before accounts sign-off. The findings indicate that initial accounting treatments for significant transactions did not capture the substance of the arrangements. A new CIPFA asset indexation process for 2025-26 generated multiple errors in its first year of implementation.","url":"https://democracy.gwynedd.llyw.cymru/documents/s51335/51335.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"W06000002","council":"Gwynedd","tag":"borrowing","figures":"Total borrowing \u00a373.9m (unchanged from 31 March); net investments \u00a311.4m","quote":"No new borrowing was undertaken in the first quarter of 2026/27. This strategy enabled the Council to reduce net borrowing costs (despite foregoing investment income) and reduce overall treasury risk.","paper":"ISA260 Cyngor Gwynedd 2025-26","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Folkestone & Hythe","title":"Folkestone and Hythe faces \u00a3504k revenue deficit despite \u00a33.3m reserve drawdown","summary":"Folkestone and Hythe Council is projecting a \u00a3504k revenue deficit for 2026/27 despite budgeting for break-even, the Finance and Performance Scrutiny Sub-Committee heard. The council plans to draw down \u00a33.3m from its reserves, money set aside for planned purposes, to cover service overspends and capital projects\u2014\u00a3935k more than originally planned. Revenue spending across services is forecast \u00a31.4m above budget, driven by a \u00a3456k overspend on housing subsidy costs for temporary accommodation, interim staffing pressures, and waste contract indexation. The council's reserves are projected to fall from \u00a322.7m to \u00a319.4m by year end, a 13.5% reduction. The General Fund capital programme has grown to \u00a339.1m, up \u00a33.7m from February's budget, funded by an additional \u00a33.4m borrowing. Two major capital projects\u2014FOLCA 2 and Folkestone: A Brighter Future\u2014spent significantly more than their annual budgets in the first quarter alone.","url":"https://folkestone-hythe.moderngov.co.uk/documents/s56726/56726.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000112","council":"Folkestone & Hythe","tag":"borrowing","figures":"Total borrowing cost \u00a35,092k (on budget, no variance). Internal borrowing \u00a354.8m available. 5-year PWLB rates 5.07%, 20-year 6.50%.","quote":"The total cost of borrowing is projected to be \u00a35,092k, mainly due to additional borrowing for the HRA to support the purchase of temporary accommodation, and long-term rates remaining high","paper":"Appendix 3 - Strategic Projects Capital Outturn 26_27 Dashboard","committee":"Finance and Performance Scrutiny Sub-Committee"},{"lane":"policy","source":"CIPFA","title of Wight Council manage budget pressures","summary":"Isle of Wight Council's treasury management generated a forecast saving of \u00a3925,000 in the year to March, contributing to management of wider in-year budget pressures. The saving came from lower borrowing costs and increased investment income, the council reported. A further \u00a3655,000 saving is forecast for the current financial year from the same sources. However, the council holds \u00a338.2 million of commercial property investments and must review options for exiting these holdings before taking on further borrowing. Internal audit gave the highest assurance rating to the treasury management controls.","url":"https://iow.moderngov.co.uk/documents/s24049/24049.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000046","council":"Isle of Wight UA","tag":"s114","figures":"One loan outstanding; zero loans to S114 authorities","quote":"Close attention is taken to the financial situation of other local authorities, and no loans have been made to any authority that has issued a S114 notice.","paper":"7e. Treasury Management Report Quarter 4 2025-26","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Worcestershire CC","title":"Worcestershire's council receives \u00a333.6m exceptional support as auditors retain financial sustainability concerns","summary":"Worcestershire County Council received \u00a333.6 million in exceptional financial support from central government for 2025/26, but the council's external auditors have warned that this support represents a permanent increase to the authority's debt rather than a one-off rescue. The government funding, granted via a capitalisation direction (a form of government permission to treat day-to-day spending as capital borrowing), will require the council to set aside an extra \u00a31.2 million each year over the next 20 years to repay it. Grant Thornton's audit found significant weaknesses remain in the council's arrangements for financial sustainability and efficiency. The auditors retained four recommendations from the previous year and have kept in place a statutory recommendation\u2014the highest category\u2014on the dedicated schools grant deficit, which has persisted into 2025/26 without resolution. The council's external auditors also identified control weaknesses in its financial systems, including journal authorisation procedures that allow the same person to prepare and approve entries, and IT control deficiencies dating back to 2020/21 that remain outstanding.","url":"https://worcestershire.moderngov.co.uk/documents/s61974/61974.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"EFS","figures":"60% of councils, median EFS request \u00a348.5m for social care-driven councils","quote":"Councils citing social care demand as their main driver typically requested higher levels of support, with a median EFS request of \u00a348.5m.","paper":"au 2026 09 28 2025-26 Interim External Auditors Annual Report","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Stockton-on-Tees UA","title":"Stockton-on-Tees increased borrowing by \u00a326.89m in 2025-26 despite capital spending 46% below budget","summary":"Stockton-on-Tees raised net borrowing from \u00a3111.43m to \u00a3138.32m during 2025-26, taking on \u00a340m of new government loans at rates between 4.31% and 4.57%, even as capital spending fell substantially short of plan. The council spent \u00a351.2m of a \u00a394.53m capital budget, leaving \u00a343.35m unspent. The mismatch reflects a deliberate strategy of internal borrowing\u2014using reserves instead of external loans to minimize interest costs\u2014but one that depletes cash cushions and commits the council to heavy future borrowing to meet its underlying need to borrow, or capital financing requirement, of \u00a3202.27m. The council also carries an accumulated schools funding deficit of \u00a317.1m, the costs of servicing which\u2014up to \u00a3500k annually\u2014fall on the general fund rather than schools budgets. Children in care placement costs have escalated the risk to Red, requiring immediate change, while commercial property investments of \u00a314.89m face mandatory review under new government borrowing rules.","url":"https://moderngov.stockton.gov.uk/documents/s23952/23952.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000004","council":"Stockton-on-Tees UA","tag":"LOBO","figures":"\u00a316.0m LOBO loans; average rate 4.87%; weighted average maturity 11.4 years","quote":"On 1st April 2025 the Authority held \u00a316m of LOBO (Lender's Option Borrower's Option) loans... As market interest rates have risen, there is an increased probability of call options on the LOBOs being exercised by lenders.","paper":"Sept 2026 - Risk Management Update - Report","committee":"Audit and Governance Committee"},{"lane":"councils","source":"LGC","title":"Total Place reforms \u2018most important in generations\u2019","url":"https://www.lgcplus.com/politics/governance-and-structure/total-place-reforms-most-important-in-generations-28-09-2026/","summary":"Total Place-style reforms represent \u201cthe biggest and most important reform to how the state delivers in generations,\u201d the first secretary of state has said. Louise Haigh, who is responsible for No10 North and the Cabinet Office, outlined the government\u2019s commitment to use AI and data\u2026\nThe post Total Place reforms \u2018most important in generations\u2019 appeared first on Local Government Chronicle (LGC).","iso":"2026-09-28T08:20:17+00:00"},{"lane":"councils","source":"LGC","title":"McMahon admits \u2018we don\u2019t always make it easy\u2019","url":"https://www.lgcplus.com/politics/governance-and-structure/mcmahon-admits-we-dont-always-make-it-easy-28-09-2026/","summary":"Local government minister Jim McMahon told Labour councillors he \u201crecognised\u201d the impact of government changing its position on local government reorgani te to Lawmaker.","iso":"2026-09-25T13:10:23+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Social housing lettings in England, April 2025 to March 2026","url":"https://www.gov.uk/government/statistics/announcements/social-housing-lettings-in-england-april-2025-to-march-2026","summary":"Statistics on new social housing lettings in England in 2025/26 by local authorities and private registered providers, covering tenancies and tenants.","iso":"2026-09-25T13:01:03+00:00"},{"lane":"councils","source":"LGC","title":"Shadow unitary accuses county of withholding Send plan","url":"https://www.lgcplus.com/services/children/shadow-unitary-accuses-county-of-withholding-send-plan-25-09-2026/","summary":"East Surrey shadow unitary authority has accused Surrey CC of withholding the plans to reform the services for children with special needs and disabilities. The Department for Education required every upper tier authority submits a Send reform plan by June as a condition for writing\u2026\nThe post Shadow unitary accuses county of withholding Send plan appeared first on Local Government Chronicle (LGC).","iso":"2026-09-25T10:39:16+00:00"},{"lane":"councils","source":"LGC","title":"Steve Kay: Building a civic alliance for every child","url":"https://www.lgcplus.com/services/children/steve-kay-building-a-civic-alliance-for-every-child-25-09-2026/","summary":"The local outcomes framework offer a chance to organise around the outcomes children experience rather than the institutions that deliver individual services, writes the director of belonging at Sheffield City Council. For more than two decades, education reform has rightly focused on making schools better.\u2026\nThe post Steve Kay: Building a civic alliance for every child appeared first on Local Gove","iso":"2026-09-25T10:31:48+00:00"},{"lane":"councils","source":"LGC","title":"Analysis: Possible fair funding legal challenge","url":"https://www.lgcplus.com/finance/analysis-possible-fair-funding-legal-challenge-25-09-2026/","summary":"London boroughs have been exploring legal routes to challenge fair funding, Jonathan Knott reports. The government\u2019s fair funding settlement is \u201cprobably immune\u201d from legal challenge due to the time passed since it was announced, a lawyer who works with councils has told LGC. However, Victoria\u2026\nThe post Analysis: Possible fair funding legal challenge appeared first on Local Government Chronicle (L","iso":"2026-09-25T09:49:58+00:00"},{"lane":"ours","source":"Shropshire UA","title":"Shropshire pension fund audit clears while council battles governance failings","summary":"Shropshire's Local Government Pension Scheme fund has received an unqualified audit opinion, with no material misstatements identified in its 2025-26 accounts. The auditors tested a sample of member data for the triennial valuation setting employer contribution rates for 2026-2029 without finding issues, and anticipate no modifications to the financial statements. Set against this, the council itself is operating through a declared financial emergency with a Section 151 Officer (chief finance officer) in interim post. Internal audit found 42 per cent of its reports between April and August rated as limited or unsatisfactory assurance, indicating significant control weaknesses. Payroll controls remain poor after four years of adverse audit ratings; six schools missed the formal deadline for declaring deficits, with one forecast to reach a \u00a31 million shortfall by 2027-28; and a data review identified 386 purchase orders where combined values exceeded authorized limits out of 2,068 same-day orders worth \u00a3125.1 million.","url":"https://shropshire.gov.uk/committee-services/documents/s46580/46580.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Progress update deadline: end September 2026; subsequent quarterly meetings","quote":"Responding to the CIPFA Review recommendations is a requirement of the EFS arrangements and will be monitored by MHCLG as part of the Best Value Notice process.","paper":"SPF Draft 9-107 LGPS Audit Findings Report 2025-26 v2","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Cardiff","title":"Cardiff council faces \u00a3167m budget gap over four years as savings delivery slips","summary":"Cardiff council has identified a medium-term budget deficit of \u00a3167.1 million over the four years from 2027/28 to 2030/31, the largest financial challenge it has yet published. The gap emerges as the council's savings delivery falters. In 2025/26, efficiency savings reached 88 per cent of target, delivering \u00a310.9 million, but service change proposals \u2014 deeper cuts requiring restructuring \u2014 achieved only 76 per cent of target at \u00a32.3 million. The council noted that service change is more complex but that further such proposals will be required in future years. Meanwhile, external borrowing stands at \u00a31.148 billion, with the council adding \u00a3234 million of new debt during 2025/26 while paying \u00a343.8 million in interest.","url":"https://cardiff.moderngov.co.uk/documents/s97282/97282.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"W06000015","council":"Cardiff","tag":"s114","figures":"None","quote":"On this basis, as the Section 151 Officer I have concluded that those conditions did not arise during the year and no Section 114 notice was issued in 2025/26.","paper":"Appointment of Section 151 Officer","committee":"Council"},{"lane":"ours","source":"Bradford","title":"Bradford's \u00a3113m day-to-day overspend funded by government financing as reserves rise by \u00a355m","summary":"Bradford Council ended 2025\u201326 with a \u00a3113 million overspend on its day-to-day spending, which the government funded through a capitalisation direction\u2014permission to treat revenue spending as if it were capital spending, paid for by borrowing or asset sales. The overspend was \u00a314 million better than initially forecast. Despite this, the council's usable reserves (money set aside, both for general purposes and named uses) increased by \u00a355 million to \u00a3229.2 million, driven in part by the accounting treatment of government-funded costs. The General Fund balance\u2014the council's cushion for unexpected costs\u2014stands at \u00a353.1 million, representing 3.5 per cent of the council's \u00a31.5 billion gross expenditure base. External auditors anticipate issuing an unqualified opinion on the financial statements, subject to completion of outstanding audit work.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Runnymede","title":"Runnymede Council's General Fund reserves forecast to fall from \u00a321.6m to \u00a32m by 2032","summary":"The General Fund working balance, money set aside as a cushion against unexpected costs, is forecast to fall from \u00a321.6m to \u00a32.0m by 2032. Between 2029 and 2031 alone, reserves are forecast to fall by \u00a311.7m. The Housing Revenue Account (HRA), the council's separate account for its housing stock, faces a \u00a39.1m deficit forecast for 2026/27, reducing reserves from \u00a325.3m to \u00a315.0m, with ongoing annual deficits expected. The Pay and Grading review is the principal driver of General Fund deterioration, creating a \u00a31.241m structural cost pressure. The council is exploring early repayment of one loan using maturing investments and has approved property disposals to reduce borrowing and interest payments. Accounts for 2025/26 remain unfinalized due to resourcing and introduction of a new Financial Management System, meaning opening reserve figures are indicative only.","url":"https://runnymede.moderngov.co.uk/documents/s18927/18927.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"intervention","figures":"Notice issued December 2023; now withdrawn as of September 2026 meeting date","quote":"Following the non-statutory best value notice, which has now been withdrawn","paper":"Q1 - Budget Monitoring report - Appenxix 6 v3 - final","committee":"Corporate Management Committee"},{"lane":"ours","source":"West Suffolk","title":"West Suffolk's audit qualification will persist until \u00a37.8m property revaluation completes","summary":"West Suffolk moved out of audit limbo this year when its external auditor, Ernst & Young, issued a qualified opinion on the 2024-25 accounts\u2014the first audit assurance in three years following the national local audit backlog. The auditor reports no concerns with the council's value-for-money arrangements. However, the qualification cannot be lifted until the council completes revaluation of \u00a37.8 million in property assets last valued in 2022-23. Once revalued, a further two-year lag in the accounts will follow before an unqualified opinion can be issued, putting full clearance at 2027-28 at the earliest. The council signed its 2025-26 draft accounts a month ahead of the extended statutory deadline, and the auditor expects to issue an opinion well in advance of the January 2027 backstop date.","url":"https://democracy.westsuffolk.gov.uk/documents/s59460/59460.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000245","council":"West Suffolk","tag":"audit opinion","figures":"\u00a329.5m cash and investments at 31 March 2026; \u00a310m forecast cash at March 2027; \u00a36.13m General Fund; \u00a352.01m earmarked reserves","quote":"Overall, based on its cash flow forecast, borrowing potential and access to investment funds, as well as the level of general fund and reserve balances it holds, the council determines that it has sufficient liquidity to continue to deliver services for the foreseeable future.","paper":"6-PAS-WS-26-015-EY-Risk-Assessment-Update","committee":"Performance and Audit Scrutiny Committee"},{"lane":"ours","source":"Hammersmith & Fulham","title":"Hammersmith and Fulham cleared audit despite cyber incident and unadjusted investment errors","summary":"Hammersmith and Fulham's accounts for 2025/26 received an unmodified audit opinion, with no going-concern doubts identified, though auditors have yet to complete their assessment of wider legal and fraud impacts from a cyber incident that took the council's pension fund systems offline during the year. The Pension Fund itself also received a clean audit opinion with net assets of \u00a31,462m. However, auditors identified but did not correct a \u00a31.4m overstatement of pension fund Level 3 investments \u2014 valuations used December 2025 figures instead of March 2026 year-end valuations \u2014 and a \u00a31.22m understatement of council property valuations, both exceeding reporting thresholds. Management agreed to reclassify \u00a310m of a \u00a325m joint venture investment from short-term to long-term after auditor challenge. Looking ahead, the council faces medium-term budget gaps of \u00a331.4m in 2027/28 and \u00a357.3m in 2028/29 as government funding reductions take effect, though it holds \u00a3122.1m in reserves.","url":"https://lbhf.moderngov.co.uk/documents/s136009/136009.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E09000013","council":"Hammersmith & Fulham","tag":"audit opinion","figures":"Total net assets: \u00a31,462.070 million; materiality: \u00a323 million","quote":"Our anticipated financial statements audit report opinion will be unmodified.","paper":"Appendix 4 - LBHF Pension Fund Audit Findings Report 2025/26","committee":"Audit Committee"},{"lane":"ours","source":"Babergh","title":"Mid Suffolk cuts borrowing by \u00a314m as Babergh's debt costs surge to 33% of revenue","summary":"Mid Suffolk delivered a significant reduction in external debt, cutting borrowing by \u00a314.169m in the year to March 2026, predominantly from short-term loans that had risen to rates of 5\u20137 per cent by year-end. Babergh, by contrast, saw its debt service costs jump from a budgeted 28 per cent of revenue to 33 per cent\u2014consuming substantially more of available income for services than anticipated. The divergence reflects the differing fortunes of the two councils' commercial strategies. Both embarked on housing development ventures that underperformed: Babergh's Hadleigh scheme has \u00a34.889m in expected losses with units still unsold despite practical completion, while Mid Suffolk cancelled phase two of its Needham Market development, writing off \u00a3877k and selling the land for \u00a32.7m. Both councils also hold \u00a343.3m in loans to CIFCO, their investment subsidiary, which recorded \u00a3434k in expected credit losses and has deferred \u00a31.3m in interest payments to manage cash flow.","url":"https://baberghmidsuffolk.moderngov.co.uk/documents/s43661/43661.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E07000200","council":"Babergh","tag":"LOBO","figures":"\u00a34m LOBO loans outstanding; average rate 4.21%; call dates February and August each year","quote":"The lender has not exercised its option during 2025/26.","paper":"MC/26/15 Annual Treasury Management Report 2025-26","committee":"Mid Suffolk Council"},{"lane":"ours","source":"City of Edinburgh","title":"Edinburgh council \u00a332.2m underspend but \u00a313m savings targets missed","summary":"The City of Edinburgh Council achieved a \u00a332.2m underspend in 2025-26, with the external auditor confirming the accounts are free from material misstatement. However, the council delivered only 70 per cent of \u00a343.2m in approved savings and pressures management, with delays in demand-led services such as home to school transport and property repairs and maintenance. The council's own reporting states the underspend reflected \"one-off mitigations of underlying pressures or savings shortfalls\", relying on a \u00a324.9m non-recurring legal settlement. Council tax income fell \u00a31.7m due to reduced property tax base growth\u2014a structural revenue loss. The auditor noted planned increases in borrowing over the next five years present a significant risk to longer-term financial sustainability, while the council forecasts overspend in 2026-27.","url":"https://edinburgh.moderngov.co.uk/documents/s103738/103738.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"S12000036","council":"City of Edinburgh","tag":"LOBO","figures":"\u00a332m market debt repaid (including two LOBOs); outstanding LOBO debt \u00a3122.4m","quote":"The lenders exercised their option to request an increase in the interest rate paid on the loans and the Council exercised its option to repay the loans at par with no penalty.","paper":"8.3 Revenue monitoring outturn 25-26","committee":"Finance and Resources Committee"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough faces three-year audit recovery, missing national target by a year","summary":"Peterborough will not receive an unqualified audit opinion\u2014a clean sign-off on its accounts\u2014before the 2028/29 financial year, the council's Audit Committee heard. The auditors, EY, assess that the 2025/26 accounts will remain disclaimed, meaning unaudited. The finding puts the council a year behind the national audit recovery programme, which aims to complete recovery by 2027/28 in all but exceptional circumstances. The delay reflects audit disclaimers on the 2024/25 Statement of Accounts, which highlighted weaknesses in financial reporting, supporting evidence and assurance arrangements. The council has recruited to its corporate finance team and engaged external advisors in specialist areas including capital, treasury and valuations. Two major balance sheet items\u2014the Revaluation Reserve and Capital Adjustment Account\u2014carry significant audit risk owing to concerns about historical fixed asset records.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon seeks \u00a3540m debt write-off as \u00a31.1bn of its \u00a31.5bn borrowing yields no assets","summary":"Croydon Council has asked the government to write off or resolve \u00a3540m of debt incurred in failed commercial ventures and the exceptional financial support that followed, according to its financial performance report to the Cabinet on 23 September. Of the council's \u00a31.497bn in general fund borrowing, approximately \u00a31.1bn\u2014described as \"overhanging\" debt\u2014has no assets attached to it. Some \u00a3545m was spent pursuing unsuccessful commercial ventures, while \u00a3526m to date has been used to fund exceptional financial support (government permission to borrow to cover day-to-day spending shortfalls) that resulted from those ventures. The council's finance report notes that government intervention requires the council to demonstrate it has taken budget decisions reflecting its status as one of the most financially stressed councils. The cabinet also heard that in-year spending is only slightly over budget\u2014a \u00a32.3m overspend, down from \u00a33.1m\u2014but that the 2026-27 budget required \u00a3119m of capitalisation directions (transferring revenue costs into capital costs to be paid over 20 years) to balance.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"ours","source":"Slough UA","title":"Slough forecasts \u00a319.9m overspend in 2026-27, with \u00a315.955m driven by children's social care placements","summary":"Slough Council's Cabinet heard on 21 September that it is heading for a \u00a319.9m overspend in 2026-27, driven largely by \u00a315.955m of unforeseen costs in children's social care placements. Government-appointed commissioners overseeing the council declared the position \"extremely serious\" and warned that without \"structured and swift intervention\" the authority faces financial collapse before the financial year closes. The overspend will deplete the General Fund reserve, forecast at \u00a322.313m before the deficit, if in-year savings cannot fully offset it. Children's social care spending has risen 26 per cent in placement numbers and 40 per cent in unit costs, reflecting a small cohort of approximately 15 children in placements costing more than \u00a3500,000 per year each. The commissioners required visible leadership from elected members and senior officers and asked that non-statutory projects be deferred to demonstrate commitment to financial recovery.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"capitalisation","figures":"\u00a327.7m target, \u00a33m received to date, \u00a38m exchanged pending completion, \u00a31m shortfall = \u00a30.050m additional annual interest cost","quote":"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock's budget depends on emergency government money as asset sales and building programmes slip.","summary":"Thurrock Council set a balanced 2026/27 budget only by assuming \u00a368.9m of exceptional financial support from government \u2014 money to cover treasury costs and operational deficit that the council cannot otherwise afford. This emergency backing reveals how deeply the authority depends on two promised routes to financial recovery: selling assets and delivering capital projects. Both are failing. The asset disposal programme is on track to raise only \u00a312.2m of a \u00a325.3m budget, a shortfall of 52%. The capital programme, after slipping \u00a387.5m (73% of budget) in 2025/26, is already forecasting a \u00a315.6m underspend (20% of budget) in the first quarter of the new year. Commissioners, who now oversee the council, have required stronger governance and stricter oversight on complex schemes. The council holds reserves to manage pressures but is drawing them down \u2014 \u00a317.9m planned for 2026/27 \u2014 rather than closing the underlying gap.","url":"https://thurrock.moderngov.co.uk/documents/s54455/54455.pdf","iso":"2026-09-16T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"\u00a387.462m underspend (73% of revised budget), \u00a382.209m slippage","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential","paper":"Appendix 4 - Capital Budget Summary","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
