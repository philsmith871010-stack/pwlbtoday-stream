<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

<script>
const DATA = {"generated":"2026-10-02T09:04:53.209994+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":24,"national":5,"councils":25,"policy":41,"markets":35},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":5,"hm-treasury":2,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"CIPFA and CIPFA/LASAAC":"nothing open"},"items":[{"lane":"markets","source":"BBC business","title":"Diesel prices in NI at highest level since Iran war began","url":"https://www.bbc.co.uk/news/articles/c64g7gn4v99go?at_medium=RSS&at_campaign=rss","summary":"The average price of a litre of diesel hit 193.3p this week, according to NI Consumer Council data.","iso":"2026-10-02T09:02:21+00:00"},{"lane":"markets","source":"Guardian business","title":"For too long, only the right has expanded the boundaries of what governments can do. Can Burnham change that? | Andy Beckett","url":"https://www.theguardian.com/commentisfree/2026/oct/02/andy-burnham-labour-talk-big-changes","summary":"<p>The PM might come across as a nice bloke but he is politically ruthless. He will need to be if he is to turn big talk into big changes</p><p>How much can a Labour government change the country? According to many voters, journalists and politicians, including plenty in the party itself, the answer to that stubbornly recurring question has always been: not that much. Labour governments can\u2019t rest","iso":"2026-10-02T09:00:16+00:00"},{"lane":"ours","source":"Barnet","title":"Barnet delivered 95.8% of planned savings in 2025/26 and used \u00a310m less government support than approved","summary":"Barnet delivered 95.8% of its planned savings in 2025/26, stayed within its agreed budget and used about \u00a310m less exceptional financial support than government had approved. That support is permission to borrow, or sell assets, to cover day-to-day spending, and is a last resort. The figures are in the council's financial sustainability plan, which goes to its Finance and Growth Overview and Scrutiny Sub-Committee. The same plan says the support \"is likely to remain necessary in 2027/28 and potentially 2028/29\".\n\nThe plan shows recurring savings and income building to \u00a370m by 2027/28, \u00a3100m by 2028/29 and \u00a3200m by 2029/30. Residual support of \u00a343m is forecast for 2027/28 and \u00a349m for 2028/29, falling to nothing in 2029/30. The council's medium-term financial strategy, its financial plan for the next several years, forecasts a budget gap of \u00a3198m by 2029/30 because spending is expected to grow faster than income. The council aims to end its reliance on the support by March 2029. The strategy does not yet include any service savings from the plan. Proposals will be added once they have business cases, named owners and assessed delivery risks.\n\nBorrowing carries a cost. Interest and minimum revenue provision, the amount set aside each year to pay off past borrowing, linked to the support rise from \u00a39.552m in 2027/28 to \u00a322.611m in 2030/31.","url":"https://barnet.moderngov.co.uk/documents/s100173/100173.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000003","council":"Barnet","tag":"EFS","figures":"\u00a379.298m EFS (2026/27); then unbalanced budgets of \u00a3113.495m, \u00a3144.080m, \u00a3183.653m, \u00a3220.542m, \u00a3228.223m (2027/28\u20132031/32)","quote":"0.000 (Surplus)/Shortfall after EFS 113.495 144.080 183.653 220.542 228.223","paper":"Annex 1 FGOSC Our Plan for Financial Sustainability 2026-29","committee":"Finance and Growth Overview and Scrutiny Sub-Committee"},{"lane":"ours","source":"Bedford UA","title":"Bedford ended 2025/26 \u00a317.7m over budget, with \u00a320m of exceptional government support drawn","summary":"Bedford Council finished 2025/26 with a day-to-day spending overspend of \u00a317.726m, about 10% of its \u00a3177.616m budget, according to the outturn report (the actual figures once the year has ended) before Full Council on 7 October. The report puts it down mainly to demand in children's and adult social care. The council drew \u00a320m of exceptional financial support (EFS, government permission to borrow or sell assets to cover day-to-day spending, a last resort), approved in principle on 23 February 2026, and carried \u00a34.078m forward to strengthen reserves.\n\nThe Audit Committee's annual report names children's external placements as a main driver. It says the Ministry of Housing, Communities and Local Government gave \u00a322m of support for 2025/26 and \u00a358m to enable a balanced 2026/27 budget. The latest monitoring report forecasts a 2026/27 overspend of \u00a33.647m as at 30 June 2026, including proposed use of all \u00a325m of EFS approved for the year. Final approval depends on the council's external audit (an independent check of its accounts) being completed at year-end. Mitigation plans had not yet shown an effect by June.\n\nThe council's working assumptions show deficits of \u00a332.1m in 2027/28, then \u00a38.0m, \u00a33.9m and \u00a34.4m, reaching \u00a348.4m cumulatively by 2030/31. They assume no EFS beyond 2027/28. In June 2026 the Executive approved a budget strategy committing the council to no more than \u00a310m of EFS beyond 2027/28, aiming to end reliance on it. Directorate savings targets are set and preparation of the 2027/28 budget has been brought forward.","url":"https://councillorsupport.bedford.gov.uk/documents/s82094/82094.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000055","council":"Bedford UA","tag":"EFS","figures":"\u00a317.7 million overspend; \u00a322 million exceptional support 2025/26; \u00a358 million for 2026/27 balanced budget","quote":"During 2025/26, the Council continued to experience significant financial pressures culminating in a budget overspend of \u00a317.7 million. This was largely driven by increased costs of Children's External Placements and Adult Social Care... The Council received Exceptional Financial Support from MHCLG of \u00a322 million for 2025/26 and \u00a358 million to enable a balanced budget to be set for 2026/27.","paper":"Item 12.2 Revenue and Capital Trends","committee":"Full Council"},{"lane":"ours","source":"Cheshire East UA","title":"Cheshire East balanced its 2026/27 budget using \u00a324.995m of government-approved emergency borrowing permission","summary":"Cheshire East Council balanced its 2026/27 budget by using exceptional financial support, with a capitalisation direction totalling \u00a324.995m, according to a quarter one forecast outturn report before its Place Overview and Scrutiny Committee on 7 October. Exceptional financial support is permission from government to borrow, or sell assets, to cover day-to-day spending, and is a last resort. A capitalisation direction is government permission to treat day-to-day spending as if it were capital spending, so it can be paid for by borrowing or asset sales.\n\nThe council set the budget in February 2026. The report says: \"The budget was balanced, as required by statute, with planned use of EFS, by way of a capitalisation direction, totalling \u00a324.995m.\" The support was planned from the outset, not added during the year to cover an overspend.\n\nThe report says the use of this support forms part of the council's medium-term financial strategy, its financial plan for the following years, which runs through to 2030. The papers verified for this item do not give the amount in later years, or the forecast position for the year at quarter one.","url":"https://moderngov.cheshireeast.gov.uk/documents/s136676/136676.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"EFS","figures":"\u00a324.995m capitalisation direction","quote":"The budget was balanced, as required by statute, with planned use of EFS, by way of a capitalisation direction, totalling \u00a324.995m.","paper":"2026/27 Budget \u2013 Quarter 1 Forecast OutturnCabinet and Committee Report Template","committee":"Place Overview and Scrutiny Committee"},{"lane":"ours","source":"Derby City UA","title":"Derby Cabinet papers put Waste Treatment Centre write-down at about \u00a351.4m, with government permission sought","summary":"Derby City Council expects to write down the value of the Derby and Derbyshire Waste Treatment Centre by about \u00a351.407m after deciding not to operate the facility, according to the Medium Term Financial Strategy paper before its Cabinet on 7 October 2026. The council's chief finance officer is required to ask government for a capitalisation direction (permission to treat day-to-day spending as if it were capital spending, so it can be paid for by borrowing or asset sales).\n\nThe paper describes the figure as an impairment and write-back, which is an accounting entry recording that the plant will no longer produce the benefits the council had expected from it. It says this is not a new cash cost. The paper puts the council's current estimate at \"approximately \u00a351.407m\" and says the scale of the effect is why the direction is needed, to manage what it means for the council's day-to-day budget (revenue spending).\n\nThe paper is part of the council's medium-term financial strategy, its financial plan for the next few years. The material available to this desk does not give the timetable for the government's decision, nor how the council would cover the sum if permission were granted.","url":"https://democracy.derby.gov.uk/Document.ashx?czJKcaeAi5tUFL1DTL2UE4zNRBcoShgo=tCiVKttyRwICAIzRId64bugtQMZJQ%2btesHjB9ceomY%2bXPH6jkoOe0g%3d%3d&amp;rUzwRPf%2bZ3zd4E7Ikn8Lyw%3d%3d=pwRE6AGJFLDNlh225F5QMaQWCtPHwdhUfCZ%2fLUQzgA2uL5jNRG4jdQ%3d%3d&amp;mCTIbCubSFfXsDGW9IXnlg%3d%3d=hFflUdN3100%3d&amp;kCx1AnS9%2fpWZQ40DXFvdEw%3d%3d=hFflUdN3100%3d&amp;uJovDxwdjMPoYv%2bAJvYtyA%3d%3d=ctNJFf55vVA%3d&amp;FgPlIEJYlotS%2bYGoBi5olA%3d%3d=NHdURQburHA%3d&amp;d9Qjj0ag1Pd993jsyOJqFvmyB7X0CSQK=ctNJFf55vVA%3d&amp;WGewmoAfeNR9xqBux0r1Q8Za60lavYmz=ctNJFf55vVA%3d&amp;WGewmoAfeNQ16B2MHuCpMRKZMwaG1PaO=ctNJFf55vVA%3d","iso":"2026-10-02T09:00:00+00:00","gss":"E06000015","council":"Derby City UA","tag":"capitalisation","figures":"Impairment and write-back impact c.\u00a351.407m","quote":"requires current estimates indicating an impairment and write-back impact for the City Council of approximately \u00a351.407m...The Director of Finance and Section 151 Officer is required to seek a Capitalisation Directive","paper":"Item 14 - Medium Term Financial Strategy including National Issues and Derby Focus","committee":"Council Cabinet"},{"lane":"ours","source":"Thurrock UA","title":"Thurrock commissioners say 2025/26 capital slippage signals \"ongoing challenges\" on infrastructure","summary":"Commissioners reviewing Thurrock Council have said that capital spending in 2025/26 fell behind its revised budgets, and that this signals \"ongoing challenges resulting in potential delay in infrastructure improvements\". Capital spending is money spent on things that last, such as buildings and roads. The comment appears in the capital budget summary (Appendix 4) in the papers for the Corporate Overview and Scrutiny Committee, which meets on 8 October 2026.\n\nThe slippage is the gap between what the council planned to spend on capital schemes and what it spent. The commissioners said that \"stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential to improve delivery\".\n\nThey added that effective governance would be needed to give assurance and to show that decisions were properly informed. The extract does not give the size of the slippage or name the schemes affected.","url":"https://thurrock.moderngov.co.uk/documents/s54727/54727.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"intervention","figures":"N/A","quote":"commissioners commented that the slippage against the revised capital budgets, signals ongoing challenges resulting in potential delay in infrastructure improvements. Stronger governance, stricter oversight on complex capital schemes and effective stakeholder engagement will be essential to improve delivery","paper":"Appendix 4 - Capital Budget Summary","committee":"Corporate Overview and Scrutiny Committee"},{"lane":"ours","source":"Derbyshire CC","title":"Derbyshire schools-funding deficit forecast at \u00a3173.845m by March 2027, with \u00a384.051m refund expected","summary":"Derbyshire County Council expects its deficit on the dedicated schools grant (DSG, the government grant that funds schools) to reach \u00a3173.845m by 31 March 2027, according to first-quarter budget monitoring (the in-year check of spending against budget) taken by Cabinet on 10 September. The figure is the \u00a393.390m carried forward from 2025-26 plus a forecast overspend this year of \u00a380.455m.\n\nAlmost all of that overspend is in high needs, the part of school funding for children with special educational needs and disabilities. The council forecasts spending of \u00a3206.523m against a budget of \u00a3127.479m, a gap of \u00a379.044m. The papers attribute it to continuing demand, limited capacity and more use of higher-cost independent placements. Education, health and care plans rose 7.6% to 9,063. The government's high needs grant rose by \u00a36.670m to \u00a3133.576m, but the papers say that includes no allowance for inflation or demand growth. The council's performance report puts the backlog of open assessments at 1,600, with 20% of plans issued within the 20-week statutory timescale in the quarter.\n\nThe government has said it will refund 90% of the deficit built up before March 2026, \u00a384.051m, expected this autumn. The council must find the remaining \u00a39.339m. The paper says the 2026-27 deficit is not covered, and that the second phase of proposals for deficits to March 2028 is \"still to be confirmed. This is a significant financial risk.\"\n\nChildren's Services separately forecasts a \u00a33.187m overspend. Cabinet is asked to approve \u00a31.015m from a budget risk reserve for a restructure of SEND services into a locality-based model. It would carry an ongoing cost of \u00a32.513m a year from 2027-28.","url":"https://derbyshire.moderngov.co.uk/documents/s36257/36257.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E10000007","council":"Derbyshire CC","tag":"DSG / SEND","figures":"\u00a379.044m overspend, \u00a3127.479m budget, \u00a3206.523m forecast, 7.6% growth to 9,063 EHCPs, \u00a361.744m prior-year above-grant allocation, \u00a36.670m grant increase","quote":"The current forecast is \u00a3206.523m against a \u00a3127.479m budget, giving a \u00a379.044m overspend, driven by continuing demand, capacity constraints and increased use of higher-cost independent and non-maintained placements, alongside special-school, mainstream and post-16 pressures.","paper":"Performance Monitoring and Budget Monitoring/Forecast Outturn 2026/27 Quarter 1, 10/09/2026 Cabinet","committee":"Council"},{"lane":"ours","source":"Kirklees","title":"Kirklees schools' high needs deficit stands at \u00a382.2m, with the annual shortfall down \u00a33m to \u00a317m","summary":"Kirklees Council's accumulated overspend on support for children with special educational needs and disabilities (the \"high needs\" part of school funding) stood at \u00a382.2m at 31 March 2026, according to papers for the Cabinet meeting on 6 October. The shortfall built up in the year to March 2026 was \u00a317m, \u00a33m lower than the \u00a320m of the year before.\n\nThe council's medium-term financial strategy (its financial plan for the next few years) says \"progress is being made in Kirklees\". The deficit is on the dedicated schools grant, the government grant that funds schools. It is held under the statutory override, a temporary government rule that lets councils keep a schools-funding deficit off their main balance sheet.\n\nThe government's Safety Valve Programme, an agreement under which the council had been working on this deficit, ended in February 2026. The council now receives 90% of its historic deficits' cost through the High Needs Stability Grant and must meet the remaining 10% from its general fund, the main account that pays for day-to-day services. The papers estimate that at about \u00a313m across 2026/27 and 2027/28. Separately, the cost of the treasury management (borrowing and cash handling) needed to carry the deficit is about \u00a33.4m a year.","url":"https://democracy.kirklees.gov.uk/documents/s77626/77626.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E08000034","council":"Kirklees","tag":"DSG / SEND","figures":"\u00a382.2m cumulative deficit at 31 March 2026; c\u00a313m General Fund cost over 2026/27-2027/28; \u00a33.4m p.a. treasury servicing; annual deficit \u00a317m in 2025/26 (\u00a33m improvement)","quote":"cumulative High Needs Block Deficit was \u00a382.2m. Progress is being made in Kirklees with a reduction in the annual deficit in 2025/26 being some \u00a33m lower at \u00a317m than the previous year","paper":"MTFS Combined Report v3","committee":"Cabinet"},{"lane":"ours","source":"Sutton","title":"Sutton's schools-funding deficit forecast to reach \u00a335.6m, with the council responsible for at least \u00a33.6m","summary":"Sutton Council's deficit on the dedicated schools grant (the government grant that funds schools) is forecast to rise from \u00a321.6m to \u00a335.6m, according to the medium-term financial strategy (the council's financial plan for the next three to five years) put to its Strategy and Resources Committee on 5 October. The extra \u00a314m is forecast growth on the \u00a321.6m accumulated so far.\n\nThe government has committed to fund 90% of accumulated deficits on high needs, the part of school funding for children with special educational needs and disabilities. That leaves Sutton responsible for the remaining 10%, which the strategy puts at a minimum of \u00a33.6m. The papers give the government's share as up to about \u00a332m.\n\nThe council has budgeted to set money aside against its share. It plans a \u00a30.5m contribution to its dedicated schools grant reserve in 2027/28, followed by a further \u00a32m in 2028/29. The strategy covers the years 2026 to 2030.","url":"https://sutton.moderngov.co.uk/documents/s97291/97291.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000029","council":"Sutton","tag":"DSG / SEND","figures":"Accumulated deficit: \u00a321.6m rising to \u00a335.6m; council share: at least \u00a33.6m; government funding: 90% (up to ~\u00a332m); reserve contributions: \u00a30.5m (2027/28), \u00a32m (2028/29)","quote":"accumulated deficit at was \u00a321.6m and is forecast to further \u00a314m in","paper":"Appendix C - Medium Term Financial Strategy 2026 - 2030","committee":"Strategy and Resources Committee"},{"lane":"ours","source":"Hart DC","title":"Hart's auditors expect a qualified opinion on 2025/26 accounts and an unqualified one by 2027/28","summary":"Hart District Council's external auditors expect to give a qualified opinion on its 2025/26 accounts, meaning they will not be able to fully sign off the accounts. They anticipate that a clean, unqualified opinion \"may be achievable by 2027/28\", according to a draft audit results report put to the council's Audit Committee on 6 October.\n\nThe council is taking part in the government's audit recovery programme, run by the Ministry of Housing, Communities and Local Government. It follows disclaimer opinions on the accounts for 2022/23 and 2023/24, in which the auditors said they could not form a view on the accounts at all. A qualified opinion for 2025/26 would be a step up from that position.\n\nThe auditors say limits on their assurance remain over the council's reserves, the money it has put aside, which are affected by the problems in earlier years' accounts. They also cite the consequences of past valuations of property, plant and equipment, the land, buildings and other physical assets the council owns. The report says the 2027/28 forecast is subject to \"the successful completion of all planned audit procedures\".","url":"https://hart.moderngov.co.uk/documents/s14709/14709.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E07000089","council":"Hart DC","tag":"audit opinion","figures":"Unqualified opinion anticipated 2027/28; qualified expected 2025/26","quote":"Based on the work completed to date, and subject to the successful completion of all planned audit procedures, we anticipate that an unqualified audit opinion may be achievable by 2027/28. However, limitations in assurance remain in relation to reserves and the consequential impact of historical property, plant and equipment valuations.","paper":"Draft Audit Results Report","committee":"Audit Committee"},{"lane":"ours","source":"Middlesbrough UA","title":"Middlesbrough's \u00a325.5m usable reserves would be gone by 2029/30 if budget gaps are not closed permanently","summary":"Middlesbrough Council held \u00a325.530m in usable, unrestricted reserves (money it has put aside and can actually spend) at 31 March 2026. A report to its Executive on 7 October says that if the forecast budget gaps in each year of its medium-term financial plan are covered from reserves rather than closed by permanent measures, the balance would fall to a negative \u00a30.2m in 2029/30.\n\nThe report's author is the council's chief finance officer, known as the section 151 officer, who has a legal duty to warn if the council cannot balance its books. They state that in that case all usable unrestricted reserves would be exhausted by 2029/30 and they would be forced to issue a section 114 notice. That is a formal warning that the council cannot balance its budget, and it freezes new spending until councillors agree a plan.\n\nThe report adds that the council would also have to apply to government for exceptional financial support, permission to borrow or sell assets to cover day-to-day spending, which is a last resort. The outcome turns on how the provisional gap for each year, set out in the report's Table 2, is met: by permanent, recurring measures, or from reserves.","url":"https://moderngov.middlesbrough.gov.uk/documents/s45328/45328.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000002","council":"Middlesbrough UA","tag":"s114 risk","figures":"Reserves at 31 March 2026: \u00a325.530m; forecast negative balance: (\u00a30.2m) by 2029/30","quote":"If the current forecast provisional budget gap for each year of the MTFP shown in Table 2 is not solved by permanent recurring measures then the level of Usable, Unrestricted Reserves would fall from \u00a325.5m at the end of 2025/26, to a negative balance of (\u00a30.2m) in 2029/30, i.e. all usable unrestricted reserves would be exhausted by 2029/30 and in that case the s151 Officer would be forced to issue a S114 notice","paper":"Report","committee":"Executive"},{"lane":"ours","source":"Runnymede","title":"Council maintained under-borrowed position in Q1, using \u00a389.1m of reserves and cash rather than external borrowing","summary":"No new borrowing was undertaken in the quarter. The Council deliberately did not access the PWLB or money markets, instead using its own reserves and cash balances to support operations. Total borrowings fell by \u00a3306k to \u00a3586,808k, while the Capital Financing Requirement (borrowing need) remained at \u00a3672.931m. This strategy avoids external borrowing costs but commits reserves to internal financing.","url":"https://runnymede.moderngov.co.uk/documents/s18967/18967.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E07000212","council":"Runnymede","tag":"borrowing","figures":"Investments held \u00a389.1m; total borrowings \u00a3586,808k (down from \u00a3587,114k); CFR \u00a3672,931k; under-borrowing of \u00a386,123k","quote":"No new borrowing was undertaken during the quarter meaning that the Council continued to maintain an under-borrowed position. This meant that the capital borrowing need, the CFR, was not fully funded with loan debt, as cash supporting the Council's reserves, balances and cash flow was used as an interim measure in the high interest rates environment and the period of low capital spend.","paper":"2026-27 Q1 Treasury Management Report v1 - Final","committee":"Overview and Scrutiny Select Committee"},{"lane":"ours","source":"Blackburn with Darwen UA","title":"Blackburn with Darwen schools high-needs account in deficit of \u00a35.094m, forecast to reach c\u00a333m by 2028","summary":"Blackburn with Darwen's schools funding for children with special educational needs and disabilities (high needs) ended 2025/26 with a cumulative deficit of \u00a35.094m, the first time the council's dedicated schools grant (DSG, the government grant that funds schools) reserve has been in deficit, according to papers for the Executive Board on 8 October.\n\nThe council's medium-term financial strategy (its financial plan for the next three to five years) says the deficit could reach about \u00a333m by March 2028 without government intervention. That is when the statutory override, a temporary government rule that lets councils keep a schools-funding deficit off their main balance sheet, expires. The paper says the council expects about \u00a34.585m from the government's High Needs Stability Grant and has identified about \u00a33.3m as its own share of the remaining deficit.\n\nTo cover that share, the council is building a \"DSG Deficit Shadow Reserve\". The reserve stood at \u00a31.004m on 31 March 2026. A transfer of \u00a32.317m in 2026/27 takes it to \u00a33.321m, and it is then held at that level to the end of the plan period in March 2030. The council is setting the money aside ahead of the deficits it expects.","url":"https://blackburn.moderngov.co.uk/documents/s37525/37525.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E06000008","council":"Blackburn with Darwen UA","tag":"reserves","figures":"Budget Support Reserve: \u00a313,914k opening balance (31-Mar-26); \u00a31,981k used to balance 2026/27; \u00a311,933k forecast (31-Mar-27); \u00a33,000k planned drawdown for 2027/28; \u00a38,933k forecast (31-Mar-28 through 31-Mar-30)","quote":"Budget Support Reserve | 13,914 | - | - | (1,981) | 11,933 | (3,000) | 8,933 | - | 8,933 | - | 8,933","paper":"Appendix 3 for Update to Medium Term Financial Plan 2027/30","committee":"Executive Board"},{"lane":"ours","source":"Wandsworth","title":"Wandsworth projects \u00a34m overspend in children's social care, despite an Outstanding Ofsted rating","summary":"Wandsworth Council is projecting a \u00a34m overspend in children's social care this financial year, its Finance Overview and Scrutiny Committee was told at its meeting on 8 October. The paper says \"an overspend of \u00a34m is currently being projected in this financial year\" (2025/26).\n\nThe forecast comes after Ofsted, the schools and children's services inspectorate, rated the council's Children's Services Outstanding in May 2026. The papers give two main causes. One is the rising complexity of need among children looked after by the council and children with disabilities. The other is the cost of transport, which has grown as demand has risen for support for children with special educational needs and disabilities (SEND).\n\nThe council says it is responding through early help and prevention, increasing local provision and improving how it commissions, or buys, places for children in care. The paper states that these measures \"will take time to deliver\", so they are not expected to remove the overspend within the current year.","url":"https://democracy.wandsworth.gov.uk/documents/s130002/130002.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000032","council":"Wandsworth","tag":"ahead of budget","figures":"\u00a311.7m surplus forecast, \u00a3152.658m closing balance, repairs overspend \u00a32.9m, decorations slippage \u00a35.8m","quote":"Overall, the most recent revenue forecast is showing an \u00a311.7m surplus in year and a forecast closing revenue balance of \u00a3152.658m.","paper":"Final Report","committee":"Finance Overview and Scrutiny Committee"},{"lane":"ours","source":"Waltham Forest","title":"Waltham Forest forecasts \u00a36.4m exceptional financial support for 2026/27, down from \u00a319m agreed","summary":"Waltham Forest Council now expects to need \u00a36.4m of exceptional financial support (EFS) in 2026/27, against the \u00a319m agreed in principle in its February 2026 budget. EFS is government permission to borrow, or sell assets, to cover day-to-day spending, and is a last resort. The figure, a 66% reduction, comes from a medium-term financial strategy report (the council's plan for the next few years) going to Cabinet on 6 October.\n\nThe report bases the \u00a36.4m on the month 3 budget monitoring, the in-year check of spending against budget. It gives three reasons for the fall: \u00a33.8m of additional funding from the Ministry of Housing, Communities and Local Government, \u00a35.7m of new savings identified during the year, and net underspends in corporate balances.\n\nThe council remains dependent on EFS borrowing to balance the year, though at a much lower level than first anticipated. The paper says the forecast \"is subject to new pressures emerging by year end.\"","url":"https://walthamforest.moderngov.co.uk/documents/s111274/111274.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E09000031","council":"Waltham Forest","tag":"overspend","figures":"\u00a347.709m (from \u00a323.927m in February 2026); Month 3 in-year overspend \u00a319.901m; new service demand pressures \u00a325.3m; additional inflation \u00a318.5m","quote":"The revised MTFS position is now indicating a total funding gap of \u00a347.709m over the 3-year period to March 2029/30 but assumes that \u00a342m of savings included within the 2026/27 MTFS will be delivered, subject to some reprofiling.","paper":"Medium Term Financial Strategy 2026 27 - Cabinet report","committee":"Cabinet"},{"lane":"ours","source":"Worthing","title":"Adur District Council systematically replaced \u00a325.3m of PWLB debt with \u00a320.9m of temporary inter-council borrowing at rates of 4.00% to 5.50%.","summary":"PWLB holdings fell from \u00a3165.143m to \u00a3139.855m whilst other borrowing rose from \u00a320.431m to \u00a341.283m. The new loans were sourced from other councils and fire authorities, mostly maturing within 12 months, at rates above the PWLB cost. This pivot toward expensive short-term funding likely reflects confidence in near-term capital receipts or a strategic decision to await better refinancing rates.","url":"https://democracy.adur-worthing.gov.uk/documents/s17588/17588.pdf","iso":"2026-10-02T09:00:00+00:00","gss":"E07000229","council":"Worthing","tag":"refinancing","figures":"PWLB reduced \u00a325.288m; other borrowing increased \u00a320.852m; new rates 4.00\u20135.50%; maturity range 12 months to 12 months (mostly under 1 year)","quote":"The following fixed interest rate loans were taken during the year: The London Treasury Liquidity Fund \u00a35m HRA 4.45% 17/12/2026; North Northamptonshire \u00a35m HRA 4.50% 03/07/2026; Merseyside Fire & Rescue Service \u00a33m HRA 4.00% 22/05/2026","paper":"Annual Treasury Management Report 25-26","committee":"Joint Strategic Committee"},{"lane":"markets","source":"BBC business","title":"US pressures Europe to release diesel reserves as Trump threatens export ban","url":"https://www.bbc.co.uk/news/articles/c5zjzjgdeneeo?at_medium=RSS&at_campaign=rss","summary":"President Donald Trump has threatened to ban diesel exports in a bid to ease prices in the US ahead of the November elections.","iso":"2026-10-02T08:54:00+00:00"},{"lane":"markets","source":"City AM","title":"Aldi debt jumps by \u00a3100m as profit slips at discount grocer","url":"https://www.cityam.com/aldi-debt-jump hLdS1lV2xfR2VEMGF0STlRLTZpdENsVlpoT2x4aHdFeXJvSnJfSjI2cW9pcnlfeTZfSE1KYU92Mlo5eFpvODI1aXdlTlRYUkRzNENaQnhWNEtpVVZFSUxSdW9hZ1JZWGpB?oc=5\" target=\"_blank\">Stark reserves warning for Kirklees ahead of \u00a324m budget gap</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Room151</font>","iso":"2026-09-29T11:42:51+00:00"},{"lane":"councils","source":"LG finance press","title":"S151s back in \u2018washing machine of turmoil\u2019 as LGR pause impacts planning - Room151","url":"https://news.google.com/rss/articles/CBMiqAFBVV95cUxNY0RXeE9YSjNZWGdMeWRsbUxYMUgzOEViZFJKUC1hb2l6eFlUem1yWE9qYXFQbnB3Q29uMXVIMndjOGUyZVhIRnFWX2VVTi1rNGRmQTlpU0N3OHRtdHR3R29XNWRoSk5hck5vd0t3OWh5ZENHdDdNVEs0Tkl2TGpFYmlBcnJkakFZRUdKSGswbWJMV2ViYmNXLXBQeHFlTjhlV0FDb0pqaEo?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiqAFBVV95cUxNY0RXeE9YSjNZWGdMeWRsbUxYMUgzOEViZFJKUC1hb2l6eFlUem1yWE9qYXFQbnB3Q29uMXVIMndjOGUyZVhIRnFWX2VVTi1rNGRmQTlpU0N3OHRtdHR3R29XNWRoSk5hck5vd0t3OWh5ZENHdDdNVEs0Tkl2TGpFYmlBcnJkakFZRUdKSGswbWJMV2ViYmNXLXBQeHFlTjhlV0FDb0pqaEo?oc=5\" target=\"_blank\">S151s back in \u2018washing machine of turmoil\u2019 as LGR pause impacts planning</a>&nbsp;&nbsp;<font color=","iso":"2026-09-29T10:34:08+00:00"},{"lane":"ours","source":"Dumfries and Galloway","title":"Dumfries and Galloway council secures \u00a350m Levelling Up grants but faces social care audit concerns","summary":"The council has received over \u00a350 million from the UK Government's Levelling Up Fund. Its capital projects \u2014 spending on buildings and other long-lived assets \u2014 are delivering on schedule: the Stranraer Watersports Hub is due to open in September, the Dalbeattie Rocks and Wheels facility is nearing completion, and the George building has attracted eight expressions of interest with a tender exercise in progress. The internal audit's overall opinion is Reasonable, meaning there is a generally sound system of governance, risk management and control in place. However, auditors have flagged two areas requiring ongoing monitoring: social care budgets and IT procurement, indicating these carry elevated risk requiring continuous attention.","url":"https://dumfriesgalloway.moderngov.co.uk/documents/s79230/79230.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"S12000006","council":"Dumfries and Galloway","tag":"audit opinion","figures":"2 areas flagged for ongoing monitoring","quote":"The Internal Audit Manager has regular discussions in particular on two areas of concern \u2013 social care budgets and IT procurement.","paper":"Internal Audit Annual Assurance Report 2025-26","committee":"Audit, Risk and Scrutiny Committee"},{"lane":"ours","source":"East Hertfordshire","title":"East Herts audit plan sets out build-back work after four years without an audit opinion","summary":"East Hertfordshire's Audit and Governance Committee on 29 September considered an external audit plan (an independent check on the council's accounts) that sets out how the council's auditor, Azets, will rebuild assurance over the accounts. The council has had a disclaimed opinion, meaning the auditor could not say whether the accounts were fairly presented, for each year from 2021/22 to 2024/25. Azets estimates the \"build-back\" work at \u00a3245,524, on top of a standard fee of \u00a3185,917 that the council says was within its \u00a3190,000 budget.\n\nThe council says the extra fee will put pressure on its day-to-day spending budget, likely split across 2026/27 and 2027/28. The work runs alongside the 2025/26 and 2026/27 audits, with a statutory deadline of 31 January 2027. The council names the capacity of both the audit team and its own finance team as the main risk to meeting it.\n\nThe 2026/27 outturn figures (actual spending against budget) show net cost of services at \u00a318,059k against a revised budget of \u00a317,619k, an overspend of \u00a3440k. Place was \u00a3338k over, at \u00a34,971k against \u00a34,633k. Regeneration, Customer & Commercial Services was budgeted to bring in \u00a32,188k net but achieved \u00a31,784k, \u00a3404k short. The minimum revenue provision, the sum set aside each year to pay off past borrowing, came in at \u00a31,588k against \u00a31,453k budgeted. In capital spending, on things that last, \u00a3237k slips to 2027/28: \u00a3170k for URC Church Hall and \u00a367k for Old Road Lane town centre regeneration.\n\nThe committee also reviewed the strategic risk register. The score for democratic transition fell from B2 to C2 after government confirmed shadow authority elections for May 2027 for the new East Hertfordshire and Broxbourne unitary authority. The climate change score fell from B4 to B3 because amended works at Amwell Depot can proceed under permitted development rights.","url":"https://democracy.eastherts.gov.uk/documents/s74022/74022.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000242","council":"East Hertfordshire","tag":"MRP","figures":"MRP: budget \u00a31,453k, outturn \u00a31,588k, variance \u00a3135k","quote":"Minimum Revenue Provision 1,453 1,588 135","paper":"Appendix A - 2026/27 Revenue outturn","committee":"Audit and Governance Committee"},{"lane":"councils","source":"Distress watch","title":"High Court of Karnataka Allows Relief Against Forfeiture of Lease Under Section 114 of Transfer of Property Act, 1882 \u2014 Tenant Granted One Month to Deposit Arrears of Rent. Court holds that forfeiture of lease for non-payment of rent is not automatic and ten - Lawtext","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBzMWlJdThDMlBCRVNEMVB5R3dLY1h4OTVUN0JsWnFuZk5TT0JDUU52dGtSVHBvSUJYWFhxN2pqZmJuTTRzXzA3OE5NMFk2Q3NvTW5GUlNkeXA1cWFvbEdmVVNheVZPdw?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBzMWlJdThDMlBCRVNEMVB5R3dLY1h4OTVUN0JsWnFuZk5TT0JDUU52dGtSVHBvSUJYWFhxN2pqZmJuTTRzXzA3OE5NMFk2Q3NvTW5GUlNkeXA1cWFvbEdmVVNheVZPdw?oc=5\" target=\"_blank\">High Court of Karnataka Allows Relief Against Forfeiture of Lease Under Section 114 of Transfer of Property Act, 1882 \u2014 Tenant Granted One Month to Deposit Arrears of Rent. Court holds that","iso":"2026-09-29T06:01:12+00:00"},{"lane":"policy","source":"HM Treasury","title":"Chancellor backs young people into work by supporting jobs","url":"https://www.gov.uk/government/news/chancellor-backs-young-people-into-work-by-supporting-jobs","summary":"The Chancellor has announced a package to help people into work, education and training, while building the skilled workforce Britain needs for the future.","iso":"2026-09-28T15:56:37+00:00"},{"lane":"policy","source":"HM Treasury","title":"More overseas firms enticed to buy British","url":"https://www.gov.uk/government/news/more-overseas-firms-enticed-to-buy-british--2","summary":"Overseas buyers will be offered a new UK Export Finance loan guarantee to incentivise buying goods and services from British companies.","iso":"2026-09-28T15:43:57+00:00"},{"lane":"ours","source":"Stockton-on-Tees UA","title":"Stockton-on-Tees carried a \u00a317.1m schools-funding deficit into 2026, with borrowing costs of up to \u00a3500k","summary":"Stockton-on-Tees Borough Council ended the 2025/26 financial year with an accumulated deficit of \u00a317.1m on its dedicated schools grant (DSG, the government grant that funds schools), according to its treasury management outturn report (the actual figures for the year) presented to the Audit and Governance Committee on 28 September. The council says the cost of borrowing to cover the deficit in the year was \"up to \u00a3500k\".\n\nThe deficit is on high needs, the part of school funding for children with special educational needs and disabilities. Under a statutory override, a temporary government rule that keeps such deficits off a council's main balance sheet, the \u00a317.1m is charged to an unusable reserve rather than to day-to-day spending. The report says cash leaves the bank account regardless. The borrowing costs cannot be charged to the grant, so they fall on the council's general fund.\n\nA separate risk management update to the same meeting links the pressure to the cost of provision. It records that a council risk on services for children with disabilities and special educational needs changed because of \"a number of processes and procedural issues\" found during the Ombudsman's investigation of a complaint, and because of \"the high cost of placements\". The council says a full review of its processes is under way as part of actions agreed with the Ombudsman. The papers give no figure for the cost of that review.","url":"https://moderngov.stockton.gov.uk/documents/s23450/23450.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000004","council":"Stockton-on-Tees UA","tag":"LOBO","figures":"\u00a316.0m LOBO loans; average rate 4.87%; weighted average maturity 11.4 years","quote":"On 1st April 2025 the Authority held \u00a316m of LOBO (Lender's Option Borrower's Option) loans... As market interest rates have risen, there is an increased probability of call options on the LOBOs being exercised by lenders.","paper":"TM Outturn Report 2025-26","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Shropshire UA","title":"Shropshire Council receiving exceptional financial support, with government monitoring and outside reviews","summary":"Shropshire Council is receiving exceptional financial support (EFS) from government, according to papers for its Audit and Governance Committee on 25 September 2026. EFS is permission from government to borrow, or sell assets, to cover day-to-day spending, and is a last resort for councils.\n\nThe report describes the council as \"receiving Exceptional Financial Support (EFS) from the Government\". It says the support comes under formal arrangements: the council must submit responses to external assurance reviews, which are reviews of its finances carried out from outside the council, and accept government monitoring.\n\nThe paper gives no figure for the support, so the amount is not stated in the material put to the committee.","url":"https://shropshire.gov.uk/committee-services/documents/s46573/46573.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Progress update deadline: end September 2026; subsequent quarterly meetings","quote":"Responding to the CIPFA Review recommendations is a requirement of the EFS arrangements and will be monitored by MHCLG as part of the Best Value Notice process.","paper":"20260924.25 Shropshire EFS External Assurance Review - Council.Audit","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Bradford","title":"Bradford Council's 2025-26 accounts: \u00a3113m overspend, usable reserves up \u00a355m to \u00a3229.2m, clean audit opinion expected","summary":"Bradford Council ended 2025-26 with usable reserves of \u00a3229.2m, up \u00a355.0m on the year, even though its day-to-day spending ran \u00a3113m over budget, the Governance and Audit Committee heard on 24 September. The council's statement of accounts, its formal annual accounts, says the overspend was \u00a314m smaller than first forecast and was paid for through a capitalisation direction, government permission to treat day-to-day spending as capital spending so it can be funded by borrowing or asset sales. The accounts say part of the rise in reserves comes from earmarking costs funded that way. The general fund balance, the cushion for the unexpected, is \u00a353.1m, or 3.5% of about \u00a31.5bn of gross spending.\n\nThe council's external auditor, Forvis Mazars, anticipates an unqualified opinion, meaning a full sign-off, on the accounts. That is subject to remaining work, including investment property valuations, land and buildings indexation, pension liability work, capital grants and long-term borrowing balances. The council says no material changes were needed to its primary statements and that it has no audit backlog. Overall materiality, the level of error the auditor treats as significant, is \u00a331.5m.\n\nThe accounts record a \u00a323.7m net fall from revaluing buildings, park land and investment properties. Non-current assets fell \u00a313.2m overall despite \u00a379.4m of capital enhancements. The Executive's July 2026 decision not to proceed with the Square Lane project means \u00a34.9m of abortive costs will be charged to day-to-day spending, taking usable reserves from \u00a3229.2m to \u00a3224.3m.\n\nThe council's pension scheme has assets of \u00a33.1bn against liabilities of \u00a32.2bn, a surplus of \u00a3871m. An accounting restriction known as the asset ceiling means no net pension asset appears on the balance sheet.\n\nSeparately, the West Yorkshire Pension Fund's audit report anticipates an unqualified opinion. Its auditor found a \u00a360.9m understatement in hard-to-value investments, which management corrected, and left \u00a330.3m of estimated further error unadjusted. A revised transaction report raised recorded purchases and sales by \u00a3842.4m after testing found the first did not match supporting evidence.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough sets up Property Board after January statutory report on John Mansfield Centre sale","summary":"Peterborough City Council has created an internal Property Board to scrutinise property decisions before they are taken, after its chief finance officer issued a statutory report in January 2026 on the disposal of the John Mansfield Centre. The council's Annual Governance Statement action plan, before the Audit Committee on 23 September, says oversight of decision notices on property transactions \"required improvement\".\n\nThe report was issued under sections 5 and 114 of the relevant legislation. A section 114 notice is a formal warning from the chief finance officer that the council cannot balance its budget, which freezes new spending until councillors agree a plan. Cabinet has since retrospectively approved four historic decisions on commercial leases that exceeded the \u00a3250,000 aggregate rental threshold.\n\nThe plan also covers procurement. An external review of the procurement function made 49 recommendations, and the council is tracking which are underway, which it regards as unattainable and which still need progressing. Temporary accommodation procurement has concluded, with 11 suppliers awarded contracts, and the council describes it as now compliant. Cabinet agreed longer-term arrangements on 23 March 2026. The council's own paper says procurement and contract management \"remain areas of elevated risk\".","url":"https://peterborough.moderngov.co.uk/documents/s60639/60639.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix B: Annual Governance Statement Action Plan","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon's forecast 2026-27 overspend falls \u00a30.8m to \u00a32.3m at period 3","summary":"Croydon Council is forecasting a \u00a32.3m overspend on its General Fund (the day-to-day budget for most services) for 2026-27, down from \u00a33.1m a period earlier. The period 3 report to the Executive Mayor and Cabinet on 23 September says this shows action to control spending \"is already having an impact\". The \u00a3485.4m budget still relied on \u00a3119m of capitalisation directions, which is government permission to treat day-to-day spending as capital spending so it can be paid for by borrowing. The report puts the future cost at about \u00a385,000 a year for every \u00a31m.\n\nInterest payable is forecast at \u00a350.7m against a \u00a355.9m budget. The council has delivered a forecast \u00a326.5m of its \u00a334.7m savings target, 76.4%, leaving \u00a38.2m not on track. Children's social care is forecast to overspend by \u00a33.4m. Placements account for \u00a31.7m of that on a \u00a349.7m budget, and the dearest single placement in June cost \u00a314,004 a week. Holding vacancies produced a \u00a30.9m staffing underspend. In the housing revenue account (the ring-fenced account for council homes, paid for by rents), a \u00a33.9m overspend is attributed to repairs and safety works, which are \u00a32.8m over, and to disrepair claims.\n\nThe report forecasts a \u00a345m overspend on high needs, the school funding for children with special educational needs, in 2026-27. The deficit on the dedicated schools grant stood at \u00a367.5m on 31 March 2026. The council says it could reach \u00a396m when the statutory override, the government rule keeping such deficits off councils' main balance sheets, ends in March 2028.\n\nA separate paper sets out four options for cutting working-age Council Tax Support, which would save between \u00a33.6m and \u00a311.9m a year, including the Greater London Authority's share. The scheme costs about \u00a339m a year, with the council bearing about \u00a320m. The paper says collection could fall from 98.0% to 97.5%.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"ours","source":"Slough UA","title":"Slough has received \u00a33m of \u00a327.7m planned 2026/27 asset sales, with \u00a38m more agreed but not completed","summary":"Slough Borough Council has received \u00a33m of the \u00a327.7m it planned to raise from selling assets in 2026/27, according to the first-quarter budget monitoring report (the in-year check of spending against budget) put to Cabinet on 21 September. The figures run to the end of July.\n\nA further \u00a38m of sales has exchanged, meaning contracts are signed, and is awaiting completion. The report says more assets are still to be marketed. The \u00a327.7m is the net figure for general fund disposals assumed in the council's treasury management strategy, its yearly statement of how much it plans to borrow, from whom, and how it will invest.\n\nThe receipts are needed to pay for the capitalisation directions, which are government permission to treat day-to-day spending as if it were spending on things that last, so it can be paid for by borrowing or asset sales. The report sets out what happens if sales fall short: \"If the Council cannot achieve the required disposals, it is likely to need to borrow more to finance the Capitalisation Directions, increasing external borrowing and capital financing costs, putting further unbudgeted pressure on the future year's revenue budgets.\" It puts the cost of a \u00a31m shortfall at up to \u00a30.050m a year in extra interest.","url":"https://slough.moderngov.co.uk/documents/s89335/89335.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"intervention","figures":"\u00a319.9m overspend requiring mitigation, governance intervention in place","quote":"This is an extremely serious financial position for the Council and managing an in-year forecasted overspends of this scale, requires structured and swift intervention, if a sustainable position is to be restored before the financial year closes.","paper":"2026-27 Q1 Budget Monitoring Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"The council could not set a balanced budget and received exceptional financial support of \u00a3130m (2022-23), \u00a3184m (2023-24), \u00a396m (2024-25) and \u00a372m (2025-26). Over seven years to 2028/29, total capitalisation directions are estimated at \u00a3691 million. The Section 114 notice expired March 2024 but the council remains under close government monitoring.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-01T07:00:00+00:00"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Modernising Payment Services Regulation","summary":"A consultation on the government's approach to modernising payment services regulation.","url":"https://www.gov.uk/government/consultations/modernising-payment-services-regulation","iso":"2026-07-14T15:10:00Z","closes":"2026-10-06T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"policy","source":"CIPFA and the codes","title":"CIPFA prudential code changes aim for greater council transparency - localgov.co.uk","url":"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2VjdzZMYVRKY2FPV3FhS0dTU01pS2ZMUWlwbWtOVU1RSzdTV2l3SXZudjlCVHlmZUFnajBNb2pCR1Znckd6MTFDTm4xUktYNldMTFVrVHJlaWNjWl9HcmFaVEI5cFFiMHhvODRST0N4UEpMeElhVDdvNlBLX3ByRDN4?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMioAFBVV95cUxPM05scjRXd3JfcU51OUMyZThEY1pxMDRZc0NaSUEyQ2VjdzZMYVRKY2FPV3FhS0dTU01pS2ZMUWlwbWtOVU1RSzdTV2l3SXZudjlCVHlmZUFnajBNb2pCR1Znckd6MTFDTm4xUktYNldMTFVrVHJlaWNjWl9HcmFaVEI5cFFiMHhvODRST0N4UEpMeElhVDdvNlBLX3ByRDN4?oc=5\" target=\"_blank\">CIPFA prudential code changes aim for greater council transparency</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">localgo","iso":"2026-07-06T07:00:00+00:00"},{"lane":"policy","source":"CIPFA
