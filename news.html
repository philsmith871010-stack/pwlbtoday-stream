mgFBVV95cUxPaFM2NEV0VlZJdFFqaHE3VFE2cV9mM3YwWkRmTURRUUM0b2J0TlhHc0puMzJ4bUhvaXhLdS1lV2xfR2VEMGF0STlRLTZpdENsVlpoT2x4aHdFeXJvSnJfSjI2cW9pcnlfeTZfSE1KYU92Mlo5eFpvODI1aXdlTlRYUkRzNENaQnhWNEtpVVZFSUxSdW9hZ1JZWGpB?oc=5\" target=\"_blank\">Stark reserves warning for Kirklees ahead of \u00a324m budget gap</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">Room151</font>","iso":"2026-09-29T11:42:51+00:00"},{"lane":"councils","source":"LG finance press","title":"S151s back in \u2018washing machine of turmoil\u2019 as LGR pause impacts planning - Room151","url":"https://news.google.com/rss/articles/CBMiqAFBVV95cUxNY0RXeE9YSjNZWGdMeWRsbUxYMUgzOEViZFJKUC1hb2l6eFlUem1yWE9qYXFQbnB3Q29uMXVIMndjOGUyZVhIRnFWX2VVTi1rNGRmQTlpU0N3OHRtdHR3R29XNWRoSk5hck5vd0t3OWh5ZENHdDdNVEs0Tkl2TGpFYmlBcnJkakFZRUdKSGswbWJMV2ViYmNXLXBQeHFlTjhlV0FDb0pqaEo?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiqAFBVV95cUxNY0RXeE9YSjNZWGdMeWRsbUxYMUgzOEViZFJKUC1hb2l6eFlUem1yWE9qYXFQbnB3Q29uMXVIMndjOGUyZVhIRnFWX2VVTi1rNGRmQTlpU0N3OHRtdHR3R29XNWRoSk5hck5vd0t3OWh5ZENHdDdNVEs0Tkl2TGpFYmlBcnJkakFZRUdKSGswbWJMV2ViYmNXLXBQeHFlTjhlV0FDb0pqaEo?oc=5\" target=\"_blank\">S151s back in \u2018washing machine of turmoil\u2019 as LGR pause impacts planning</a>&nbsp;&nbsp;<font color=","iso":"2026-09-29T10:34:08+00:00"},{"lane":"ours","source":"East Hertfordshire","title":"East Herts audit plan sets out build-back work after four years without an audit opinion","summary":"East Hertfordshire's Audit and Governance Committee on 29 September considered an external audit plan (an independent check on the council's accounts) that sets out how the council's auditor, Azets, will rebuild assurance over the accounts. The council has had a disclaimed opinion, meaning the auditor could not say whether the accounts were fairly presented, for each year from 2021/22 to 2024/25. Azets estimates the \"build-back\" work at \u00a3245,524, on top of a standard fee of \u00a3185,917 that the council says was within its \u00a3190,000 budget.\n\nThe council says the extra fee will put pressure on its day-to-day spending budget, likely split across 2026/27 and 2027/28. The work runs alongside the 2025/26 and 2026/27 audits, with a statutory deadline of 31 January 2027. The council names the capacity of both the audit team and its own finance team as the main risk to meeting it.\n\nThe 2026/27 outturn figures (actual spending against budget) show net cost of services at \u00a318,059k against a revised budget of \u00a317,619k, an overspend of \u00a3440k. Place was \u00a3338k over, at \u00a34,971k against \u00a34,633k. Regeneration, Customer & Commercial Services was budgeted to bring in \u00a32,188k net but achieved \u00a31,784k, \u00a3404k short. The minimum revenue provision, the sum set aside each year to pay off past borrowing, came in at \u00a31,588k against \u00a31,453k budgeted. In capital spending, on things that last, \u00a3237k slips to 2027/28: \u00a3170k for URC Church Hall and \u00a367k for Old Road Lane town centre regeneration.\n\nThe committee also reviewed the strategic risk register. The score for democratic transition fell from B2 to C2 after government confirmed shadow authority elections for May 2027 for the new East Hertfordshire and Broxbourne unitary authority. The climate change score fell from B4 to B3 because amended works at Amwell Depot can proceed under permitted development rights.","url":"https://democracy.eastherts.gov.uk/documents/s74022/74022.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000242","council":"East Hertfordshire","tag":"audit opinion","figures":"Base fee \u00a3185,917; building back assurance \u00a3245,524; total \u00a3444,441","quote":"Building back assurance as per the build back plan 245,524","paper":"Appendix A - 2026/27 Revenue outturn","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Teignbridge","title":"Teignbridge cuts forecast funding gaps by nearly half as audit work to regain assurance accelerates","summary":"Teignbridge District Council faces a disclaimed audit opinion, the lowest form of external audit assurance, for 2025/26 and has held this status since 2020/21. However, the council's financial position is improving. Forecast funding gaps for 2027/28 and 2028/29 have fallen from \u00a33.6 million and \u00a32.8 million to \u00a31.13 million and \u00a30.95 million, driven partly by drawing only \u00a3680,000 from reserves in 2025/26 against a budgeted \u00a31.5 million. The Ministry of Housing and Communities and Local Government upgraded Teignbridge's audit assessment ranking from D to C. Regaining assurance work, originally scheduled for 2030\u201331, is now prioritised to begin in 2027, backed by \u00a342,388 in government grant funding. Internal audits have identified control gaps: licensing income lacks regular reconciliation; the self-build register requires cleansing; and car park audit recommendations from February 2024 remain largely unimplemented, with only two of ten completed. Financial resilience has been marked as a critical audit priority.","url":"https://democracy.teignbridge.gov.uk/documents/s26101/26101.pdf","iso":"2026-09-29T09:00:00+00:00","gss":"E07000045","council":"Teignbridge","tag":"audit opinion","figures":"\u00a342,388 Section 31 grant; remediation timeline accelerated from 2030-2031 to starting 2027","quote":"The audit opinion for this year will still have to be disclaimed. The original proposed date for the regaining assurance work was 2030-2031 however Teignbridge has now been prioritised.","paper":"TDC - Audit progress report and sector update - August 2026","committee":"Audit Committee"},{"lane":"councils","source":"Distress watch","title":"High Court of Karnataka Allows Relief Against Forfeiture of Lease Under Section 114 of Transfer of Property Act, 1882 \u2014 Tenant Granted One Month to Deposit Arrears of Rent. Court holds that forfeiture of lease for non-payment of rent is not automatic and ten - Lawtext","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBzMWlJdThDMlBCRVNEMVB5R3dLY1h4OTVUN0JsWnFuZk5TT0JDUU52dGtSVHBvSUJYWFhxN2pqZmJuTTRzXzA3OE5NMFk2Q3NvTW5GUlNkeXA1cWFvbEdmVVNheVZPdw?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBzMWlJdThDMlBCRVNEMVB5R3dLY1h4OTVUN0JsWnFuZk5TT0JDUU52dGtSVHBvSUJYWFhxN2pqZmJuTTRzXzA3OE5NMFk2Q3NvTW5GUlNkeXA1cWFvbEdmVVNheVZPdw?oc=5\" target=\"_blank\">High Court of Karnataka Allows Relief Against Forfeiture of Lease Under Section 114 of Transfer of Property Act, 1882 \u2014 Tenant Granted One Month to Deposit Arrears of Rent. Court holds that","iso":"2026-09-29T06:01:12+00:00"},{"lane":"policy","source":"HM Treasury","title":"Chancellor backs young people into work by supporting jobs","url":"https://www.gov.uk/government/news/chancellor-backs-young-people-into-work-by-supporting-jobs","summary":"The Chancellor has announced a package to help people into work, education and training, while building the skilled workforce Britain needs for the future.","iso":"2026-09-28T15:56:37+00:00"},{"lane":"policy","source":"HM Treasury","title":"More overseas firms enticed to buy British","url":"https://www.gov.uk/government/news/more-overseas-firms-enticed-to-buy-british--2","summary":"Overseas buyers will be offered a new UK Export Finance loan guarantee to incentivise buying goods and services from British companies.","iso":"2026-09-28T15:43:57+00:00"},{"lane":"ours","source":"Stockton-on-Tees UA","title":"Stockton-on-Tees net borrowing rose \u00a326.89m to \u00a3138.32m in 2025-26 as capital spending ran 46% under budget","summary":"Stockton-on-Tees Council's net borrowing rose by \u00a326.89m to \u00a3138.32m during 2025-26, according to its treasury management outturn report (the actual figures for the year, set against what was budgeted) put to the Audit and Governance Committee. Total borrowing rose by \u00a318.19m to \u00a3168.97m, and the council took on \u00a340m of new loans from the Public Works Loan Board (the government's lending arm for councils) at rates of 4.31% to 4.57%. Its cash fell by \u00a38.7m.\n\nSpending on things that last, such as buildings and roads (capital spending), was \u00a351.2m against a budget of \u00a394.53m, a gap of \u00a343.35m. Borrowing for capital purposes was \u00a36.93m against an estimate of \u00a323.1m. The report attributes the variance only to \"a variance against the in-year spend profile within the capital programme\".\n\nThe council's borrowing is \u00a324.16m below its capital financing requirement of \u00a3202.27m, the total it has spent on long-lived assets and not yet paid for. The report describes this as internal borrowing, using the council's own cash instead of taking loans, to \"keep interest costs low\".\n\nAn accumulated deficit of \u00a317.1m on the dedicated schools grant, the government grant that funds schools, stood at year end. The report says borrowing to cover it cost up to \u00a3500,000 in the year, and that this cannot be charged to the grant and falls on the council's general fund.\n\nThe council holds \u00a316m of LOBO loans, where the lender may propose a higher rate and the council may repay instead, at an average 4.87%. The report says the chance of lenders using that option has increased as rates have risen. It also holds \u00a314.89m of commercial property, down from \u00a318.32m, earning \u00a30.917m a year, and says it will need to review options for exiting these.\n\nSeparately, the committee's September risk update moved the risk on children in care from Amber to Red, \"primarily due to the costs of placing children exceeding the budget provision\" in the medium-term financial plan. A full review of special educational needs processes is under way after an Ombudsman investigation. Bridge inspection delays are due for review by March 2027.","url":"https://moderngov.stockton.gov.uk/documents/s23952/23952.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E06000004","council":"Stockton-on-Tees UA","tag":"LOBO","figures":"\u00a316.0m LOBO loans; average rate 4.87%; weighted average maturity 11.4 years","quote":"On 1st April 2025 the Authority held \u00a316m of LOBO (Lender's Option Borrower's Option) loans... As market interest rates have risen, there is an increased probability of call options on the LOBOs being exercised by lenders.","paper":"Sept 2026 - Risk Management Update - Report","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Worcestershire CC","title":"Worcestershire auditors report improvement but keep a statutory recommendation on schools deficit for 2025/26","summary":"Worcestershire County Council's external auditors, Grant Thornton, say the council's arrangements show \"an overall picture of improvement\", but have kept their most serious recommendation, on the dedicated schools grant (the government grant that funds schools) deficit, open for 2025/26. The Audit and Governance Committee considered the findings on 28 September. Grant Thornton named financial sustainability as \"the most concerning issue\", adding that members are \"fully aware\" of it.\n\nThe statutory recommendation is the highest level the auditors can make. It requires discussion at Full Council and a public response, and it carries over from 2024/25. In its value for money judgement (the auditor's view of whether the council manages its money and decisions properly), the auditor reports significant weaknesses remain in financial sustainability and in economy, efficiency and effectiveness. It says the council has made progress on earlier findings but that further action is required. Four key recommendations from 2024/25 are retained, two on each area, and the statutory recommendation issued in November 2025 is in progress but not fully implemented.\n\nThe draft audit findings report also covers the \u00a333.6m of exceptional financial support (permission to borrow to cover day-to-day spending) the council received from the Ministry of Housing, Communities and Local Government for 2025/26. The auditor says this is \"a structural increase\" in the council's debt rather than a one-off adjustment. The minimum revenue provision (the amount set aside each year to pay off past borrowing) rose \u00a31.2m, or 7%, to \u00a318.4m, from \u00a317.2m. The capitalisation direction behind the support requires repayment over no more than 20 years.\n\nThe auditor also recorded \u00a32.3m of Section 106 developer contributions as an unadjusted misstatement. Of that, \u00a31.2m is accrued interest and \u00a31.0m is historic balances without enough supporting evidence, with spend deadlines expired. Management intends to release them to revenue in 2026/27.","url":"https://worcestershire.moderngov.co.uk/documents/s61974/61974.pdf","iso":"2026-09-28T09:00:00+00:00","gss":"E10000034","council":"Worcestershire CC","tag":"MRP","figures":"\u00a310m savings delivered over 2 years from 2023/24 MRP policy changes","quote":"A comprehensive review of MRP policy was completed in January 2024 by external experts, and changes were implemented in 2023/24, saving \u00a310m over 2 years.","paper":"au 2026 09 28 2025-26 Interim External Auditors Annual Report","committee":"Audit and Governance Committee"},{"lane":"ours","source":"Shropshire UA","title":"Shropshire pension fund audit heads for unmodified opinion; 42% of internal audit reports limited","summary":"Auditors expect to give Shropshire's pension fund an unmodified opinion, a full sign-off of its accounts, the Audit & Governance Committee will hear on 25 September. The external audit (an independent check on the accounts) is substantially complete. It found no misstatements above the \u00a32.25m reporting threshold, no material adjustments and no material uncertainty over the fund continuing as a going concern. Testing of 25 member records supplied to the actuary for the 2025 triennial valuation, which sets employer contribution rates for April 2026 to March 2029, found no issues.\n\nOne area is still open. Work on Level 3 investments, valued using inputs that cannot be directly observed, is classed as high risk of material adjustment. It is waiting for audited accounts from LGPS Central, due in late September. Nothing material has been found so far.\n\nThe committee also has the council's internal audit report. Of 29 final reports issued between April and August 2026, 58% gave good or reasonable assurance and 42% limited or unsatisfactory. The report says that is better than the same period of 2025/26, but cautions that it is early in the reporting cycle.\n\nThe appendix details the weaker areas. A payroll follow-up was rated Limited, with 12 fundamental and 15 significant recommendations, after Limited in 2023/24 and Unsatisfactory in 2021/22 and 2020/21. A data review found 2,068 same-day purchase orders worth \u00a3125.1m, 386 of them where combined values exceeded authorisation limits. Bishops Castle Community College's three-year plan shows its deficit rising to about \u00a31m in 2027/28. Of six schools forecasting deficits, five had not notified the council on time, and auditors found no evidence of formal escalation.\n\nThe papers place this within what the internal audit charter calls the council's \"financial emergency\", with an Improvement Plan set up in December 2025. Duncan Whitfield is interim section 151 officer, the council's chief finance officer. The risk register lists repeated low assurance opinions as a governance risk, with committee challenge where issues persist.","url":"https://shropshire.gov.uk/committee-services/documents/s46580/46580.pdf","iso":"2026-09-25T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"intervention","figures":"Progress update deadline: end September 2026; subsequent quarterly meetings","quote":"Responding to the CIPFA Review recommendations is a requirement of the EFS arrangements and will be monitored by MHCLG as part of the Best Value Notice process.","paper":"SPF Draft 9-107 LGPS Audit Findings Report 2025-26 v2","committee":"Audit & Governance Committee"},{"lane":"ours","source":"Bradford","title":"Bradford Council's 2025-26 accounts: \u00a3113m overspend, usable reserves up \u00a355m to \u00a3229.2m, clean audit opinion expected","summary":"Bradford Council ended 2025-26 with usable reserves of \u00a3229.2m, up \u00a355.0m on the year, even though its day-to-day spending ran \u00a3113m over budget, the Governance and Audit Committee heard on 24 September. The council's statement of accounts, its formal annual accounts, says the overspend was \u00a314m smaller than first forecast and was paid for through a capitalisation direction, government permission to treat day-to-day spending as capital spending so it can be funded by borrowing or asset sales. The accounts say part of the rise in reserves comes from earmarking costs funded that way. The general fund balance, the cushion for the unexpected, is \u00a353.1m, or 3.5% of about \u00a31.5bn of gross spending.\n\nThe council's external auditor, Forvis Mazars, anticipates an unqualified opinion, meaning a full sign-off, on the accounts. That is subject to remaining work, including investment property valuations, land and buildings indexation, pension liability work, capital grants and long-term borrowing balances. The council says no material changes were needed to its primary statements and that it has no audit backlog. Overall materiality, the level of error the auditor treats as significant, is \u00a331.5m.\n\nThe accounts record a \u00a323.7m net fall from revaluing buildings, park land and investment properties. Non-current assets fell \u00a313.2m overall despite \u00a379.4m of capital enhancements. The Executive's July 2026 decision not to proceed with the Square Lane project means \u00a34.9m of abortive costs will be charged to day-to-day spending, taking usable reserves from \u00a3229.2m to \u00a3224.3m.\n\nThe council's pension scheme has assets of \u00a33.1bn against liabilities of \u00a32.2bn, a surplus of \u00a3871m. An accounting restriction known as the asset ceiling means no net pension asset appears on the balance sheet.\n\nSeparately, the West Yorkshire Pension Fund's audit report anticipates an unqualified opinion. Its auditor found a \u00a360.9m understatement in hard-to-value investments, which management corrected, and left \u00a330.3m of estimated further error unadjusted. A revised transaction report raised recorded purchases and sales by \u00a3842.4m after testing found the first did not match supporting evidence.","url":"https://bradford.moderngov.co.uk/documents/s57378/57378.pdf","iso":"2026-09-24T09:00:00+00:00","gss":"E08000032","council":"Bradford","tag":"capitalisation","figures":"\u00a3113 million overspend, \u00a314 million reduction from initial forecast","quote":"The revenue outturn for 2025\u201326 reflects an overspend of \u00a3113 million, which has been funded through the Capitalisation Direction (CD). This represents a \u00a314million reduction compared to the initial forecast.","paper":"Doc N - Covering Report External Audit Completions 2025-26 for GAC 24 September 2026","committee":"Governance and Audit Committee"},{"lane":"ours","source":"Peterborough UA","title":"Peterborough's auditor EY does not expect a clean opinion on the council's accounts before 2028/29","summary":"Peterborough City Council's auditor, EY, does not expect to give an unqualified opinion on the council's accounts before the 2028/29 audit, a year later than the national recovery programme's target of the end of 2027/28. The Audit Committee's papers for 23 September say EY expects the 2025/26 opinion to remain disclaimed, meaning the auditor has not given an opinion on the accounts.\n\nThe 2024/25 statement of accounts, the council's formal annual accounts, also carried a series of audit disclaimers. The council's own Annual Governance Statement, which is the council speaking about itself, says these showed weaknesses in financial reporting, supporting evidence and assurance arrangements. EY's risk assessment rates two balance sheet items, the Revaluation Reserve and the Capital Adjustment Account, as presenting significant risk because of concerns about historical fixed asset records and the effect of earlier disclaimer periods.\n\nThe council says recruitment to its corporate finance team is complete and external advisers are supporting specialist areas: capital, treasury, valuations and the collection fund. EY's action plan is being delivered over several years, with assurance gains tracked.\n\nThe governance statement's action plan also covers a statutory report issued in January 2026 on the sale of the John Mansfield Centre. Cabinet has retrospectively approved four historic commercial lease decisions above the \u00a3250,000 aggregate rental threshold, and an internal Property Board now reviews property decisions beforehand. An external review of procurement made 49 recommendations, which are being progressed. Temporary accommodation procurement has concluded, with 11 suppliers awarded contracts, and Cabinet agreed longer-term arrangements on 23 March 2026. A Transactions Governance Framework is being developed, with early Audit Committee involvement in material decisions.\n\nTreasury papers show the council's adviser raising near-term borrowing rate forecasts: the Public Works Loan Board, the government's lending arm for councils, was charging 5.33% for five years and 6.43% for 25 years on 3 August. The 2026/27 investment earnings forecast fell from 3.90% to 3.80%.","url":"https://peterborough.moderngov.co.uk/documents/s60635/60635.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E06000031","council":"Peterborough UA","tag":"s114","figures":"\u00a3250,000 aggregate rental threshold; four historic decisions retrospectively approved; 49 procurement recommendations","quote":"Given the recent s5/s114 report, in relation to the disposal of the John Mansfield Centre, the oversight of decision notices relating to property transactions required improvement.","paper":"Appendix 1 - Treasury Management","committee":"Audit Committee"},{"lane":"ours","source":"Croydon","title":"Croydon's forecast 2026-27 overspend falls \u00a30.8m to \u00a32.3m at period 3","summary":"Croydon Council is forecasting a \u00a32.3m overspend on its General Fund (the day-to-day budget for most services) for 2026-27, down from \u00a33.1m a period earlier. The period 3 report to the Executive Mayor and Cabinet on 23 September says this shows action to control spending \"is already having an impact\". The \u00a3485.4m budget still relied on \u00a3119m of capitalisation directions, which is government permission to treat day-to-day spending as capital spending so it can be paid for by borrowing. The report puts the future cost at about \u00a385,000 a year for every \u00a31m.\n\nInterest payable is forecast at \u00a350.7m against a \u00a355.9m budget. The council has delivered a forecast \u00a326.5m of its \u00a334.7m savings target, 76.4%, leaving \u00a38.2m not on track. Children's social care is forecast to overspend by \u00a33.4m. Placements account for \u00a31.7m of that on a \u00a349.7m budget, and the dearest single placement in June cost \u00a314,004 a week. Holding vacancies produced a \u00a30.9m staffing underspend. In the housing revenue account (the ring-fenced account for council homes, paid for by rents), a \u00a33.9m overspend is attributed to repairs and safety works, which are \u00a32.8m over, and to disrepair claims.\n\nThe report forecasts a \u00a345m overspend on high needs, the school funding for children with special educational needs, in 2026-27. The deficit on the dedicated schools grant stood at \u00a367.5m on 31 March 2026. The council says it could reach \u00a396m when the statutory override, the government rule keeping such deficits off councils' main balance sheets, ends in March 2028.\n\nA separate paper sets out four options for cutting working-age Council Tax Support, which would save between \u00a33.6m and \u00a311.9m a year, including the Greater London Authority's share. The scheme costs about \u00a339m a year, with the council bearing about \u00a320m. The paper says collection could fall from 98.0% to 97.5%.","url":"https://croydon.moderngov.co.uk/documents/s73036/73036.pdf","iso":"2026-09-23T09:00:00+00:00","gss":"E09000008","council":"Croydon","tag":"capitalisation","figures":"\u00a32.3m overspend forecast; \u00a30.8m improvement from period 2 (prior position \u00a33.1m); \u00a3119m capitalisation directions required; \u00a385k future annual cost per \u00a31m capitalised","quote":"The General Fund is currently forecasting a \u00a32.3m overspend, an improvement of \u00a30.8m since Period 2, showing that action to control expenditure is already having an impact.","paper":"2026-27 Period 3 Financial Performance Report","committee":"Cabinet"},{"lane":"ours","source":"Slough UA","title":"Slough Cabinet told day-to-day spending forecast is \u00a319.9m over budget, \u00a315.955m of it in children's social care","summary":"Slough's Cabinet has been told the council expects to overspend its day-to-day general fund budget by \u00a319.9m in 2026-27, with \u00a315.955m of that in children's social care run by Slough Children First, according to the first-quarter budget monitoring report (the in-year check of spending against budget).\n\nThe children's figure is \u00a311.455m based on placement numbers at the end of June, plus \u00a34.5m for continued growth in demand. The report records 26% growth in placement numbers and 40% growth in average unit costs, partly because about 15 children are in placements costing more than \u00a30.5m a year each. The council is rebasing its demand projections and looking for ways to cut costs. Rising borrowing rates add \u00a30.550m, as the council assumed five-year gilt (government bond) yields would rise from 4.3% in February to 5.5% in May.\n\nThe general fund reserve, the cushion for the unexpected, is forecast at \u00a322.313m after an \u00a311m contribution, but the report says that is before the overspend and the fund would be drawn on if in-year measures fall short. The government-appointed commissioners called the position \"extremely serious\" and asked for structured and swift intervention. Full mitigation proposals are due at the second quarter.\n\nThe deficit on the dedicated schools grant (the government grant that funds schools) is forecast at \u00a324.903m by March 2027, after a \u00a320.8m overspend offset by a \u00a313.0m high needs stability grant. If that grant is not renewed, the report puts it at \u00a354.8m by March 2028.\n\nThe council has received \u00a33m of its \u00a327.7m asset sale target and has exchanged contracts on \u00a38m more. Capital spending (money spent on things that last) stood at \u00a32.931m, 9% of a \u00a333.454m forecast, with slippage on the A4 cycle lane and Destination Farnham Road. Council tax collection is 35.95%, 0.15% behind target; the 93.5% full-year target is expected to be met.\n\nSeparately, Cabinet is asked to approve buying 24 homes at Moor Furlong and Eltham Avenue for \u00a34.875m, funded by \u00a32.263m of grant and \u00a32.612m of housing revenue account receipts, with no extra borrowing.","url":"https://slough.moderngov.co.uk/documents/s89326/89326.pdf","iso":"2026-09-21T09:00:00+00:00","gss":"E06000039","council":"Slough UA","tag":"intervention","figures":"\u00a319.9m overspend requiring mitigation, governance intervention in place","quote":"This is an extremely serious financial position for the Council and managing an in-year forecasted overspends of this scale, requires structured and swift intervention, if a sustainable position is to be restored before the financial year closes.","paper":"Housing Benefit War Pension Disregard Policy Report","committee":"Cabinet"},{"lane":"policy","source":"Consultation","title":"Land use statistics in England: methodology changes","summary":"We are seeking views on a new methodology for the collection of MHCLG's land use statistics for England. ","url":"https://www.gov.uk/government/consultations/land-use-statistics-in-england-methodology-changes","iso":"2026-09-16T09:09:44Z","closes":"2026-10-28T23:59:00.000+00:00","org":"ministry-of-housing-communities-local-government"},{"lane":"ours","source":"Thurrock UA","title":"Council issued Section 114 notice in December 2022 with \u00a3452 million deficit and remains dependent on \u00a3691 million in exceptional government support over seven years","summary":"The council could not set a balanced budget and received exceptional financial support of \u00a3130m (2022-23), \u00a3184m (2023-24), \u00a396m (2024-25) and \u00a372m (2025-26). Over seven years to 2028/29, total capitalisation directions are estimated at \u00a3691 million. The Section 114 notice expired March 2024 but the council remains under close government monitoring.","url":"https://thurrock.moderngov.co.uk/documents/s54330/54330.pdf","iso":"2026-09-14T09:00:00+00:00","gss":"E06000034","council":"Thurrock UA","tag":"s114","figures":"\u00a3452 million deficit for 2023/24; capitalisation directions: \u00a3130m, \u00a3184m, \u00a396m, \u00a372m; total seven-year requirement \u00a3691 million","quote":"The Council issued a Section 114 Notice in December 2022 after concluding it could not set a balanced budget for 2022/23 and 2023/24... the Council's provisional deficit of approximately \u00a3452 million against a \u00a3153 million budget for 2023/24.","paper":"Appendix 1 - EY Audit Committe Update Report","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"Leasehold enfranchisement valuation rates","summary":"This consultation seeks views on prescribing the valuation rates used in leasehold enfranchisement claims under the Leasehold and Freehold Reform Act 2024.","url":"https://www.gov.uk/government/consultations/leasehold-enfranchisement-valuation-rates","iso":"2026-09-07T14:01:31Z","closes":"2026-10-21T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"CIPFA","title":"Consultation on the 2027/28 Code of Practice on Local Authority Accounting in the UK - CIPFA","url":"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMi1gFBVV95cUxQcUJRY29fOWJjNDJNcE8yS1ZYS2FZZ3VTb2pXRm5IS2hLZUJoOHJJdXVDLVNDYXY1MDBLNkRiSHVzZDA5YzJRRXBTQXdDaGt5SVlpV1RNbmhYSVhWV3BEajY2a2NhNXRUeUtUY3o2Z3dRdEFIWXNnWGk1b1ZqelpJV3NfSE5fX1lrTWRDWTg5SHNEOE1tMldJd19wZjctTTV4RFJWQ1dIVjliOXRfbS04R2Q1SzhfamlEalEzOVJDa19HWnJsRm9vUkVWZFpHOUtDVFZ0QzNB?oc=5\" target=\"_blank\">Consultation on the 2027/28 Code of Pra","iso":"2026-09-01T07:00:00+00:00"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Best Value Duty: consultation on revised statutory guidance","summary":"We are seeking views on revised statutory guidance for local and strategic authorities in England to comply with the Best Value Duty.","url":"https://www.gov.uk/government/consultations/best-value-duty-consultation-on-revised-statutory-guidance","iso":"2026-07-15T14:06:00Z","closes":"2026-10-07T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consulta function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
