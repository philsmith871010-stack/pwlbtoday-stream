<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWLBintel — the newsroom</title>
<meta name="description" content="UK local government finance: what the papers said, what government is consulting on, and the sector's news.">
<style>
:root{
  --paper:#f7f8fa; --card:#ffffff; --sunken:#f1f3f5; --ink:#1c2a38; --ink2:#3d4d5e;
  --muted:#6c757d; --faint:#98a2ac; --line:#e9ecef; --line2:#dbe0e5;
  --accent:#0a2540; --accent-soft:#eaf0f6;
  --orange:#fd7e14; --alert:#c0392b; --good:#1f9d57; --warn:#b26a12;
  --chip:#eef1f4;
  --r:10px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(20,35,55,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
a{color:inherit}

header{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:20px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
h1{font-size:27px;margin:0;letter-spacing:-.02em;color:var(--accent);font-weight:700}
h1 span{font-weight:400;color:var(--ink2)}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:62ch}
.freshness{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.5}
.freshness b{font-family:var(--mono);color:var(--ink2)}
.backlink{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:5px 11px;background:var(--card)}
.backlink:hover{background:var(--accent-soft)}

/* Lane filter */
.lanes{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.lane{background:var(--card);border:1px solid var(--line2);border-radius:20px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.lane:hover{border-color:var(--accent)}
.lane.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lane b{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* The consultations strip: the only lane about the future, so it leads and
   is never hidden by the filter. */
.consults{background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.consults h2{font-family:var(--serif);font-size:19px;margin:0 0 3px}
.consults .note{font-size:12px;color:var(--muted);margin:0 0 13px}
.ctable{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.crow{display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:14px;
  background:var(--card);padding:9px 12px;align-items:baseline;font-size:13px}
.crow:hover{background:var(--sunken)}
/* Date over department, stacked. Inline they collided with the title at
   any width where the department name was longer than "MHCLG". */
.crow .cd{font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px}
.crow .ct{color:var(--ink);text-decoration:none;min-width:0;
  overflow-wrap:anywhere}
.crow .ct:hover{text-decoration:underline}
.crow .cw{font-size:11px;font-family:var(--mono);white-space:nowrap;padding:2px 7px;border-radius:10px}
.cw.soon{background:rgba(192,57,43,.09);color:var(--alert);font-weight:600}
.cw.ok{background:var(--chip);color:var(--muted)}
.corg{font-size:9.5px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;font-family:inherit}

/* The feed */
.feed{display:flex;flex-direction:column;gap:11px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;box-shadow:var(--sh-sm)}
.item.ours{border-left:3px solid var(--accent)}
.item.national{border-left:3px solid var(--good)}
.item.national .src{color:var(--good)}
.item.national .origin{background:rgba(31,157,87,.1);color:var(--good)}
.bullets{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.bullets div{font-size:12.5px;line-height:1.5;color:var(--ink2);
  padding-left:14px;position:relative}
.bullets div::before{content:"";position:absolute;left:3px;top:8px;
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.foot{margin-top:9px;font-size:12.5px}
.foot summary{cursor:pointer;color:var(--muted);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.foot div{margin-top:6px;padding-left:11px;border-left:2px solid var(--line2);
  color:var(--ink2);line-height:1.5}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.item.ours .src{color:var(--accent)}
.origin{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--chip);
  color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.item.ours .origin{background:var(--accent-soft);color:var(--accent)}
.rel{font-size:11px;color:var(--faint);max-width:46ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.item h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;letter-spacing:-.005em}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:80ch}
.figs{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);
  background:var(--sunken);border-radius:var(--r-sm);padding:6px 9px;display:inline-block;max-width:100%}
.quote{margin:8px 0 0;padding-left:11px;border-left:2px solid var(--line2);
  font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink2)}
.paper{margin-top:8px;font-size:11.5px;color:var(--faint)}
.paper a{color:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--card);
  border:1px dashed var(--line2);border-radius:var(--r)}
footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.6}
@media(max-width:640px){
  .crow{grid-template-columns:1fr;gap:3px}
  .freshness{text-align:left}
}
</style>

const DATA = {"generated":"2026-09-09T07:59:03.567271+00:00","hours":96,"lanes":{"ours":"From the papers","national":"National statistics","councils":"Local government","policy":"Policy and consultations","markets":"Markets"},"counts":{"ours":23,"national":5,"councils":15,"policy":44,"markets":32},"errors":{},"consultation_totals":{"ministry-of-housing-communities-local-government":6,"hm-treasury":4,"office-for-local-government":0,"department-for-levelling-up-housing-and-communities":0},"guidance_notes":{"CIPFA and CIPFA/LASAAC":"nothing open"},"items":[{"lane":"ours","source":"Bedford UA","title":"Council received \u00a358 million Exceptional Financial Support from MHCLG for 2026/27 to balance budget","summary":"Dependency on exceptional government support in consecutive years, combined with Limited Assurance audit opinions on financial controls and efficiency plans, indicates structural financial problems and elevated refinancing risk.","url":"https://councillorsupport.bedford.gov.uk/documents/s81782/81782.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000055","council":"Bedford UA","tag":"EFS","figures":"\u00a322 million EFS 2025/26; \u00a358 million EFS 2026/27","quote":"The Council received Exceptional Financial Support from MHCLG of \u00a322 million for 2025/26 and \u00a358 million to enable a balanced budget to be set for 2026/27.","paper":"Item 10 - Internal Audit Plan Update - covering report","committee":"Audit Committee"},{"lane":"ours","source":"Shropshire UA","title":"Exceptional Financial Support requirement reduced from \u00a3121m to \u00a390m, but the council remains dependent on government bailout funding.","summary":"EFS is exceptional support, not recurring funding, and carries fixed debt costs over a multi-year period. Dependence on it signals structural unbalance. MHCLG's stipulation of regular reviews and progressive reductions creates execution risk if improvement plans miss targets.","url":"https://shropshire.gov.uk/committee-services/documents/s45417/45417.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"EFS","figures":"\u00a3121m original EFS; reduced to \u00a390m in Quarter 1 forecast (revised from \u00a3120.718m in income table); Non-Statutory Best Value Notice issued; MHCLG reviews to begin September 2026","quote":"reduced call for EFS in 2026/27 to \u00a390m from the \u00a3121m set out in the MTFP report to Council in February 2026... MHCLG will be seeking evidence of improvement against their report recommendations and of progressive reductions in the Council's requirements for EFS.","paper":"UPDATED REPORT - Financial Monitoring Report Quarter 1 2026.27-02072026 1235 v8","committee":"Cabinet"},{"lane":"ours","source":"Shropshire UA","title":"Council requires \u00a3121m Exceptional Financial Support in 2026/27 to support revenue budget","summary":"EFS indicates the council cannot fund its revenue budget without government financial support, a significant credit weakness for lenders evaluating municipal creditworthiness.","url":"https://shropshire.gov.uk/committee-services/documents/s45332/45332.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000051","council":"Shropshire UA","tag":"EFS","figures":"\u00a3121m approved in principle for 2026/27","quote":"During 2026/27, the Council will have a need to borrow, specifically in relation to the Exceptional Financial Support of \u00a3121m approved in principle for 2026/27 to support the revenue budget","paper":"Treasury Management Update Quarter 1 2026.27-02072026 1245","committee":"Cabinet"},{"lane":"ours","source":"York UA","title":"DSG deficit growing to \u00a33.27m in Q1 despite 6% funding increase, driven by 22% growth in Education, Health and Care Plans","summary":"DSG deficits are ringfenced and must eventually be recovered from the general fund. This accumulating deficit is an unfunded liability that will force future general fund cuts. Growth in EHCP numbers at 22% per year is not sustainable within current funding.","url":"https://democracy.york.gov.uk/documents/s195242/195242.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000014","council":"York UA","tag":"DSG / SEND","figures":"DSG cumulative deficit \u00a3664k; Q1 in-year deficit forecast \u00a33.27m; High Needs Block overspend \u00a35.024m; EHCP growth 1,521 to 1,986 (22%); DSG funding increase 6%; Safety Valve funding lost \u00a32m","quote":"The pressure reflects continuing growth in EHCP numbers and increasing complexity of children's needs. EHCPs have increased from 1,521 in 2024/25 to 1,986 in 2026/27... Although the Authority's DSG allocation has increased by approximately 6% in 2026/27 to \u00a3101.7m, this falls significantly short of the growth in demand, with EHCP numbers increasing by approximately 22% over the same period.","paper":"Item 6 - Quarter 1 2026-27 Finance and Performance Monitor","committee":"Executive"},{"lane":"ours","source":"Salford","title":"SEND reform programme depends on annually-confirmed government grant","summary":"Year-to-year government grant confirmation creates budget uncertainty; loss of grant would create sudden cost pressure from permanent staffing added during the grant period.","url":"https://salford.moderngov.co.uk/documents/s96995/96995.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"DSG / SEND","figures":"\u00a32.094m in 2026/27","quote":"Indicative national funding profiles show continued investment beyond 2026/27, with future allocations confirmed annually by the Department for Education.","paper":"SEND Reform Plan Scrutiny report Sept 26 28.8.26","committee":"Children's Scrutiny Panel"},{"lane":"ours","source":"Enfield","title":"Dedicated Schools Grant cumulative deficit of \u00a336.1m with in-year overspend of \u00a315.3m, costing General Fund \u00a31m annually in interest, government support uncertain","summary":"The DSG deficit is a material contingent liability. Government support is subject to conditions and approval of a local SEND reform plan. If support does not materialise, the council faces absorbing a large deficit from general resources when the override expires.","url":"https://enfield.moderngov.co.uk/documents/s115108/115108.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E09000010","council":"Enfield","tag":"DSG / SEND","figures":"\u00a336.1m cumulative deficit, \u00a315.3m 2026/27 overspend, \u00a31m annual interest cost, Statutory Override expires 31 March 2028","quote":"The cumulative DSG position forecast at the end of 2026/27 is \u00a336.1m...Council's need to plan to meet the costs of the residual deficit from their own resources in 2028/29, once the statutory override ends on 31 March 2028.","paper":"2026-27 Q1 Revenue Capital Monitoring Report Cabinet 01.09.2026","committee":"Cabinet"},{"lane":"ours","source":"Hampshire CC","title":"A qualified audit opinion is expected, with an unqualified opinion not anticipated until 2029/30.","summary":"A qualified audit opinion signals material uncertainties in the financial statements, which affects the reliability of financial information used by lenders to assess creditworthiness and financial risk.","url":"https://democracy.hants.gov.uk/documents/s150570/150570.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E10000014","council":"Hampshire CC","tag":"audit opinion","figures":"2029/30 for anticipated unqualified opinion; 2027/28 for full PPE assurance","quote":"Given the Authority's current PPE revaluation cycle, assurance over PPE valuations cannot be fully rebuilt until 2027/28. At this stage therefore it is anticipated that an unqualified opinion will be possible by 2029/30.","paper":"Item 17 - EY Draft Audit Results - Appendix A","committee":"HIWFRA Audit and Governance Committee"},{"lane":"ours","source":"Hampshire CC","title":"Disclaimer opinion in 2023/24 followed by qualified opinion in 2024/25; unqualified opinion not expected before 2027/28","summary":"Lenders and finance directors need to understand the authority will operate under qualified audit opinions for at least three more years, indicating unresolved financial reporting control issues.","url":"https://democracy.hants.gov.uk/documents/s150485/150485.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E10000014","council":"Hampshire CC","tag":"audit opinion","figures":"Disclaimer 2023/24, qualified 2024/25, expected unqualified opinion not before 2027/28","quote":"A qualified audit opinion was issued for 2024/25 which drew attention to remaining areas where full assurance had not been obtained, as a result of the prior year disclaimers. In 2023/24 a disclaimer of opinion was issued due to the application of the backstop.","paper":"2026-09-09 - 2026-27 EY Audit Planning Report - Appendix B","committee":"HIWFRA Audit and Governance Committee"},{"lane":"ours","source":"Oldham","title":"LOBO loan reset at 6.70% forced council to repay from cash reserves in April","summary":"Shows lenders are testing market conditions and willing to force borrowers into rate resets; council's repayment from cash preserves position but reduces liquidity buffer.","url":"https://committees.oldham.gov.uk/documents/s161182/161182.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E08000004","council":"Oldham","tag":"LOBO","figures":"\u00a34.0m LOBO called at proposed rate of 6.70%, versus council weighted average borrowing cost of 4.38%","quote":"One LOBO loan of \u00a34.000m was called in the period. The revised interest rate offered was 6.70% and the Council exercised its option to repay the loan in full, utilising available cash balances.","paper":"Treasury Management Quarter 1 - Audit Committee","committee":"Audit Committee"},{"lane":"ours","source":"Somerset Council","title":"Somerset's budget depends on delivering \u00a3135m savings from a \u00a345m transformation investment, with section 114 risk if it fails","summary":"A council's solvency depending on discretionary transformation savings rather than statutory process changes represents higher execution risk for lenders, particularly if delivery is delayed.","url":"https://somerset.moderngov.co.uk/documents/s69209/69209.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E06000066","council":"Somerset Council","tag":"s114 risk","figures":"\u00a345m transformation fund, \u00a3135m anticipated savings (3:1 ratio)","quote":"Financial savings reduced or not realised which may contribute towards a section 114.","paper":"Appendix J - Inspiring Innovation Programme Risks","committee":"Scrutiny Committee - Corporate and Strategic"},{"lane":"ours","source":"Burnley","title":"Council maintains under-borrowed position with \u00a325.4m headroom: CFR \u00a388.1m against debt of \u00a362.7m","summary":"Confirms council has prudent borrowing capacity available for capital needs without breaching prudential limits; indicates conservative treasury management approach with financial headroom for contingencies","url":"https://burnley.moderngov.co.uk/documents/s51766/51766.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E07000117","council":"Burnley","tag":"borrowing","figures":"Capital Financing Requirement \u00a388.114m; Total borrowing \u00a362.670m; Approximate headroom \u00a325.4m (approximately 29% of CFR)","quote":"The Council maintains an under-borrowed position","paper":"Treasury Mgt Q1 Report 2026-27 Final","committee":"Scrutiny Committee"},{"lane":"ours","source":"Winchester","title":"Council internally borrowing \u00a368.3m and explicitly warns future external borrowing will be required","summary":"Internal borrowing masks the true borrowing need and relies on maintaining high cash reserves; when reserves deplete, the council will need to access capital markets at rates and times not of its choosing.","url":"https://democracy.winchester.gov.uk/documents/s35874/35874.pdf","iso":"2026-09-09T09:00:00+00:00","gss":"E07000094","council":"Winchester","tag":"borrowing","figures":"Internal borrowing \u00a368.333m; external borrowing \u00a30 (General Fund); capital financing requirement \u00a368.333m","quote":"While the council has sufficient cash and investment balances, it is able to internally borrow but as CFR increases, and cash and investment balances decrease, it will need to increase its external borrowing in addition to the \u00a3159.3m the council has already borrowed","paper":"CAB3567 General Fund Outturn 2025-26","committee":"Cabinet"},{"lane":"markets","source":"City AM","title":"Gym Group upgrades outlook as Gen-Z shuns heatwave and World Cup","url":"https://www.cityam.com/gym-group-upgrades-outlook-as-gen-z-shuns-heatwave-and-world-cup/","summary":"Gym Group has upgraded its outlook after managing to tempt Gen-Zers into its gyms throughout the summer, despite the distractions of the World Cup and multiple heatwaves.\u00a0 Will Orr, chief executive of the no-frills gym provider, said the group is still on course to deliver three per cent sales growth despite a \u201cnoisy macro, some [...]","iso":"2026-09-09T07:56:21+00:00"},{"lane":"markets","source":"City AM","title":"Oil hits $100 a barrel as Iran war escalates","url":"https://www.cityam.com/oil-prices-hit-100-as-interest-rate-pressure-grows/","summary":"Oil prices hit $100 per barrel for the first time since July on Wednesday morning as new strikes in the Middle East sparked fresh concerns for global oil supplies.\u00a0 Brent crude \u2013 the international benchmark for oil prices \u2013 jumped more than two per cent, hitting $100 per barrel after making consistent gains from the [...]","iso":"2026-09-09T07:44:46+00:00"},{"lane":"markets","source":"Guardian business","title":"Air traffic control boss rules out cyber-attack and apologises to passengers as UK flight chaos enters second day \u2013 business live","url":"https://www.theguardian.com/business/live/2026/sep/09/nats-boss-to-meet-uk-transport-secretary-as-second-day-of-flight-chaos-takes-cancelllations-past-1300-business-live","summary":"<p>Technical issue at air traffic control provider Nats leads to over 1,300 flight u201d legal advice. Decisions on Essex, Hampshire,\u00a0Norfolk\u00a0and Suffolk have been withdrawn and the other 14 areas\u2026\nThe post Ministers to review LGR decisions appeared first on Loc","iso":"2026-09-07T12:31:34+00:00"},{"lane":"policy","source":"HM Treasury","title":"First ever Entrepreneurship Advisor appointed to the Treasury","url":"https://www.gov.uk/government/news/first-ever-entrepreneurship-advisor-appointed-to-the-treasury","summary":"Alex Depledge MBE appointed by the Chancellor as first ever Entrepreneurship Advisor appointed to Treasury to address barriers for high growth businesses.","iso":"2026-09-07T11:42:27+00:00"},{"lane":"policy","source":"HM Treasury","title":"Chancellor John Healey's Growth Speech 2026","url":"https://www.gov.uk/government/speeches/chancellor-john-healeys-growth-speech-2026","summary":"Chancellor John Healey delivered his Growth Speech on 7 September 2026.","iso":"2026-09-07T11:03:00+00:00"},{"lane":"policy","source":"MHCLG","title":"Accredited official statistics: Affordable Housing Supply in England: 2026 to 2027","url":"https://www.gov.uk/government/statistics/announcements/affordable-housing-supply-in-england-2026-to-2027","summary":"Statistics on gross additional affordable housing supply in England between April 2026 and March 2027. Relevant sections of the Local Authority Housing Statistics (LAHS) will be published alongside this release.","iso":"2026-09-07T10:15:40+00:00"},{"lane":"policy","source":"HM Treasury","title":"Correspondence: The Simplification and Agency of Government - Letter to all ministers","url":"https://www.gov.uk/government/publications/the-simplification-and-agency-of-government-letter-to-all-ministers","summary":"A joint letter from the Chancellor of the Exchequer, the First Secretary of State, and the Attorney General to all ministers.","iso":"2026-09-07T09:30:00+00:00"},{"lane":"ours","source":"Brent","title":"Two LOBO loans refinanced at 6.4% and 6.2% following lender options, up from original rates of 4.1% and 5.2%","summary":"Unexpected forced refinancing at elevated rates increases debt servicing costs and reduces budget flexibility at a time when the council is already taking on substantial new borrowing.","url":"https://democracy.brent.gov.uk/documents/s159555/159555.pdf","iso":"2026-09-07T09:00:00+00:00","gss":"E09000005","council":"Brent","tag":"LOBO","figures":"\u00a310m repaid at 6.41%, \u00a310m repaid at 6.24%; original rates 4.1% and 5.2%; \u00a39.5m LOBO due for review 2026/27","quote":"The Council repaid two LOBO loans in 2025/26 after the lender exercised their option. As a result, the Council's borrowing requirement increased, with the additional financing being met through borrowing from the Public Works Loan Board (PWLB) during the year within our overall borrowing need.","paper":"13. Treasury Management Outturn 2025-26","committee":"Cabinet"},{"lane":"policy","source":"CIPFA","title":"Sponsorship - CIPFA","url":"https://news.google.com/rss/articles/CBMiWEFVX3lxTFBfcHJWRjhia3VKWDY5SDBVREstY2VVbFBsYzVINVlNR3hlUlJEQjlvLWF6UkFqN1hwSzc2SFhpbFVXb1RLaFktVU53a0NaM19IQ2drM3V6Umk?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiWEFVX3lxTFBfcHJWRjhia3VKWDY5SDBVREstY2VVbFBsYzVINVlNR3hlUlJEQjlvLWF6UkFqN1hwSzc2SFhpbFVXb1RLaFktVU53a0NaM19IQ2drM3V6Umk?oc=5\" target=\"_blank\">Sponsorship</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font>","iso":"2026-09-05T10:18:02+00:00"},{"lane":"policy","source":"CIPFA","title":"Counter fraud training - CIPFA","url":"https://news.google.com/rss/articles/CBMiV0FVX3lxTE9PaDFJMjljSG04SEo1dXB4eDVDTW84YzJ6b1NyUHVfay1PYTVBTVhFZFdSVGZvSFE4WVFjS3BTTmY1THpvV296YklnZU5kSVpYTlhZdnJROA?oc=5","summary":"<a href=\"https://news.google.com/rss/articles/CBMiV0FVX3lxTE9PaDFJMjljSG04SEo1dXB4eDVDTW84YzJ6b1NyUHVfay1PYTVBTVhFZFdSVGZvSFE4WVFjS3BTTmY1THpvV296YklnZU5kSVpYTlhZdnJROA?oc=5\" target=\"_blank\">Counter fraud training</a>&nbsp;&nbsp;<font color=\"#6f6f6f\">CIPFA</font>","iso":"2026-09-05T10:17:32+00:00"},{"lane":"ours","source":"Cheshire East UA","title":"Council operating under Non-Statutory Best Value Notice with need to improve financial sustainability","summary":"A council under regulatory financial scrutiny is viewed as higher risk by lenders and demonstrates existing financial management concerns.","url":"https://moderngov.cheshireeast.gov.uk/documents/s135552/135552.pdf","iso":"2026-09-03T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"intervention","figures":"Best Value Notice issued 15 July 2026","quote":"given the revised Non-Statutory Best Value Notice issued on 15 July 2026 and the continuing need to improve financial sustainability","paper":"Cheshire East Growth, Investment and Regeneration Programme - Procurement of intelligent client and technical support and a strategic approach for Crewe.Cabinet and Committee Report Template","committee":"Cabinet"},{"lane":"ours","source":"Cheshire East UA","title":"Council received a Best Value Notice requiring continued urgent progress on financial sustainability","summary":"A Best Value Notice signals regulatory concern and puts the council on notice. If progress is not demonstrated, the council risks escalation to statutory intervention or external management of finances.","url":"https://moderngov.cheshireeast.gov.uk/documents/s135871/135871.pdf","iso":"2026-09-03T09:00:00+00:00","gss":"E06000049","council":"Cheshire East UA","tag":"intervention","figures":"Notice issued July 2026","quote":"The revised Non-Statutory Best Value Notice issued in July 2026 recognises early improvement but requires continued urgent progress on financial sustainability.","paper":"20260825110212_005784_0013327_StrategicRiskReport","committee":"Cabinet"},{"lane":"ours","source":"Swansea","title":"Welsh Government has no protocol for supporting councils that issue section 114 (cannot balance budget) reports","summary":"A lender assessing financial sustainability risk needs to understand that if a Welsh council does get into severe financial difficulty (unable to balance budget), there is no published framework for intervention or support. This affects the lender's understanding of worst-case escalation.","url":"https://swansea.moderngov.co.uk/documents/s129728/129728.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"W06000011","council":"Swansea","tag":"s114","figures":"No section 114 reports made in Wales to date; draft protocol in development but not finalised","quote":"Not being clear on what would happen after a section 114 report is made can have a negative impact on financial decision-making. For example, during our interviews we heard there is a misconception amongst some members and officers that issuing a section 114 report will lead to the Welsh Government providing more funding.","paper":"07 (1 of 1) - Funding_councils_How_the_Welsh_Government_funds_councils","committee":"Governance & Audit Committee"},{"lane":"ours","source":"Salford","title":"Council repaid one \u00a325m LOBO loan from cash but declined \u00a3143m of lenders' subsequent refinancing offers","summary":"LOBO loans carry refinancing risk if lenders exercise options to propose new rates; the council's selective approach to early repayment (paying cash on one loan, retaining others) reveals both liquidity position and debt management strategy, signalling whether refinancing at proposed rates remains affordable.","url":"https://salford.moderngov.co.uk/documents/s96840/96840.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E08000006","council":"Salford","tag":"LOBO","figures":"\u00a325m repaid November 2024; \u00a3143m of refinancing offers (\u00a328m + \u00a320m + \u00a326m + \u00a328m + \u00a316m) declined between July 2025 and March 2026","quote":"There was one lender exercising an option and there were early prepayment offers on the following of the Authority's loans","paper":"Treasury Management Annual Report for 2025-26 v4 - Legal","committee":"Overview and Scrutiny Board"},{"lane":"ours","source":"Cumberland Council","title":"General Fund reserves falling below the minimum adequacy threshold after unplanned Q1 draw","summary":"A council operating below its minimum reserve threshold has reduced financial resilience and signals stress early in the financial year, with nine months remaining.","url":"https://cumberland.moderngov.co.uk/documents/s57346/57346.pdf","iso":"2026-09-02T09:00:00+00:00","gss":"E06000063","council":"Cumberland Council","tag":"reserves","figures":"General Fund reserves to \u00a324.965m, minimum adequacy level \u00a325.000m, unplanned contribution \u00a33.719m","quote":"The draft outturn position requires an unplanned contribution from General Fund balances of \u00a33.719m. This takes General Fund reserves to \u00a324.965m (subject to audit), which is below the Councils minimum adequacy level of \u00a325.000m.","paper":"2026/27 Budget Monitoring at Quarter 1 (April to June 2026)","committee":"Business and Resources Overview and Scrutiny Committee"},{"lane":"policy","source":"Consultation","title":"Standard planning agreements for medium-sized sites","summary":"We are seeking views on 4 standardised planning agreements for sites between 10 to 49 homes and up to 2.5 hectares in area.","url":"https://www.gov.uk/government/consultations/standard-planning-agreements-for-medium-sized-sites","iso":"2026-08-25T10:20:41Z","closes":"2026-10-20T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"policy","source":"Consultation","title":"Planning powers for mayors in England","summary":"We are seeking views on how planning powers for mayors of strategic authorities in the English Devolution and Community Empowerment Act 2026 should be implemented. ","url":"https://www.gov.uk/government/consultations/planning-powers-for-mayors-in-england","iso":"2026-08-24T08:34:35Z","closes":"2026-10-05T23:59:00.000+01:00","org":"ministry-of-housing-communities-local-government"},{"lane":"national","source":"MHCLG statistics","title":"First multi-year CSV format release covering 2017-18 to 2024-25; totals are estimates where submissions are incomplete","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-revenue-outturn-multi-year-data-set","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: Revenue outturn multi-year data set","changed":"- First release of Revenue Outturn data in machine-readable multi-year CSV format (follows 2021 Review recommendation)\n- Covers eight financial years: 2017-18 through 2024-25, containing 2,000+ data items\n- Data presented in \u00a3 thousands, cash terms (no inflation adjustment across the period)\n- Wide format (one row per authority per year)","footnotes":"- England and class totals are grossed up to estimate what data would be if all authorities had submitted; users must use these published totals rather than summing individual authorities for reliable comparisons\n- Some data items have start and end dates, meaning they were not collected in all years covered by the dataset\n- Data in cash terms throughout; no adjustment for inflation between 2017-18 and 2024-25\n- Authority notes in metadata document mergers and changes to administrative remit, affecting within-series comparability"},{"lane":"national","source":"MHCLG statistics","title":"Service expenditure down 1% in real terms; Children's Social Care up 6.3%, Highways transport down 16.3%","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-revenue-expenditure-and-financing-england-2022-to-2023-third-release","iso":"2026-08-13T09:30:00+00:00","release":"Local authority revenue expenditure and financing England: 2022 to 2023 - final release","changed":"- Children's Social Care increased \u00a3764 million (+6.3%) to \u00a312.8 billion in real terms\n- Highways and transport services fell \u00a3928 million (-16.3%), largely due to GLA expenditure down \u00a3849 million\n- Public Health services decreased \u00a3704 million (-15.5%) in real terms\n- Total Service Expenditure excluding Education down \u00a3990 million (-1.3%) in real terms\n- Revenue Expenditure totalled \u00a3117.3 billion, 1.4% lower in real terms than 2021-22\n- Revenue Account non-ringfenced reserves fell to \u00a331.5 billion from \u00a333.4 billion, though remain \u00a38 billion above March 2020","footnotes":"- Education expenditure not comparable year-on-year: schools converting to academies means their funding is now centrally recorded rather than through local authorities\n- Adult Social Care figures exclude \u00a34.0 billion NHS funding via Better Care Fund and similar; NHS Digital's Adult Social Care Activity and Finance Report publishes the fuller picture\n- COVID-19 business rate relief grants (paid 2020-21 and 2021-22) adjusted out of grants and reserves totals to remove timing effects and improve historical comparability\n- GDP deflator inflation adjustment of 7.1% used for 2022-23, described as \"more significant in 2022-23 than in previous years\", meaning while cash expenditure rose 5.5%, real terms fell 1.4%"},{"lane":"national","source":"MHCLG statistics","title":"Capital expenditure rose 2.4% in real terms to \u00a331.6bn; final outturn \u00a31.9bn above provisional","summary":"","url":"https://www.gov.uk/government/statistics/local-authority-capital-expenditure-and-receipts-in-england-2024-to-2025-final-outturn","iso":"2026-08-12T09:30:00+00:00","release":"Local authority capital expenditure and receipts in England: 2024 to 2025 final outturn","changed":"- Total capital expenditure \u00a331.6 billion, up \u00a3725 million (2.4%) in real terms, with fixed assets up \u00a31 billion (4.1%) driven by land/building acquisitions (+\u00a3463 million, 17.7%) and new construction (+\u00a3400 million, 2%)\n- Financial expenditure down \u00a3285 million (4.6%) to \u00a36 billion\n- Housing Services up \u00a3286 million (2.8%) to \u00a310.4 billion; Trading Services up \u00a361 million (6.1%), marking the first increase after four consecutive years of decline\n- Section 16(2)(b) Direction expenditure reached \u00a31 billion, highest in five years\n- Capital receipts up \u00a3491 million (13.2%) to \u00a34.2 billion; prudential borrowing up \u00a3439 million (4.3%) to \u00a310.7 billion","footnotes":"- From 2024/25, IFRS 16 Leases adoption brings most leases onto the balance sheet, increasing Capital Financing Requirement (CFR) and external debt recognition without a corresponding rise in in-year capital expenditure, affecting year-on-year comparability\n- Final outturn \u00a31.9 billion (6.4%) above June provisional\u2014described as \"greater than is typically seen\"\u2014because local authority accounts are not finalised when CPR4 quarterly returns are collected; four authorities (Barking & Dagenham, GLA, Newham, West Yorkshire Combined Authority) account for \u00a3677 million of the difference\n- Trading Services increased 74.1% from provisional to final (against a typical 38.3% last year) due to recategorisation as authorities are reminded to report commercial acquisitions in this category\n- From 2022/23, categorisation corrections from central government to non-departmental public bodies remain ongoing; 2020-21 forecasts predate COVID-19 and should not be directly compared with later outturn years"},{"lane":"ours","source":"Stoke-on-Trent UA","title":"Council using capital receipts flexibility and reserves to offset revenue overspends; no Section 114 report yet, but mitigations are finite.","summary":"Capital receipts flexibility and reserve drawdown are tools of last resort. Their deployment signals the council is using contingency strategies to manage a \u00a313.6m social care overspend. If overspends persist into Q2-Q4, these tools will be depleted.","url":"https://moderngov.stoke.gov.uk/documents/s182418/182418.pdf","iso":"2026-08-11T09:00:00+00:00","gss":"E06000021","council":"Stoke-on-Trent UA","tag":"s114","figures":"\u00a32m corporate reserve deployed; \u00a33.293m capital receipts flexibility deployed","quote":"Despite the in-year pressures currently facing the Council, the Section 151 Officer has not considered it necessary to make any such report at the current juncture in light of ongoing mitigations.","paper":"Financial Performance Report 2026/27 - Quarter 1","committee":"Cabinet"},{"lane":"national","source":"MHCLG statistics","title":"Collection rates for both council tax and non-domestic rates fell in 2025-26 despite higher absolute receipts, driven by faster growth in net collectable debit.","summary":"","url":"https://www.gov.uk/government/statistics/collection-rates-for-council-tax-and-non-domestic-rates-in-england-2025-to-2026","iso":"2026-07-31T09:30:00+00:00","release":"Collection rates for Council Tax and non-domestic rates in England, 2025 to 2026","changed":"- Council tax in-year collection rate fell 0.3 percentage points to 95.6%; non-domestic rates fell 0.6 percentage points to 96.7%\n- Council tax receipts rose \u00a32.7 billion (6.8%) to \u00a343.0 billion; non-domestic rates rose \u00a31.6 billion (5.9%) to \u00a328.1 billion\n- Council tax arrears increased \u00a3782 million (11.8%) to \u00a37.4 billion; non-domestic rates arrears increased \u00a3286 million to \u00a32.6 billion\n- Retail, Hospitality and Leisure relief reduced from 75% to 40% in 2025-26\n- Non-domestic standard multiplier increased by September 2024 CPI; small business multiplier unchanged\n- Collection rates fell across all authority types (London boroughs, metropolitan districts, unitary authorities, shire districts)","footnotes":"- Release revised on 31 July 2026 to include data from Kensington & Chelsea and corrections from Bradford and Stoke-on-Trent; originally published 24 June 2026 with 295 of 296 authorities\n- Local government reorganisation in 2021-22 and 2023-24 means shire district and unitary authority figures are not year-on-year comparable (e.g. 17 fewer shire districts in 2023-24 than 2022-23)\n- Court and administration costs included in arrears figures may be under-reported; some authorities report only costs added in latest year, not cumulative costs\n- Collection continues after year-end; final collection rates will exceed figures shown here as arrears are collected in following years unless written off"},{"lane":"ours","source":"Nottingham City UA","title":"Council issued a Section 114 notice in November 2023 for inability to set a balanced budget; recovery is now early-stage despite achievement of 2026/27 balanced budget without Exceptional Financial Support.","summary":"Section 114 is a critical threshold event for local authority lending. While recovery progress is welcome, it is very early-stage and dependent on continued financial discipline.","url":"https://committee.nottinghamcity.gov.uk/documents/s183981/183981.pdf","iso":"2026-07-31T09:00:00+00:00","gss":"E06000018","council":"Nottingham City UA","tag":"s114","figures":"Section 114 issued November 2023; Commissioners oversight concluded March 2026; EFS \u00a341.024m approved 2024/25, only \u00a37.737m required year-end; 2026/27 balanced budget achieved without EFS","quote":"In November 2023, a Section 114 (Part 3) report was issued to Councillors due to concerns regarding the financial sustainability of the Council","paper":"Enc. 1 for Draft Annual Governance Statement 2025 - 2026","committee":"Audit Committee"},{"lane":"policy","source":"Consultation","title":"IFRS 18 Presentation and Disclosure in Financial Statements Exposure Draft","summary":"Public consultation on HM Treasury proposals for the application of IFRS 18 Presentation and Disclosure in Financial Statements across Central Government","url":"https://www.gov.uk/government/consultations/ifrs-18-presentation-and-disclosure-in-financial-statements-exposure-draft","iso":"2026-07-28T11:22:45Z","closes":"2026-09-11T23:59:00.000+01:00","org":"hm-treasury"},{"lane":"national","source":"MHCLG statistics","title":"Collected \u00a327.6bn; granted \u00a37.7bn relief; retail/hospitality scheme cut from 75% to 40%","summary":"","url":"https://www.gov.uk/government/statistics/national-non-domestic-rates-collected-by-councils-in-england-2025-to-2026","iso":"2026-07-22T09:30:00+00:00","release":"National non-domestic rates collected by councils in England: 2025 to 2026","changed":"- Retail, hospitality and leisure relief fell 44% from \u00a32.5bn to \u00a31.4bn after rate reduced from 75% to 40%\n- Standard business rates multiplier up 0.9p to 55.5p; small multiplier frozen at 49.9p; total reliefs down from \u00a38.6bn to \u00a37.7bn\n- Net appeals provision decrease of \u00a3224m; collection losses \u00a3295m\n- Transitional relief costs down from \u00a3433m to \u00a348m as 2023 revaluation scheme winds down","footnotes":"- 2023 revaluation (effective April 2023) creates a discontinuity: figures from 2023-24 onwards not directly comparable to 2022-23 and earlier years\n- Multiplier decoupling from 2024-25 changed mandatory relief reporting: the 1.3p supplement no longer deducted, making mandatory relief appear higher than pre-2024-25 years on a like-for-like basis\n- Retail, hospitality and leisure relief explicitly not comparable across years due to changing rates: 100%/66% (2021-22) \u2192 50% (2022-23) \u2192 75% (2023-25) \u2192 40% (2025-26)\n- Private schools lost charitable relief eligibility in 2025-26 unless providing EHCP education; some authorities reported this as reason for relief decreases; all data provisional, final figures expected January 2027"},{"lane":"policy","source":"Consultation","title":"Time-limited relief from the Community Infrastructure Levy in London","summary":"We are seeking views on proposed regulations to implement a time-limited relief from the Community Infrastructure Levy (CIL) to support housebuilding in London.","url":"https://www.gov.uk/government/consultations/time-limited-relief-from-the-community-infrastructure-levy-in-london function esc(s){ return String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }

// How long ago, in the units a reader thinks in. Anything older than a week
// gets a date, because "12 days ago" is harder to place than "17 Aug".
function ago(iso){
  if (!iso) return "";
  const t = new Date(iso); if (isNaN(t)) return "";
  const mins = (Date.now() - t.getTime()) / 60000;
  if (mins < 60) return Math.max(1, Math.round(mins)) + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  if (mins < 10080) return Math.round(mins / 1440) + "d ago";
  return t.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

// Days until a consultation closes. This is the whole point of the strip:
// an open consultation is only useful while you can still answer it.
function closesIn(iso){
  const t = new Date(iso); if (isNaN(t)) return null;
  return Math.ceil((t.getTime() - Date.now()) / 86400000);
}

function card(it){
  const ours = it.lane === "ours";
  const link = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
                      : esc(it.title);
  // Origin is stated on every item, never inferred from styling alone. An
  // agency headline and a machine-read finding from a council's own papers
  // are not equally certain, and a reader is entitled to know which is which.
  const origin = ours ? "Our reading"
    : it.lane === "national" ? "MHCLG commentary, read by us" : "Published";
  return `<article class="item${ours ? " ours" : ""}${
    it.lane === "national" ? " national" : ""}">
    <div class="meta">
      <span class="src">${esc(it.source || "")}</span>
      ${it.release ? `<span class="rel">${esc(it.release)}</span>` : ""}
      <span class="origin">${origin}</span>
      <span class="when">${esc(ago(it.iso))}</span>
    </div>
    <h3>${link}</h3>
    ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
    ${it.changed ? `<div class="bullets">${esc(it.changed).split("\n")
        .filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</div>` : ""}
    ${it.footnotes ? `<details class="foot"><summary>Watch the footnotes</summary>
      ${esc(it.footnotes).split("\n").filter(l => l.trim().startsWith("-"))
        .map(l => `<div>${esc(l.replace(/^\s*-\s*/,""))}</div>`).join("")}</details>` : ""}
    ${it.figures ? `<div class="figs">${esc(it.figures)}</div>` : ""}
    ${it.quote ? `<blockquote class="quote">${esc(it.quote)}</blockquote>` : ""}
    ${ours && it.paper ? `<div class="paper">${esc(it.committee || "")}${
        it.committee ? " · " : ""}${esc(it.paper)}${
        it.gss ? ` · <a href="councils.html#${esc(it.gss)}">open ${esc(it.council)}</a>` : ""}</div>` : ""}
  </article>`;
}

let LANE = "all";

function render(){
  const items = (DATA.items || []).filter(i => !i.closes);   // consultations lead separately
  const show = LANE === "all" ? items : items.filter(i => i.lane === LANE);
  document.getElementById("feed").innerHTML = show.length
    ? show.map(card).join("")
    : `<div class="empty">Nothing in this lane in the current window.</div>`;
}

function setLane(l){
  LANE = l;
  [...document.querySelectorAll(".lane")].forEach(b =>
    b.classList.toggle("on", b.dataset.lane === l));
  render();
}

(function init(){
  const items = DATA.items || [];
  const cons = items.filter(i => i.closes);

  // Consultations lead and are never filtered away: they are the only items
  // here about something a council can still act on.
  const host = document.getElementById("consults");
  if (cons.length){
    const rows = cons.slice().sort((a,b) => String(a.closes).localeCompare(String(b.closes)))
      .map(c => {
        const d = closesIn(c.closes);
        const lab = d == null ? "" : d < 0 ? "closed"
          : d === 0 ? "closes today" : d + (d === 1 ? " day left" : " days left");
        return `<div class="crow">
          <span class="cd">${esc(String(c.closes).slice(0,10))}
            <span class="corg">${esc((c.org||"").replace("ministry-of-housing-communities-local-government","MHCLG").replace("hm-treasury","HM Treasury").replace(/-/g," "))}</span></span>
          <a class="ct" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
          <span class="cw ${d != null && d <= 14 ? "soon" : "ok"}">${esc(lab)}</span>
        </div>`; }).join("");
    const t = DATA.consultation_totals || {};
    const claimed = Object.values(t).filter(v => typeof v === "number")
      .reduce((a,b) => a+b, 0);
    host.innerHTML = `<div class="consults">
      <h2>Open consultations</h2>
      <p class="note">Every open consultation from MHCLG, HM Treasury and the
        local-government bodies — ${cons.length} of ${claimed} gov.uk reports,
        soonest closing first.</p>
      <div class="ctable">${rows}</div></div>`;
  }

  const lanes = DATA.lanes || {};
  const counts = {};
  items.filter(i => !i.closes).forEach(i => counts[i.lane] = (counts[i.lane]||0)+1);
  const total = items.filter(i => !i.closes).length;
  document.getElementById("lanes").innerHTML =
    `<button class="lane on" data-lane="all">Everything <b>${total}</b></button>` +
    Object.keys(lanes).filter(k => counts[k])
      .map(k => `<button class="lane" data-lane="${k}">${esc(lanes[k])} <b>${counts[k]}</b></button>`)
      .join("");
  document.getElementById("lanes").addEventListener("click", e => {
    const b = e.target.closest(".lane"); if (b) setLane(b.dataset.lane); });

  // The page says how old it is, from its own data. Same defence as the other
  // two pages: a promise about cadence cannot be checked, a timestamp can.
  const gen = DATA.generated ? new Date(DATA.generated) : null;
  document.getElementById("fresh").innerHTML = gen
    ? `Gathered <b>${ago(DATA.generated)}</b><br>${
        gen.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}`
    : "";

  const errs = Object.keys(DATA.errors || {});
  const g = DATA.guidance_notes || {};
  document.getElementById("foot").innerHTML =
    `${total} item${total===1?"":"s"} from ${Object.keys(lanes).length} lanes, plus
     ${cons.length} open consultation${cons.length===1?"":"s"}. Newswire items are
     held for ${DATA.hours}h; our own findings for longer, because committee papers
     are published weekly or monthly.`
    + (Object.keys(g).length ? ` CIPFA checked directly: ${
        esc(Object.values(g).join("; "))}.` : "")
    + (errs.length ? ` ${errs.length} source(s) unreachable this pass: ${
        esc(errs.join(", "))}.` : " All sources reachable this pass.");

  render();
})();
</script>
